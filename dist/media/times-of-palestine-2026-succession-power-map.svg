<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Power after Abbas: office, influence and the ballot</title>
  <desc id="desc">A bilingual power map distinguishing Mahmoud Abbas's current offices, Hussein al-Sheikh's caretaker route, the political influence of Marwan Barghouti and Yasser Abbas, and the requirement for a popular presidential election.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101114"/>
      <stop offset="1" stop-color="#1c1d21"/>
    </linearGradient>
    <linearGradient id="vote" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e1e2b"/>
      <stop offset=".48" stop-color="#286344"/>
      <stop offset="1" stop-color="#bd9854"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <clipPath id="abbasClip"><rect x="92" y="242" width="278" height="300" rx="14"/></clipPath>
    <clipPath id="sheikhClip"><rect x="455" y="242" width="278" height="300" rx="14"/></clipPath>
    <clipPath id="barghoutiClip"><rect x="818" y="242" width="278" height="300" rx="14"/></clipPath>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f3efe8}
      .muted{fill:#aaa9a5}
      .gold{fill:#d4b36e}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:17px}
      .small{font-size:20px}
      .body{font-size:23px}
      .label{font-size:18px;font-weight:800;letter-spacing:1.2px}
      .name{font-size:28px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="90" y="78" class="serif ivory" font-size="52" font-weight="800">Power after Abbas: office, influence and the ballot</text>
  <text x="90" y="126" class="sans muted body">These are different paths. None makes a permanent president automatically.</text>
  <text x="1510" y="169" class="arabic ivory" font-size="37" font-weight="800" text-anchor="end">السلطة بعد عباس: المنصب والنفوذ وصندوق الاقتراع</text>
  <text x="1510" y="203" class="arabic muted small" text-anchor="end">مسارات مختلفة، ولا يمنح أي منها الرئاسة الدائمة تلقائياً</text>

  <g filter="url(#shadow)">
    <rect x="70" y="220" width="322" height="470" rx="18" fill="#27282c" stroke="#d4b36e" stroke-width="2"/>
    <image x="92" y="242" width="278" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#abbasClip)" xlink:href="/media/mahmoud-abbas-2022-public-domain.jpg"/>
    <text x="92" y="580" class="sans gold label">CURRENT OFFICE</text>
    <text x="92" y="616" class="sans ivory name">Mahmoud Abbas</text>
    <text x="92" y="650" class="arabic muted small">الرئيس الحالي</text>
    <text x="92" y="675" class="arabic muted small">ورئيس منظمة التحرير وفتح</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="433" y="220" width="322" height="470" rx="18" fill="#27282c" stroke="#dc6572" stroke-width="3"/>
    <image x="455" y="242" width="278" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#sheikhClip)" xlink:href="/media/hussein-al-sheikh-2022-public-domain.jpg"/>
    <text x="455" y="580" class="sans red label">CARETAKER ROUTE</text>
    <text x="455" y="616" class="sans ivory name">Hussein al-Sheikh</text>
    <text x="455" y="650" class="arabic muted small">المسار المؤقت في إعلان 2025</text>
    <text x="455" y="675" class="arabic muted small">وليس تفويضاً دائماً</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="796" y="220" width="322" height="470" rx="18" fill="#27282c" stroke="#61aa80" stroke-width="2"/>
    <image x="818" y="242" width="278" height="300" preserveAspectRatio="xMidYMid slice" clip-path="url(#barghoutiClip)" xlink:href="/media/marwan-barghouti-2002-cc-by-4.jpg"/>
    <text x="818" y="580" class="sans green label">POLITICAL WEIGHT</text>
    <text x="818" y="616" class="sans ivory name">Marwan Barghouti</text>
    <text x="818" y="650" class="arabic muted small">أعلى أصوات مركزية فتح</text>
    <text x="818" y="675" class="arabic muted small">بلا مسار دستوري تلقائي</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1159" y="220" width="351" height="470" rx="18" fill="#27282c" stroke="#72747a" stroke-width="2"/>
    <rect x="1181" y="242" width="307" height="300" rx="14" fill="#1d1e22"/>
    <circle cx="1334" cy="341" r="58" fill="#44464c"/>
    <path d="M1235 514c17-69 60-104 99-104s82 35 99 104" fill="#44464c"/>
    <text x="1334" y="559" class="sans muted tiny" text-anchor="middle">No cleared portrait located</text>
    <text x="1334" y="582" class="arabic muted tiny" text-anchor="middle">لم تُعثر على صورة مرخصة بوضوح</text>
    <text x="1181" y="616" class="sans ivory name">Yasser Abbas</text>
    <text x="1181" y="650" class="arabic muted small">عضو مركزية فتح</text>
    <text x="1181" y="675" class="arabic muted small">نفوذ سياسي بلا حق دستوري</text>
  </g>

  <path d="M231 718H1334" stroke="#67696f" stroke-width="4"/>
  <circle cx="231" cy="718" r="11" fill="#d4b36e"/>
  <circle cx="594" cy="718" r="11" fill="#dc6572"/>
  <circle cx="957" cy="718" r="11" fill="#61aa80"/>
  <circle cx="1334" cy="718" r="11" fill="#85878d"/>

  <rect x="90" y="750" width="1420" height="100" rx="15" fill="url(#vote)"/>
  <text x="122" y="785" class="sans ivory" font-size="24" font-weight="800">PERMANENT PRESIDENCY</text>
  <text x="122" y="816" class="sans ivory small">The published route is a popular election.</text>
  <text x="122" y="840" class="sans ivory small">Q1 2027 announced; no exact date is public.</text>
  <text x="1280" y="785" class="arabic ivory" font-size="24" font-weight="800">الرئاسة الدائمة</text>
  <text x="1478" y="816" class="arabic ivory small" text-anchor="end">المسار المنشور هو الانتخاب الشعبي</text>
  <text x="1478" y="840" class="arabic ivory small" text-anchor="end">أُعلن الربع الأول من 2027 بلا موعد دقيق</text>

  <text x="90" y="882" class="sans muted tiny">Photos: Freddie Everett/U.S. State Department (public domain); Fadwa Barghouti (CC BY 4.0). Graphic: Times of Palestine.</text>
</svg>

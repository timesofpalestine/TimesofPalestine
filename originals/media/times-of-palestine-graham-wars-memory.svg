<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The two ledgers of remembrance after Lindsey Graham's death</title>
  <desc id="d">Illustration of a balance scale weighing an official mourning wreath against candles for war victims, before the silhouette of the US Capitol, with English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <!-- Capitol dome silhouette backdrop -->
  <g fill="#26262c" opacity=".85">
    <rect x="640" y="470" width="320" height="24" rx="4"/>
    <rect x="700" y="330" width="200" height="140" rx="10"/>
    <path d="M700 330 Q800 190 900 330 Z"/>
    <rect x="788" y="150" width="24" height="60" rx="6"/>
    <circle cx="800" cy="145" r="14"/>
    <g>
      <rect x="716" y="360" width="14" height="90" rx="4" fill="#1d1e21"/>
      <rect x="748" y="360" width="14" height="90" rx="4" fill="#1d1e21"/>
      <rect x="780" y="360" width="14" height="90" rx="4" fill="#1d1e21"/>
      <rect x="812" y="360" width="14" height="90" rx="4" fill="#1d1e21"/>
      <rect x="844" y="360" width="14" height="90" rx="4" fill="#1d1e21"/>
      <rect x="876" y="360" width="14" height="90" rx="4" fill="#1d1e21"/>
    </g>
  </g>

  <!-- balance scale -->
  <g filter="url(#sh)">
    <rect x="790" y="470" width="20" height="270" rx="8" fill="#3a3a42"/>
    <rect x="680" y="740" width="240" height="22" rx="10" fill="#3a3a42"/>
    <!-- beam, tilted toward the heavier, unweighed side -->
    <g transform="rotate(7 800 500)">
      <rect x="440" y="490" width="720" height="16" rx="8" fill="#c7a86b"/>
      <circle cx="800" cy="498" r="18" fill="#c7a86b"/>
      <!-- left chains and pan: official wreath -->
      <path d="M470 506 L430 610 M470 506 L510 610" stroke="#c7a86b" stroke-width="4" fill="none"/>
      <path d="M410 610 Q470 660 530 610 Z" fill="#26262c" stroke="#c7a86b" stroke-width="3"/>
      <circle cx="470" cy="586" r="34" fill="none" stroke="#59a97d" stroke-width="10"/>
      <circle cx="470" cy="586" r="34" fill="none" stroke="#286344" stroke-width="4" stroke-dasharray="8 8"/>
      <rect x="458" y="612" width="10" height="26" fill="#8a1f2d"/>
      <rect x="472" y="612" width="10" height="26" fill="#8a1f2d"/>
      <!-- right chains and pan: candles for the victims -->
      <path d="M1130 506 L1090 610 M1130 506 L1170 610" stroke="#c7a86b" stroke-width="4" fill="none"/>
      <path d="M1070 610 Q1130 660 1190 610 Z" fill="#26262c" stroke="#c7a86b" stroke-width="3"/>
      <g>
        <rect x="1092" y="566" width="14" height="44" rx="4" fill="#f2eee8"/>
        <rect x="1122" y="554" width="14" height="56" rx="4" fill="#f2eee8"/>
        <rect x="1152" y="572" width="14" height="38" rx="4" fill="#f2eee8"/>
        <path d="M1099 552 q7 -16 0 -26 q-9 12 0 26 Z" fill="#c7a86b"/>
        <path d="M1129 540 q7 -16 0 -26 q-9 12 0 26 Z" fill="#c7a86b"/>
        <path d="M1159 558 q7 -16 0 -26 q-9 12 0 26 Z" fill="#c7a86b"/>
      </g>
    </g>
  </g>

  <!-- pan labels -->
  <text x="400" y="700" class="sans muted" font-size="26">Official mourning · الحِداد الرسمي</text>
  <text x="1210" y="700" class="sans muted" font-size="26" text-anchor="end">The wars' victims · ضحايا الحروب</text>

  <text x="90" y="120" class="sans ivory" font-size="52" font-weight="800">The ledger of memory</text>
  <text x="90" y="168" class="sans muted" font-size="27">Washington eulogizes a senator; an imam asks who counts his wars' dead</text>
  <text x="1510" y="120" class="arabic ivory" font-size="44" font-weight="700" text-anchor="end">دفتر الذاكرة</text>
  <text x="1510" y="168" class="arabic muted" font-size="26" text-anchor="end">واشنطن ترثي شيخ الصقور.. وإمام يسأل: من يُحصي ضحايا حروبه؟</text>
  <text x="800" y="840" class="sans" fill="#59a97d" font-size="24" text-anchor="middle">Gaza · Lebanon · Iran · Plainfield, Illinois — غزة · لبنان · إيران · بلينفيلد</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The magazine after the Iran war: US interceptor stocks and the money Congress has not moved</title>
  <desc id="desc">A bilingual chart of estimated United States Patriot and THAAD interceptor stocks before and after the war with Iran, alongside the four numbers governing replenishment: the cost of the war to date, the emergency funding request, the Pentagon's 21-day deadline to arms makers, and the stopgap that freezes spending until 11 December 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f2eee8}
      .muted{fill:#aaa9a5}
      .gold{fill:#c7a86b}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:17px}
      .small{font-size:20px}
      .body{font-size:23px}
      .label{font-size:18px;font-weight:800;letter-spacing:1.2px}
      .num{font-size:34px;font-weight:800}
      .big{font-size:44px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="90" y="80" class="serif ivory" font-size="50" font-weight="800">The magazine after the Iran war</text>
  <text x="90" y="124" class="sans muted body">What Washington estimates it has left, and the money Congress has not moved</text>
  <text x="1520" y="80" class="arabic ivory" font-size="38" font-weight="800" text-anchor="end">المخزون بعد حرب إيران</text>
  <text x="1520" y="120" class="arabic muted small" text-anchor="end">ما تبقّى من الصواريخ الاعتراضية.. والمال المعلّق في الكونغرس</text>

  <g filter="url(#shadow)">
    <rect x="70" y="170" width="800" height="560" rx="18" fill="#27282c" stroke="#c7a86b" stroke-width="2"/>

    <text x="106" y="216" class="sans gold label">ESTIMATED INTERCEPTOR STOCKS</text>
    <text x="834" y="216" class="arabic muted small" text-anchor="end">تقديرات المخزون الاعتراضي</text>

    <text x="106" y="278" class="sans ivory" font-size="26" font-weight="800">Patriot PAC-3</text>
    <text x="834" y="278" class="arabic muted small" text-anchor="end">باتريوت</text>
    <rect x="106" y="298" width="700" height="34" rx="6" fill="#3a3b40"/>
    <text x="106" y="356" class="sans muted tiny">Before the war — about 2,200</text>
    <rect x="106" y="372" width="252" height="34" rx="6" fill="#dc6572"/>
    <text x="378" y="398" class="sans ivory small">759–827 left</text>
    <text x="834" y="398" class="arabic muted tiny" text-anchor="end">المتبقّي: نحو ثلث المخزون</text>

    <text x="106" y="470" class="sans ivory" font-size="26" font-weight="800">THAAD</text>
    <text x="834" y="470" class="arabic muted small" text-anchor="end">ثاد</text>
    <rect x="106" y="490" width="700" height="34" rx="6" fill="#3a3b40"/>
    <text x="106" y="548" class="sans muted tiny">Before the war — 452</text>
    <rect x="106" y="564" width="396" height="34" rx="6" fill="#c7a86b"/>
    <text x="522" y="590" class="sans ivory small">234–278 left</text>
    <text x="834" y="590" class="arabic muted tiny" text-anchor="end">المتبقّي من أصل 452</text>

    <line x1="106" y1="640" x2="834" y2="640" stroke="#3a3b40" stroke-width="2"/>
    <text x="106" y="674" class="sans muted tiny">Each grey bar is that system's own prewar stock. Analytical estimates by the</text>
    <text x="106" y="698" class="sans muted tiny">Center for Strategic and International Studies — the Pentagon publishes no figures.</text>
    <text x="834" y="722" class="arabic muted tiny" text-anchor="end">تقديرات تحليلية لمركز الدراسات الاستراتيجية والدولية، ولا أرقام رسمية من البنتاغون</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="900" y="170" width="630" height="560" rx="18" fill="#27282c" stroke="#286344" stroke-width="2"/>

    <text x="936" y="216" class="sans green label">THE REPLENISHMENT LEDGER</text>
    <text x="1494" y="216" class="arabic muted small" text-anchor="end">دفتر إعادة الملء</text>

    <text x="936" y="284" class="sans ivory big">$37.5bn</text>
    <text x="936" y="316" class="sans muted tiny">Cost of the Iran war through 30 September, Hegseth told senators on 21 July</text>
    <text x="1494" y="344" class="arabic muted tiny" text-anchor="end">كلفة الحرب حتى 30 أيلول/سبتمبر بحسب وزير الدفاع</text>

    <line x1="936" y1="368" x2="1494" y2="368" stroke="#3a3b40" stroke-width="2"/>

    <text x="936" y="418" class="sans ivory big">$67.1bn</text>
    <text x="936" y="450" class="sans muted tiny">Further emergency funding the Pentagon has asked Congress to appropriate</text>
    <text x="1494" y="478" class="arabic muted tiny" text-anchor="end">تمويل طارئ إضافي طلبه البنتاغون من الكونغرس</text>

    <line x1="936" y1="502" x2="1494" y2="502" stroke="#3a3b40" stroke-width="2"/>

    <text x="936" y="552" class="sans gold big">21 days</text>
    <text x="936" y="584" class="sans muted tiny">Deadline Feinberg gave arms makers to file faster production plans, 5 August</text>
    <text x="1494" y="612" class="arabic muted tiny" text-anchor="end">مهلة البنتاغون لمصانع السلاح، 5 آب/أغسطس</text>

    <line x1="936" y1="636" x2="1494" y2="636" stroke="#3a3b40" stroke-width="2"/>

    <text x="936" y="686" class="sans red num">Frozen to 11 December</text>
    <text x="936" y="716" class="sans muted tiny">Senate stopgap of 8 August holds last year's levels, bars new starts and five</text>
    <text x="936" y="740" class="sans muted tiny">multiyear munitions contracts</text>
    <text x="1494" y="768" class="arabic muted tiny" text-anchor="end">تمويل مؤقت يجمّد الإنفاق ويمنع عقود الذخائر متعدّدة السنوات</text>
  </g>

  <text x="90" y="812" class="sans muted small">Times of Palestine — Washington Brief, 11 August 2026</text>
  <text x="1520" y="812" class="arabic muted small" text-anchor="end">تايمز أوف فلسطين — الموجز من واشنطن، 11 آب/أغسطس 2026</text>
  <rect x="90" y="836" width="120" height="6" rx="3" fill="#C8102E"/>
  <rect x="222" y="836" width="120" height="6" rx="3" fill="#007A3D"/>
  <rect x="354" y="836" width="120" height="6" rx="3" fill="#c7a86b"/>
</svg>

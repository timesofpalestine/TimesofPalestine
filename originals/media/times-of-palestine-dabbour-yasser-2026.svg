<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Two files around the president's son: the arrested envoy in Beirut and the detained fuel magnate in the West Bank — what the record shows and what remains unestablished">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>
  <text x="800" y="80" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="28" letter-spacing="6">TIMES OF PALESTINE · ACCOUNTABILITY</text>
  <text x="800" y="142" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="48" font-weight="bold">Two Files Around the President's Son</text>
  <text x="800" y="192" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,sans-serif" font-size="34">ملفان حول نجل الرئيس</text>

  <!-- envoy file -->
  <g transform="translate(140,240)">
    <rect x="0" y="0" width="620" height="470" rx="6" fill="#17181b" stroke="#2a2b2f" stroke-width="2"/>
    <text x="310" y="52" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="28" font-weight="bold">THE ENVOY · ملف السفير</text>
    <g font-family="Tahoma,sans-serif" font-size="22" fill="#f2eee8">
      <text x="50" y="110">2025 — Yasser Abbas sent to Beirut</text>
      <text x="50" y="142" fill="#aaa9a5" font-size="20">يُكلَّف ببيع عقارات المنظمة في لبنان</text>
      <text x="50" y="200">April — Dabbour's public accusation</text>
      <text x="50" y="232" fill="#aaa9a5" font-size="20">دبّور يتهمه علناً باستخدام الأجهزة ضده</text>
      <text x="50" y="290">August — arrested at Beirut airport</text>
      <text x="50" y="322" fill="#aaa9a5" font-size="20">توقيفه بطلب من رام الله تمهيداً لتسليمه</text>
      <text x="50" y="380" fill="#c7a86b">He denies the charges · ينفي التهم</text>
      <text x="50" y="430" fill="#aaa9a5" font-size="19">Sources: AFP · L'Orient Today · Asharq Al-Awsat</text>
    </g>
  </g>

  <!-- fuel file -->
  <g transform="translate(840,240)">
    <rect x="0" y="0" width="620" height="470" rx="6" fill="#17181b" stroke="#2a2b2f" stroke-width="2"/>
    <text x="310" y="52" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="28" font-weight="bold">THE FUEL · ملف المحروقات</text>
    <g font-family="Tahoma,sans-serif" font-size="22" fill="#f2eee8">
      <text x="50" y="110">PA owes fuel suppliers mounting arrears</text>
      <text x="50" y="142" fill="#aaa9a5" font-size="20">مستحقات متراكمة لموردي المحروقات</text>
      <text x="50" y="200">Security raids Al-Huda's stations</text>
      <text x="50" y="232" fill="#aaa9a5" font-size="20">مداهمات لمحطات «الهدى» واحتجاز النتشة</text>
      <text x="50" y="290">Shortages hit Ramallah's pumps</text>
      <text x="50" y="322" fill="#aaa9a5" font-size="20">نقص الوقود يضرب محطات رام الله</text>
      <text x="50" y="380" fill="#c7a86b">New fuel firm reports: unconfirmed</text>
      <text x="50" y="412" fill="#aaa9a5" font-size="20">أنباء شركة الوقود الجديدة: بلا تأكيد رسمي</text>
      <text x="50" y="450" fill="#aaa9a5" font-size="19">Sources: Ultra Palestine · NPP · AP</text>
    </g>
  </g>

  <text x="800" y="790" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="26" font-style="italic">No court has linked the files. No parliament can ask. That gap is the story.</text>
  <text x="800" y="830" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="22">لم تربط أي محكمة بين الملفين، ولا برلمان يسأل — وهذه الفجوة هي القصة</text>
  <rect x="0" y="894" width="1600" height="6" fill="#286344"/>
</svg>

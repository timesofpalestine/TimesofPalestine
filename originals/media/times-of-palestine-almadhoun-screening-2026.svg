<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">Times of Palestine — Flagged at every step: Hani Almadhoun's account of US airport screening / أوقفه التدقيق الأمني عند كل خطوة</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient>
  <style>.serif{font-family:"Source Serif 4",Georgia,serif}.arabic{font-family:Cairo,Arial,sans-serif}.sans{font-family:"Libre Franklin",Arial,sans-serif}.mono{font-family:"Courier New",monospace}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- boarding pass, its stub torn off and stamped -->
  <g>
    <rect x="1074" y="252" width="416" height="396" rx="8" fill="#17181b" stroke="#3d4f6b" stroke-width="3"/>
    <line x1="1330" y1="262" x2="1330" y2="638" stroke="#3d4f6b" stroke-width="3" stroke-dasharray="10 12"/>
    <rect x="1074" y="252" width="416" height="54" rx="8" fill="#1f2937"/>
    <text x="1098" y="288" class="sans" fill="#aaa9a5" font-size="22" letter-spacing="3">BOARDING PASS</text>
    <text x="1098" y="368" class="sans" fill="#f2eee8" font-size="34" font-weight="700">DCA</text>
    <text x="1178" y="368" class="sans" fill="#aaa9a5" font-size="30">&#8594;</text>
    <text x="1226" y="368" class="sans" fill="#f2eee8" font-size="34" font-weight="700">IAH</text>
    <text x="1098" y="416" class="sans" fill="#aaa9a5" font-size="20">4 JULY</text>
    <text x="1098" y="452" class="sans" fill="#aaa9a5" font-size="20">SEAT — / —</text>
    <text x="1098" y="520" class="sans" fill="#aaa9a5" font-size="18">REDRESS NO.</text>
    <text x="1098" y="552" class="mono" fill="#c7a86b" font-size="26">&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;</text>
    <rect x="1354" y="404" width="112" height="112" rx="6" fill="#8a1f2d" stroke="#c0334a" stroke-width="4"/>
    <text x="1410" y="480" class="sans" text-anchor="middle" fill="#f2eee8" font-size="40" font-weight="700" letter-spacing="2">SSSS</text>
    <text x="1410" y="560" class="sans" text-anchor="middle" fill="#aaa9a5" font-size="18">SECONDARY</text>
    <text x="1410" y="586" class="sans" text-anchor="middle" fill="#aaa9a5" font-size="18">SCREENING</text>
  </g>

  <rect x="120" y="268" width="120" height="7" fill="#c7a86b"/>
  <text x="120" y="366" class="arabic" fill="#f2eee8" font-size="70" font-weight="700">أوقفه التدقيق عند كل خطوة</text>
  <text x="120" y="450" class="serif" fill="#c7a86b" font-size="50" font-weight="700">Flagged at every step</text>
  <text x="120" y="522" class="sans" fill="#f2eee8" font-size="30">Hani Almadhoun · UNRWA USA · Gaza Soup Kitchen</text>
  <text x="120" y="570" class="arabic" fill="#f2eee8" font-size="30">هاني المدهون · أونروا الولايات المتحدة · مطبخ غزة الخيري</text>
  <text x="120" y="636" class="sans" fill="#aaa9a5" font-size="26">A US citizen with a federal redress number, stopped at each stage</text>
  <text x="120" y="680" class="arabic" fill="#aaa9a5" font-size="26">مواطن أميركي يحمل رقم تظلّم فيدرالياً، والتدقيق يوقفه في كل مرحلة</text>
  <text x="120" y="812" class="sans" fill="#aaa9a5" font-size="26" letter-spacing="4">TIMES OF PALESTINE</text>
</svg>

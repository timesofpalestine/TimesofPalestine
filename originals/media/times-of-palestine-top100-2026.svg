      <circle cx="980" cy="420" r="9"/><circle cx="1040" cy="420" r="9"/><circle cx="1100" cy="420" r="9"/><circle cx="1160" cy="420" r="9"/><circle cx="1220" cy="420" r="9"/><circle cx="1280" cy="420" r="9"/><circle cx="1340" cy="420" r="9"/><circle cx="1400" cy="420" r="9"/><circle cx="1460" cy="420" r="9"/><circle cx="920" cy="420" r="9"/>
      <circle cx="980" cy="480" r="9"/><circle cx="1040" cy="480" r="9"/><circle cx="1100" cy="480" r="9"/><circle cx="1160" cy="480" r="9"/><circle cx="1220" cy="480" r="9"/><circle cx="1280" cy="480" r="9"/><circle cx="1340" cy="480" r="9"/><circle cx="1400" cy="480" r="9"/><circle cx="1460" cy="480" r="9"/><circle cx="920" cy="480" r="9"/>

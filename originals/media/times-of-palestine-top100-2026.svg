  <!-- the big 100 -->
  <g filter="url(#sh)">
    <text x="90" y="560" class="sans" fill="#c7a86b" font-size="380" font-weight="900" letter-spacing="-.04em">100</text>
  </g>
  <rect x="100" y="610" width="640" height="8" fill="#8a1f2d"/>
  <rect x="100" y="618" width="640" height="8" fill="#286344"/>

  <text x="90" y="130" class="sans ivory" font-size="54" font-weight="800">The TOP 100</text>
  <text x="90" y="180" class="sans muted" font-size="27">The most influential Palestinians in the world — the inaugural annual list</text>
  <text x="1510" y="130" class="arabic ivory" font-size="44" font-weight="700" text-anchor="end">قائمة المئة</text>
  <text x="1510" y="180" class="arabic muted" font-size="26" text-anchor="end">أكثر فلسطينيي العالم تأثيراً — القائمة السنوية الأولى</text>
  <text x="90" y="720" class="arabic ivory" font-size="40" font-weight="700">مئة اسم يصنع الحاضر الفلسطيني</text>
  <text x="90" y="775" class="sans muted" font-size="26">Leaders · Titans · Witnesses · Artists · Icons · Innovators · Healers · Athletes</text>
  <text x="800" y="860" class="mono" fill="#59a97d" font-size="24" text-anchor="middle">Times of Palestine · 2026 · annual edition No. 1</text>

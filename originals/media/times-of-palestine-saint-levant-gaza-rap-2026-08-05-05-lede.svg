<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Saint Levant's Afandi World Tour: Gaza's name across four continents</title>
<desc id="dsc">A timeline of the announced Afandi World Tour running from Boston on 12 September to Muscat on 12 December, with stops including Dublin on 29 October and Istanbul on 10 December. Below the line, a golden box carries the name Gaza — the name the tour carries to every stage, through the album DEIRA named for the family's seafront hotel.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#8a1f2d"/>
<stop offset="0.55" stop-color="#c7a86b"/>
<stop offset="1" stop-color="#286344"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="110" y="78" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" letter-spacing="5" fill="#c7a86b">AFANDI WORLD TOUR · SAINT LEVANT</text>
<text x="110" y="152" font-family="'Source Serif 4',Georgia,serif" font-size="62" fill="#f2eee8">Gaza's name, on the world's stages</text>
<text x="110" y="204" font-family="Cairo,Arial,sans-serif" font-size="34" fill="#c7a86b">اسم غزة على مسارح العالم — أربعون حفلاً في أربع قارات</text>

<text x="1520" y="78" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" letter-spacing="3" fill="#f2eee8">40+ DATES · 4 CONTINENTS</text>
<text x="1520" y="112" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">أكثر من ٤٠ حفلاً في أربع قارات</text>
<text x="1520" y="150" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">Tickets on general sale 24 July · produced by Live Nation</text>

<line x1="110" y1="240" x2="1520" y2="240" stroke="#3a3b3f" stroke-width="2"/>

<text x="110" y="286" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">Announced itinerary also includes Brooklyn · Toronto · Chicago · Los Angeles · San Francisco</text>

<!-- timeline -->
<line x1="200" y1="430" x2="1440" y2="430" stroke="url(#line)" stroke-width="6" stroke-linecap="round"/>
<line x1="140" y1="430" x2="200" y2="430" stroke="#3a3b3f" stroke-width="6" stroke-linecap="round"/>

<!-- Boston 12 Sep -->
<circle cx="200" cy="430" r="13" fill="#C8102E"/>
<line x1="200" y1="417" x2="200" y2="352" stroke="#3a3b3f" stroke-width="2"/>
<text x="200" y="336" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="28" fill="#f2eee8">BOSTON</text>
<text x="200" y="366" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#c7a86b">12 Sep — opening night</text>

<!-- Dublin 29 Oct -->
<circle cx="840" cy="430" r="11" fill="#f2eee8"/>
<line x1="840" y1="419" x2="840" y2="352" stroke="#3a3b3f" stroke-width="2"/>
<text x="840" y="336" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="28" fill="#f2eee8">DUBLIN</text>
<text x="840" y="366" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#c7a86b">29 Oct — Europe begins</text>

<!-- Istanbul 10 Dec -->
<circle cx="1412" cy="430" r="11" fill="#f2eee8"/>
<line x1="1412" y1="419" x2="1412" y2="352" stroke="#3a3b3f" stroke-width="2"/>
<text x="1440" y="336" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="28" fill="#f2eee8">ISTANBUL</text>
<text x="1440" y="366" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#c7a86b">10 Dec — Volkswagen Arena</text>

<!-- Muscat 12 Dec -->
<circle cx="1440" cy="430" r="13" fill="#286344"/>
<line x1="1440" y1="443" x2="1440" y2="500" stroke="#3a3b3f" stroke-width="2"/>
<text x="1440" y="528" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="28" fill="#f2eee8">MUSCAT</text>
<text x="1440" y="556" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#59a97d">12 Dec — home to the Arab world</text>

<text x="140" y="486" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#aaa9a5">SEPTEMBER</text>
<text x="880" y="486" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#aaa9a5">DECEMBER</text>

<!-- the name every stage carries -->
<circle cx="700" cy="500" r="13" fill="#c7a86b"/>
<line x1="700" y1="513" x2="700" y2="596" stroke="#c7a86b" stroke-width="2"/>

<rect x="410" y="596" width="580" height="184" rx="10" fill="#161719" stroke="#c7a86b" stroke-width="3"/>
<text x="700" y="668" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="58" letter-spacing="6" fill="#f2eee8">GAZA</text>
<text x="700" y="712" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="32" fill="#c7a86b">غزة — الاسم الذي تحمله كل ليلة من الجولة</text>
<text x="700" y="752" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#aaa9a5">DEIRA — the seafront hotel his father built, kept standing in song</text>

<!-- quote -->
<line x1="110" y1="812" x2="1520" y2="812" stroke="#3a3b3f" stroke-width="2"/>
<text x="110" y="852" font-family="'Source Serif 4',Georgia,serif" font-size="26" font-style="italic" fill="#f2eee8">“My name is Saint Levant and I was born in Jerusalem and raised in Gaza.” — Coachella, 2024</text>
<text x="1520" y="852" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">Sources: Arab News · The Music Universe · Türkiye Today · Middle East Eye</text>
</svg>

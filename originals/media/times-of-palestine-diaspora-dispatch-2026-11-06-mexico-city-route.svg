<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From Jabalia to Mexico City: one route out, and the gap it answers</title>
  <desc id="desc">A bilingual two-panel graphic. The left panel traces the route that brought eighteen members of the Abed family from Gaza to Mexico City between January 2024 and 2026, including the volunteer collective, the university law clinic, the arrival date and the grants of refuge and residency. The right panel gives the scale of Gaza's child amputee caseload recorded by the Euro-Mediterranean Human Rights Monitor and the World Health Organization.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101114"/>
      <stop offset="1" stop-color="#1c1d21"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e1e2b"/>
      <stop offset=".48" stop-color="#286344"/>
      <stop offset="1" stop-color="#bd9854"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f2eee8}
      .muted{fill:#aaa9a5}
      .gold{fill:#c7a86b}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:17px}
      .small{font-size:19px}
      .body{font-size:22px}
      .label{font-size:18px;font-weight:800;letter-spacing:1.2px}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="90" y="76" class="serif ivory" font-size="48" font-weight="800">From Jabalia to Mexico City</text>
  <text x="90" y="118" class="sans muted body">One route out of Gaza, and the shortage it answers</text>
  <text x="1510" y="162" class="arabic ivory" font-size="34" font-weight="800" text-anchor="end">من جباليا إلى مكسيكو سيتي</text>
  <text x="1510" y="194" class="arabic muted small" text-anchor="end">مسار واحد للخروج من غزة.. والنقص الذي يعالجه</text>

  <g filter="url(#shadow)">
    <rect x="70" y="232" width="750" height="478" rx="18" fill="#27282c" stroke="#c7a86b" stroke-width="2"/>
    <text x="108" y="278" class="sans gold label">THE ROUTE OUT</text>
    <text x="108" y="304" class="arabic muted small">مسار الخروج</text>

    <circle cx="118" cy="344" r="8" fill="#c7a86b"/>
    <text x="148" y="352" class="sans ivory body">Jan 2024: a volunteer collective forms in Mexico City</text>
    <text x="148" y="378" class="arabic muted small">يناير 2024: تشكُّل جماعة تطوعية في مكسيكو سيتي</text>

    <circle cx="118" cy="420" r="8" fill="#c7a86b"/>
    <text x="148" y="428" class="sans ivory body">2024: a university legal clinic takes the file</text>
    <text x="148" y="454" class="arabic muted small">2024: عيادة قانونية جامعية تتبنّى الملف</text>

    <circle cx="118" cy="496" r="8" fill="#dc6572"/>
    <text x="148" y="504" class="sans ivory body">24 May 2025: 18 members of one family land</text>
    <text x="148" y="530" class="arabic muted small">24 أيار 2025: وصول 18 فرداً من عائلة واحدة</text>

    <circle cx="118" cy="572" r="8" fill="#61aa80"/>
    <text x="148" y="580" class="sans ivory body">Refugee status granted, then permanent residency</text>
    <text x="148" y="606" class="arabic muted small">منح صفة اللجوء ثم الإقامة الدائمة</text>

    <circle cx="118" cy="648" r="8" fill="#61aa80"/>
    <text x="148" y="656" class="sans ivory body">2026: two wounded children arrive for treatment</text>
    <text x="148" y="682" class="arabic muted small">2026: وصول طفلين جريحين للعلاج</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="852" y="232" width="658" height="478" rx="18" fill="#27282c" stroke="#72747a" stroke-width="2"/>
    <text x="890" y="278" class="sans gold label">THE SHORTAGE IN GAZA</text>
    <text x="890" y="304" class="arabic muted small">النقص داخل غزة</text>

    <text x="890" y="382" class="sans gold" font-size="54" font-weight="800">1,134</text>
    <text x="890" y="412" class="sans ivory small">children with amputations, 9 October 2026</text>
    <text x="890" y="438" class="arabic muted small">طفل بُترت أطرافه حتى 9 تشرين الأول 2026</text>

    <text x="890" y="518" class="sans red" font-size="54" font-weight="800">502</text>
    <text x="890" y="548" class="sans ivory small">of 2,277 people assessed received a limb</text>
    <text x="890" y="574" class="arabic muted small">من 2,277 جرى تقييمهم حصلوا على طرف صناعي</text>

    <text x="890" y="634" class="sans green" font-size="54" font-weight="800">8</text>
    <text x="890" y="664" class="sans ivory small">prosthetics and orthotics specialists remain</text>
    <text x="890" y="690" class="arabic muted small">ثمانية أخصائيين فقط في الأطراف الصناعية</text>
  </g>

  <rect x="90" y="742" width="1420" height="104" rx="15" fill="url(#band)"/>
  <text x="124" y="780" class="sans ivory" font-size="23" font-weight="800">A TIE TO MEXICO OPENED THE DOOR</text>
  <text x="124" y="812" class="sans ivory small">The father had taken Mexican nationality years before the war.</text>
  <text x="124" y="836" class="sans ivory small">Without that tie the family could not have applied at all.</text>
  <text x="1478" y="780" class="arabic ivory" font-size="23" font-weight="800" text-anchor="end">الصلة بالمكسيك هي ما فتح الباب</text>
  <text x="1478" y="812" class="arabic ivory small" text-anchor="end">الأب نال الجنسية المكسيكية قبل الحرب بسنوات</text>
  <text x="1478" y="836" class="arabic ivory small" text-anchor="end">ولولا تلك الصلة لما جاز للعائلة التقدّم أصلاً</text>

  <text x="90" y="880" class="sans muted tiny">Figures: Euro-Mediterranean Human Rights Monitor (9 October 2026) and the World Health Organization. Graphic: Times of Palestine.</text>
</svg>

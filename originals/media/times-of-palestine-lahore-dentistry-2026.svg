<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Gaza dentistry students graduate in Lahore</title><desc id="d">Editorial illustration of a graduation cap and diploma above a route from Gaza to Lahore, with a dental mirror and an open textbook.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient><style>.e{font-family:Arial,sans-serif}.a{font-family:Cairo,Arial,sans-serif}.iv{fill:#f2eee8}.mu{fill:#aaa9a5}.go{fill:#c7a86b}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="22" height="900" fill="#8a1f2d"/><rect x="22" width="8" height="900" fill="#286344"/><text x="75" y="84" class="e iv" font-size="42" font-weight="800">REAL LIVES · FROM GAZA TO A LAHORE GRADUATION</text><text x="1525" y="84" class="a iv" font-size="34" font-weight="700" text-anchor="end">حكايات · من غزة إلى تخرّج في لاهور</text><g transform="translate(110 300)"><rect width="300" height="160" rx="20" fill="#211b1e" stroke="#8a1f2d" stroke-width="5"/><text x="150" y="70" class="e iv" font-size="32" font-weight="800" text-anchor="middle">GAZA</text><text x="150" y="118" class="a mu" font-size="26" text-anchor="middle">جامعة الأزهر · غزة</text></g><g transform="translate(1160 300)"><rect width="300" height="160" rx="20" fill="#17211b" stroke="#286344" stroke-width="5"/><text x="150" y="70" class="e iv" font-size="32" font-weight="800" text-anchor="middle">LAHORE</text><text x="150" y="118" class="a mu" font-size="26" text-anchor="middle">جامعة لاهور · باكستان</text></g><path d="M420 380C620 300 980 300 1150 380" stroke="#c7a86b" stroke-width="12" fill="none"/><circle cx="785" cy="331" r="16" fill="#c7a86b"/><g transform="translate(660 470)"><path d="M140 0 280 62 140 124 0 62z" fill="#e9e0d3"/><path d="M140 132 44 90v70q0 40 96 40t96-40V90z" fill="#8a1f2d"/><path d="M262 74v96" stroke="#c7a86b" str
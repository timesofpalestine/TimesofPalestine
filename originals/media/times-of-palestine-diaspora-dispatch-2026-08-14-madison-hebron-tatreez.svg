<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Idhna to Madison: the thread and the numbers behind it</title>
  <desc id="desc">A bilingual figures board pairing the Women in Hebron cooperative — founded 2005, more than 150 stitchers, working inside Hebron's Israeli-controlled H2 area — with the Madison, Wisconsin network that exhibits and sells its tatreez, from the 2003 founding of the Madison-Rafah Sister City Project to the 2026 Threading Solidarity exhibition, and UNESCO's 2021 inscription of Palestinian embroidery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101114"/>
      <stop offset="1" stop-color="#1c1d21"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a1f2d"/>
      <stop offset=".5" stop-color="#286344"/>
      <stop offset="1" stop-color="#c7a86b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f2eee8}
      .muted{fill:#aaa9a5}
      .gold{fill:#d4b36e}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:17px}
      .small{font-size:19px}
      .body{font-size:23px}
      .label{font-size:18px;font-weight:800;letter-spacing:1.2px}
      .item{font-size:22px;font-weight:700}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="90" y="76" class="serif ivory" font-size="52" font-weight="800">Idhna to Madison: the thread and the numbers</text>
  <text x="90" y="122" class="sans muted body">One cooperative stitches. One American city exhibits the work — and buys it.</text>
  <text x="1510" y="166" class="arabic ivory" font-size="37" font-weight="800" text-anchor="end">من إذنا إلى ماديسون: الخيط والأرقام</text>
  <text x="1510" y="200" class="arabic muted small" text-anchor="end">تعاونية تطرّز، ومدينة أميركية تعرض العمل وتشتريه</text>

  <g filter="url(#shadow)">
    <rect x="70" y="238" width="700" height="330" rx="18" fill="#27282c" stroke="#8a1f2d" stroke-width="3"/>
    <text x="102" y="282" class="sans red label">HEBRON — WHERE THE STITCHING EARNS</text>
    <text x="738" y="282" class="arabic gold small" text-anchor="end">الخليل: حيث يصير التطريز دخلاً</text>

    <text x="102" y="336" class="sans ivory item">2005 — a table in the Old City souq becomes a shop</text>
    <text x="102" y="362" class="arabic muted small">2005: طاولة في سوق البلدة القديمة تصير محلاً ثابتاً</text>

    <text x="102" y="410" class="sans ivory item">150+ women stitch for the cooperative today</text>
    <text x="102" y="436" class="arabic muted small">أكثر من 150 مطرِّزة تعمل مع التعاونية اليوم</text>

    <text x="102" y="484" class="sans ivory item">H2: 33,000 Palestinians, some 700 settlers</text>
    <text x="102" y="510" class="arabic muted small">في H2: 33 ألف فلسطيني ونحو 700 مستوطن — الأمم المتحدة</text>

    <text x="102" y="546" class="sans muted small">1,079 of 3,369 Old City homes stood empty — 2015 UN survey</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="238" width="700" height="330" rx="18" fill="#27282c" stroke="#c7a86b" stroke-width="3"/>
    <text x="862" y="282" class="sans gold label">MADISON — WHERE THE MARKET IS</text>
    <text x="1498" y="282" class="arabic green small" text-anchor="end">ماديسون: حيث السوق</text>

    <text x="862" y="336" class="sans ivory item">2003 — the Madison-Rafah Sister City Project begins</text>
    <text x="862" y="362" class="arabic muted small">2003: انطلاق مشروع ماديسون - رفح التوأم</text>

    <text x="862" y="410" class="sans ivory item">2004 — the twinning falls by a single council vote</text>
    <text x="862" y="436" class="arabic muted small">2004: سقوط التوأمة الرسمية بفارق صوت واحد</text>

    <text x="862" y="484" class="sans ivory item">June 2024 — Laila Hasan shows the work in Madison</text>
    <text x="862" y="510" class="arabic muted small">حزيران 2024: ليلى حسن تعرض أعمال التعاونية في المدينة</text>

    <text x="862" y="546" class="sans muted small">7 July – 29 August 2026 — "Threading Solidarity" on view</text>
  </g>

  <path d="M140 620H1460" stroke="#67696f" stroke-width="3"/>
  <g stroke-width="4" fill="none">
    <g stroke="#dc6572">
      <path d="M231 609l18 22M249 609l-18 22"/>
      <path d="M471 609l18 22M489 609l-18 22"/>
    </g>
    <g stroke="#61aa80">
      <path d="M711 609l18 22M729 609l-18 22"/>
      <path d="M951 609l18 22M969 609l-18 22"/>
    </g>
    <g stroke="#d4b36e">
      <path d="M1191 609l18 22M1209 609l-18 22"/>
      <path d="M1371 609l18 22M1389 609l-18 22"/>
    </g>
  </g>
  <circle cx="140" cy="620" r="11" fill="#8a1f2d"/>
  <circle cx="1460" cy="620" r="11" fill="#c7a86b"/>

  <text x="140" y="660" class="sans ivory small" font-weight="800">Idhna &amp; Hebron, West Bank</text>
  <text x="140" y="684" class="arabic muted tiny">إذنا والخليل في الضفة الغربية</text>
  <text x="800" y="660" class="sans muted small" text-anchor="middle">about 8,000 km of thread</text>
  <text x="800" y="684" class="arabic muted tiny" text-anchor="middle">نحو ثمانية آلاف كيلومتر من الخيط</text>
  <text x="1460" y="660" class="sans ivory small" font-weight="800" text-anchor="end">Madison, Wisconsin</text>
  <text x="1460" y="684" class="arabic muted tiny" text-anchor="end">ماديسون في ولاية ويسكونسن</text>

  <rect x="90" y="712" width="1420" height="104" rx="15" fill="url(#band)"/>
  <text x="122" y="750" class="sans ivory" font-size="24" font-weight="800">UNESCO, 15 DECEMBER 2021</text>
  <text x="122" y="782" class="sans ivory small">The art of embroidery in Palestine joined the Representative List of Intangible Cultural Heritage.</text>
  <text x="122" y="806" class="sans ivory small">Recognition is not wages. The cooperative asked for a market instead of aid.</text>
  <text x="1478" y="750" class="arabic ivory" font-size="24" font-weight="800" text-anchor="end">اليونسكو، 15 كانون الأول 2021</text>
  <text x="1478" y="782" class="arabic ivory small" text-anchor="end">أُدرج فن التطريز في فلسطين على القائمة التمثيلية للتراث غير المادي</text>
  <text x="1478" y="806" class="arabic ivory small" text-anchor="end">والاعتراف ليس أجراً: التعاونية طلبت سوقاً بدل المساعدة</text>

  <text x="90" y="864" class="sans muted tiny">Figures: UN OCHA (H2 and Old City surveys); UNESCO; the Cap Times; the Wisconsin Muslim Journal; Arts + Literature Laboratory. Graphic: Times of Palestine.</text>
</svg>

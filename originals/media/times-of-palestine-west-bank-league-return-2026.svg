<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">West Bank league football returns after three lost seasons</title>
<desc id="dsc">A football pitch drawn as a map of the occupied West Bank's league cities — Hebron, Bethlehem, Ramallah, Nablus, Jenin, Tulkarem — with the checkpoints and gates between them marked, and the three suspended seasons counted along the touchline.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>
<text x="110" y="78" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" letter-spacing="5" fill="#c7a86b">SPORT · WEST BANK LEAGUE · دوري الضفة</text>
<text x="110" y="152" font-family="'Source Serif 4',Georgia,serif" font-size="56" fill="#f2eee8">Three seasons lost, a whistle in September</text>
<text x="110" y="204" font-family="Cairo,Arial,sans-serif" font-size="34" fill="#c7a86b">ثلاثة مواسم ضائعة.. وصافرة في أيلول</text>
<line x1="110" y1="240" x2="1490" y2="240" stroke="#3a3b3f" stroke-width="2"/>

<!-- the pitch -->
<rect x="150" y="300" width="820" height="460" fill="#17251c" stroke="#3a3b3f" stroke-width="3"/>
<line x1="560" y1="300" x2="560" y2="760" stroke="#3a3b3f" stroke-width="3"/>
<circle cx="560" cy="530" r="78" fill="none" stroke="#3a3b3f" stroke-width="3"/>
<rect x="150" y="430" width="70" height="200" fill="none" stroke="#3a3b3f" stroke-width="3"/>
<rect x="900" y="430" width="70" height="200" fill="none" stroke="#3a3b3f" stroke-width="3"/>

<!-- league cities as players -->
<g fill="#c7a86b">
<circle cx="290" cy="380" r="13"/>
<circle cx="300" cy="530" r="13"/>
<circle cx="290" cy="690" r="13"/>
<circle cx="700" cy="390" r="13"/>
<circle cx="720" cy="545" r="13"/>
<circle cx="700" cy="690" r="13"/>
</g>
<g font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">
<text x="316" y="386">Jenin</text>
<text x="326" y="536">Nablus</text>
<text x="316" y="696">Tulkarem</text>
<text x="726" y="396">Ramallah</text>
<text x="746" y="551">Bethlehem</text>
<text x="726" y="696">Hebron</text>
</g>
<g font-family="Cairo,Arial,sans-serif" font-size="18" fill="#c7a86b">
<text x="316" y="412">جنين</text>
<text x="326" y="562">نابلس</text>
<text x="316" y="722">طولكرم</text>
<text x="726" y="422">رام الله</text>
<text x="746" y="577">بيت لحم</text>
<text x="726" y="722">الخليل</text>
</g>

<!-- the closures between them -->
<g stroke="#8a1f2d" stroke-width="4" stroke-dasharray="14 12">
<line x1="330" y1="450" x2="670" y2="450"/>
<line x1="340" y1="610" x2="680" y2="610"/>
</g>
<text x="500" y="440" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#d98a94">closures between league cities · الحواجز بين مدن الدوري</text>

<!-- the counters -->
<g font-family="'Libre Franklin',Arial,sans-serif" fill="#f2eee8">
<text x="1040" y="360" font-size="62" fill="#c7a86b">3</text>
<text x="1040" y="396" font-size="21">seasons suspended since October 2023</text>
<text x="1040" y="480" font-size="62" fill="#c7a86b">925</text>
<text x="1040" y="516" font-size="21">movement obstacles counted by OCHA, Dec 2025</text>
<text x="1040" y="600" font-size="62" fill="#c7a86b">1000</text>
<text x="1040" y="636" font-size="21">the Martyrs Cup that reopens the season</text>
</g>
<g font-family="Cairo,Arial,sans-serif" font-size="19" fill="#c7a86b">
<text x="1040" y="424">مواسم متوقفة منذ تشرين الأول 2023</text>
<text x="1040" y="544">حاجزاً وعائقاً أحصاها مكتب أوتشا في كانون الأول 2025</text>
<text x="1040" y="664">كأس الألف شهيد التي تفتتح الموسم</text>
</g>

<text x="800" y="850" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">الاتحاد الفلسطيني لكرة القدم حدّد أيلول موعداً لعودة اللعب · The PFA set September as the deadline to restart play</text>
</svg>

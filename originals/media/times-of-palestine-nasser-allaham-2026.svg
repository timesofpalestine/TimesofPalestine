<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Nasser al-Laham and A Tour of the Hebrew Press</title>
  <desc id="d">An illustration of the Palestinian journalist Nasser al-Laham, editor-in-chief of the Ma'an news agency and director of al-Mayadeen's Palestine bureau, whose daily programme A Tour of the Hebrew Press has run for more than twenty years and some seven thousand editions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#286344"/>
      <stop offset="0.55" stop-color="#7a5a3c"/>
      <stop offset="1" stop-color="#8a1f2d"/>
    </linearGradient>
    <linearGradient id="fig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f46"/>
      <stop offset="1" stop-color="#22262b"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>

  <text x="800" y="76" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="25" letter-spacing="6">TIMES OF PALESTINE &#183; PROFILE</text>
  <text x="800" y="150" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="54" font-weight="700">Nasser al-Laham</text>
  <text x="800" y="204" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,Arial,sans-serif" font-size="36">ناصر اللحام</text>

  <line x1="380" y1="248" x2="1220" y2="248" stroke="url(#rule)" stroke-width="4"/>

  <g transform="translate(300,300)">
    <circle cx="150" cy="96" r="62" fill="url(#fig)"/>
    <path d="M46 300 q0 -110 104 -110 q104 0 104 110 z" fill="url(#fig)"/>
    <rect x="18" y="212" width="264" height="150" rx="6" fill="#e8e3d9" transform="rotate(-4 150 287)"/>
    <g transform="rotate(-4 150 287)" fill="#8f8b83">
      <rect x="40" y="236" width="100" height="9" rx="4"/>
      <rect x="40" y="258" width="220" height="6" rx="3"/>
      <rect x="40" y="274" width="220" height="6" rx="3"/>
      <rect x="40" y="290" width="184" height="6" rx="3"/>
      <rect x="160" y="236" width="100" height="9" rx="4" fill="#b3aea4"/>
      <rect x="40" y="312" width="220" height="6" rx="3"/>
      <rect x="40" y="328" width="150" height="6" rx="3"/>
    </g>
  </g>

  <text x="760" y="356" fill="#c7a86b" font-family="Georgia,serif" font-size="21" letter-spacing="3">A TOUR OF THE HEBREW PRESS</text>
  <text x="760" y="400" fill="#f2eee8" font-family="Tahoma,Arial,sans-serif" font-size="30">«جولة في الصحافة العبرية»</text>

  <text x="760" y="484" fill="#f2eee8" font-family="Georgia,serif" font-size="76" font-weight="700">~7,000</text>
  <text x="760" y="524" fill="#a9a49b" font-family="Georgia,serif" font-size="24">editions of a single daily programme</text>
  <text x="760" y="562" fill="#8f8b83" font-family="Tahoma,Arial,sans-serif" font-size="24">نحو سبعة آلاف حلقة من برنامج يومي واحد</text>

  <line x1="760" y1="600" x2="1380" y2="600" stroke="#2a2c31" stroke-width="2"/>

  <text x="760" y="646" fill="#a9a49b" font-family="Georgia,serif" font-size="24">Editor-in-chief, Ma&#8217;an news agency &#183; Bethlehem</text>
  <text x="760" y="686" fill="#a9a49b" font-family="Georgia,serif" font-size="24">Director, al-Mayadeen bureau in Palestine</text>
  <text x="760" y="726" fill="#8f8b83" font-family="Georgia,serif" font-size="24">Born 1966, Dheisheh refugee camp</text>

  <text x="800" y="820" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="23">Thirty-two years in journalism, in print, radio and television</text>
  <text x="800" y="864" text-anchor="middle" fill="#6f6b64" font-family="Georgia,serif" font-size="19">Illustration: Times of Palestine</text>
</svg>

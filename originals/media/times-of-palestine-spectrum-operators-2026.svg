<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Two operators, one spectrum gate</title>
  <desc id="desc">A bilingual board: Paltel Group (PADICO anchor, Jawwal, Paltel, Hadara) and Ooredoo Palestine (48.45 percent Ooredoo Qatar, 34.03 percent Palestine Investment Fund) on the Palestinian side, and the Israeli-held frequency gate of Oslo Annex III Article 36 — 3G granted only in 2018, Gaza kept on 2G, 4G agreed at the end of 2023 — with World Bank loss figures.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#142333"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="54" width="1472" height="792" rx="30" fill="#0d1a26" stroke="#30485a" stroke-width="2" filter="url(#shadow)"/>

  <text x="110" y="128" fill="#ffffff" font-family="Arial, sans-serif" font-size="44" font-weight="700">Two operators, one spectrum gate</text>
  <text x="1490" y="128" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-family="Arial, sans-serif" font-size="34" font-weight="700">مشغّلان وبوابة طيف واحدة</text>
  <text x="110" y="176" fill="#89a8ba" font-family="Arial, sans-serif" font-size="23">Oslo Annex III, Article 36: every Palestinian frequency is Israel's to release</text>

  <g font-family="Arial, sans-serif">
    <rect x="110" y="225" width="660" height="270" rx="16" fill="#122536" stroke="#26a269" stroke-width="2"/>
    <text x="440" y="280" text-anchor="middle" fill="#26a269" font-size="26" font-weight="700">PALTEL GROUP — est. 1995</text>
    <text x="440" y="322" text-anchor="middle" fill="#ffffff" font-size="22">Chair: Sabih al-Masri — anchor: PADICO</text>
    <text x="440" y="358" text-anchor="middle" fill="#b8cbd6" font-size="21">Jawwal mobile - Paltel fixed - Hadara internet</text>
    <text x="440" y="394" text-anchor="middle" fill="#b8cbd6" font-size="21">the bourse's heavyweight; thousands employed</text>
    <text x="440" y="448" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="21">مجموعة «بالتل» — «جوّال» و«حضارة»</text>

    <rect x="830" y="225" width="660" height="270" rx="16" fill="#122536" stroke="#e0a928" stroke-width="2"/>
    <text x="1160" y="280" text-anchor="middle" fill="#e0a928" font-size="26" font-weight="700">OOREDOO PALESTINE — 2009</text>
    <text x="1160" y="322" text-anchor="middle" fill="#ffffff" font-size="22">48.45% Ooredoo Qatar — 34.03% PIF</text>
    <text x="1160" y="358" text-anchor="middle" fill="#b8cbd6" font-size="21">~17.5% free float; Gaza launch only 2018</text>
    <text x="1160" y="394" text-anchor="middle" fill="#b8cbd6" font-size="21">the public's fund owns a third of operator two</text>
    <text x="1160" y="448" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="21">«أوريدو فلسطين» — ثلثها لصندوق الاستثمار</text>

    <rect x="110" y="530" width="1380" height="150" rx="16" fill="#0f2436" stroke="#e74c3c" stroke-width="3"/>
    <text x="800" y="586" text-anchor="middle" fill="#e74c3c" font-size="28" font-weight="700">THE GATE: 2G for decades — 3G released Jan 2018 (West Bank only) — 4G agreed end-2023</text>
    <text x="800" y="626" text-anchor="middle" fill="#b8cbd6" font-size="21">World Bank: $1bn+ lost to restrictions in three years; Israeli carriers hold 20–40% of the market unlicensed</text>
    <text x="800" y="662" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="20">البوابة الإسرائيلية: الجيل الثالث في 2018 فقط، وغزة على الثاني، والرابع وُعد في نهاية 2023</text>

    <rect x="110" y="710" width="1380" height="70" rx="16" fill="#122536" stroke="#30485a" stroke-width="2"/>
    <text x="800" y="754" text-anchor="middle" fill="#89a8ba" font-size="21">Gaza's network infrastructure devastated in the war — crews from both operators repair lines under fire</text>
  </g>

  <text x="110" y="818" fill="#6d8798" font-family="Arial, sans-serif" font-size="20">Graphic: Times of Palestine — figures: World Bank, Ooredoo IR, MAS</text>
</svg>

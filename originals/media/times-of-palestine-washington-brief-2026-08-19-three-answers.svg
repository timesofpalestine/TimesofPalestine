<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One day, three Israeli actions, three American answers</title>
  <desc id="desc">A bilingual comparison of Washington's response on 18 August 2026 to three Israeli actions on the same day: the air strike on the Abu al-Duhur base in Syria, which drew a public rebuke from envoy Tom Barrack; the strike on a cafe in Gaza City's fishing harbour, which drew a Board of Peace statement affirming Israel's right of self-defence; and the housing ministry tender for 1,234 settlement units in E1, on which the administration has taken no position.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a1f2d"/>
      <stop offset=".5" stop-color="#286344"/>
      <stop offset="1" stop-color="#c7a86b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f2eee8}
      .muted{fill:#a9a8a4}
      .gold{fill:#c7a86b}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:17px}
      .small{font-size:20px}
      .body{font-size:22px}
      .label{font-size:17px;font-weight:800;letter-spacing:1.4px}
      .figure{font-size:46px;font-weight:800}
      .name{font-size:27px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="88" y="80" class="serif ivory" font-size="50" font-weight="800">One day, three Israeli actions, three American answers</text>
  <text x="88" y="122" class="sans muted body">Tuesday 18 August 2026 — what Washington said, and what it did not say</text>
  <text x="1516" y="166" class="arabic ivory" font-size="35" font-weight="800" text-anchor="end">يوم واحد.. ثلاثة أفعال إسرائيلية وثلاثة ردود أميركية</text>
  <text x="1516" y="200" class="arabic muted small" text-anchor="end">الثلاثاء 18 آب/أغسطس 2026 — ما قالته واشنطن وما سكتت عنه</text>

  <rect x="88" y="222" width="1428" height="4" fill="url(#spine)"/>

  <!-- Column 1: Syria -->
  <g filter="url(#shadow)">
    <rect x="88" y="256" width="446" height="440" rx="18" fill="#26272b" stroke="#dc6572" stroke-width="3"/>
    <text x="118" y="300" class="sans red label">SYRIA — سوريا</text>
    <text x="118" y="342" class="sans ivory name">Abu al-Duhur air base</text>
    <text x="118" y="374" class="arabic muted small">قاعدة أبو الظهور الجوية بإدلب</text>
    <text x="118" y="446" class="sans ivory figure">8</text>
    <text x="118" y="480" class="sans muted small">Israeli strikes on runways and hangars</text>
    <text x="118" y="508" class="arabic muted tiny">ثماني غارات على المدارج والحظائر</text>
    <text x="118" y="558" class="sans gold label">THE AMERICAN ANSWER</text>
    <text x="118" y="596" class="sans ivory body">Envoy Tom Barrack: “an unnecessary</text>
    <text x="118" y="624" class="sans ivory body">escalation”, said in public, same day</text>
    <text x="118" y="658" class="arabic muted small">برّاك: «تصعيد لا لزوم له».. علناً وفي اليوم ذاته</text>
  </g>

  <!-- Column 2: Gaza -->
  <g filter="url(#shadow)">
    <rect x="577" y="256" width="446" height="440" rx="18" fill="#26272b" stroke="#c7a86b" stroke-width="3"/>
    <text x="607" y="300" class="sans gold label">GAZA — غزة</text>
    <text x="607" y="342" class="sans ivory name">Café, fishing harbour</text>
    <text x="607" y="374" class="arabic muted small">مقهى في ميناء صيادي غزة</text>
    <text x="607" y="446" class="sans ivory figure">6</text>
    <text x="607" y="480" class="sans muted small">killed, including a boy of 13 and his</text>
    <text x="607" y="506" class="sans muted small">father; 14 wounded</text>
    <text x="607" y="534" class="arabic muted tiny">ستة قتلى بينهم طفل (13 عاماً) ووالده.. و14 جريحاً</text>
    <text x="607" y="576" class="sans gold label">THE AMERICAN ANSWER</text>
    <text x="607" y="614" class="sans ivory body">Board of Peace official: Israel keeps its</text>
    <text x="607" y="642" class="sans ivory body">“full right of self-defence”</text>
    <text x="607" y="676" class="arabic muted small">مجلس السلام: لإسرائيل «كامل حق الدفاع عن النفس»</text>
  </g>

  <!-- Column 3: West Bank -->
  <g filter="url(#shadow)">
    <rect x="1066" y="256" width="450" height="440" rx="18" fill="#26272b" stroke="#61aa80" stroke-width="3"/>
    <text x="1096" y="300" class="sans green label">WEST BANK — الضفة الغربية</text>
    <text x="1096" y="342" class="sans ivory name">E1 settlement tender</text>
    <text x="1096" y="374" class="arabic muted small">عطاء استيطاني في منطقة E1</text>
    <text x="1096" y="446" class="sans ivory figure">1,234</text>
    <text x="1096" y="480" class="sans muted small">housing units opened for bidding;</text>
    <text x="1096" y="506" class="sans muted small">bids close 19 October</text>
    <text x="1096" y="534" class="arabic muted tiny">1234 وحدة سكنية.. وإغلاق العطاء في 19 تشرين الأول</text>
    <text x="1096" y="576" class="sans gold label">THE AMERICAN ANSWER</text>
    <text x="1096" y="614" class="sans ivory body">No position. 85 members of Congress</text>
    <text x="1096" y="642" class="sans ivory body">asked Rubio to stop E1 in June</text>
    <text x="1096" y="676" class="arabic muted small">لا موقف.. و85 نائباً طالبوا روبيو في حزيران بوقفه</text>
  </g>

  <!-- Footer band -->
  <g filter="url(#shadow)">
    <rect x="88" y="726" width="1428" height="124" rx="16" fill="#1a1b1e" stroke="#3a3b3f" stroke-width="2"/>
    <text x="118" y="772" class="sans gold label">THE CEASEFIRE LEDGER — دفتر وقف إطلاق النار</text>
    <text x="118" y="814" class="sans ivory body">Gaza's health ministry counts at least 1,262 Palestinians killed and more than 4,100 wounded since 10 October.</text>
    <text x="1486" y="814" class="arabic muted small" text-anchor="end">وزارة الصحة في غزة: 1262 قتيلاً وأكثر من 4100 جريح منذ 10 تشرين الأول</text>
  </g>

  <text x="88" y="880" class="sans muted tiny">Graphic: Times of Palestine — sources: Syrian state media, US envoy statements, Gaza health ministry, Peace Now, Wafa</text>
  <text x="1516" y="880" class="arabic muted tiny" text-anchor="end">رسم: تايمز أوف فلسطين</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">From Saudi funding to maternal-health services in Gaza</title><desc id="d">Process graphic: $1.5 million from KSrelief moved through UNFPA into two restored hospitals, one new primary care centre, equipment, 120 trained workers and services for more than 20,400 women and girls.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient><style>.e{font-family:Arial,sans-serif}.a{font-family:Cairo,Arial,sans-serif}.iv{fill:#f2eee8}.mu{fill:#aaa9a5}.go{fill:#c7a86b}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="22" height="900" fill="#8a1f2d"/><rect x="22" width="8" height="900" fill="#286344"/><text x="75" y="80" class="e iv" font-size="40" font-weight="800">FROM COMMITMENT TO CARE</text><text x="1525" y="80" class="a iv" font-size="36" font-weight="700" text-anchor="end">من الالتزام إلى الرعاية</text><text x="75" y="125" class="e mu" font-size="22">Delivered components reported by UNFPA · January 2026</text><text x="1525" y="158" class="a mu" font-size="21" text-anchor="end">مكونات منفذة وفق صندوق الأمم المتحدة للسكان · كانون الثاني 2026</text><g><rect x="75" y="280" width="310" height="260" rx="22" fill="#17211b" stroke="#286344" stroke-width="5"/><text x="230" y="355" class="e go" font-size="52" font-weight="800" text-anchor="middle">$1.5m</text><text x="230" y="415" class="e iv" font-size="27" text-anchor="middle">KSRELIEF FUNDING</text><text x="230" y="465" class="a mu" font-size="25" text-anchor="middle">تمويل سعودي</text><path d="M385 410h110" stroke="#aaa9a5" stroke-width="8"/><rect x="495" y="235" width="610" height="350" rx="22" fill="#18191d" stroke="#c7a86b" stroke-width="5"/><text x="800" y="300" class="e go" font-size="29" font-weight="800" text-anchor="middle">UNFPA AND LOCAL PROVIDERS</text><text x="800" y="342" class="a mu" font-size="25" text-anchor="middle">الصندوق ومقدمو الخدمات المحليون</text><text x="565" y="420" class="e iv" font-size="25">2 hospitals restored</text><text x="565" y="470" class="e iv" font-size="25">1 new primary centre</text><text x="565" y="520" class="e iv" font-size="25">Equipment delivered</text><text x="1040" y="420" class="a iv" font-size="23" text-anchor="end">تأهيل مستشفيين</text><text x="1040" y="470" class="a iv" font-size="23" text-anchor="end">مركز أولي جديد</text><text x="1040" y="520" class="a iv" font-size="23" text-anchor="end">تسليم معدات</text><path d="M1105 410h110" stroke="#aaa9a5" stroke-width="8"/><rect x="1215" y="280" width="310" height="260" rx="22" fill="#211b1e" stroke="#8a1f2d" stroke-width="5"/><text x="1370" y="350" class="e go" font-size="48" font-weight="800" text-anchor="middle">120</text><text x="1370" y="395" class="e iv" font-size="22" text-anchor="middle">WORKERS TRAINED</text><text x="1370" y="455" class="e go" font-size="42" font-weight="800" text-anchor="middle">20,400+</text><text x="1370" y="500" class="a mu" font-size="22" text-anchor="middle">امرأة وفتاة تلقين خدمات</text></g><text x="75" y="720" class="e mu" font-size="22">The 2024 plan’s 48,366 target included newborns and named partly different sites; it is not a like-for-like denominator.</text><text x="1525" y="765" class="a mu" font-size="21" text-anchor="end">هدف 48,366 لعام 2024 شمل المواليد وسمّى مواقع مختلفة جزئياً، لذلك لا يصلح مقاماً حسابياً مباشراً</text><text x="75" y="835" class="e mu" font-size="19">Sources: UNFPA, 26 Nov 2024 and 5 Jan 2026 · Graphic: Times of Palestine</text></svg>

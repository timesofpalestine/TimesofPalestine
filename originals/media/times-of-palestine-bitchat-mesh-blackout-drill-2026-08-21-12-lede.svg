<text x="112" y="794" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">26 July (Sensor Tower)</text>

<rect x="445" y="676" width="330" height="140" rx="8" fill="#f2eee8" fill-opacity=".04" stroke="#f2eee8" stroke-opacity=".12"/>
<text x="467" y="736" font-family="'Source Serif 4',Georgia,serif" font-size="40" font-weight="700" fill="#c7a86b">48,781</text>
<text x="467" y="770" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#f2eee8">downloads in Nepal on</text>
<text x="467" y="794" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">8 September 2025</text>

<rect x="800" y="676" width="330" height="140" rx="8" fill="#f2eee8" fill-opacity=".04" stroke="#f2eee8" stroke-opacity=".12"/>
<text x="822" y="736" font-family="'Source Serif 4',Georgia,serif" font-size="40" font-weight="700" fill="#c7a86b">12,581</text>
<text x="822" y="770" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#f2eee8">installs in Indonesia by</text>
<text x="822" y="794" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">3 September 2025</text>

<rect x="1155" y="676" width="330" height="140" rx="8" fill="#286344" fill-opacity=".18" stroke="#59a97d" stroke-opacity=".45"/>
<text x="1177" y="736" font-family="'Source Serif 4',Georgia,serif" font-size="40" font-weight="700" fill="#59a97d">100–200 m</text>
<text x="1177" y="770" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#f2eee8">planned Wi-Fi Direct range,</text>
<text x="1177" y="794" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">not yet released</text>
</g>

<text x="90" y="862" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Sources: bitchat mesh App Store release notes 1.7.1 and 1.6.0 · Gizmodo · Rest of World / Sensor Tower · No field test inside Gaza has been published.</text>
</svg>
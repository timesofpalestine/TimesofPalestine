<rect x="1318" y="372" width="64" height="116" rx="11" fill="#1a1b1e" stroke="#aaa9a5" stroke-width="3"/>
<rect x="1327" y="384" width="46" height="86" rx="4" fill="#f2eee8" fill-opacity=".08"/>

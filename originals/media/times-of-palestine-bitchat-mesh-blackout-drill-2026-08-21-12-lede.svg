<rect x="858" y="372" width="64" height="116" rx="11" fill="#1a1b1e" stroke="#c7a86b" stroke-width="3"/>
<rect x="867" y="384" width="46" height="86" rx="4" fill="#f2eee8" fill-opacity=".14"/>
<circle cx="890" cy="479" r="3.5" fill="#c7a86b"/>
</g>

<text x="90" y="578" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">dashed ring = Bluetooth Low Energy range of one phone · Wi-Fi Direct support is planned, not shipped</text>
<text x="90" y="616" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" font-weight="700" fill="#f2eee8">Density, not distance: every relay must be a phone with bitchat installed, awake, Bluetooth on.</text>
<text x="90" y="648" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5" direction="rtl">الكثافة لا المسافة: كل هاتف في السلسلة يجب أن يكون فعّالاً والبلوتوث مفتوحاً</text>

<!-- stats -->
<g>
<rect x="90" y="676" width="330" height="140" rx="8" fill="#f2eee8" fill-opacity=".04" stroke="#f2eee8" stroke-opacity=".12"/>
<text x="112" y="736" font-family="'Source Serif 4',Georgia,serif" font-size="40" font-weight="700" fill="#c7a86b">430,000</text>

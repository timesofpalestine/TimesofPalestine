<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The al-Masri portfolio across three economies</title>
  <desc id="desc">A bilingual board showing Sabih al-Masri's chairmanships across three capitals: Arab Bank and Zara Investment Holding in Amman, the Astra Group in Saudi Arabia, and the Paltel Group and Palestine Securities Exchange in Palestine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#142333"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="54" width="1472" height="792" rx="30" fill="#0d1a26" stroke="#30485a" stroke-width="2" filter="url(#shadow)"/>

  <text x="110" y="128" fill="#ffffff" font-family="Arial, sans-serif" font-size="46" font-weight="700">One chairman, three economies</text>
  <text x="1490" y="128" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-family="Arial, sans-serif" font-size="38" font-weight="700">رئيس واحد وثلاثة اقتصادات</text>
  <text x="110" y="176" fill="#89a8ba" font-family="Arial, sans-serif" font-size="23">Sabih al-Masri's chairmanships, from Amman to Riyadh to Ramallah</text>

  <!-- hub -->
  <g font-family="Arial, sans-serif">
    <circle cx="800" cy="330" r="86" fill="#122536" stroke="#e0a928" stroke-width="4"/>
    <text x="800" y="318" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">Sabih</text>
    <text x="800" y="352" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">al-Masri</text>
    <text x="800" y="384" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="21">صبيح المصري</text>

    <line x1="736" y1="392" x2="330" y2="520" stroke="#6d8798" stroke-width="4"/>
    <line x1="800" y1="416" x2="800" y2="520" stroke="#6d8798" stroke-width="4"/>
    <line x1="864" y1="392" x2="1270" y2="520" stroke="#6d8798" stroke-width="4"/>

    <!-- Amman -->
    <rect x="110" y="520" width="440" height="240" rx="16" fill="#122536" stroke="#26a269" stroke-width="2"/>
    <text x="330" y="570" text-anchor="middle" fill="#26a269" font-size="26" font-weight="700">AMMAN — JORDAN</text>
    <text x="330" y="612" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Arab Bank — chairman since 2012</text>
    <text x="330" y="648" text-anchor="middle" fill="#b8cbd6" font-size="21">Zara Investment Holding — hotels</text>
    <text x="330" y="692" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="21">البنك العربي — «زارة» القابضة</text>
    <text x="330" y="726" text-anchor="middle" fill="#89a8ba" font-size="19">Jordan's systemic lender, founded Jerusalem 1930</text>

    <!-- Saudi -->
    <rect x="580" y="520" width="440" height="240" rx="16" fill="#122536" stroke="#e0a928" stroke-width="2"/>
    <text x="800" y="570" text-anchor="middle" fill="#e0a928" font-size="26" font-weight="700">SAUDI ARABIA</text>
    <text x="800" y="612" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Astra Group — founder</text>
    <text x="800" y="648" text-anchor="middle" fill="#b8cbd6" font-size="21">agriculture, industry, supply</text>
    <text x="800" y="692" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="21">مجموعة «أسترا» — المؤسس</text>
    <text x="800" y="726" text-anchor="middle" fill="#89a8ba" font-size="19">the first fortune, base of all the rest</text>

    <!-- Palestine -->
    <rect x="1050" y="520" width="440" height="240" rx="16" fill="#122536" stroke="#e74c3c" stroke-width="2"/>
    <text x="1270" y="570" text-anchor="middle" fill="#e74c3c" font-size="26" font-weight="700">RAMALLAH — PALESTINE</text>
    <text x="1270" y="612" text-anchor="middle" fill="#ffffff" font-size="25" font-weight="700">Paltel Group — chairman</text>
    <text x="1270" y="648" text-anchor="middle" fill="#b8cbd6" font-size="21">Palestine Securities Exchange — co-founder</text>
    <text x="1270" y="692" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="21">مجموعة «بالتل» — بورصة فلسطين</text>
    <text x="1270" y="726" text-anchor="middle" fill="#89a8ba" font-size="19">the bourse's anchor stock and its market</text>
  </g>

  <text x="110" y="812" fill="#6d8798" font-family="Arial, sans-serif" font-size="20">Graphic: Times of Palestine</text>
  <text x="1490" y="812" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#6d8798" font-family="Arial, sans-serif" font-size="20">غرافيك: تايمز أوف فلسطين</text>
</svg>

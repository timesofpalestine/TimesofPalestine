<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Bitchat: messaging that works when the internet does not</title>
  <desc id="d">Illustration of the Bitchat app: phones exchanging encrypted messages over a Bluetooth mesh with no internet, with English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <!-- mesh links between devices -->
  <g stroke="#c7a86b" stroke-width="3" stroke-dasharray="4 10" opacity=".8">
    <path d="M560 480 Q 700 330 840 430" fill="none"/>
    <path d="M960 430 Q 1110 330 1240 470" fill="none"/>
    <path d="M600 560 Q 900 720 1200 560" fill="none"/>
  </g>

  <!-- left phone -->
  <g filter="url(#sh)">
    <rect x="420" y="330" width="220" height="420" rx="30" fill="#0b0b0c" stroke="#3a3a42" stroke-width="3"/>
    <rect x="440" y="380" width="180" height="330" rx="8" fill="#16161a"/>
    <rect x="455" y="400" width="120" height="40" rx="12" fill="#286344"/>
    <rect x="485" y="455" width="120" height="40" rx="12" fill="#26262c"/>
    <rect x="455" y="510" width="100" height="40" rx="12" fill="#286344"/>
    <circle cx="530" cy="360" r="6" fill="#3a3a42"/>
  </g>

  <!-- right phone -->
  <g filter="url(#sh)">
    <rect x="960" y="330" width="220" height="420" rx="30" fill="#0b0b0c" stroke="#3a3a42" stroke-width="3"/>
    <rect x="980" y="380" width="180" height="330" rx="8" fill="#16161a"/>
    <rect x="1055" y="400" width="90" height="40" rx="12" fill="#26262c"/>
    <rect x="995" y="455" width="130" height="40" rx="12" fill="#8a1f2d"/>
    <rect x="1035" y="510" width="110" height="40" rx="12" fill="#26262c"/>
    <circle cx="1070" cy="360" r="6" fill="#3a3a42"/>
  </g>

  <!-- relay node -->
  <g>
    <circle cx="800" cy="620" r="46" fill="#16161a" stroke="#c7a86b" stroke-width="3"/>
    <path d="M800 596 L800 644 M786 610 L814 634 M814 610 L786 634 M800 596 L814 610 M800 644 L814 634"
          stroke="#c7a86b" stroke-width="5" fill="none" stroke-linecap="round"/>
  </g>

  <text x="90" y="120" class="sans ivory" font-size="58" font-weight="800">bitchat</text>
  <text x="90" y="170" class="sans muted" font-size="27">Encrypted messages over Bluetooth mesh — no internet, no SIM, no account</text>
  <text x="1510" y="120" class="arabic ivory" font-size="46" font-weight="700" text-anchor="end">«بيتشات»</text>
  <text x="1510" y="170" class="arabic muted" font-size="26" text-anchor="end">رسائل مشفّرة عبر البلوتوث دون إنترنت أو شريحة أو حساب</text>
  <text x="800" y="830" class="mono" fill="#59a97d" font-size="24" text-anchor="middle">phone → phone → phone · 100–300m per hop</text>
</svg>

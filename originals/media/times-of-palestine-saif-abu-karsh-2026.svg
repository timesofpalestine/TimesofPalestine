<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Saif Abu Karsh: the voice that sees</title>
  <desc id="d">Illustration for the profile of Saif Abu Karsh, a blind Palestinian boy who reproduces the voices of Japanese anime characters: a microphone radiating sound waves that turn into anime-style speed lines, with English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <text x="70" y="84" class="sans ivory" font-size="44" font-weight="800">THE VOICE THAT SEES</text>
  <text x="1530" y="84" class="arabic ivory" font-size="40" font-weight="700" text-anchor="end">الصوت الذي يبصر</text>

  <!-- microphone -->
  <g filter="url(#sh)">
    <rect x="758" y="330" width="84" height="150" rx="42" fill="#16161a" stroke="#c7a86b" stroke-width="5"/>
    <path d="M742 430 a58 58 0 0 0 116 0" fill="none" stroke="#c7a86b" stroke-width="6" stroke-linecap="round"/>
    <path d="M800 492 L800 560" stroke="#c7a86b" stroke-width="6"/>
    <path d="M752 562 h96" stroke="#c7a86b" stroke-width="6" stroke-linecap="round"/>
    <path d="M775 355 h50 M775 380 h50 M775 405 h50" stroke="#c7a86b" stroke-width="3" opacity=".7"/>
  </g>

  <!-- sound waves left, becoming anime speed lines right -->
  <g stroke="#286344" stroke-width="5" fill="none" stroke-linecap="round" opacity=".9">
    <path d="M700 405 a105 105 0 0 0 0 10"/>
    <path d="M660 380 a150 150 0 0 0 0 60"/>
    <path d="M618 355 a200 200 0 0 0 0 110"/>
    <path d="M574 330 a255 255 0 0 0 0 160"/>
  </g>
  <g stroke="#8a1f2d" stroke-width="5" stroke-linecap="round" opacity=".9">
    <path d="M900 380 L1130 340"/>
    <path d="M905 410 L1210 400"/>
    <path d="M900 440 L1130 480"/>
    <path d="M890 355 L1040 290"/>
    <path d="M890 465 L1040 530"/>
  </g>
  <!-- starburst accents, anime style -->
  <g fill="#c7a86b">
    <path d="M1240 330 l8 22 22 8 -22 8 -8 22 -8 -22 -22 -8 22 -8 z"/>
    <path d="M1300 470 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6 z"/>
  </g>

  <text x="800" y="660" class="sans ivory" font-size="30" font-weight="700" text-anchor="middle">Saif Abu Karsh gives Japan's anime heroes a Palestinian voice</text>
  <text x="800" y="706" class="arabic muted" font-size="27" text-anchor="middle">سيف أبو كرش يمنح أبطال الأنمي الياباني صوتاً فلسطينياً</text>

  <text x="70" y="862" class="sans muted" font-size="19">Graphic: Times of Palestine · Profile source: Palestine TV</text>
  <text x="1530" y="862" class="arabic muted" font-size="19" text-anchor="end">غرافيك: تايمز أوف فلسطين</text>
</svg>

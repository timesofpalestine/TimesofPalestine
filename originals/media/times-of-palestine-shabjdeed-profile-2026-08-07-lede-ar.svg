<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Shabjdeed: from Kufr Aqab to the sound of Arab rap</title>
<desc id="dsc">A skyline silhouette of Kufr Aqab's dense towers beside the separation wall, with a microphone rising above it and the milestones of Shabjdeed's career: BLTNM founded 2015, Sindibad el Ward 2019, Inn Ann 2021, half a billion streams.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>
<text x="110" y="78" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" letter-spacing="5" fill="#c7a86b">PROFILE · SHABJDEED · شب جديد</text>
<text x="110" y="158" font-family="Cairo,Arial,sans-serif" font-size="56" font-weight="700" fill="#f2eee8">الصوت الذي أعطته كفر عقب للراب العربي</text>
<text x="110" y="208" font-family="'Source Serif 4',Georgia,serif" font-size="28" fill="#c7a86b">The voice Kufr Aqab gave Arab rap</text>
<line x1="110" y1="240" x2="1490" y2="240" stroke="#3a3b3f" stroke-width="2"/>
<!-- skyline: dense Kufr Aqab towers -->
<g fill="#26272b">
<rect x="150" y="560" width="90" height="240"/>
<rect x="250" y="500" width="110" height="300"/>
<rect x="370" y="540" width="80" height="260"/>
<rect x="460" y="470" width="120" height="330"/>
<rect x="590" y="520" width="95" height="280"/>
<rect x="695" y="480" width="105" height="320"/>
</g>
<g fill="#3a3b3f">
<rect x="170" y="580" width="18" height="18"/><rect x="200" y="580" width="18" height="18"/><rect x="170" y="615" width="18" height="18"/><rect x="200" y="615" width="18" height="18"/>
<rect x="275" y="525" width="18" height="18"/><rect x="308" y="525" width="18" height="18"/><rect x="275" y="560" width="18" height="18"/><rect x="308" y="560" width="18" height="18"/><rect x="275" y="595" width="18" height="18"/>
<rect x="487" y="495" width="18" height="18"/><rect x="520" y="495" width="18" height="18"/><rect x="487" y="530" width="18" height="18"/><rect x="520" y="530" width="18" height="18"/>
<rect x="715" y="505" width="18" height="18"/><rect x="748" y="505" width="18" height="18"/><rect x="715" y="540" width="18" height="18"/>
</g>
<!-- the wall -->
<g fill="#4a4b50">
<rect x="820" y="600" width="42" height="200"/>
<rect x="866" y="600" width="42" height="200"/>
<rect x="912" y="600" width="42" height="200"/>
<rect x="958" y="600" width="42" height="200"/>
</g>
<text x="910" y="580" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5">الجدار · the wall</text>
<!-- microphone rising -->
<g>
<rect x="1150" y="330" width="76" height="210" rx="38" fill="#c7a86b"/>
<rect x="1158" y="345" width="60" height="76" rx="30" fill="none" stroke="#111214" stroke-width="4"/>
<line x1="1170" y1="368" x2="1206" y2="368" stroke="#111214" stroke-width="3"/>
<line x1="1170" y1="388" x2="1206" y2="388" stroke="#111214" stroke-width="3"/>
<rect x="1178" y="540" width="20" height="260" fill="#3a3b3f"/>
</g>
<!-- milestones -->
<g font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">
<text x="1290" y="380">2015 · BLTNM founded in Ramallah</text>
<text x="1290" y="440">2019 · Sindibad el Ward</text>
<text x="1290" y="500">2021 · Inn Ann with Daboor</text>
<text x="1290" y="560">~500M · label streams worldwide</text>
</g>
<g font-family="Cairo,Arial,sans-serif" font-size="19" fill="#c7a86b">
<text x="1290" y="406">تأسيس «بلاطنم» في رام الله</text>
<text x="1290" y="466">«سندباد الورد» مع الناظر</text>
<text x="1290" y="526">«إن أن» مع ضبّور</text>
<text x="1290" y="586">نصف مليار استماع</text>
</g>
<text x="800" y="860" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">عدي عباس، مواليد 1995، كفر عقب · Oday Abbas, b. 1995, Kufr Aqab, between the checkpoint and the city</text>
</svg>

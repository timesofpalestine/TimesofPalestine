<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Arab support for Palestinians: the ledger</title>
  <desc id="d">Overview of Arab support tracks for Palestinians in 2026: Egypt's phased 53-billion-dollar reconstruction plan, 17 billion dollars pledged through the Gaza board, Jordan's medical corridor and field hospitals with tens of thousands of patients treated, and scholarship programs placing Gaza students in Arab universities. English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}.gold{fill:#c7a86b}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <text x="70" y="80" class="sans ivory" font-size="44" font-weight="800">THE ARAB SUPPORT LEDGER · 2026</text>
  <text x="1530" y="80" class="arabic ivory" font-size="38" font-weight="700" text-anchor="end">سجلّ الإسناد العربي</text>
  <text x="70" y="120" class="sans muted" font-size="24">Four tracks, followed from pledge to delivery · politics, money, medicine, education</text>

  <!-- four track cards -->
  <g filter="url(#sh)">
    <rect x="70" y="170" width="700" height="290" rx="14" fill="#16161a" stroke="#c7a86b" stroke-width="3"/>
    <text x="100" y="225" class="sans gold" font-size="24" font-weight="800">RECONSTRUCTION · الإعمار</text>
    <text x="100" y="285" class="mono ivory" font-size="52" font-weight="700">$53bn</text>
    <text x="330" y="285" class="sans muted" font-size="22">Egypt's phased plan, endorsed</text>
    <text x="330" y="313" class="sans muted" font-size="22">at the Cairo Arab summit</text>
    <text x="100" y="360" class="mono ivory" font-size="52" font-weight="700">$17bn</text>
    <text x="330" y="360" class="sans muted" font-size="22">pledged via the Gaza board's members</text>
    <text x="100" y="425" class="arabic muted" font-size="22">خطة مصر على ثلاث مراحل.. والتعهدات تنتظر الصرف</text>
  </g>
  <g filter="url(#sh)">
    <rect x="830" y="170" width="700" height="290" rx="14" fill="#16161a" stroke="#286344" stroke-width="3"/>
    <text x="860" y="225" class="sans gold" font-size="24" font-weight="800">MEDICINE · الطب</text>
    <text x="860" y="285" class="mono ivory" font-size="52" font-weight="700">30,226</text>
    <text x="1090" y="285" class="sans muted" font-size="22">patients at Jordan's Khan Younis</text>
    <text x="1090" y="313" class="sans muted" font-size="22">field hospital since July</text>
    <text x="860" y="360" class="mono ivory" font-size="52" font-weight="700">10</text>
    <text x="950" y="360" class="sans muted" font-size="22" textLength="634" lengthAdjust="spacingAndGlyphs">groups of Gaza children evacuated on Amman's medical corridor</text>
    <text x="860" y="425" class="arabic muted" font-size="22">مستشفيات الأردن الميدانية وممرّه الطبي.. ومدد عُماني بالدواء</text>
  </g>
  <g filter="url(#sh)">
    <rect x="70" y="500" width="700" height="250" rx="14" fill="#16161a" stroke="#3d4f6b" stroke-width="3"/>
    <text x="100" y="555" class="sans gold" font-size="24" font-weight="800">EDUCATION · التعليم</text>
    <text x="100" y="615" class="mono ivory" font-size="52" font-weight="700">27</text>
    <text x="190" y="615" class="sans muted" font-size="22">Gaza students placed in Egyptian universities in one program alone</text>
    <text x="100" y="665" class="sans muted" font-size="22">Regional scholarships open Egyptian and Lebanese campuses to Palestinians</text>
    <text x="100" y="715" class="arabic muted" font-size="22">منح تفتح جامعات مصر ولبنان أمام طلبة غزة</text>
  </g>
  <g filter="url(#sh)">
    <rect x="830" y="500" width="700" height="250" rx="14" fill="#16161a" stroke="#8a1f2d" stroke-width="3"/>
    <text x="860" y="555" class="sans gold" font-size="24" font-weight="800">POLITICS · السياسة</text>
    <text x="860" y="610" class="sans ivory" font-size="26" font-weight="700">Five capitals shaped the Gaza plan;</text>
    <text x="860" y="645" class="sans ivory" font-size="26" font-weight="700">Arab seats anchor the Gaza board</text>
    <text x="860" y="690" class="sans muted" font-size="22">Cairo · Amman · Riyadh · Doha · Abu Dhabi</text>
    <text x="860" y="725" class="arabic muted" font-size="22">خمس عواصم صاغت الخطة.. ومقاعد عربية في مجلس غزة</text>
  </g>

  <text x="70" y="815" class="sans muted" font-size="23">The monitor's rule: a pledge is news twice — when it is made, and when it is (or is not) paid.</text>
  <text x="1530" y="815" class="arabic muted" font-size="23" text-anchor="end">التعهد خبرٌ مرتين: يوم يُعلَن ويوم يُدفَع — أو لا يُدفَع</text>
  <text x="70" y="862" class="sans muted" font-size="19">Graphic: Times of Palestine · Sources: Arab summit records, Jordan Armed Forces, program tallies, 2025–2026</text>
</svg>

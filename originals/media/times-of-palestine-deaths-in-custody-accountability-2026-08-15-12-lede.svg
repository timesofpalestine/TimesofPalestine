<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Five years of hearings without a verdict in the Nizar Banat trial</title>
<desc id="dsc">Timeline graphic: the Palestinian Authority military court trial of 14 Preventive Security members over the death of activist Nizar Banat. Hearings opened 7 September 2021 in Ramallah; on 6 September 2022 all 14 defendants appeared at liberty; on 29 January 2023 the court added a disputed expert medical report to the file; a hearing on 17 November 2024 was again postponed. No verdict and no date for the next hearing. Case number 2021/1.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#c7a86b" stop-opacity="0.85"/>
<stop offset="0.75" stop-color="#8a1f2d" stop-opacity="0.85"/>
<stop offset="1" stop-color="#8a1f2d" stop-opacity="0.25"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- headline -->
<text x="90" y="128" font-family="'Source Serif 4',Georgia,serif" font-size="48" fill="#f2eee8">PA military court holds Banat trial</text>
<text x="90" y="184" font-family="'Source Serif 4',Georgia,serif" font-size="48" fill="#f2eee8">five years without verdict</text>
<text x="90" y="244" font-family="Cairo,Arial,sans-serif" font-size="32" fill="#59a97d" text-anchor="start">خمس سنوات من الجلسات دون حكم</text>

<!-- stat panels -->
<rect x="1040" y="78" width="225" height="164" fill="#17181b" stroke="#3a3b3f"/>
<text x="1060" y="158" font-family="'Libre Franklin',Arial,sans-serif" font-size="64" font-weight="700" fill="#c7a86b">14</text>
<text x="1060" y="192" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">defendants</text>
<text x="1060" y="222" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start">متهماً</text>

<rect x="1285" y="78" width="225" height="164" fill="#17181b" stroke="#3a3b3f"/>
<text x="1305" y="158" font-family="'Libre Franklin',Arial,sans-serif" font-size="64" font-weight="700" fill="#C8102E">0</text>
<text x="1305" y="192" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">verdicts</text>
<text x="1305" y="222" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start">لا أحكام</text>

<line x1="90" y1="292" x2="1510" y2="292" stroke="#3a3b3f" stroke-width="2"/>

<!-- section label -->
<text x="90" y="352" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" letter-spacing="3" fill="#c7a86b">TRIAL TIMELINE — CASE NO. 2021/1</text>
<text x="90" y="386" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5" text-anchor="start">مسار المحاكمة أمام المحكمة العسكرية</text>

<!-- axis -->
<line x1="150" y1="560" x2="1440" y2="560" stroke="url(#axis)" stroke-width="5"/>
<g stroke="#3a3b3f" stroke-width="2">
<line x1="200" y1="546" x2="200" y2="574"/>
<line x1="448" y1="546" x2="448" y2="574"/>
<line x1="531" y1="546" x2="531" y2="574"/>
<line x1="987" y1="546" x2="987" y2="574"/>
<line x1="1380" y1="546" x2="1380" y2="574"/>
</g>

<!-- node 1 : below -->
<circle cx="200" cy="560" r="11" fill="#c7a86b"/>
<text x="192" y="608" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="700" fill="#c7a86b">7 Sep 2021</text>
<text x="192" y="636" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Hearings open,</text>
<text x="192" y="660" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">military court</text>
<text x="192" y="692" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start">بدء الجلسات</text>

<!-- node 2 : above -->
<circle cx="448" cy="560" r="11" fill="#C8102E"/>
<text x="440" y="514" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="700" fill="#C8102E">6 Sep 2022</text>
<text x="440" y="488" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">All 14 defendants</text>
<text x="440" y="464" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">appear at liberty</text>
<text x="440" y="434" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start">إخلاء سبيل المتهمين</text>

<!-- node 3 : below -->
<circle cx="531" cy="560" r="11" fill="#c7a86b"/>
<text x="523" y="608" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="700" fill="#c7a86b">29 Jan 2023</text>
<text x="523" y="636" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Disputed expert</text>
<text x="523" y="660" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">report added to file</text>
<text x="523" y="692" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start">تقرير الخبير الطبي</text>

<!-- node 4 : above -->
<circle cx="987" cy="560" r="11" fill="#c7a86b"/>
<text x="979" y="514" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="700" fill="#c7a86b">17 Nov 2024</text>
<text x="979" y="488" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Hearing postponed</text>
<text x="979" y="464" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">once again</text>
<text x="979" y="434" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start">تأجيل الجلسة</text>

<!-- node 5 : below -->
<circle cx="1380" cy="560" r="13" fill="#1d1e21" stroke="#C8102E" stroke-width="4"/>
<text x="1372" y="608" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="700" fill="#C8102E">Five years on</text>
<text x="1372" y="636" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">No verdict</text>
<text x="1372" y="660" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">No next date</text>
<text x="1372" y="692" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start">لا حكم</text>

<!-- footer note -->
<rect x="90" y="742" width="6" height="94" fill="#286344"/>
<text x="120" y="772" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">The family filed at the International Criminal Court in December 2022;</text>
<text x="120" y="800" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">complementarity holds that file until the Ramallah trial is decided.</text>
<text x="120" y="830" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#59a97d" text-anchor="start">الجنائية الدولية تنتظر حسم المحاكمة المحلية</text>

<text x="90" y="874" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Source: Lawyers for Justice, which has observed the hearings — Times of Palestine</text>
</svg>
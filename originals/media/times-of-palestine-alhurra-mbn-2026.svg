<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Alhurra, before and after: a $100 million satellite channel became a $69 million digital newsroom</title>
<desc id="dsc">Ledger graphic. Left column, before: about $100 million a year in the 2024 fiscal year, a satellite television channel plus Radio Sawa, bureaus from Dubai to Baghdad. Right column, after: $69 million in the 2026 appropriation, a website, four newsletters, a podcast and an app, about 90 percent of staff dismissed in April 2025 with 30 kept. A satellite dish on the left fades toward a phone on the right.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<style>.serif{font-family:"Source Serif 4",Georgia,serif}.arabic{font-family:Cairo,Arial,sans-serif}.sans{font-family:"Libre Franklin",Arial,sans-serif}.mono{font-family:"IBM Plex Mono",Menlo,monospace}</style>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="90" y="72" class="sans" font-size="19" letter-spacing="3.5" fill="#c7a86b">ARAB MEDIA — TIMES OF PALESTINE</text>
<text x="90" y="138" class="serif" font-size="56" fill="#f2eee8">Alhurra, before and after</text>
<text x="90" y="192" class="arabic" font-size="32" fill="#aaa9a5" direction="rtl" text-anchor="end">«الحرة» قبل وبعد: من صحن فضائي إلى غرفة أخبار رقمية</text>
<line x1="90" y1="222" x2="1540" y2="222" stroke="#3a3b40" stroke-width="2"/>

<!-- before column -->
<text x="90" y="272" class="sans" font-size="20" letter-spacing="3" fill="#aaa9a5">BEFORE · قبل</text>
<rect x="90" y="292" width="640" height="150" rx="6" fill="#16171a" stroke="#2b2c30" stroke-width="2"/>
<rect x="90" y="292" width="6" height="150" fill="#8a1f2d"/>
<text x="120" y="372" class="mono" font-size="60" font-weight="700" fill="#f2eee8">$100M</text>
<text x="360" y="340" class="sans" font-size="21" fill="#f2eee8">a year, fiscal 2024</text>
<text x="360" y="372" class="sans" font-size="18" fill="#aaa9a5">US Agency for Global Media</text>
<text x="360" y="410" class="arabic" font-size="20" fill="#aaa9a5" direction="rtl" text-anchor="end">مئة مليون دولار سنوياً (2024)</text>

<rect x="90" y="462" width="640" height="150" rx="6" fill="#16171a" stroke="#2b2c30" stroke-width="2"/>
<rect x="90" y="462" width="6" height="150" fill="#8a1f2d"/>
<!-- dish icon -->
<path d="M150 570 A70 70 0 0 1 250 500" fill="none" stroke="#c7a86b" stroke-width="10" stroke-linecap="round"/>
<line x1="200" y1="535" x2="255" y2="490" stroke="#c7a86b" stroke-width="6"/>
<circle cx="258" cy="487" r="8" fill="#c7a86b"/>
<line x1="180" y1="575" x2="180" y2="600" stroke="#c7a86b" stroke-width="8"/>
<text x="300" y="510" class="sans" font-size="21" fill="#f2eee8">Satellite channel + Radio Sawa</text>
<text x="300" y="542" class="sans" font-size="18" fill="#aaa9a5">Bureaus: Dubai, Baghdad, Beirut, Amman</text>
<text x="300" y="580" class="arabic" font-size="20" fill="#aaa9a5" direction="rtl" text-anchor="end">قناة فضائية وراديو ومكاتب من دبي إلى بغداد</text>

<!-- arrow -->
<polygon points="760,440 830,440 830,415 880,452 830,489 830,464 760,464" fill="#c7a86b"/>

<!-- after column -->
<text x="910" y="272" class="sans" font-size="20" letter-spacing="3" fill="#aaa9a5">AFTER · بعد</text>
<rect x="910" y="292" width="630" height="150" rx="6" fill="#16171a" stroke="#c7a86b" stroke-width="2"/>
<rect x="910" y="292" width="6" height="150" fill="#286344"/>
<text x="940" y="372" class="mono" font-size="60" font-weight="700" fill="#c7a86b">$69M</text>
<text x="1160" y="340" class="sans" font-size="21" fill="#f2eee8">2026 appropriation</text>
<text x="1160" y="372" class="sans" font-size="18" fill="#aaa9a5">Congress, via Carnegie Endowment</text>
<text x="1160" y="410" class="arabic" font-size="20" fill="#aaa9a5" direction="rtl" text-anchor="end">69 مليون دولار في موازنة 2026</text>

<rect x="910" y="462" width="630" height="150" rx="6" fill="#16171a" stroke="#c7a86b" stroke-width="2"/>
<rect x="910" y="462" width="6" height="150" fill="#286344"/>
<!-- phone icon -->
<rect x="960" y="482" width="60" height="110" rx="10" fill="none" stroke="#c7a86b" stroke-width="8"/>
<line x1="978" y1="576" x2="1002" y2="576" stroke="#c7a86b" stroke-width="6"/>
<text x="1060" y="510" class="sans" font-size="21" fill="#f2eee8">Website, 4 newsletters, podcast, app</text>
<text x="1060" y="542" class="sans" font-size="18" fill="#aaa9a5">About 90% of staff dismissed, April 2025; 30 kept</text>
<text x="1060" y="580" class="arabic" font-size="20" fill="#aaa9a5" direction="rtl" text-anchor="end">موقع ونشرات وبودكاست وتطبيق، وثلاثون موظفاً</text>

<!-- bottom line -->
<rect x="90" y="650" width="1450" height="120" rx="6" fill="#16171a" stroke="#2b2c30" stroke-width="2"/>
<text x="120" y="700" class="serif" font-size="30" fill="#f2eee8">Every Arab capital pays for the same dish. None has switched it off.</text>
<text x="120" y="745" class="arabic" font-size="26" fill="#c7a86b" direction="rtl" text-anchor="end">كل عاصمة عربية تدفع ثمن الصحن نفسه، ولم تطفئه واحدة</text>

<text x="90" y="850" class="sans" font-size="16" fill="#6f6f6f">Graphic: Times of Palestine · figures: USAGM, Carnegie Endowment, The New Arab, AFP</text>
<text x="1540" y="850" class="arabic" font-size="16" fill="#6f6f6f" text-anchor="end">رسم: تايمز أوف بالستين</text>
</svg>

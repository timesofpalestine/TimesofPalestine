<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">East Asian partners list 47 projects for Palestinian development</title>
  <desc id="desc">A bilingual Times of Palestine graphic showing 47 projects, nine registering partner countries, 15 fields and the distinction between delivered, active and planned work.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#17283a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="54" width="1472" height="792" rx="30" fill="#0d1a26" stroke="#30485a" stroke-width="2" filter="url(#shadow)"/>

  <text x="110" y="128" fill="#ffffff" font-family="Arial, sans-serif" font-size="43" font-weight="700">East Asia’s Palestine development register</text>
  <text x="1490" y="184" text-anchor="end" fill="#dce9f1" font-family="Arial, sans-serif" font-size="34" font-weight="700">سجل شرق آسيا لمشاريع التنمية الفلسطينية</text>
  <text x="110" y="184" fill="#8eb0c3" font-family="Arial, sans-serif" font-size="22">Published at the fifth CEAPAD ministerial meeting, Manila · 22 July 2026</text>

  <g font-family="Arial, sans-serif">
    <rect x="110" y="245" width="405" height="220" rx="24" fill="#162a3b" stroke="#3f6075" stroke-width="2"/>
    <text x="312" y="345" text-anchor="middle" fill="#ffffff" font-size="88" font-weight="700">47</text>
    <text x="312" y="396" text-anchor="middle" fill="#bcd0dc" font-size="25">development projects</text>
    <text x="312" y="433" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="25">مشروعاً تنموياً</text>

    <rect x="598" y="245" width="405" height="220" rx="24" fill="#162a3b" stroke="#3f6075" stroke-width="2"/>
    <text x="800" y="345" text-anchor="middle" fill="#ffffff" font-size="88" font-weight="700">9</text>
    <text x="800" y="396" text-anchor="middle" fill="#bcd0dc" font-size="25">registering partner countries</text>
    <text x="800" y="433" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="25">دول شريكة سجّلت مشاريع</text>

    <rect x="1085" y="245" width="405" height="220" rx="24" fill="#162a3b" stroke="#3f6075" stroke-width="2"/>
    <text x="1287" y="345" text-anchor="middle" fill="#ffffff" font-size="88" font-weight="700">15</text>
    <text x="1287" y="396" text-anchor="middle" fill="#bcd0dc" font-size="25">development fields</text>
    <text x="1287" y="433" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="25">مجالاً تنموياً</text>
  </g>

  <rect x="110" y="525" width="1380" height="188" rx="24" fill="#132433" stroke="#3f6075" stroke-width="2"/>
  <text x="150" y="580" fill="#ffffff" font-family="Arial, sans-serif" font-size="28" font-weight="700">One list, three stages · قائمة واحدة وثلاث مراحل</text>

  <g font-family="Arial, sans-serif">
    <circle cx="185" cy="648" r="18" fill="#26a269"/>
    <text x="222" y="638" fill="#ffffff" font-size="25" font-weight="700">Delivered</text>
    <text x="222" y="675" fill="#bcd0dc" font-size="20">courses and students already in place</text>
    <text x="465" y="638" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#ffffff" font-size="23" font-weight="700">منجز</text>

    <circle cx="630" cy="648" r="18" fill="#2f81f7"/>
    <text x="667" y="638" fill="#ffffff" font-size="25" font-weight="700">Under way</text>
    <text x="667" y="675" fill="#bcd0dc" font-size="20">multi-year programmes through 2032</text>
    <text x="945" y="638" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#ffffff" font-size="23" font-weight="700">جارٍ</text>

    <circle cx="1090" cy="648" r="18" fill="#e0a928"/>
    <text x="1127" y="638" fill="#ffffff" font-size="25" font-weight="700">Planned</text>
    <text x="1127" y="675" fill="#bcd0dc" font-size="20">future entries explicitly marked TBD</text>
    <text x="1415" y="638" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#ffffff" font-size="23" font-weight="700">مخطط</text>
  </g>

  <text x="110" y="778" fill="#7895a6" font-family="Arial, sans-serif" font-size="19">Source: CEAPAD Project List, Japan Ministry of Foreign Affairs, 22 July 2026</text>
  <text x="1490" y="778" text-anchor="end" fill="#7895a6" font-family="Arial, sans-serif" font-size="19">Graphic: Times of Palestine</text>
</svg>

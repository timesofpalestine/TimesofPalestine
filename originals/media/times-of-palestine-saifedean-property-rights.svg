<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">A property-rights test for Palestinian dispossession</title>
  <desc id="desc">A bilingual Times of Palestine graphic showing the equal-rule test Saifedean Ammous applies to Palestinian land: identify the owner, document the taking and provide restitution or compensation.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".34"/></filter><style>.sans{font-family:"Libre Franklin",Arial,sans-serif}.serif{font-family:"Source Serif 4",Georgia,serif}.arabic{font-family:Cairo,Tahoma,Arial,sans-serif}.ivory{fill:#f2eee8}.gold{fill:#c7a86b}.muted{fill:#aaa9a5}.green{fill:#61aa80}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="22" height="900" fill="#8a1f2d"/><rect x="22" width="8" height="900" fill="#286344"/>
  <text x="82" y="82" class="serif ivory" font-size="53" font-weight="800">Palestine through a property-rights test</text><text x="1518" y="132" text-anchor="end" direction="rtl" class="arabic gold" font-size="40" font-weight="700">فلسطين في اختبار حقوق الملكية</text>
  <g transform="translate(100 215)" filter="url(#shadow)">
    <path d="M0 110 L145 0 L290 110 V300 H0Z" fill="#222328" stroke="#c7a86b" stroke-width="4"/><rect x="117" y="178" width="60" height="122" fill="#8a1f2d"/><rect x="35" y="128" width="55" height="55" fill="#286344" opacity=".9"/><rect x="200" y="128" width="55" height="55" fill="#286344" opacity=".9"/>
    <text x="145" y="365" text-anchor="middle" class="sans ivory" font-size="27" font-weight="800" textLength="258" lengthAdjust="spacingAndGlyphs">1 • IDENTIFY THE OWNER</text><text x="145" y="407" text-anchor="middle" direction="rtl" class="arabic gold" font-size="27">عيّن المالك</text>
  </g>
  <g transform="translate(550 215)" filter="url(#shadow)">
    <rect width="290" height="300" rx="3" fill="#222328" stroke="#c7a86b" stroke-width="4"/><path d="M52 74h186M52 132h150M52 190h186M52 248h105" stroke="#aaa9a5" stroke-width="10"/><path d="M190 220l36 36 62-82" fill="none" stroke="#61aa80" stroke-width="16"/>
    <text x="145" y="365" text-anchor="middle" class="sans ivory" font-size="27" font-weight="800" textLength="258" lengthAdjust="spacingAndGlyphs">2 • DOCUMENT THE TAKING</text><text x="145" y="407" text-anchor="middle" direction="rtl" class="arabic gold" font-size="27">وثّق الانتزاع</text>
  </g>
  <g transform="translate(1000 215)" filter="url(#shadow)">
    <path d="M145 0v260M42 54h206M42 54L0 170h84L42 54ZM248 54l-42 116h84L248 54Z" stroke="#c7a86b" stroke-width="9" fill="none"/><path d="M80 260h130" stroke="#61aa80" stroke-width="14"/>
    <text x="145" y="365" text-anchor="middle" class="sans ivory" font-size="27" font-weight="800" textLength="258" lengthAdjust="spacingAndGlyphs">3 • APPLY ONE RULE</text><text x="145" y="407" text-anchor="middle" direction="rtl" class="arabic gold" font-size="27">طبّق قاعدة واحدة</text>
  </g>
  <path d="M405 360h110M855 360h110" stroke="#8a1f2d" stroke-width="8" marker-end="url(#none)"/>
  <g transform="translate(105 700)"><rect width="1390" height="94" rx="3" fill="#17181b" stroke="#3d4f6b" stroke-width="2"/><text x="35" y="41" class="sans ivory" font-size="23">Ammous’s economic lens: equal property rules. The legal record adds occupation, refugee rights and self-determination.</text><text x="1355" y="76" text-anchor="end" direction="rtl" class="arabic gold" font-size="23">عدسة عموص: مساواة في الملكية. ويضيف القانون الاحتلال وحقوق اللاجئين وتقرير المصير.</text></g>
  <text x="70" y="858" class="sans muted" font-size="18">Editorial graphic: Times of Palestine • Record tested against the ICJ advisory opinion, 19 July 2024</text><text x="1530" y="858" text-anchor="end" direction="rtl" class="arabic muted" font-size="18">غرافيك تحريري: تايمز أوف فلسطين</text>
</svg>

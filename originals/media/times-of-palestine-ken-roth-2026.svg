<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Kenneth Roth on AIPAC: the lobby's money rises as the name it defends disappears from its own ads">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>
  <text x="800" y="88" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="30" letter-spacing="6">TIMES OF PALESTINE · ACCOUNTABILITY</text>
  <text x="800" y="156" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="54" font-weight="bold">The Lobby That Stopped Saying Israel</text>
  <text x="800" y="212" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,sans-serif" font-size="40">اللوبي الذي توقّف عن ذكر إسرائيل</text>

  <!-- the ledger: spending doubles while the word disappears -->
  <g transform="translate(300,300)">
    <rect x="0" y="0" width="1000" height="400" rx="6" fill="#17181b" stroke="#2a2b2f" stroke-width="2"/>
    <!-- two bars: 2021-22 vs 2025-26 PAC spending -->
    <rect x="120" y="220" width="150" height="110" fill="#286344"/>
    <text x="195" y="200" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="24">$29.3M</text>
    <text x="195" y="362" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="20">2021–22</text>
    <rect x="360" y="78" width="150" height="252" fill="#8a1f2d"/>
    <text x="435" y="58" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="28" font-weight="bold">$67.2M</text>
    <text x="435" y="362" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="20">2025–26</text>
    <!-- the redacted word -->
    <text x="620" y="150" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="24">In the ads, one word is missing:</text>
    <rect x="620" y="180" width="280" height="46" rx="4" fill="#0b0b0c"/>
    <text x="620" y="290" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="24">في الإعلانات كلمة غائبة:</text>
    <rect x="620" y="310" width="280" height="46" rx="4" fill="#0b0b0c"/>
  </g>

  <text x="800" y="812" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="22">كين روث، المدير التنفيذي لهيومن رايتس ووتش ١٩٩٣–٢٠٢٢ · Kenneth Roth, Human Rights Watch executive director 1993–2022</text>
  <rect x="0" y="894" width="1600" height="6" fill="#286344"/>
</svg>

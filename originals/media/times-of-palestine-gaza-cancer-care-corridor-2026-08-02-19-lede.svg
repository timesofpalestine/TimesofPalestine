<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Only one Gaza patient reached a West Bank hospital since October 2023</title>
<desc id="d">Dark editorial graphic: a corridor runs from a box marked Gaza to a box marked West Bank and East Jerusalem, blocked by a red barrier with a single narrow gap through which one gold line passes, marked "only 1 patient since October 2023". Below, four figures from the report: more than 11,000 cancer patients in Gaza, 564 cancer patients evacuated abroad since January 2025, 75 percent of chemotherapy drugs unavailable, and about 16,500 Gaza residents at risk of death.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="14" height="14" fill="#8a1f2d"/>
<rect width="6" height="14" fill="#6d1723"/>
</pattern>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- Titles -->
<text x="90" y="86" font-family="'Source Serif 4',Georgia,serif" font-size="45" fill="#f2eee8">Israel bars Gaza’s cancer patients from West Bank hospitals</text>
<text x="90" y="124" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2" fill="#c7a86b">WHO MEDICAL EVACUATION FACT SHEET · 23 FEBRUARY 2026</text>
<text x="1560" y="124" direction="rtl" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="26" fill="#aaa9a5">إسرائيل تمنع مرضى السرطان في غزة من مستشفيات الضفة الغربية</text>
<line x1="90" y1="148" x2="1560" y2="148" stroke="#3a3b3f" stroke-width="2"/>

<!-- Corridor band -->
<rect x="470" y="330" width="640" height="96" fill="#191a1d" stroke="#3a3b3f" stroke-width="2" stroke-dasharray="10 8"/>

<!-- Gaza box -->
<rect x="100" y="292" width="370" height="172" fill="#16171a" stroke="#8a1f2d" stroke-width="3"/>
<text x="128" y="342" font-family="'Libre Franklin',Arial,sans-serif" font-size="30" letter-spacing="3" fill="#f2eee8">GAZA</text>
<text x="442" y="342" direction="rtl" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="28" fill="#c7a86b">غزة</text>
<text x="128" y="384" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">More than 11,000 cancer patients</text>
<text x="128" y="412" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Treatment now confined to</text>
<text x="128" y="438" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">3 medical facilities</text>

<!-- Destination box -->
<rect x="1110" y="292" width="450" height="172" fill="#16171a" stroke="#286344" stroke-width="3"/>
<text x="1138" y="336" font-family="'Libre Franklin',Arial,sans-serif" font-size="25" letter-spacing="2" fill="#f2eee8">WEST BANK &amp;</text>
<text x="1138" y="366" font-family="'Libre Franklin',Arial,sans-serif" font-size="25" letter-spacing="2" fill="#f2eee8">EAST JERUSALEM</text>
<text x="1532" y="336" direction="rtl" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="26" fill="#c7a86b">الضفة والقدس</text>
<text x="1138" y="406" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Augusta Victoria Hospital can take</text>
<text x="1138" y="434" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#59a97d">50 new oncology patients a day</text>

<!-- flow arrows into barrier -->
<g stroke="#59a97d" stroke-width="6" opacity="0.75">
<line x1="486" y1="356" x2="720" y2="356"/>
<line x1="486" y1="400" x2="720" y2="400"/>
</g>
<line x1="486" y1="378" x2="712" y2="378" stroke="#c7a86b" stroke-width="4"/>

<!-- barrier -->
<rect x="740" y="316" width="40" height="56" fill="url(#hatch)"/>
<rect x="740" y="384" width="40" height="56" fill="url(#hatch)"/>
<rect x="736" y="312" width="48" height="64" fill="none" stroke="#C8102E" stroke-width="3"/>
<rect x="736" y="380" width="48" height="64" fill="none" stroke="#C8102E" stroke-width="3"/>

<!-- single patient line through gap -->
<line x1="712" y1="378" x2="1098" y2="378" stroke="#c7a86b" stroke-width="4"/>
<polygon points="1098,368 1122,378 1098,388" fill="#c7a86b"/>
<circle cx="760" cy="378" r="9" fill="#c7a86b"/>

<!-- blocked flows fade -->
<g stroke="#8a1f2d" stroke-width="6" opacity="0.35">
<line x1="800" y1="356" x2="1094" y2="356" stroke-dasharray="4 18"/>
<line x1="800" y1="400" x2="1094" y2="400" stroke-dasharray="4 18"/>
</g>

<!-- barrier caption -->
<text x="760" y="272" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="70" fill="#c7a86b">1</text>
<text x="760" y="486" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="2" fill="#f2eee8">ONLY ONE PATIENT SINCE OCTOBER 2023</text>
<text x="760" y="516" text-anchor="middle" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">مريض واحد فقط منذ تشرين الأول/أكتوبر 2023</text>
<text x="760" y="546" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">and only after an Israeli court overturned the government’s refusal</text>

<!-- stats -->
<line x1="90" y1="596" x2="1560" y2="596" stroke="#3a3b3f" stroke-width="2"/>

<g font-family="'Libre Franklin',Arial,sans-serif">
<rect x="100" y="626" width="340" height="182" fill="#16171a" stroke="#3a3b3f"/>
<text x="126" y="700" font-family="'Source Serif 4',Georgia,serif" font-size="50" fill="#c7a86b">11,000+</text>
<text x="126" y="734" font-size="17" fill="#f2eee8">cancer patients in Gaza</text>
<text x="126" y="758" font-size="15" fill="#aaa9a5">Gaza health ministry, via OCHA</text>
<text x="414" y="790" direction="rtl" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="17" fill="#59a97d">مرضى سرطان في القطاع</text>

<rect x="470" y="626" width="340" height="182" fill="#16171a" stroke="#3a3b3f"/>
<text x="496" y="700" font-family="'Source Serif 4',Georgia,serif" font-size="50" fill="#c7a86b">564</text>
<text x="496" y="734" font-size="17" fill="#f2eee8">cancer patients evacuated</text>
<text x="496" y="758" font-size="15" fill="#aaa9a5">since Jan 2025: 215 men, 207</text>
<text x="496" y="778" font-size="15" fill="#aaa9a5">women, 142 children (WHO)</text>
<text x="784" y="790" direction="rtl" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="17" fill="#59a97d">أُجلوا للخارج</text>

<rect x="840" y="626" width="340" height="182" fill="#16171a" stroke="#3a3b3f"/>
<text x="866" y="700" font-family="'Source Serif 4',Georgia,serif" font-size="50" fill="#c7a86b">75%</text>
<text x="866" y="734" font-size="17" fill="#f2eee8">of chemotherapy drugs</text>
<text x="866" y="756" font-size="17" fill="#f2eee8">unavailable in Gaza</text>
<text x="866" y="780" font-size="15" fill="#aaa9a5">High Court petition, Nov 2025</text>
<text x="1154" y="790" direction="rtl" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="17" fill="#59a97d">أدوية كيماوي مفقودة</text>

<rect x="1210" y="626" width="350" height="182" fill="#16171a" stroke="#3a3b3f"/>
<text x="1236" y="700" font-family="'Source Serif 4',Georgia,serif" font-size="50" fill="#C8102E">16,500</text>
<text x="1236" y="734" font-size="17" fill="#f2eee8">Gaza residents at risk of</text>
<text x="1236" y="756" font-size="17" fill="#f2eee8">death, petitioners say</text>
<text x="1236" y="780" font-size="15" fill="#aaa9a5">Five Israeli rights groups, 20 Nov 2025</text>
<text x="1534" y="790" direction="rtl" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="17" fill="#59a97d">مهددون بالموت</text>
</g>

<text x="90" y="852" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Sources: WHO medical evacuation fact sheet (23 Feb 2026); OCHA; Gisha; Haaretz; Ha-Makom; The Lancet Global Health</text>
<text x="1560" y="852" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" letter-spacing="2" fill="#8a1f2d">TIMES OF PALESTINE</text>
</svg>
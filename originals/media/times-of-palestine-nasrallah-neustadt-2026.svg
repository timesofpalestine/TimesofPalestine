<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Ibrahim Nasrallah, 2026 Neustadt laureate</title>
  <desc id="d">House illustration for the Real Lives feature on the Palestinian poet and novelist Ibrahim Nasrallah: a shelf of book spines rising out of a refugee camp skyline, with a laurel mark and bilingual labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <text x="70" y="86" class="sans ivory" font-size="44" font-weight="800">REAL LIVES</text>
  <text x="1530" y="86" class="arabic ivory" font-size="40" font-weight="700" text-anchor="end">سِيَر حيّة</text>
  <text x="70" y="128" class="sans muted" font-size="26">Ibrahim Nasrallah — 29th Neustadt laureate</text>
  <text x="1530" y="130" class="arabic muted" font-size="26" text-anchor="end">إبراهيم نصرالله — الفائز التاسع والعشرون بجائزة نويشتات</text>

  <!-- camp skyline -->
  <g opacity=".55">
    <rect x="120" y="620" width="120" height="150" fill="#2a2c30"/>
    <rect x="250" y="660" width="90" height="110" fill="#232529"/>
    <rect x="350" y="600" width="140" height="170" fill="#2a2c30"/>
    <rect x="500" y="670" width="110" height="100" fill="#232529"/>
    <rect x="1000" y="650" width="130" height="120" fill="#232529"/>
    <rect x="1140" y="610" width="100" height="160" fill="#2a2c30"/>
    <rect x="1250" y="665" width="150" height="105" fill="#232529"/>
    <rect x="1410" y="630" width="90" height="140" fill="#2a2c30"/>
  </g>
  <rect x="70" y="768" width="1460" height="4" fill="#3a3c41"/>

  <!-- book spines -->
  <g filter="url(#sh)">
    <rect x="640" y="300" width="46" height="470" rx="4" fill="#8a1f2d"/>
    <rect x="694" y="250" width="46" height="520" rx="4" fill="#286344"/>
    <rect x="748" y="330" width="46" height="440" rx="4" fill="#3f4147"/>
    <rect x="802" y="220" width="46" height="550" rx="4" fill="#c9a227"/>
    <rect x="856" y="310" width="46" height="460" rx="4" fill="#286344"/>
    <rect x="910" y="270" width="46" height="500" rx="4" fill="#8a1f2d"/>
  </g>

  <!-- laurel mark -->
  <g transform="translate(800,180)" fill="none" stroke="#c9a227" stroke-width="5" stroke-linecap="round">
    <path d="M-70 40 C -95 0, -80 -45, -40 -62"/>
    <path d="M70 40 C 95 0, 80 -45, 40 -62"/>
    <path d="M-58 22 l -26 -8 M-64 0 l -28 -4 M-58 -22 l -25 4 M-44 -44 l -20 12"/>
    <path d="M58 22 l 26 -8 M64 0 l 28 -4 M58 -22 l 25 4 M44 -44 l 20 12"/>
  </g>

  <text x="800" y="838" class="sans ivory" font-size="30" font-weight="700" text-anchor="middle">From the Wehdat camp to world literature</text>
  <text x="800" y="878" class="arabic muted" font-size="26" text-anchor="middle">من مخيّم الوحدات إلى الأدب العالمي</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The Abu Dhabi–Washington–Gaza triangle</title>
  <desc id="d">Network diagram of the Gaza back channel: Abu Dhabi, Washington and Gaza as three nodes joined through a central hub representing Mohammad Dahlan, with English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <!-- triangle edges through the hub -->
  <g stroke="#c7a86b" stroke-width="4" stroke-dasharray="6 10" opacity=".85">
    <path d="M470 340 L800 520" fill="none"/>
    <path d="M1130 340 L800 520" fill="none"/>
    <path d="M800 520 L800 730" fill="none"/>
    <path d="M470 340 Q800 200 1130 340" fill="none" opacity=".5"/>
  </g>

  <!-- Abu Dhabi node -->
  <g filter="url(#sh)">
    <circle cx="470" cy="320" r="86" fill="#16161a" stroke="#3a3a42" stroke-width="3"/>
    <path d="M470 268 L484 300 L518 300 L491 322 L501 356 L470 336 L439 356 L449 322 L422 300 L456 300 Z" fill="#c7a86b"/>
  </g>
  <text x="470" y="452" class="sans ivory" font-size="30" font-weight="800" text-anchor="middle">ABU DHABI</text>
  <text x="470" y="488" class="arabic muted" font-size="24" text-anchor="middle">المال والغطاء السياسي</text>

  <!-- Washington node -->
  <g filter="url(#sh)">
    <circle cx="1130" cy="320" r="86" fill="#16161a" stroke="#3a3a42" stroke-width="3"/>
    <rect x="1086" y="316" width="88" height="40" fill="#26262c"/>
    <polygon points="1130,270 1082,318 1178,318" fill="#26262c"/>
    <rect x="1124" y="284" width="12" height="30" fill="#c7a86b"/>
    <rect x="1096" y="326" width="10" height="30" fill="#3a3a42"/><rect x="1116" y="326" width="10" height="30" fill="#3a3a42"/>
    <rect x="1136" y="326" width="10" height="30" fill="#3a3a42"/><rect x="1156" y="326" width="10" height="30" fill="#3a3a42"/>
  </g>
  <text x="1130" y="452" class="sans ivory" font-size="30" font-weight="800" text-anchor="middle">WASHINGTON</text>
  <text x="1130" y="488" class="arabic muted" font-size="24" text-anchor="middle">الخطة والضمانة</text>

  <!-- Gaza node -->
  <g filter="url(#sh)">
    <circle cx="800" cy="740" r="86" fill="#16161a" stroke="#3a3a42" stroke-width="3"/>
    <rect x="756" y="726" width="30" height="44" fill="#26262c"/>
    <rect x="792" y="710" width="30" height="60" fill="#26262c"/>
    <rect x="828" y="734" width="26" height="36" fill="#26262c"/>
    <path d="M756 726 L771 712 L786 726 M792 710 L807 696 L822 710" stroke="#286344" stroke-width="5" fill="none"/>
  </g>
  <text x="800" y="668" class="sans ivory" font-size="30" font-weight="800" text-anchor="middle">GAZA</text>

  <!-- Dahlan hub -->
  <g filter="url(#sh)">
    <circle cx="800" cy="520" r="58" fill="#8a1f2d"/>
    <circle cx="800" cy="520" r="58" fill="none" stroke="#c7a86b" stroke-width="4"/>
    <text x="800" y="512" class="sans ivory" font-size="22" font-weight="800" text-anchor="middle">DAHLAN</text>
    <text x="800" y="544" class="arabic ivory" font-size="22" text-anchor="middle">دحلان</text>
  </g>

  <text x="90" y="120" class="sans ivory" font-size="52" font-weight="800">The exile in the middle</text>
  <text x="90" y="170" class="sans muted" font-size="27">Why Kushner's road to Gaza runs through Abu Dhabi — and Abu Dhabi's runs through Dahlan</text>
  <text x="1510" y="120" class="arabic ivory" font-size="42" font-weight="700" text-anchor="end">المنفيّ في المنتصف</text>
  <text x="1510" y="170" class="arabic muted" font-size="25" text-anchor="end">طريق كوشنر إلى غزة يمرّ بأبوظبي.. وطريق أبوظبي يمرّ بدحلان</text>
  <text x="800" y="860" class="mono" fill="#59a97d" font-size="23" text-anchor="middle">money · mandate · manpower — the Gaza back channel, mapped</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Ali Al Thawadi: one office, two files</title>
  <desc id="d">Diagram of Qatari minister Ali Al Thawadi's dual mediation role: Doha at the center, connected to the Gaza ceasefire and reconstruction file on one side and the Tehran nuclear file on the other, with Washington above, and a timeline of key moments from the September 2025 Doha strike to the 2026 talks. English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <text x="70" y="80" class="sans ivory" font-size="44" font-weight="800">ONE OFFICE, TWO FILES</text>
  <text x="1530" y="80" class="arabic ivory" font-size="40" font-weight="700" text-anchor="end">مكتب واحد.. ملفّان</text>
  <text x="70" y="120" class="sans muted" font-size="24">Ali Al Thawadi, Minister of State for Strategic Affairs, Doha</text>
  <text x="1530" y="120" class="arabic muted" font-size="22" text-anchor="end">علي الذوادي، وزير الدولة للشؤون الاستراتيجية</text>

  <!-- connection lines -->
  <path d="M800 430 L360 330" stroke="#c7a86b" stroke-width="5"/>
  <path d="M800 430 L1240 330" stroke="#c7a86b" stroke-width="5"/>
  <path d="M800 430 L800 235" stroke="#c7a86b" stroke-width="5" stroke-dasharray="10 8"/>

  <!-- Washington -->
  <g filter="url(#sh)">
    <rect x="640" y="165" width="320" height="72" rx="12" fill="#16161a" stroke="#3d4f6b" stroke-width="3"/>
    <text x="800" y="197" class="sans ivory" font-size="26" font-weight="700" text-anchor="middle">WASHINGTON · TRUMP</text>
    <text x="800" y="226" class="arabic muted" font-size="22" text-anchor="middle">واشنطن · ترامب</text>
  </g>

  <!-- Doha center -->
  <g filter="url(#sh)">
    <circle cx="800" cy="470" r="110" fill="#16161a" stroke="#c7a86b" stroke-width="5"/>
    <text x="800" y="450" class="sans ivory" font-size="30" font-weight="800" text-anchor="middle">DOHA</text>
    <text x="800" y="486" class="arabic ivory" font-size="28" font-weight="700" text-anchor="middle">الذوادي</text>
    <text x="800" y="518" class="sans muted" font-size="20" text-anchor="middle">AL THAWADI</text>
  </g>

  <!-- Gaza file -->
  <g filter="url(#sh)">
    <rect x="120" y="255" width="380" height="150" rx="14" fill="#16161a" stroke="#286344" stroke-width="4"/>
    <text x="310" y="298" class="sans ivory" font-size="27" font-weight="700" text-anchor="middle">GAZA FILE · غزة</text>
    <text x="310" y="334" class="sans muted" font-size="21" text-anchor="middle">Ceasefire · hostages · aid</text>
    <text x="310" y="366" class="arabic muted" font-size="21" text-anchor="middle">مقعد قطر في مجلس غزة التنفيذي</text>
  </g>

  <!-- Iran file -->
  <g filter="url(#sh)">
    <rect x="1100" y="255" width="380" height="150" rx="14" fill="#16161a" stroke="#8a1f2d" stroke-width="4"/>
    <text x="1290" y="298" class="sans ivory" font-size="27" font-weight="700" text-anchor="middle">IRAN FILE · إيران</text>
    <text x="1290" y="334" class="sans muted" font-size="21" text-anchor="middle">Secret Tehran flights · nuclear deal</text>
    <text x="1290" y="366" class="arabic muted" font-size="21" text-anchor="middle">رحلات سرية إلى طهران مع الكبيسي</text>
  </g>

  <!-- timeline -->
  <g>
    <rect x="70" y="660" width="1460" height="4" fill="#33342f"/>
    <g class="mono" fill="#c7a86b" font-size="22" font-weight="700">
      <circle cx="200" cy="662" r="9" fill="#8a1f2d"/>
      <circle cx="580" cy="662" r="9" fill="#c7a86b"/>
      <circle cx="960" cy="662" r="9" fill="#8a1f2d"/>
      <circle cx="1340" cy="662" r="9" fill="#286344"/>
    </g>
    <g class="sans ivory" font-size="21" font-weight="700" text-anchor="middle">
      <text x="200" y="705">SEP 2025</text>
      <text x="580" y="705">JAN 2026</text>
      <text x="960" y="705">JUN 2026</text>
      <text x="1340" y="705">AUG 2026</text>
    </g>
    <g class="arabic muted" font-size="20" text-anchor="middle">
      <text x="200" y="740">إسرائيل تقصف الدوحة.. فيطير إلى واشنطن</text>
      <text x="580" y="740">يتسلّم مقعد قطر في مجلس غزة</text>
      <text x="960" y="740">عالق في مطار طهران تحت القصف</text>
      <text x="1340" y="740">محادثات مباشرة لإحياء الاتفاق</text>
    </g>
    <g class="sans muted" font-size="18" text-anchor="middle">
      <text x="200" y="770">Israel bombs Doha; he flies to DC</text>
      <text x="580" y="770">Takes Qatar's Gaza Board seat</text>
      <text x="960" y="770">Stranded in Tehran under strikes</text>
      <text x="1340" y="770">Direct talks to revive the deal</text>
    </g>
  </g>

  <text x="70" y="850" class="sans muted" font-size="19">Graphic: Times of Palestine · Reporting: FT, Semafor, the Telegraph, Ynet, Axios, July–August 2026</text>
  <text x="1530" y="850" class="arabic muted" font-size="19" text-anchor="end">غرافيك: تايمز أوف فلسطين</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="t">
  <title id="t">TOP 100 — The Witnesses</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="420" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="420" fill="#286344"/>
  <g stroke="#c96a6a" stroke-width="7" fill="none"><rect x="700" y="150" width="200" height="120" rx="18"/><circle cx="800" cy="210" r="38"/><circle cx="800" cy="210" r="16" fill="#c96a6a" stroke="none"/><rect x="760" y="122" width="80" height="28" rx="8" fill="#c96a6a" stroke="none"/></g>
  <text x="90" y="150" class="sans ivory" font-size="58" font-weight="800">The Witnesses</text>
  <text x="90" y="205" class="sans muted" font-size="26">The cameras the world could not look away from</text>
  <text x="1510" y="150" class="arabic ivory" font-size="48" font-weight="700" text-anchor="end">الشهود</text>
  <text x="1510" y="205" class="arabic muted" font-size="26" text-anchor="end">كاميرات لم يستطع العالم أن يشيح عنها</text>
  <text x="90" y="360" class="mono" fill="#c96a6a" font-size="26">TOP 100 · 2026</text>
  <text x="1510" y="360" class="mono" fill="#c96a6a" font-size="26" text-anchor="end">قائمة المئة</text>
</svg>

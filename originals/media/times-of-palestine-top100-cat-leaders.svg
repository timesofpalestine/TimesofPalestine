<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="420" viewBox="0 0 1600 420" role="img" aria-labelledby="t">
  <title id="t">TOP 100 — The Leaders</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="420" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="420" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="420" fill="#286344"/>
  <g stroke="#c7a86b" stroke-width="6" fill="none" stroke-linecap="round"><path d="M800 120 L815 165 L862 165 L824 192 L838 238 L800 210 L762 238 L776 192 L738 165 L785 165 Z" fill="#c7a86b" stroke="none"/><path d="M720 250 Q800 290 880 250"/><rect x="740" y="270" width="120" height="14" rx="4" fill="#c7a86b" stroke="none"/></g>
  <text x="90" y="150" class="sans ivory" font-size="58" font-weight="800">The Leaders</text>
  <text x="90" y="205" class="sans muted" font-size="26">Presidents, prisoners, diplomats</text>
  <text x="1510" y="150" class="arabic ivory" font-size="48" font-weight="700" text-anchor="end">القادة</text>
  <text x="1510" y="205" class="arabic muted" font-size="26" text-anchor="end">رؤساء وأسرى ودبلوماسيون</text>
  <text x="90" y="360" class="mono" fill="#c7a86b" font-size="26">TOP 100 · 2026</text>
  <text x="1510" y="360" class="mono" fill="#c7a86b" font-size="26" text-anchor="end">قائمة المئة</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">One Paris association, two halves: a culture house and a helpline</title>
  <desc id="desc">A bilingual board on La Palestine Nous Rassemble, the Paris association founded in 2014: the Beitna culture house of 135 square metres near the passage Ramey in the 18th arrondissement, with four rooms, 300 workshops and about 4,000 visitors a year and a 75,000 euro fit-out campaign; and the CNASaR committee, created after families began arriving from Gaza in late 2023, whose stated aim is to support more than 500 survivors with housing, school places and legal follow-up. A timeline runs from 2014 to the announced November 2026 opening.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101114"/>
      <stop offset="1" stop-color="#1c1d21"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e1e2b"/>
      <stop offset=".5" stop-color="#286344"/>
      <stop offset="1" stop-color="#bd9854"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f3efe8}
      .muted{fill:#aaa9a5}
      .gold{fill:#d4b36e}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:17px}
      .small{font-size:20px}
      .body{font-size:23px}
      .label{font-size:18px;font-weight:800;letter-spacing:1.2px}
      .fig{font-size:44px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="90" y="76" class="serif ivory" font-size="46" font-weight="800">One association, two halves: a house and a helpline</text>
  <text x="90" y="118" class="sans muted body">La Palestine Nous Rassemble, Paris, founded 2014</text>
  <text x="1512" y="160" class="arabic ivory" font-size="34" font-weight="800" text-anchor="end">جمعية واحدة ونصفان: بيت وخطّ هاتف</text>
  <text x="1512" y="192" class="arabic muted small" text-anchor="end">«فلسطين تجمعنا» في باريس، تأسست 2014</text>

  <g filter="url(#shadow)">
    <rect x="70" y="222" width="700" height="410" rx="18" fill="#27282c" stroke="#d4b36e" stroke-width="2"/>
    <text x="102" y="266" class="sans gold label">BEITNA — THE CULTURE HOUSE</text>
    <text x="738" y="266" class="arabic gold small" text-anchor="end">«بيتنا».. بيت الثقافة</text>
    <text x="102" y="306" class="sans ivory body">135 m² near the passage Ramey, 18th arrondissement</text>
    <text x="738" y="340" class="arabic muted small" text-anchor="end">135 متراً مربعاً قرب ممرّ رامي بالدائرة 18</text>

    <text x="102" y="404" class="sans gold fig">4</text>
    <text x="102" y="432" class="sans muted tiny">rooms: café-grocery,</text>
    <text x="102" y="454" class="sans muted tiny">craft shop, classroom, events</text>
    <text x="102" y="478" class="arabic muted tiny">غرف: مقهى وبقالة، متجر حرف، قاعة درس، فعاليات</text>

    <text x="392" y="404" class="sans green fig">300</text>
    <text x="392" y="432" class="sans muted tiny">workshops and events</text>
    <text x="392" y="454" class="sans muted tiny">planned each year</text>
    <text x="392" y="478" class="arabic muted tiny">ورشة وفعالية سنوياً</text>

    <text x="102" y="552" class="sans green fig">4,000</text>
    <text x="102" y="580" class="sans muted tiny">visitors a year expected</text>
    <text x="102" y="604" class="arabic muted tiny">زائر سنوياً متوقَّع</text>

    <text x="392" y="552" class="sans gold fig">€75,000</text>
    <text x="392" y="580" class="sans muted tiny">fit-out campaign still running</text>
    <text x="392" y="604" class="arabic muted tiny">حملة تجهيز ما زالت جارية</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="222" width="700" height="410" rx="18" fill="#27282c" stroke="#dc6572" stroke-width="2"/>
    <text x="842" y="266" class="sans red label">CNASaR — THE HELPLINE</text>
    <text x="1478" y="266" class="arabic red small" text-anchor="end">لجنة استقبال الناجين</text>
    <text x="842" y="306" class="sans ivory body">Created after families began arriving from Gaza, late 2023</text>
    <text x="1478" y="340" class="arabic muted small" text-anchor="end">أُنشئت بعد وصول عائلات من غزة أواخر 2023</text>

    <text x="842" y="404" class="sans red fig">500+</text>
    <text x="842" y="432" class="sans muted tiny">survivors the committee</text>
    <text x="842" y="454" class="sans muted tiny">states it aims to support</text>
    <text x="842" y="478" class="arabic muted tiny">ناجٍ تعلن اللجنة أنها تستهدف دعمهم</text>

    <text x="1152" y="404" class="sans gold fig">2024</text>
    <text x="1152" y="432" class="sans muted tiny">French asylum court: Gazans</text>
    <text x="1152" y="454" class="sans muted tiny">qualify as refugees (July)</text>
    <text x="1152" y="478" class="arabic muted tiny">محكمة اللجوء: الغزيون لاجئون (تموز)</text>

    <text x="842" y="552" class="sans ivory small">Housing, food, school places, legal follow-up</text>
    <text x="842" y="580" class="sans muted tiny">A volunteer phone line routes callers to lawyers and social services</text>
    <text x="842" y="604" class="arabic muted tiny">إيواء وطعام ومقاعد دراسية ومتابعة قانونية عبر خطّ متطوّعين</text>
  </g>

  <path d="M150 700H1450" stroke="#67696f" stroke-width="4"/>
  <circle cx="150" cy="700" r="11" fill="#d4b36e"/>
  <circle cx="583" cy="700" r="11" fill="#dc6572"/>
  <circle cx="1016" cy="700" r="11" fill="#61aa80"/>
  <circle cx="1450" cy="700" r="11" fill="#f3efe8"/>

  <text x="150" y="736" class="sans ivory small">2014</text>
  <text x="150" y="760" class="sans muted tiny">Association founded</text>
  <text x="150" y="782" class="arabic muted tiny">تأسيس الجمعية</text>

  <text x="583" y="736" class="sans ivory small">Late 2023</text>
  <text x="583" y="760" class="sans muted tiny">CNASaR set up</text>
  <text x="583" y="782" class="arabic muted tiny">إنشاء لجنة الناجين</text>

  <text x="1016" y="736" class="sans ivory small">May 2026</text>
  <text x="1016" y="760" class="sans muted tiny">Building works begin</text>
  <text x="1016" y="782" class="arabic muted tiny">انطلاق الأشغال</text>

  <text x="1450" y="736" class="sans ivory small" text-anchor="end">Nov 2026</text>
  <text x="1450" y="760" class="sans muted tiny" text-anchor="end">Announced opening</text>
  <text x="1450" y="782" class="arabic muted tiny" text-anchor="end">الافتتاح المعلن</text>

  <rect x="90" y="812" width="1420" height="6" rx="3" fill="url(#band)"/>
  <text x="90" y="858" class="sans muted tiny">Figures published by La Palestine Nous Rassemble; opening date reported by Time Out Paris, 10 September 2026. Graphic: Times of Palestine.</text>
  <text x="1510" y="884" class="arabic muted tiny" text-anchor="end">الأرقام من نشرات الجمعية، وموعد الافتتاح عن «تايم أوت باريس» 10 أيلول 2026. غرافيك: تايمز أوف فلسطين</text>
</svg>

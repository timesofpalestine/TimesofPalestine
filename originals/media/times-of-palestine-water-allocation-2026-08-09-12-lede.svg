<text x="910" y="790" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5" textLength="674" lengthAdjust="spacingAndGlyphs">Under Article 40 of the 1995 Oslo II accord, Israel was allotted roughly 80% of the</text>
<text x="910" y="814" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">shared mountain aquifer; the quantities were never revised.</text>

<text x="910" y="878" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#6d6f73">Source: UN OCHA situation reports, 2025–2026 · Times of Palestine</text>

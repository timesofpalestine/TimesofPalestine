<text x="126" y="765" text-anchor="end">0</text>
<text x="126" y="595" text-anchor="end">100</text>
<text x="126" y="425" text-anchor="end">200</text>
</g>

<!-- bar 1: 247 -->
<rect x="160" y="340" width="150" height="420" rx="6" fill="url(#gold)"/>
<text x="235" y="318" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#e0c68d">247</text>
<text x="235" y="800" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#f2eee8">Israelis, incl. settlers</text>
<text x="235" y="826" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="16" fill="#aaa9a5" direction="rtl">الإسرائيليون والمستوطنون</text>

<!-- bar 2: 82.4 -->
<rect x="400" y="620" width="150" height="140" rx="6" fill="url(#red)"/>
<text x="475" y="598" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#C8102E">82.4</text>
<text x="475" y="800" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#f2eee8">West Bank Palestinians</text>
<text x="475" y="826" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="16" fill="#aaa9a5" direction="rtl">فلسطينيو الضفة الغربية</text>

<!-- bar 3: 26 -->
<rect x="640" y="716" width="150" height="44" rx="6" fill="#5d1a24"/>
<text x="715" y="694" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#a5646e">26</text>
<text x="715" y="800" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#f2eee8">Off-grid: 100,000 people</text>
<text x="715" y="822" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">in 70 communities</text>
<text x="715" y="846" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="16" fill="#aaa9a5" direction="rtl">غير موصولين بالشبكة</text>

<text x="140" y="878" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#6d6f73">Source: B’Tselem, “Parched”, 2023</text>


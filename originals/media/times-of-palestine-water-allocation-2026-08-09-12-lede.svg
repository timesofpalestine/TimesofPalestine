<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Three times the water: Israeli versus Palestinian per-capita water use in the West Bank</title>
<desc id="dsc">Bar chart comparing daily water consumption per person: 247 litres for Israelis including settlers, 82.4 litres for West Bank Palestinians, and about 26 litres for roughly 100,000 Palestinians in 70 communities not connected to the grid, per B'Tselem's 2023 report Parched. A side panel notes that UN OCHA recorded an average of about 14 water and sanitation structures demolished each month in Area C during 2025 and the first seven months of 2026, that water tanks made up more than half of roughly 160 such structures hit in settler attacks since the start of 2026, and that the UN recorded 62 incidents of settlers vandalising wells, pipelines and irrigation networks.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#e0c68d"/>
<stop offset="1" stop-color="#c7a86b"/>
</linearGradient>
<linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#C8102E"/>
<stop offset="1" stop-color="#8a1f2d"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- headline -->
<text x="100" y="98" font-family="'Source Serif 4',Georgia,serif" font-size="54" fill="#f2eee8">Three times the water</text>
<text x="100" y="140" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#aaa9a5">Daily water use per person — Israelis including settlers vs Palestinians in the West Bank</text>

<text x="1540" y="96" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="42" fill="#c7a86b" direction="rtl">ثلاثة أضعاف المياه</text>
<text x="1540" y="138" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5" direction="rtl">استهلاك المياه للفرد يومياً: الإسرائيليون مقابل الفلسطينيين في الضفة الغربية</text>

<line x1="100" y1="172" x2="1540" y2="172" stroke="#33353a" stroke-width="2"/>

<!-- chart -->
<text x="100" y="222" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="2" fill="#59a97d">LITRES PER PERSON PER DAY</text>
<text x="100" y="252" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" direction="rtl">لتر للفرد في اليوم</text>

<g stroke="#2c2e32" stroke-width="1">

<text x="910" y="252" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" direction="rtl">تدمير منشآت المياه والصرف الصحي</text>

<g>
<text x="910" y="360" font-family="'Source Serif 4',Georgia,serif" font-size="92" fill="#C8102E">≈14</text>
<text x="1060" y="322" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">water and sanitation structures</text>
<text x="1060" y="350" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">demolished per month in Area C,</text>
<text x="1060" y="378" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">2025 – July 2026</text>
</g>
<text x="910" y="410" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5" textLength="674" lengthAdjust="spacingAndGlyphs">More than three times the monthly rate of previous years — UN OCHA, 23 July 2026</text>

<line x1="910" y1="446" x2="1540" y2="446" stroke="#2c2e32" stroke-width="1"/>

<!-- water tank icons -->
<text x="910" y="498" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Water tanks were more than half of the roughly 160 water</text>
<text x="910" y="524" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">and sanitation structures damaged, destroyed or seized</text>
<text x="910" y="550" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">in settler attacks since the start of 2026</text>


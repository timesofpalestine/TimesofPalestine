<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Where Gaza aid money goes: contractors and consultancies at the top, 4–7 percent at the bottom</title>
<desc id="dsc">Diagram of the $30 million US grant to the Gaza Humanitarian Foundation, now under State Department inspector general investigation. Below it, two tiers: security contractors UG Solutions and Safe Reach Solutions, whose contract values are not published, and Boston Consulting Group, whose involvement covered seven months, more than $4 million of contracted work and more than a dozen staff. At the bottom, a bar shows that local and national humanitarian actors typically recover only 4 to 7 percent in indirect costs. A side panel notes what is not in the public record and the $185 million collected by Hala Consulting for coordinating exits through Rafah.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="90" y="72" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" letter-spacing="3.5" fill="#c7a86b">AID FINANCE — TIMES OF PALESTINE</text>
<text x="90" y="132" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">Security contractors and consultancies</text>
<text x="90" y="190" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">capture Gaza's aid spending</text>
<text x="90" y="238" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#aaa9a5">شركات الأمن والاستشارات تبتلع إنفاق المساعدات في غزة</text>
<line x1="90" y1="266" x2="1540" y2="266" stroke="#3a3b40" stroke-width="2"/>

<!-- tier 1 -->
<rect x="90" y="300" width="800" height="120" rx="6" fill="#16171a" stroke="#c7a86b" stroke-width="2"/>
<text x="120" y="374" font-family="'Libre Franklin',Arial,sans-serif" font-size="52" font-weight="700" fill="#c7a86b">$30M</text>
<text x="300" y="342" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">US grant to the Gaza Humanitarian Foundation</text>
<text x="300" y="372" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">State Dept inspector general investigating how it was spent</text>
<text x="300" y="398" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">approved under a White House "priority directive", audit waived</text>

<polygon points="480,428 500,428 490,462" fill="#8a1f2d"/>

<!-- tier 2 -->
<rect x="90" y="470" width="390" height="150" rx="6" fill="#16171a" stroke="#2b2c30" stroke-width="2"/>
<rect x="90" y="470" width="6" height="150" fill="#8a1f2d"/>
<text x="120" y="506" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="2" fill="#c7a86b">SECURITY CONTRACTORS</text>
<text x="120" y="544" font-family="'Libre Franklin',Arial,sans-serif" font-size="23" fill="#f2eee8">UG Solutions</text>
<text x="120" y="574" font-family="'Libre Franklin',Arial,sans-serif" font-size="23" fill="#f2eee8">Safe Reach Solutions</text>
<text x="120" y="604" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">Contract values: not published</text>

<rect x="500" y="470" width="390" height="150" rx="6" fill="#16171a" stroke="#2b2c30" stroke-width="2"/>
<rect x="500" y="470" width="6" height="150" fill="#8a1f2d"/>
<text x="530" y="506" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="2" fill="#c7a86b">CONSULTANCY</text>
<text x="530" y="544" font-family="'Libre Franklin',Arial,sans-serif" font-size="23" fill="#f2eee8">Boston Consulting Group</text>
<text x="530" y="574" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">7 months, $4M+ of contracted work</text>
<text x="530" y="600" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">more than a dozen staff</text>

<polygon points="480,628 500,628 490,662" fill="#286344"/>

<!-- tier 3 -->
<text x="90" y="690" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="2" fill="#c7a86b">LOCAL AND NATIONAL ACTORS</text>
<text x="430" y="690" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">جهات محلية ووطنية</text>
<rect x="90" y="704" width="800" height="46" rx="4" fill="#202126" stroke="#3a3b40" stroke-width="1.5"/>
<rect x="90" y="704" width="56" height="46" rx="4" fill="#59a97d"/>
<text x="172" y="734" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">4–7% indirect cost recovery, if they get anything</text>
<text x="90" y="778" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Overseas Development Institute research, October 2025</text>
<text x="90" y="804" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Only 25 of 67 Grand Bargain signatories guarantee overheads to partners</text>

<!-- side panel -->
<rect x="940" y="300" width="600" height="490" rx="6" fill="#16171a" stroke="#2b2c30" stroke-width="2"/>
<text x="970" y="344" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2" fill="#c7a86b">NOT IN THE PUBLIC RECORD</text>
<text x="970" y="376" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5">ما لا يظهر في السجل العام</text>
<line x1="970" y1="398" x2="1510" y2="398" stroke="#3a3b40" stroke-width="1.5"/>
<text x="970" y="432" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Contract values for UG Solutions and Safe</text>
<text x="970" y="458" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Reach Solutions, and the contractors' margin</text>
<text x="970" y="506" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">BCG says the work was pro bono; insiders say</text>
<text x="970" y="532" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">monthly invoices ran above $1 million</text>
<line x1="970" y1="566" x2="1510" y2="566" stroke="#3a3b40" stroke-width="1.5"/>
<text x="970" y="602" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2" fill="#c7a86b">MONEY MOVING THE OTHER WAY</text>
<text x="970" y="668" font-family="'Libre Franklin',Arial,sans-serif" font-size="46" font-weight="700" fill="#C8102E">$185M</text>
<text x="970" y="704" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">collected by Hala Consulting coordinating</text>
<text x="970" y="730" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">exits through Rafah: $5,000 per adult,</text>
<text x="970" y="756" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">$2,500 per child</text>
<text x="1240" y="756" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Al-Quds al-Arabi, April 2024</text>

<!-- footer -->
<line x1="90" y1="826" x2="1540" y2="826" stroke="#3a3b40" stroke-width="2"/>
<text x="90" y="858" font-family="'Source Serif 4',Georgia,serif" font-size="26" fill="#f2eee8">No breakdown of the $30 million has been published</text>
<text x="90" y="886" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">لم يُنشر أي تفصيل لإنفاق الثلاثين مليون دولار</text>
<text x="1050" y="858" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Sources: Financial Times, CNN, The Intercept,</text>
<text x="1050" y="882" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Washington Post, ODI, Al-Quds al-Arabi</text>
</svg>
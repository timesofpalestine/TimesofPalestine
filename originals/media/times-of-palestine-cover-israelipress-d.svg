<text x="780" y="430" font-family="'Source Serif 4',Georgia,serif" fill="#c7a86b" font-size="62" font-weight="700">Israeli Press</text>
<text x="780" y="502" font-family="'Libre Franklin',Arial,sans-serif" fill="#aaa9a5" font-size="24" letter-spacing="4">TIMES OF PALESTINE</text>

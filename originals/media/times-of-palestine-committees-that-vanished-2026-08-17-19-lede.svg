<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Palestinian Authority inquiry committees that never publish findings</title>
<desc id="d">A sealed ivory report page stamped "Never published" in red, beside a vertical timeline of dated Palestinian Authority inquiries: Arafat's death in November 2004, a final trial hearing on 20 July 2010, Nizar Banat's death in custody on 24 June 2021, the committee report submitted five days later, the security-force inquiry completed on 6 September, and the 21 June 2022 release of 14 detained men. Statistics show 5 days to finish, 0 pages made public and 11 court hearings.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f2eee8"/><stop offset="1" stop-color="#ddd8cf"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="90" y="86" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" letter-spacing="3.5" fill="#c7a86b">ACCOUNTABILITY  ·  THE FILE THAT NEVER OPENS</text>

<text x="90" y="148" font-family="'Source Serif 4',Georgia,serif" font-size="45" fill="#f2eee8">Reports submitted. Findings never published.</text>
<text x="90" y="200" font-family="Cairo,Arial,sans-serif" font-size="33" fill="#59a97d" text-anchor="start">تقارير تُسلَّم ونتائج لا تُنشر</text>

<line x1="90" y1="238" x2="1510" y2="238" stroke="#3a3b3f" stroke-width="2"/>

<!-- document -->
<g>
<rect x="118" y="292" width="424" height="368" rx="4" fill="#26272a"/>
<rect x="110" y="284" width="424" height="368" rx="4" fill="url(#paper)"/>
<rect x="110" y="284" width="424" height="14" fill="#8a1f2d"/>
<text x="140" y="342" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="2" fill="#8a1f2d">COMMITTEE OF INQUIRY</text>
<text x="140" y="376" font-family="'Source Serif 4',Georgia,serif" font-size="26" fill="#1d1e21">Death of Nizar Banat</text>
<text x="140" y="404" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#55565a">Formed by PM Mohammad Shtayyeh</text>
<g fill="#c2bdb4">
<rect x="140" y="432" width="364" height="8"/>
<rect x="140" y="456" width="330" height="8"/>
<rect x="140" y="480" width="352" height="8"/>
<rect x="140" y="504" width="286" height="8"/>
<rect x="140" y="528" width="344" height="8"/>
<rect x="140" y="552" width="240" height="8"/>
<rect x="140" y="576" width="318" height="8"/>
<rect x="140" y="600" width="180" height="8"/>
</g>
<g transform="rotate(-13 322 500)">
<rect x="128" y="462" width="388" height="78" fill="#8a1f2d" opacity="0.94"/>
<text x="322" y="497" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="30" letter-spacing="3" fill="#f2eee8">NEVER PUBLISHED</text>
<text x="322" y="526" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#f2eee8">لم يُنشر أبداً</text>
</g>
</g>

<!-- stats -->
<g font-family="'Libre Franklin',Arial,sans-serif">
<text x="110" y="726" font-size="46" fill="#c7a86b">5</text>
<text x="110" y="752" font-size="15" fill="#aaa9a5">days to finish</text>
<text x="260" y="726" font-size="46" fill="#c7a86b">0</text>
<text x="260" y="752" font-size="15" fill="#aaa9a5">pages published</text>
<text x="410" y="726" font-size="46" fill="#c7a86b">11</text>
<text x="410" y="752" font-size="15" fill="#aaa9a5">court hearings</text>
</g>
<text x="110" y="796" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">Report submitted June 2021, five days after the committee was formed.</text>

<!-- timeline -->
<line x1="700" y1="300" x2="700" y2="800" stroke="#3a3b3f" stroke-width="3"/>

<g font-family="'Libre Franklin',Arial,sans-serif">
<circle cx="700" cy="330" r="9" fill="#8a1f2d"/>
<text x="732" y="322" font-size="20" letter-spacing="1.5" fill="#c7a86b">NOVEMBER 2004</text>
<text x="732" y="350" font-size="24" fill="#f2eee8">Yasser Arafat dies; inquiry chaired by Tawfiq Tirawi</text>
<text x="732" y="376" font-size="16" fill="#aaa9a5">Chair: no precise, objective or decisive results. No report.</text>

<circle cx="700" cy="424" r="9" fill="#8a1f2d"/>
<text x="732" y="416" font-size="20" letter-spacing="1.5" fill="#c7a86b">20 JULY 2010</text>
<text x="732" y="444" font-size="24" fill="#f2eee8">Last of three hearings in an earlier custody death</text>
<text x="732" y="470" font-size="16" fill="#aaa9a5">Human Rights Watch, February 2011: nobody punished.</text>

<circle cx="700" cy="518" r="9" fill="#C8102E"/>
<text x="732" y="510" font-size="20" letter-spacing="1.5" fill="#c7a86b">24 JUNE 2021</text>
<text x="732" y="538" font-size="24" fill="#f2eee8">Nizar Banat, 46, dies after arrest raid in Hebron</text>
<text x="732" y="564" font-size="16" fill="#aaa9a5">Justice minister: violence used; the death was “unnatural”.</text>

<circle cx="700" cy="612" r="9" fill="#8a1f2d"/>
<text x="732" y="604" font-size="20" letter-spacing="1.5" fill="#c7a86b">6 SEPTEMBER</text>
<text x="732" y="632" font-size="24" fill="#f2eee8">Security-force inquiry absolves regional commanders</text>
<text x="732" y="658" font-size="16" fill="#aaa9a5">Amnesty International: “The judicial process resembles a farce”.</text>

<circle cx="700" cy="706" r="9" fill="#8a1f2d"/>
<text x="732" y="698" font-size="20" letter-spacing="1.5" fill="#c7a86b">21 JUNE 2022</text>
<text x="732" y="726" font-size="24" fill="#f2eee8">14 detained men released, 21 June to 2 July</text>
<text x="732" y="752" font-size="16" fill="#aaa9a5">A “holiday”, guaranteed by Preventive Security colleagues.</text>
</g>

<text x="732" y="794" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#59a97d" text-anchor="start">لجان تحقيق بلا تقارير معلنة</text>

<line x1="90" y1="832" x2="1510" y2="832" stroke="#3a3b3f" stroke-width="2"/>
<text x="90" y="864" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">Sources: Human Rights Watch · Amnesty International · Middle East Eye · The New Arab · Wattan · Asharq Al-Awsat · Al-Araby Al-Jadeed</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Washington's West Bank ledger and the machinery it is building</title>
  <desc id="desc">Three columns recording the 6 August 2026 congressional letter demanding restored settler sanctions, the Board of Peace's first Gaza construction contract for a Moroccan troop outpost, and the seventh round of United States-brokered Israel-Lebanon talks in Rome, with the Michigan Senate primary spending figures beneath.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a1f2d"/>
      <stop offset=".5" stop-color="#286344"/>
      <stop offset="1" stop-color="#c7a86b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f2eee8}
      .muted{fill:#a9a8a4}
      .gold{fill:#c7a86b}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:17px}
      .small{font-size:19px}
      .body{font-size:22px}
      .label{font-size:18px;font-weight:800;letter-spacing:1.2px}
      .fig{font-size:64px;font-weight:800}
      .figs{font-size:40px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="90" y="80" class="serif ivory" font-size="50" font-weight="800">Washington's West Bank ledger, 6-8 August 2026</text>
  <text x="90" y="124" class="sans muted body">What Congress asked for, what the board is building, what Rome is rehearsing</text>
  <text x="1520" y="80" class="arabic ivory" font-size="36" font-weight="800" text-anchor="end">دفتر واشنطن في الضفة الغربية</text>
  <text x="1520" y="120" class="arabic muted small" text-anchor="end">ما طلبه الكونغرس، وما تبنيه الإدارة، وما تجرّبه روما</text>

  <g filter="url(#shadow)">
    <rect x="70" y="172" width="452" height="452" rx="18" fill="#26272b" stroke="#dc6572" stroke-width="3"/>
    <text x="102" y="216" class="sans red label">THE LETTER</text>
    <text x="490" y="216" class="arabic red small" text-anchor="end" font-weight="800">الرسالة</text>
    <text x="102" y="300" class="sans ivory fig">21</text>
    <text x="102" y="332" class="sans muted small">members of Congress signed</text>
    <text x="490" y="332" class="arabic muted small" text-anchor="end">عضواً في الكونغرس وقّعوا</text>
    <line x1="102" y1="356" x2="490" y2="356" stroke="#3a3b40" stroke-width="2"/>
    <text x="102" y="400" class="sans gold figs">30+</text>
    <text x="102" y="430" class="sans muted small">settler designations they want restored</text>
    <text x="490" y="430" class="arabic muted tiny" text-anchor="end">عقوبات على مستوطنين يطالبون بإعادتها</text>
    <line x1="102" y1="454" x2="490" y2="454" stroke="#3a3b40" stroke-width="2"/>
    <text x="102" y="498" class="sans ivory figs">9</text>
    <text x="102" y="528" class="sans muted small">American citizens killed since Jan 2022</text>
    <text x="490" y="528" class="arabic muted tiny" text-anchor="end">مواطنين أمريكيين قُتلوا منذ 2022</text>
    <text x="102" y="574" class="sans muted small">Four of them since this administration took office.</text>
    <text x="490" y="602" class="arabic muted tiny" text-anchor="end">أربعة منهم في عهد الإدارة الحالية</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="574" y="172" width="452" height="452" rx="18" fill="#26272b" stroke="#c7a86b" stroke-width="3"/>
    <text x="606" y="216" class="sans gold label">THE FIRST CONTRACT</text>
    <text x="994" y="216" class="arabic gold small" text-anchor="end" font-weight="800">أول عقد بناء</text>
    <text x="606" y="300" class="sans ivory fig">150</text>
    <text x="606" y="332" class="sans muted small">soldiers the Gaza outpost will house</text>
    <text x="994" y="332" class="arabic muted tiny" text-anchor="end">جندياً تتسع لهم القاعدة في غزة</text>
    <line x1="606" y1="356" x2="994" y2="356" stroke="#3a3b40" stroke-width="2"/>
    <text x="606" y="400" class="sans gold figs">100 × 120 m</text>
    <text x="606" y="430" class="sans muted small">the outpost's footprint, built by Arkel International</text>
    <text x="994" y="430" class="arabic muted tiny" text-anchor="end">مساحة الموقع الذي تبنيه شركة أركِل</text>
    <line x1="606" y1="454" x2="994" y2="454" stroke="#3a3b40" stroke-width="2"/>
    <text x="606" y="498" class="sans ivory figs">~60%</text>
    <text x="606" y="528" class="sans muted small">of Gaza the Israeli army holds around it</text>
    <text x="994" y="528" class="arabic muted tiny" text-anchor="end">من غزة يسيطر عليها الجيش الإسرائيلي</text>
    <text x="606" y="574" class="sans muted small">Moroccan troops would rotate in from a base in Israel.</text>
    <text x="994" y="602" class="arabic muted tiny" text-anchor="end">قوات مغربية تتناوب من قاعدة داخل إسرائيل</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1078" y="172" width="452" height="452" rx="18" fill="#26272b" stroke="#61aa80" stroke-width="3"/>
    <text x="1110" y="216" class="sans green label">THE REHEARSAL</text>
    <text x="1498" y="216" class="arabic green small" text-anchor="end" font-weight="800">البروفة في الجنوب</text>
    <text x="1110" y="300" class="sans ivory fig">7</text>
    <text x="1110" y="332" class="sans muted small">rounds of US-brokered Israel-Lebanon talks</text>
    <text x="1498" y="332" class="arabic muted tiny" text-anchor="end">جولات تفاوض برعاية أمريكية</text>
    <line x1="1110" y1="356" x2="1498" y2="356" stroke="#3a3b40" stroke-width="2"/>
    <text x="1110" y="400" class="sans green figs">3</text>
    <text x="1110" y="430" class="sans muted small">pilot-zone villages given to the Lebanese army</text>
    <text x="1498" y="430" class="arabic muted tiny" text-anchor="end">قرى سُلّمت للجيش اللبناني</text>
    <text x="1110" y="462" class="sans muted tiny">Zawtar al-Gharbiyeh · Srifa · Froun</text>
    <line x1="1110" y1="486" x2="1498" y2="486" stroke="#3a3b40" stroke-width="2"/>
    <text x="1110" y="528" class="sans ivory small" font-weight="800">Disarm first, withdraw later</text>
    <text x="1110" y="558" class="sans muted small">the order Washington asks for in Lebanon and Gaza alike</text>
    <text x="1498" y="596" class="arabic muted tiny" text-anchor="end">نزع السلاح أولاً والانسحاب لاحقاً في لبنان وغزة معاً</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="660" width="1460" height="150" rx="18" fill="#212226" stroke="#3a3b40" stroke-width="2"/>
    <rect x="70" y="660" width="1460" height="6" rx="3" fill="url(#band)"/>
    <text x="102" y="706" class="sans gold label">THE POLITICS BEHIND THE MONEY — السياسة خلف المال</text>
    <text x="102" y="768" class="sans ivory figs">$30.6m</text>
    <text x="102" y="796" class="sans muted small">spent against Abdul El-Sayed by AIPAC's United Democracy Project</text>
    <text x="700" y="768" class="sans ivory figs">48.5% – 47.5%</text>
    <text x="700" y="796" class="sans muted small">El-Sayed's margin over Haley Stevens in the Michigan primary</text>
    <text x="1498" y="768" class="arabic muted small" text-anchor="end">أنفق ذراع أيباك 30.6 مليون دولار ضد عبد الرحمن السيد</text>
    <text x="1498" y="796" class="arabic muted small" text-anchor="end">وفاز بفارق نقطة واحدة في انتخابات ميشيغن التمهيدية</text>
  </g>

  <text x="90" y="866" class="sans muted tiny">Times of Palestine · Washington Brief, 9 August 2026 — تايمز أوف فلسطين · موجز واشنطن</text>
</svg>

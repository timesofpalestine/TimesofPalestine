  <text x="1510" y="150" class="arabic ivory" font-size="48" font-weight="700" text-anchor="end">ساحة الشتات</text>
  <text x="1510" y="205" class="arabic muted" font-size="26" text-anchor="end">من الكونغرس إلى برلمانات العالم</text>

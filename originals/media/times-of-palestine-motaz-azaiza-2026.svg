<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Motaz Azaiza, Palestinian journalist</title>
  <desc id="d">A house illustration in woodcut style representing the Palestinian journalist Motaz Azaiza. Born Deir al-Balah refugee camp, 1999 Photographed Gaza before anyone was watching Normandy Freedom Prize - GQ Middle East man of the year.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#286344"/>
      <stop offset="0.55" stop-color="#7a5a3c"/>
      <stop offset="1" stop-color="#8a1f2d"/>
    </linearGradient>
    <pattern id="hatchB" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-42)">
      <rect width="8" height="8" fill="#1a1c1f"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b4048" stroke-width="2.4"/>
    </pattern>
    <pattern id="hatchB2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(26)">
      <rect width="7" height="7" fill="#20242a"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#4d535c" stroke-width="2"/>
    </pattern>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#286344" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#286344" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>
  <circle cx="470" cy="470" r="330" fill="url(#glowB)"/>

  <text x="800" y="76" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="25" letter-spacing="6">TIMES OF PALESTINE &#183; PROFILE</text>

  <g transform="translate(250,196)" opacity="0.42">
    <path d="M0 556 h60 v-96 h56 v96 h44 v-140 h62 v140 h48 v-72 h58 v72 h72" fill="none" stroke="#3f7a53" stroke-width="5"/>
  </g>

  <g transform="translate(310,214)">
    <path d="M18 596 q0 -184 168 -216 l58 -20 l58 20 q168 32 168 216 z" fill="url(#hatchB)" stroke="#5a6069" stroke-width="3"/>
    <path d="M208 340 h72 v56 q-36 22 -72 0 z" fill="#3a4048"/>
    <ellipse cx="244" cy="254" rx="94" ry="110" fill="url(#hatchB2)" stroke="#6a707a" stroke-width="3"/>
    <path d="M150 240 q6 -126 94 -126 q88 0 94 126 q-30 -68 -94 -68 q-64 0 -94 68 z" fill="#2a2f36" stroke="#7d838d" stroke-width="3"/>
    <path d="M192 272 q24 -14 48 0" stroke="#aab0ba" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M258 272 q22 -12 42 2" stroke="#aab0ba" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M224 330 q24 12 48 -4" stroke="#8f959f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <g transform="translate(0,-6)">
      <rect x="150" y="486" width="204" height="140" rx="12" fill="#14161a" stroke="#c7a86b" stroke-width="5"/>
      <rect x="206" y="462" width="80" height="30" rx="6" fill="#14161a" stroke="#c7a86b" stroke-width="4"/>
      <circle cx="252" cy="556" r="52" fill="#22262b" stroke="#c7a86b" stroke-width="5"/>
      <circle cx="252" cy="556" r="26" fill="#0d0f11" stroke="#6f7681" stroke-width="3"/>
      <circle cx="322" cy="508" r="9" fill="#8a1f2d"/>
    </g>
  </g>

  <line x1="900" y1="250" x2="1470" y2="250" stroke="url(#rule)" stroke-width="4"/>
  <text x="900" y="336" fill="#f2eee8" font-family="Georgia,serif" font-size="52" font-weight="700">Motaz Azaiza</text>
  <text x="900" y="392" fill="#f2eee8" font-family="Tahoma,Arial,sans-serif" font-size="34">معتز عزايزة</text>

  <text x="900" y="472" fill="#c7a86b" font-family="Georgia,serif" font-size="21" letter-spacing="3">TIME 100, 2024</text>
  <text x="900" y="548" fill="#f2eee8" font-family="Georgia,serif" font-size="72" font-weight="700">100</text>
  <text x="900" y="592" fill="#a9a49b" font-family="Georgia,serif" font-size="25">most influential people in the world</text>
  <text x="900" y="632" fill="#8f8b83" font-family="Tahoma,Arial,sans-serif" font-size="24">ضمن مئة شخصية الأكثر تأثيرًا في العالم</text>

  <line x1="900" y1="672" x2="1470" y2="672" stroke="#2a2c31" stroke-width="2"/>
  <text x="900" y="716" fill="#a9a49b" font-family="Georgia,serif" font-size="23">Born Deir al-Balah refugee camp, 1999</text>
  <text x="900" y="754" fill="#a9a49b" font-family="Georgia,serif" font-size="23">Photographed Gaza before anyone was watching</text>
  <text x="900" y="792" fill="#8f8b83" font-family="Georgia,serif" font-size="23" textLength="684" lengthAdjust="spacingAndGlyphs">Normandy Freedom Prize &#183; GQ Middle East man of the year</text>

  <text x="800" y="862" text-anchor="middle" fill="#6f6b64" font-family="Georgia,serif" font-size="19">Illustration: Times of Palestine &#183; a house drawing, not a portrait likeness</text>
</svg>

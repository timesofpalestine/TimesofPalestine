<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Women teachers run Gaza's tent classrooms through a third year</title>
  <desc id="dsc">Illustration of a self-made tent classroom with a chalkboard, a standing teacher and three pupils, beside a bar chart comparing UNICEF's current reach of 135,462 children in 111 temporary learning spaces with its target of 336,000 children, and stat cards showing 60 per cent of school-age children without in-person learning, more than 90 per cent of schools damaged or destroyed, and 1,054 teachers and education staff killed.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2eee8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#f2eee8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <!-- headline block -->
  <text x="90" y="92" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="3.5" fill="#c7a86b">GAZA · EDUCATION · TENT SCHOOLS</text>
  <text x="90" y="160" font-family="'Source Serif 4',Georgia,serif" font-size="48" fill="#f2eee8">Women teachers run Gaza's tent</text>
  <text x="90" y="214" font-family="'Source Serif 4',Georgia,serif" font-size="48" fill="#f2eee8">classrooms through a third year</text>
  <text x="90" y="266" font-family="Cairo,Arial,sans-serif" font-size="32" fill="#59a97d" direction="rtl" text-anchor="end">معلمات يدرن مدارس الخيام في غزة للعام الثالث</text>
  <line x1="90" y1="308" x2="1540" y2="308" stroke="#2c2e31" stroke-width="2"/>

  <!-- LEFT: tent classroom -->
  <text x="140" y="352" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">Self-made tent classrooms</text>
  <text x="140" y="382" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5" direction="rtl" text-anchor="end">فصول من صنع المعلمات في الخيام</text>

  <line x1="90" y1="800" x2="770" y2="800" stroke="#3a3c40" stroke-width="3"/>
  <polygon points="420,430 720,800 120,800" fill="url(#tent)" stroke="#f2eee8" stroke-width="4" stroke-linejoin="round"/>
  <line x1="420" y1="430" x2="420" y2="800" stroke="#f2eee8" stroke-width="1.5" stroke-opacity="0.28"/>
  <line x1="420" y1="430" x2="280" y2="800" stroke="#f2eee8" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="420" y1="430" x2="560" y2="800" stroke="#f2eee8" stroke-width="1.5" stroke-opacity="0.18"/>
  <line x1="420" y1="430" x2="420" y2="404" stroke="#c7a86b" stroke-width="5"/>
  <line x1="120" y1="800" x2="86" y2="812" stroke="#aaa9a5" stroke-width="2.5"/>
  <line x1="720" y1="800" x2="754" y2="812" stroke="#aaa9a5" stroke-width="2.5"/>

  <!-- chalkboard -->
  <rect x="350" y="580" width="200" height="120" rx="6" fill="#16241d" stroke="#286344" stroke-width="4"/>
  <text x="375" y="638" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#f2eee8" direction="rtl">أ ب ج</text>
  <line x1="375" y1="662" x2="525" y2="662" stroke="#f2eee8" stroke-width="3" stroke-opacity="0.55"/>
  <line x1="375" y1="680" x2="470" y2="680" stroke="#f2eee8" stroke-width="3" stroke-opacity="0.35"/>

  <!-- teacher -->
  <circle cx="252" cy="688" r="19" fill="#c7a86b"/>
  <path d="M252 710 c-24 0 -34 20 -36 80 h72 c-2 -60 -12 -80 -36 -80 z" fill="#c7a86b"/>
  <line x1="286" y1="726" x2="336" y2="700" stroke="#c7a86b" stroke-width="7" stroke-linecap="round"/>

  <!-- pupils -->
  <circle cx="380" cy="752" r="14" fill="#f2eee8" fill-opacity="0.85"/>
  <path d="M380 768 c-17 0 -24 12 -25 32 h50 c-1 -20 -8 -32 -25 -32 z" fill="#f2eee8" fill-opacity="0.55"/>
  <circle cx="452" cy="752" r="14" fill="#f2eee8" fill-opacity="0.85"/>
  <path d="M452 768 c-17 0 -24 12 -25 32 h50 c-1 -20 -8 -32 -25 -32 z" fill="#f2eee8" fill-opacity="0.55"/>
  <circle cx="524" cy="752" r="14" fill="#f2eee8" fill-opacity="0.85"/>
  <path d="M524 768 c-17 0 -24 12 -25 32 h50 c-1 -20 -8 -32 -25 -32 z" fill="#f2eee8" fill-opacity="0.55"/>

  <!-- RIGHT: chart -->
  <text x="830" y="352" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">In-person learning: reach against target</text>
  <text x="830" y="382" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5" direction="rtl">الوصول الحالي مقابل الهدف</text>

  <text x="830" y="432" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#59a97d">Reached now: 135,462 children in 111 spaces</text>
  <rect x="830" y="444" width="560" height="40" fill="#ffffff" fill-opacity="0.04"/>
  <rect x="830" y="444" width="226" height="40" fill="#286344"/>

  <text x="830" y="524" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#c7a86b">Target: 336,000 children, needs US$86 million</text>
  <rect x="830" y="536" width="560" height="40" fill="#c7a86b" fill-opacity="0.25" stroke="#c7a86b" stroke-width="2"/>

  <!-- stat cards -->
  <rect x="830" y="624" width="222" height="180" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#2c2e31" stroke-width="2"/>
  <text x="852" y="694" font-family="'Source Serif 4',Georgia,serif" font-size="44" fill="#C8102E">60%</text>
  <text x="852" y="730" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">of school-age children</text>
  <text x="852" y="752" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">with no in-person</text>
  <text x="852" y="774" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">learning</text>

  <rect x="1067" y="624" width="222" height="180" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#2c2e31" stroke-width="2"/>
  <text x="1089" y="694" font-family="'Source Serif 4',Georgia,serif" font-size="44" fill="#C8102E">90%+</text>
  <text x="1089" y="730" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">of schools damaged</text>
  <text x="1089" y="752" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">or destroyed</text>

  <rect x="1304" y="624" width="222" height="180" rx="8" fill="#ffffff" fill-opacity="0.04" stroke="#2c2e31" stroke-width="2"/>
  <text x="1326" y="694" font-family="'Source Serif 4',Georgia,serif" font-size="44" fill="#C8102E">1,054</text>
  <text x="1326" y="730" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">teachers and education</text>
  <text x="1326" y="752" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">staff killed since</text>
  <text x="1326" y="774" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">October 2023</text>

  <text x="90" y="862" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">Sources: UNICEF, 27 January 2026; Palestinian Ministry of Education, 9 June 2026</text>
</svg>
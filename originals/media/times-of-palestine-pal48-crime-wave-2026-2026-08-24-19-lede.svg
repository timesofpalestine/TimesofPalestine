<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Israeli police solved 12 percent of homicides in Arab communities in the first half of 2026</title>
<desc id="dsc">Chart comparing case clearance rates: 12 percent for Arab communities in the first half of 2026, 10 percent in 2025, 15 percent in police and Knesset data versus 65 percent among Jewish Israelis; alongside a grid of 144 dots for the 144 people killed between January and June 2026, of whom 127 were killed with firearms. Source: the Abraham Initiatives; police and Knesset figures reported by CNN in February.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="90" y="112" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">Israeli police solve 12% of homicides</text>
<text x="90" y="172" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">in Arab communities</text>
<text x="90" y="228" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#c7a86b" direction="rtl" text-anchor="end">الشرطة تحل 12% من جرائم القتل في المجتمع العربي</text>
<text x="90" y="270" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#aaa9a5">The Abraham Initiatives report, January–June 2026</text>

<line x1="90" y1="300" x2="1510" y2="300" stroke="#3a3b3f" stroke-width="2"/>

<!-- Panel A: clearance rates -->
<text x="90" y="346" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="3" fill="#59a97d">CASE CLEARANCE RATE</text>
<text x="90" y="378" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5" direction="rtl" text-anchor="end">نسبة حل قضايا القتل</text>

<g font-family="'Libre Franklin',Arial,sans-serif">
  <text x="90" y="428" font-size="19" fill="#f2eee8">Arab communities · first half of 2026</text>
  <rect x="90" y="440" width="600" height="26" fill="#232428"/>
  <rect x="90" y="440" width="72" height="26" fill="#C8102E"/>
  <text x="176" y="461" font-size="22" fill="#C8102E">12%</text>

  <text x="90" y="518" font-size="19" fill="#f2eee8">Arab communities · 2025</text>
  <rect x="90" y="530" width="600" height="26" fill="#232428"/>
  <rect x="90" y="530" width="60" height="26" fill="#8a1f2d"/>
  <text x="164" y="551" font-size="22" fill="#c7a86b">10%</text>

  <text x="90" y="608" font-size="19" fill="#f2eee8">Arab communities · Knesset data (CNN, February)</text>
  <rect x="90" y="620" width="600" height="26" fill="#232428"/>
  <rect x="90" y="620" width="90" height="26" fill="#8a1f2d"/>
  <text x="194" y="641" font-size="22" fill="#c7a86b">15%</text>

  <text x="90" y="698" font-size="19" fill="#f2eee8">Jewish Israelis · Knesset data (CNN, February)</text>
  <rect x="90" y="710" width="600" height="26" fill="#232428"/>
  <rect x="90" y="710" width="390" height="26" fill="#286344"/>
  <text x="494" y="731" font-size="22" fill="#59a97d">65%</text>
</g>
<text x="90" y="784" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Bars scaled to 100% of homicide cases</text>

<!-- Panel B: 144 killed -->
<text x="860" y="346" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="3" fill="#59a97d">144 KILLED, JANUARY–JUNE 2026</text>
<text x="860" y="378" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5" direction="rtl">144 قتيلاً بين كانون الثاني وحزيران 2026</text>


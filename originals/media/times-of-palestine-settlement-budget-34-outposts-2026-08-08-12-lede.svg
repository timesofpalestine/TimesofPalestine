<text x="700" y="576" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Gush Etzion</text>
<text x="1010" y="576" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">غوش عتصيون</text>
<g fill="#c7a86b">
<circle cx="1050" cy="569" r="10"/><circle cx="1082" cy="569" r="10"/><circle cx="1114" cy="569" r="10"/><circle cx="1146" cy="569" r="10"/><circle cx="1178" cy="569" r="10"/><circle cx="1210" cy="569" r="10"/>
</g>
<text x="1512" y="580" text-anchor="end" font-family="'Source Serif 4',Georgia,serif" font-size="32" fill="#f2eee8">6</text>

<!-- South Hebron Hills 4 -->
<text x="700" y="646" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">South Hebron Hills</text>
<text x="1010" y="646" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">مسافر يطا</text>

<!-- Binyamin 7 -->
<text x="700" y="436" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Binyamin</text>
<text x="1010" y="436" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">بنيامين</text>
<g fill="#c7a86b">
<circle cx="1050" cy="429" r="10"/><circle cx="1082" cy="429" r="10"/><circle cx="1114" cy="429" r="10"/><circle cx="1146" cy="429" r="10"/><circle cx="1178" cy="429" r="10"/><circle cx="1210" cy="429" r="10"/><circle cx="1242" cy="429" r="10"/>
</g>
<text x="1512" y="440" text-anchor="end" font-family="'Source Serif 4',Georgia,serif" font-size="32" fill="#f2eee8">7</text>

<!-- Jordan Valley 7 -->
<text x="700" y="506" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Jordan Valley</text>
<text x="1010" y="506" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">الأغوار</text>
<g fill="#c7a86b">
<circle cx="1050" cy="499" r="10"/><circle cx="1082" cy="499" r="10"/><circle cx="1114" cy="499" r="10"/><circle cx="1146" cy="499" r="10"/><circle cx="1178" cy="499" r="10"/><circle cx="1210" cy="499" r="10"/><circle cx="1242" cy="499" r="10"/>
</g>
<text x="1512" y="510" text-anchor="end" font-family="'Source Serif 4',Georgia,serif" font-size="32" fill="#f2eee8">7</text>


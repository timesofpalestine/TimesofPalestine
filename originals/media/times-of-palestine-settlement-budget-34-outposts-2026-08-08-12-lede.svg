<text x="1512" y="650" text-anchor="end" font-family="'Source Serif 4',Georgia,serif" font-size="32" fill="#f2eee8">4</text>

<!-- Megillot 1 -->
<text x="700" y="716" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Megillot Regional Council</text>
<text x="1010" y="716" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">مجيلوت</text>
<circle cx="1050" cy="709" r="10" fill="#c7a86b"/>
<text x="1512" y="720" text-anchor="end" font-family="'Source Serif 4',Georgia,serif" font-size="32" fill="#f2eee8">1</text>

<line x1="700" y1="752" x2="1512" y2="752" stroke="#3a3b3f" stroke-width="1"/>
<text x="700" y="786" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">No official map, coordinates or decision text has been published. Shaul Arieli:</text>
<text x="700" y="810" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">32 of the 34 sites lie outside the route of the existing separation barrier.</text>
<text x="700" y="834" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#c7a86b">Chief of staff Lt. Gen. Eyal Zamir warned ministers the army lacks the manpower.</text>

<text x="92" y="874" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#78777a">Sources: Reuters (14 July), Ynet, Peace Now, FMEP, Israel National News, WAFA, Middle East Monitor · Times of Palestine graphic</text>
</svg>
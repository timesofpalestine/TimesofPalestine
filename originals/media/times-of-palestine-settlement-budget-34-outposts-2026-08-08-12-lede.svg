<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Israel's cabinet funds 34 new West Bank settlements with 1.3 billion shekels</title>
<desc id="dsc">Chart showing the 1.3 billion shekel budget (about 434 million dollars) for 34 new settlements and a further 1.075 billion shekels for access roads, alongside the regional breakdown of the 34 sites reported by Ynet: nine in Samaria, seven in Binyamin, seven in the Jordan Valley, six in Gush Etzion, four in the South Hebron Hills and one in the Megillot Regional Council.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="barRed" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#8a1f2d"/>
<stop offset="1" stop-color="#C8102E"/>
</linearGradient>
<linearGradient id="barGreen" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#286344"/>
<stop offset="1" stop-color="#59a97d"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="92" y="86" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" letter-spacing="4" fill="#c7a86b">WEST BANK · ISRAELI SECURITY CABINET</text>
<text x="92" y="152" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">1.3 billion shekels for 34 new settlements</text>
<text x="92" y="200" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" fill="#aaa9a5">Approved 25 March 2026 · announced 14 July · plus 1.075 billion for roads</text>
<text x="1512" y="152" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="40" fill="#c7a86b">1.3 مليار شيكل لـ34 مستوطنة جديدة</text>
<text x="1512" y="200" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="23" fill="#aaa9a5">و1.075 مليار شيكل لشقّ الطرق المؤدية إليها</text>

<line x1="92" y1="238" x2="1512" y2="238" stroke="#3a3b3f" stroke-width="2"/>

<!-- LEFT: money -->
<text x="92" y="292" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="3" fill="#f2eee8">THE MONEY</text>
<text x="600" y="292" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#c7a86b">الميزانية</text>
<line x1="92" y1="306" x2="600" y2="306" stroke="#3a3b3f" stroke-width="1"/>

<text x="92" y="356" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">Establishing the 34 settlements</text>
<rect x="92" y="372" width="500" height="62" fill="url(#barRed)"/>
<text x="112" y="414" font-family="'Source Serif 4',Georgia,serif" font-size="38" fill="#f2eee8">1.3bn ₪</text>
<text x="580" y="414" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8" opacity="0.85">≈ $434 million</text>
<text x="92" y="462" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Prepared by the PM's Office · carried out through the</text>
<text x="92" y="486" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Ministry of Construction and Housing</text>

<text x="92" y="552" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">Roads to reach them</text>
<rect x="92" y="568" width="413" height="62" fill="url(#barGreen)"/>
<text x="112" y="610" font-family="'Source Serif 4',Georgia,serif" font-size="38" fill="#f2eee8">1.075bn ₪</text>
<text x="92" y="658" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Split between the transport and defence ministries</text>
<text x="92" y="682" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">across three years · covers Homesh, Sa-Nur, Ganim</text>
<text x="92" y="706" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">and Kadim, dismantled in 2005</text>

<rect x="92" y="742" width="508" height="94" fill="none" stroke="#3a3b3f" stroke-width="1"/>
<text x="112" y="776" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#c7a86b">Peace Now: all sites lie in Area C.</text>
<text x="112" y="802" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">FMEP: eight are planned on land Israel itself</text>
<text x="112" y="824" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">recognises as privately owned by Palestinians.</text>

<line x1="656" y1="270" x2="656" y2="840" stroke="#3a3b3f" stroke-width="2"/>

<!-- RIGHT: breakdown -->
<text x="700" y="292" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="3" fill="#f2eee8">WHERE THE 34 WILL STAND — as listed by Ynet</text>
<text x="1512" y="292" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#c7a86b">مواقع المستوطنات الـ34</text>
<line x1="700" y1="306" x2="1512" y2="306" stroke="#3a3b3f" stroke-width="1"/>

<!-- row: Samaria 9 -->
<text x="700" y="366" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Samaria</text>
<text x="1010" y="366" text-anchor="end" direction="rtl" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">السامرة</text>
<g fill="#c7a86b">
<circle cx="1050" cy="359" r="10"/><circle cx="1082" cy="359" r="10"/><circle cx="1114" cy="359" r="10"/><circle cx="1146" cy="359" r="10"/><circle cx="1178" cy="359" r="10"/><circle cx="1210" cy="359" r="10"/><circle cx="1242" cy="359" r="10"/><circle cx="1274" cy="359" r="10"/><circle cx="1306" cy="359" r="10"/>
</g>

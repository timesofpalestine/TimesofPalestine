<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Haya Washington: from DC to Gaza's orphan camps</title>
  <desc id="d">Illustration of the aid line run by the nonprofit Haya Washington: Washington DC on one side, the displacement camps of southern Gaza on the other, joined by an arc carrying food, clean water and shelter — with English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <text x="70" y="80" class="sans ivory" font-size="44" font-weight="800">A LIFELINE TO THE ORPHAN CITIES</text>
  <text x="1530" y="80" class="arabic ivory" font-size="38" font-weight="700" text-anchor="end">شريان حياة إلى مدن الأيتام</text>
  <text x="70" y="120" class="sans muted" font-size="24">Haya Washington · nonprofit aid on the ground in southern Gaza since 2023</text>

  <!-- arc from DC to Gaza -->
  <path d="M300 560 C 600 260, 1000 260, 1300 560" stroke="#c7a86b" stroke-width="6" fill="none" stroke-dasharray="2 14" stroke-linecap="round"/>

  <!-- DC node -->
  <g filter="url(#sh)">
    <circle cx="300" cy="600" r="96" fill="#16161a" stroke="#3d4f6b" stroke-width="4"/>
    <text x="300" y="588" class="sans ivory" font-size="26" font-weight="800" text-anchor="middle">WASHINGTON</text>
    <text x="300" y="622" class="arabic muted" font-size="23" text-anchor="middle">واشنطن</text>
    <text x="300" y="652" class="sans muted" font-size="18" text-anchor="middle">501(c)(3)</text>
  </g>

  <!-- Gaza node -->
  <g filter="url(#sh)">
    <circle cx="1300" cy="600" r="96" fill="#16161a" stroke="#286344" stroke-width="4"/>
    <text x="1300" y="588" class="sans ivory" font-size="26" font-weight="800" text-anchor="middle">SOUTHERN GAZA</text>
    <text x="1300" y="622" class="arabic muted" font-size="23" text-anchor="middle">جنوب غزة</text>
    <text x="1300" y="652" class="sans muted" font-size="18" text-anchor="middle">displacement camps</text>
  </g>

  <!-- payload icons on the arc -->
  <g filter="url(#sh)">
    <!-- bread -->
    <circle cx="520" cy="365" r="54" fill="#16161a" stroke="#c7a86b" stroke-width="3"/>
    <ellipse cx="520" cy="365" rx="28" ry="16" fill="#c7a86b"/>
    <path d="M503 365 h34 M509 358 h22 M509 372 h22" stroke="#16161a" stroke-width="2.5"/>
    <text x="520" y="445" class="sans ivory" font-size="22" font-weight="700" text-anchor="middle">FOOD</text>
    <text x="520" y="473" class="arabic muted" font-size="21" text-anchor="middle">غذاء</text>
    <!-- water -->
    <circle cx="705" cy="315" r="54" fill="#16161a" stroke="#c7a86b" stroke-width="3"/>
    <path d="M705 289 C 719 311, 726 323, 726 334 a21 21 0 1 1 -42 0 c0 -11 7 -23 21 -45z" fill="#3d6b8a"/>
    <text x="705" y="398" class="sans ivory" font-size="22" font-weight="700" text-anchor="middle">CLEAN WATER</text>
    <text x="705" y="426" class="arabic muted" font-size="21" text-anchor="middle">مياه نظيفة</text>
    <!-- shelter -->
    <circle cx="895" cy="315" r="54" fill="#16161a" stroke="#c7a86b" stroke-width="3"/>
    <path d="M867 331 L895 294 L923 331 z" fill="#286344"/>
    <rect x="888" y="316" width="14" height="15" fill="#16161a"/>
    <text x="895" y="398" class="sans ivory" font-size="22" font-weight="700" text-anchor="middle">SHELTER</text>
    <text x="895" y="426" class="arabic muted" font-size="21" text-anchor="middle">مأوى</text>
    <!-- school -->
    <circle cx="1080" cy="365" r="54" fill="#16161a" stroke="#c7a86b" stroke-width="3"/>
    <path d="M1052 355 L1080 340 L1108 355 z" fill="#8a1f2d"/>
    <rect x="1058" y="355" width="44" height="26" fill="#f2eee8"/>
    <rect x="1074" y="362" width="12" height="19" fill="#16161a"/>
    <text x="1080" y="445" class="sans ivory" font-size="22" font-weight="700" text-anchor="middle">A SCHOOL</text>
    <text x="1080" y="473" class="arabic muted" font-size="21" text-anchor="middle">مدرسة</text>
  </g>

  <!-- children note -->
  <text x="800" y="770" class="sans ivory" font-size="26" font-weight="700" text-anchor="middle">Hundreds of children who lost entire families · food, water and care where larger agencies could not reach</text>
  <text x="800" y="810" class="arabic muted" font-size="24" text-anchor="middle">مئات الأطفال الذين فقدوا عائلاتهم كاملة.. غذاء وماء ورعاية حيث تعذّر وصول المنظمات الكبرى</text>

  <text x="70" y="862" class="sans muted" font-size="19">Graphic: Times of Palestine</text>
  <text x="1530" y="862" class="arabic muted" font-size="19" text-anchor="end">غرافيك: تايمز أوف فلسطين</text>
</svg>

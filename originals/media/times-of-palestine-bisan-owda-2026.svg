<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Bisan Owda, Palestinian journalist</title>
  <desc id="d">A house illustration in woodcut style representing the Palestinian journalist Bisan Owda. Born Beit Hanoun - filmmaker before the war Hakawatiya, five years recording Gaza It's Bisan from Gaza and I'm Still Alive, AJ+.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#286344"/>
      <stop offset="0.55" stop-color="#7a5a3c"/>
      <stop offset="1" stop-color="#8a1f2d"/>
    </linearGradient>
    <pattern id="hatchB" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-42)">
      <rect width="8" height="8" fill="#1a1c1f"/>
      <line x1="0" y1="0" x2="0" y2="8" stroke="#3b4048" stroke-width="2.4"/>
    </pattern>
    <pattern id="hatchB2" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(26)">
      <rect width="7" height="7" fill="#20242a"/>
      <line x1="0" y1="0" x2="0" y2="7" stroke="#4d535c" stroke-width="2"/>
    </pattern>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#c7a86b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#c7a86b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>
  <circle cx="470" cy="470" r="330" fill="url(#glowB)"/>

  <text x="800" y="76" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="25" letter-spacing="6">TIMES OF PALESTINE &#183; PROFILE</text>

  <g transform="translate(250,196)" opacity="0.42">
    <path d="M10 556 l84 -128 l84 128 z M186 556 l84 -128 l84 128 z" fill="none" stroke="#3f7a53" stroke-width="5"/>
  </g>

  <g transform="translate(310,214)">
    <path d="M18 596 q0 -184 168 -216 l58 -20 l58 20 q168 32 168 216 z" fill="url(#hatchB)" stroke="#5a6069" stroke-width="3"/>
    <path d="M208 340 h72 v56 q-36 22 -72 0 z" fill="#3a4048"/>
    <ellipse cx="244" cy="254" rx="94" ry="110" fill="url(#hatchB2)" stroke="#6a707a" stroke-width="3"/>
    <path d="M148 236 q4 -122 96 -122 q92 0 96 122 q-8 -40 -30 -60 q-42 26 -96 22 q-40 -4 -66 38 z" fill="#2a2f36" stroke="#7d838d" stroke-width="3"/>
    <path d="M192 272 q24 -14 48 0" stroke="#aab0ba" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M258 272 q22 -12 42 2" stroke="#aab0ba" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M224 330 q24 12 48 -4" stroke="#8f959f" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M366 560 q86 -34 118 -128 l52 20 q-40 116 -142 158 z" fill="url(#hatchB)" stroke="#5a6069" stroke-width="3"/>
    <g transform="rotate(15 513 405)">
      <rect x="470" y="330" width="86" height="150" rx="12" fill="#14161a" stroke="#c7a86b" stroke-width="4"/>
      <rect x="482" y="348" width="62" height="114" rx="5" fill="#3d444d"/>
    </g>
    <circle cx="500" cy="330" r="9" fill="#8a1f2d"/>
  </g>

  <line x1="900" y1="250" x2="1470" y2="250" stroke="url(#rule)" stroke-width="4"/>
  <text x="900" y="336" fill="#f2eee8" font-family="Georgia,serif" font-size="52" font-weight="700">Bisan Owda</text>
  <text x="900" y="392" fill="#f2eee8" font-family="Tahoma,Arial,sans-serif" font-size="34">بيسان عودة</text>

  <text x="900" y="472" fill="#c7a86b" font-family="Georgia,serif" font-size="21" letter-spacing="3">EMMY &#183; PEABODY &#183; MURROW, 2024</text>
  <text x="900" y="548" fill="#f2eee8" font-family="Georgia,serif" font-size="72" font-weight="700">3</text>
  <text x="900" y="592" fill="#a9a49b" font-family="Georgia,serif" font-size="25">major awards in a single year</text>
  <text x="900" y="632" fill="#8f8b83" font-family="Tahoma,Arial,sans-serif" font-size="24">ثلاث جوائز كبرى في عام واحد</text>

  <line x1="900" y1="672" x2="1470" y2="672" stroke="#2a2c31" stroke-width="2"/>
  <text x="900" y="716" fill="#a9a49b" font-family="Georgia,serif" font-size="23">Born Beit Hanoun &#183; filmmaker before the war</text>
  <text x="900" y="754" fill="#a9a49b" font-family="Georgia,serif" font-size="23"><tspan font-style="italic">Hakawatiya</tspan>, five years recording Gaza</text>
  <text x="900" y="792" fill="#8f8b83" font-family="Georgia,serif" font-size="23"><tspan font-style="italic">It&#8217;s Bisan from Gaza and I&#8217;m Still Alive</tspan>, AJ+</text>

  <text x="800" y="862" text-anchor="middle" fill="#6f6b64" font-family="Georgia,serif" font-size="19">Illustration: Times of Palestine &#183; a house drawing, not a portrait likeness</text>
</svg>

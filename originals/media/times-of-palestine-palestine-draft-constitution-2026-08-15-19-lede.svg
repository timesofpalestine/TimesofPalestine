<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Abbas's drafting committee rewrites the system, leaving the PLO's status unsettled</title>
<desc id="d">A timeline of the draft Interim Constitution of the State of Palestine — presidential decree of 18 August 2025, draft handed to President Abbas on 5 February, released for public comment on 9 February, sixty-day consultation closed 9 April 2026 — with no final text published and no referendum date set. Beside it, a document graphic highlights Article 11, which says the State does not diminish the PLO as sole legitimate representative. Committee facts: 17 members, 70 meetings, about seven months of work.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f2eee8"/><stop offset="1" stop-color="#e4ded4"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="90" y="68" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4" fill="#c7a86b">PALESTINE · A CONSTITUTION STILL IN DRAFT</text>

<text x="90" y="122" font-family="'Source Serif 4',Georgia,serif" font-size="44" font-weight="700" fill="#f2eee8">Abbas's drafting committee rewrites the system,</text>
<text x="90" y="172" font-family="'Source Serif 4',Georgia,serif" font-size="44" font-weight="700" fill="#f2eee8">leaves PLO status unsettled</text>
<text x="90" y="218" font-family="Cairo,Arial,sans-serif" font-size="27" fill="#59a97d" text-anchor="start">لجنة الصياغة تعيد كتابة النظام وتترك وضع المنظمة معلقًا</text>

<line x1="90" y1="244" x2="1510" y2="244" stroke="#3a3b3f" stroke-width="2"/>

<!-- LEFT: timeline -->
<text x="90" y="292" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#aaa9a5">TIMELINE — الجدول الزمني</text>

<line x1="140" y1="330" x2="140" y2="600" stroke="#286344" stroke-width="4"/>
<line x1="140" y1="600" x2="140" y2="760" stroke="#8a1f2d" stroke-width="4" stroke-dasharray="10 10"/>

<circle cx="140" cy="345" r="11" fill="#59a97d"/>
<text x="180" y="340" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" font-weight="700" fill="#c7a86b">18 August 2025</text>
<text x="180" y="368" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Presidential decree appoints the drafting committee</text>

<circle cx="140" cy="430" r="11" fill="#59a97d"/>
<text x="180" y="425" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" font-weight="700" fill="#c7a86b">5 February</text>
<text x="180" y="453" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Draft handed to President Mahmoud Abbas</text>

<circle cx="140" cy="515" r="11" fill="#59a97d"/>
<text x="180" y="510" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" font-weight="700" fill="#c7a86b">9 February</text>
<text x="180" y="538" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Released for public comment by decision</text>

<circle cx="140" cy="600" r="11" fill="#59a97d"/>
<text x="180" y="595" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" font-weight="700" fill="#c7a86b">9 April 2026</text>
<text x="180" y="623" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">60-day consultation period closes</text>

<circle cx="140" cy="685" r="11" fill="#1d1e21" stroke="#8a1f2d" stroke-width="4"/>
<text x="180" y="680" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" font-weight="700" fill="#C8102E">Final text</text>
<text x="180" y="708" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">Not published</text>

<circle cx="140" cy="760" r="11" fill="#1d1e21" stroke="#8a1f2d" stroke-width="4"/>
<text x="180" y="755" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" font-weight="700" fill="#C8102E">Referendum</text>
<text x="180" y="783" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">No date set — لم يُحدَّد موعد</text>


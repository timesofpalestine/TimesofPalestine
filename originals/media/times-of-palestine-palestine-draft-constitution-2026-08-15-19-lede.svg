<rect x="288" y="815" width="190" height="48" rx="24" fill="#26272b" stroke="#3a3b3f" stroke-width="2"/>
<text x="310" y="846" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="700" fill="#c7a86b">70 meetings</text>
<rect x="496" y="815" width="230" height="48" rx="24" fill="#26272b" stroke="#3a3b3f" stroke-width="2"/>
<text x="518" y="846" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="700" fill="#c7a86b">About 7 months</text>

<!-- RIGHT: the document -->
<text x="960" y="292" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#aaa9a5">THE DOCUMENT — الوثيقة</text>

<rect x="972" y="322" width="470" height="500" rx="6" fill="#0d0e10" opacity="0.5"/>
<rect x="960" y="310" width="470" height="500" rx="6" fill="url(#page)"/>
<rect x="960" y="310" width="470" height="66" rx="6" fill="#8a1f2d"/>
<rect x="960" y="360" width="470" height="16" fill="#8a1f2d"/>
<text x="986" y="354" font-family="'Source Serif 4',Georgia,serif" font-size="24" font-weight="700" fill="#f2eee8">Draft Interim Constitution</text>

<text x="986" y="412" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#3a3b3f" text-anchor="start">مسودة الدستور الانتقالي لدولة فلسطين</text>

<rect x="986" y="432" width="400" height="7" rx="3" fill="#c3bcb0"/>
<rect x="986" y="450" width="360" height="7" rx="3" fill="#c3bcb0"/>
<rect x="986" y="468" width="386" height="7" rx="3" fill="#c3bcb0"/>

<rect x="986" y="498" width="418" height="196" rx="5" fill="#efe3cd" stroke="#c7a86b" stroke-width="2"/>
<rect x="986" y="498" width="9" height="196" fill="#8a1f2d"/>
<text x="1012" y="534" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="#8a1f2d">ARTICLE 11 — المادة 11</text>
<text x="1012" y="570" font-family="'Source Serif 4',Georgia,serif" font-size="19" fill="#26272b">The establishment of the State does not</text>
<text x="1012" y="596" font-family="'Source Serif 4',Georgia,serif" font-size="19" fill="#26272b">diminish the PLO in its capacity as sole</text>
<text x="1012" y="622" font-family="'Source Serif 4',Georgia,serif" font-size="19" fill="#26272b">legitimate representative.</text>
<line x1="1012" y1="640" x2="1380" y2="640" stroke="#c7a86b" stroke-width="2"/>
<text x="1012" y="670" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" font-weight="700" fill="#8a1f2d">Critics: recognition stops at the symbolic</text>

<rect x="986" y="712" width="418" height="7" rx="3" fill="#c3bcb0"/>
<rect x="986" y="730" width="330" height="7" rx="3" fill="#c3bcb0"/>

<text x="986" y="784" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" font-weight="700" fill="#3a3b3f">State · PLO · Authority: knot unanswered</text>


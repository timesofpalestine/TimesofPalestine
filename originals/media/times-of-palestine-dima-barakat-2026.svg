<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t">
  <title id="t">Times of Palestine — Release Dr. Dima Barakat / أطلقوا سراح الطبيبة ديما بركات</title>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient>
  <style>.serif{font-family:"Source Serif 4",Georgia,serif}.arabic{font-family:Cairo,Arial,sans-serif}.sans{font-family:"Libre Franklin",Arial,sans-serif}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <!-- prison-bar motif, one bar broken: the file stays open until she walks out -->
  <g stroke="#3d4f6b" stroke-width="12" opacity=".6">
    <line x1="1250" y1="150" x2="1250" y2="750"/><line x1="1330" y1="150" x2="1330" y2="750"/>
    <line x1="1490" y1="150" x2="1490" y2="750"/>
  </g>
  <g stroke="#c7a86b" stroke-width="12">
    <line x1="1410" y1="150" x2="1410" y2="390"/><line x1="1410" y1="540" x2="1410" y2="750"/>
  </g>
  <!-- caduceus-free medical mark: a plain crescent-and-pulse line, house geometric style -->
  <path d="M120 690 h180 l40 -70 l55 130 l45 -90 h180" fill="none" stroke="#286344" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
  <path d="M120 690 h180 l40 -70 l55 130 l45 -90 h60" fill="none" stroke="#8a1f2d" stroke-width="14" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>
  <rect x="120" y="330" width="120" height="7" fill="#c7a86b"/>
  <text x="120" y="300" class="arabic" fill="#f2eee8" font-size="80" font-weight="700">أطلقوا سراح الطبيبة ديما بركات</text>
  <text x="120" y="430" class="serif" fill="#c7a86b" font-size="52" font-weight="700">Release Dr. Dima Barakat</text>
  <text x="120" y="500" class="sans" fill="#aaa9a5" font-size="28">Ramallah · seized 18 August 2026 · no charge announced</text>
  <text x="120" y="548" class="arabic" fill="#aaa9a5" font-size="28">رام الله · اعتُقلت في 18 آب/أغسطس 2026 · بلا تهمة معلنة</text>
  <text x="120" y="800" class="sans" fill="#aaa9a5" font-size="26" letter-spacing="4">TIMES OF PALESTINE</text>
</svg>

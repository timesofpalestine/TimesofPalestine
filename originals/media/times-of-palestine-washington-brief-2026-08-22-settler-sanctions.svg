<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What Washington can actually do to a violent settler</title>
  <desc id="desc">A bilingual status board of the four American instruments for penalising violent Israeli settlers — Executive Order 14115 sanctions, Treasury designations, visa ineligibility and pending legislation — with the date each was revoked, unwound, blunted or stalled, set against the siege of Qusra that began on 9 August 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f2eee8}
      .muted{fill:#aaa9a5}
      .gold{fill:#c7a86b}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:16px}
      .small{font-size:19px}
      .body{font-size:22px}
      .label{font-size:17px;font-weight:800;letter-spacing:1.2px}
      .name{font-size:26px;font-weight:800}
      .huge{font-size:40px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="90" y="76" class="serif ivory" font-size="48" font-weight="800">What Washington can actually do to a violent settler</text>
  <text x="90" y="118" class="sans muted body">The four American instruments, and the date each one stopped working</text>
  <text x="1520" y="76" class="arabic ivory" font-size="34" font-weight="800" text-anchor="end">ما تستطيع واشنطن فعله بمستوطن عنيف</text>
  <text x="1520" y="112" class="arabic muted small" text-anchor="end">أربع أدوات أميركية.. وتاريخ توقّف كل واحدة</text>

  <line x1="90" y1="146" x2="1520" y2="146" stroke="#3a3b40" stroke-width="2"/>

  <g filter="url(#shadow)">
    <rect x="90" y="180" width="340" height="392" rx="18" fill="#27282c" stroke="#dc6572" stroke-width="3"/>
    <text x="116" y="222" class="sans red label">REVOKED · ملغى</text>
    <text x="116" y="262" class="sans ivory name">Executive Order</text>
    <text x="116" y="292" class="sans ivory name">14115</text>
    <text x="116" y="326" class="arabic muted small">الأمر التنفيذي 14115</text>
    <text x="116" y="372" class="sans muted small">Signed by Biden</text>
    <text x="116" y="400" class="sans gold body">1 Feb 2024</text>
    <text x="116" y="440" class="sans muted small">Revoked by Trump</text>
    <text x="116" y="468" class="sans red huge">20 Jan 2025</text>
    <text x="116" y="512" class="sans muted tiny">Asset freezes on settlers who</text>
    <text x="116" y="534" class="sans muted tiny">undermine West Bank stability</text>
    <text x="404" y="558" class="arabic muted tiny" text-anchor="end">تجميد أصول المستوطنين</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="450" y="180" width="340" height="392" rx="18" fill="#27282c" stroke="#dc6572" stroke-width="3"/>
    <text x="476" y="222" class="sans red label">UNWOUND · شُطبت</text>
    <text x="476" y="262" class="sans ivory name">Treasury</text>
    <text x="476" y="292" class="sans ivory name">designations</text>
    <text x="476" y="326" class="arabic muted small">إدراجات وزارة الخزانة</text>
    <text x="476" y="372" class="sans muted small">Delisted by OFAC</text>
    <text x="476" y="400" class="sans red huge">24 Jan 2025</text>
    <text x="476" y="452" class="sans gold" font-size="34" font-weight="800">17</text>
    <text x="514" y="452" class="sans muted small">Israeli individuals</text>
    <text x="476" y="490" class="sans gold" font-size="34" font-weight="800">9</text>
    <text x="510" y="490" class="sans muted small">Israeli entities</text>
    <text x="476" y="524" class="sans muted tiny">and one Palestinian organisation;</text>
    <text x="476" y="546" class="sans muted tiny">all blocked property unblocked</text>
    <text x="764" y="558" class="arabic muted tiny" text-anchor="end">ورُفع التجميد عن أموالهم</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="810" y="180" width="340" height="392" rx="18" fill="#27282c" stroke="#c7a86b" stroke-width="3"/>
    <text x="836" y="222" class="sans gold label">BLUNTED · مُفرَّغة</text>
    <text x="836" y="262" class="sans ivory name">Visa</text>
    <text x="836" y="292" class="sans ivory name">ineligibility</text>
    <text x="836" y="326" class="arabic muted small">منع منح التأشيرة</text>
    <text x="836" y="372" class="sans muted small">State Dept policy since</text>
    <text x="836" y="400" class="sans gold body">Dec 2023 · INA 212(a)(3)(C)</text>
    <text x="836" y="440" class="sans muted small">Israel joined the Visa Waiver</text>
    <text x="836" y="466" class="sans muted small">Program</text>
    <text x="836" y="500" class="sans gold" font-size="30" font-weight="800">19 Oct 2023</text>
    <text x="836" y="534" class="sans muted tiny">Most Israelis now travel on ESTA,</text>
    <text x="836" y="556" class="sans muted tiny">not on a visa. No name published.</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1170" y="180" width="340" height="392" rx="18" fill="#27282c" stroke="#61aa80" stroke-width="3"/>
    <text x="1196" y="222" class="sans green label">STALLED · معطّلة</text>
    <text x="1196" y="262" class="sans ivory name">Bills in</text>
    <text x="1196" y="292" class="sans ivory name">committee</text>
    <text x="1196" y="326" class="arabic muted small">مشروعا قانون في اللجنة</text>
    <text x="1196" y="372" class="sans muted small">West Bank Violence</text>
    <text x="1196" y="396" class="sans muted small">Prevention Act · 28 Apr 2025</text>
    <text x="1196" y="432" class="sans green" font-size="30" font-weight="800">100 cosponsors</text>
    <text x="1196" y="460" class="sans muted tiny">Markup requested 10 Nov 2025 — none held</text>
    <text x="1196" y="500" class="sans muted small">Ceasefire Compliance</text>
    <text x="1196" y="524" class="sans muted small">Act · 23 Feb 2026</text>
    <text x="1196" y="556" class="sans green" font-size="26" font-weight="800">25 cosponsors</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="90" y="614" width="1420" height="196" rx="18" fill="#212226" stroke="#8a1f2d" stroke-width="2"/>
    <text x="120" y="658" class="sans gold label">THE CASE IN FRONT OF THEM · الحالة المعروضة</text>
    <text x="120" y="702" class="serif ivory" font-size="30" font-weight="800">Qusra, occupied West Bank — three families besieged since 9 August 2026</text>
    <text x="120" y="742" class="sans muted body">Day 14 on 22 August. No Israeli arrests announced. One home belongs to a US citizen.</text>
    <text x="120" y="784" class="sans muted small">Ambassador Mike Huckabee, 20 August: settlers could face sanctions — "not aware that any such measures are under consideration".</text>
    <text x="1480" y="702" class="arabic ivory" font-size="26" font-weight="800" text-anchor="end">قصرة: ثلاث عائلات محاصرة منذ 9 آب/أغسطس 2026</text>
    <text x="1480" y="740" class="arabic muted small" text-anchor="end">اليوم الرابع عشر في 22 آب.. ولا اعتقالات إسرائيلية معلنة</text>
    <text x="1480" y="776" class="arabic muted small" text-anchor="end">هاكابي: عقوبات محتملة «لا أعلم بأي إجراء قيد الدراسة»</text>
  </g>

  <text x="90" y="864" class="sans muted tiny">Times of Palestine · Washington Brief, 22 August 2026 · Sources named inline in the report</text>
  <text x="1520" y="864" class="arabic muted tiny" text-anchor="end">تايمز أوف فلسطين · موجز واشنطن، 22 آب/أغسطس 2026</text>
</svg>

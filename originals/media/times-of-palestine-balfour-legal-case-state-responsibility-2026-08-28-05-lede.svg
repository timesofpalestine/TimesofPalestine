<circle cx="660" cy="560" r="15" fill="#59a97d"/>
<circle cx="1400" cy="560" r="15" fill="#C8102E"/>

<text x="622" y="470" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#c7a86b">8 SEPTEMBER 2025</text>
<text x="622" y="506" font-family="'Libre Franklin',Arial,sans-serif" font-size="23" fill="#f2eee8">Petition delivered to Downing Street</text>
<text x="622" y="534" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">&#1578;&#1587;&#1604;&#1610;&#1605; &#1575;&#1604;&#1593;&#1585;&#1610;&#1590;&#1577; &#1573;&#1604;&#1609; &#1583;&#1575;&#1608;&#1606;&#1610;&#1606;&#1594; &#1587;&#1578;&#1585;&#1610;&#1578;</text>

<text x="912" y="624" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" letter-spacing="2" fill="#aaa9a5">TEN MONTHS &#183; NO GOVERNMENT RESPONSE</text>
<text x="912" y="656" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#6d6c69">&#1593;&#1588;&#1585;&#1577; &#1571;&#1588;&#1607;&#1585; &#1583;&#1608;&#1606; &#1585;&#1583; &#1581;&#1603;&#1608;&#1605;&#1610;</text>

<text x="1188" y="470" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#c7a86b">SEPTEMBER</text>
<text x="1188" y="506" font-family="'Libre Franklin',Arial,sans-serif" font-size="23" fill="#f2eee8" textLength="396" lengthAdjust="spacingAndGlyphs">Petitioners go to the High Court</text>
<text x="1188" y="534" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">&#1575;&#1604;&#1604;&#1580;&#1608;&#1569; &#1573;&#1604;&#1609; &#1575;&#1604;&#1605;&#1581;&#1603;&#1605;&#1577; &#1575;&#1604;&#1593;&#1604;&#1610;&#1575;</text>

<!-- data chips -->
<rect x="620" y="700" width="286" height="118" rx="6" fill="#f2eee8" opacity="0.05" stroke="#3a3b3e" stroke-width="2"/>
<text x="644" y="756" font-family="'Source Serif 4',Georgia,serif" font-size="44" fill="#c7a86b">7</text>
<text x="700" y="742" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">requests made of</text>
<text x="700" y="766" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">the government</text>
<text x="644" y="798" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#aaa9a5">&#1587;&#1576;&#1593;&#1577; &#1605;&#1591;&#1575;&#1604;&#1576;</text>

<rect x="930" y="700" width="286" height="118" rx="6" fill="#f2eee8" opacity="0.05" stroke="#3a3b3e" stroke-width="2"/>
<text x="954" y="756" font-family="'Source Serif 4',Georgia,serif" font-size="44" fill="#c7a86b">14</text>
<text x="1030" y="742" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">Palestinian</text>
<text x="1030" y="766" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">petitioners</text>
<text x="954" y="798" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#aaa9a5">&#1571;&#1585;&#1576;&#1593;&#1577; &#1593;&#1588;&#1585; &#1605;&#1602;&#1583;&#1605;&#1611;&#1575;</text>

<rect x="1240" y="700" width="300" height="118" rx="6" fill="#f2eee8" opacity="0.05" stroke="#3a3b3e" stroke-width="2"/>
<text x="1264" y="752" font-family="'Source Serif 4',Georgia,serif" font-size="38" fill="#c7a86b">1917&#8211;1948</text>
<text x="1264" y="780" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">British conduct in Palestine</text>
<text x="1264" y="806" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#aaa9a5">&#1587;&#1604;&#1608;&#1603; &#1576;&#1585;&#1610;&#1591;&#1575;&#1606;&#1610;&#1575; &#1601;&#1610; &#1601;&#1604;&#1587;&#1591;&#1610;&#1606;</text>

<!-- archival note -->
<text x="620" y="352" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#59a97d">THE ARCHIVAL POINT</text>
<text x="620" y="392" font-family="'Source Serif 4',Georgia,serif" font-size="24" fill="#f2eee8">League of Nations Council, 29 September 1923:</text>
<text x="620" y="424" font-family="'Source Serif 4',Georgia,serif" font-size="24" fill="#c7a86b">the minutes record that it &#8220;noted&#8221; the mandates.</text>
</svg>
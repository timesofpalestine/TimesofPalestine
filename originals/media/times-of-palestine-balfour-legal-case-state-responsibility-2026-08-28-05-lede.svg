<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Britain leaves Palestinian Balfour petition unanswered</title>
<desc id="dsc">Illustration of the 424-page legal petition delivered to Downing Street on 8 September 2025, stamped "no reply", beside a timeline running from delivery through ten months of government silence to the petitioners' September deadline for going to the High Court. Data chips note seven requests made of the government, fourteen Palestinian petitioners and the 1917 to 1948 period of British conduct in Palestine.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#f2eee8"/>
<stop offset="1" stop-color="#ded9d1"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="90" y="88" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="4" fill="#c7a86b">TIMES OF PALESTINE  ·  LEGAL DESK</text>
<text x="90" y="152" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">Britain leaves Balfour petition unanswered</text>
<text x="90" y="196" font-family="'Libre Franklin',Arial,sans-serif" font-size="26" fill="#aaa9a5">A 424-page demand for apology and reparations, 1917&#8211;1948</text>
<text x="90" y="242" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#59a97d">&#1576;&#1585;&#1610;&#1591;&#1575;&#1606;&#1610;&#1575; &#1578;&#1578;&#1585;&#1603; &#1593;&#1585;&#1610;&#1590;&#1577; &#1576;&#1604;&#1601;&#1608;&#1585; &#1583;&#1608;&#1606; &#1585;&#1583;</text>
<rect x="90" y="272" width="1450" height="2" fill="#3a3b3e"/>

<!-- petition document stack -->
<rect x="202" y="312" width="290" height="430" rx="4" fill="#c7a86b" opacity="0.22"/>
<rect x="186" y="326" width="290" height="430" rx="4" fill="#f2eee8" opacity="0.28"/>
<rect x="170" y="340" width="290" height="430" rx="4" fill="url(#paper)"/>
<rect x="170" y="340" width="290" height="52" rx="4" fill="#8a1f2d"/>
<rect x="170" y="380" width="290" height="12" fill="#8a1f2d"/>
<text x="190" y="373" font-family="'Libre Franklin',Arial,sans-serif" font-size="13" letter-spacing="1.6" fill="#f2eee8">PETITION TO THE PRIME MINISTER</text>

<rect x="190" y="418" width="250" height="6" fill="#aaa9a5" opacity="0.55"/>
<rect x="190" y="436" width="228" height="6" fill="#aaa9a5" opacity="0.55"/>
<rect x="190" y="454" width="196" height="6" fill="#aaa9a5" opacity="0.55"/>

<text x="315" y="566" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="92" fill="#1d1e21">424</text>
<text x="315" y="600" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="6" fill="#8a1f2d">PAGES</text>

<g transform="rotate(-9 315 655)">
<rect x="196" y="618" width="238" height="74" rx="6" fill="none" stroke="#C8102E" stroke-width="4"/>
<text x="315" y="650" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="27" letter-spacing="3" fill="#C8102E">NO REPLY</text>
<text x="315" y="680" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#C8102E">&#1604;&#1575; &#1585;&#1583;</text>
</g>

<rect x="190" y="720" width="200" height="5" fill="#aaa9a5" opacity="0.45"/>
<rect x="190" y="736" width="150" height="5" fill="#aaa9a5" opacity="0.45"/>

<text x="170" y="800" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#c7a86b">Campaign: Britain Owes Palestine</text>
<text x="170" y="830" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5">&#1576;&#1585;&#1610;&#1591;&#1575;&#1606;&#1610;&#1575; &#1605;&#1583;&#1610;&#1606;&#1577; &#1604;&#1601;&#1604;&#1587;&#1591;&#1610;&#1606;</text>

<!-- timeline -->
<line x1="640" y1="560" x2="900" y2="560" stroke="#59a97d" stroke-width="6"/>

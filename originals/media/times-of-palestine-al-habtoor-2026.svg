<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Khalaf Al Habtoor's question: no trusteeship — justice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>
  <text x="800" y="90" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="30" letter-spacing="6">TIMES OF PALESTINE · ARAB SUPPORT</text>

  <text x="800" y="240" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="140">«</text>
  <text x="800" y="400" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,sans-serif" font-size="58" font-weight="bold">لا يحتاج إلى وصاية.. بل إلى عدالة</text>
  <text x="800" y="480" text-anchor="middle" fill="#aaa9a5" font-family="Georgia,serif" font-size="34" font-style="italic">"They do not need trusteeship — they need justice."</text>

  <line x1="640" y1="560" x2="960" y2="560" stroke="#286344" stroke-width="4"/>
  <text x="800" y="640" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,sans-serif" font-size="40" font-weight="bold">خلف الحبتور · Khalaf Al Habtoor</text>
  <text x="800" y="700" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="26">مؤسس مجموعة الحبتور — دبي · Founding chairman, Al Habtoor Group, Dubai</text>
  <text x="800" y="800" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="24">4 أغسطس/آب 2026 · on the Board of Peace وعن «مجلس السلام»</text>
  <rect x="0" y="894" width="1600" height="6" fill="#286344"/>
</svg>

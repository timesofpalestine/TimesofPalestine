<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">From a Gaza diamond to a Japanese ballpark: ten years of Palestinian baseball</title>
  <desc id="desc">A bilingual timeline of the Palestine national baseball team from its founding in Gaza in 2016 to its Asian Games debut at Aichi-Nagoya in September 2026, with the tournament ledger and the places the squad comes from.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101114"/>
      <stop offset="1" stop-color="#1c1d21"/>
    </linearGradient>
    <linearGradient id="axis" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e1e2b"/>
      <stop offset=".5" stop-color="#286344"/>
      <stop offset="1" stop-color="#bd9854"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f3efe8}
      .muted{fill:#aaa9a5}
      .gold{fill:#d4b36e}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:17px}
      .small{font-size:19px}
      .body{font-size:22px}
      .label{font-size:18px;font-weight:800;letter-spacing:1.2px}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="90" y="72" class="serif ivory" font-size="46" font-weight="800">From a Gaza diamond to a Japanese ballpark</text>
  <text x="90" y="112" class="sans muted body">Ten years of Palestinian baseball, 2016 to 2026</text>
  <text x="1540" y="152" class="arabic ivory" font-size="32" font-weight="800" text-anchor="end">من ملعب في غزة إلى ملعب في اليابان</text>
  <text x="1540" y="184" class="arabic muted small" text-anchor="end">عشر سنوات من البيسبول الفلسطيني</text>

  <line x1="120" y1="300" x2="1500" y2="300" stroke="url(#axis)" stroke-width="4"/>

  <circle cx="140" cy="300" r="9" fill="#8a1f2d" stroke="#f3efe8" stroke-width="2"/>
  <text x="140" y="272" class="sans gold" font-size="24" font-weight="800">2016</text>
  <text x="140" y="338" class="sans ivory small">Gaza plants the game</text>
  <text x="140" y="362" class="arabic muted tiny">غزة تزرع اللعبة</text>

  <circle cx="410" cy="300" r="9" fill="#8a1f2d" stroke="#f3efe8" stroke-width="2"/>
  <text x="410" y="272" class="sans gold" font-size="24" font-weight="800">2017</text>
  <text x="410" y="338" class="sans ivory small">Asian federation joined</text>
  <text x="410" y="362" class="arabic muted tiny">الانضمام للاتحاد الآسيوي</text>

  <circle cx="680" cy="300" r="9" fill="#286344" stroke="#f3efe8" stroke-width="2"/>
  <text x="680" y="272" class="sans gold" font-size="24" font-weight="800">2019</text>
  <text x="680" y="338" class="sans ivory small">World recognition won</text>
  <text x="680" y="362" class="arabic muted tiny">اعتراف دولي باللعبة</text>

  <circle cx="950" cy="300" r="9" fill="#286344" stroke="#f3efe8" stroke-width="2"/>
  <text x="950" y="272" class="sans gold" font-size="24" font-weight="800">2023</text>
  <text x="950" y="338" class="sans ivory small">First tournament abroad</text>
  <text x="950" y="362" class="arabic muted tiny">أول بطولة خارج فلسطين</text>

  <circle cx="1220" cy="300" r="9" fill="#bd9854" stroke="#f3efe8" stroke-width="2"/>
  <text x="1220" y="272" class="sans gold" font-size="24" font-weight="800">2025</text>
  <text x="1220" y="338" class="sans ivory small">West Asia Cup lifted</text>
  <text x="1220" y="362" class="arabic muted tiny">رفع كأس غرب آسيا</text>

  <circle cx="1490" cy="300" r="11" fill="#dc6572" stroke="#f3efe8" stroke-width="2"/>
  <text x="1490" y="272" class="sans gold" font-size="24" font-weight="800" text-anchor="end">2026</text>
  <text x="1490" y="338" class="sans ivory small" text-anchor="end">Asian Games debut</text>
  <text x="1490" y="362" class="arabic muted tiny" text-anchor="end">أول ظهور في الآسياد</text>

  <g filter="url(#shadow)">
    <rect x="70" y="400" width="700" height="450" rx="18" fill="#27282c" stroke="#d4b36e" stroke-width="2"/>
    <text x="100" y="444" class="sans gold label">AICHI-NAGOYA 2026: THE LEDGER</text>
    <text x="740" y="444" class="arabic muted small" text-anchor="end">سجل آسياد آيتشي-ناغويا</text>

    <text x="100" y="498" class="sans ivory body">Philippines</text>
    <text x="470" y="498" class="sans ivory body" font-weight="700">0 – 12</text>
    <text x="740" y="498" class="sans muted small" text-anchor="end">21 Sep</text>

    <text x="100" y="556" class="sans ivory body">Japan</text>
    <text x="470" y="556" class="sans ivory body" font-weight="700">0 – 15</text>
    <text x="740" y="556" class="sans muted small" text-anchor="end">22 Sep</text>

    <text x="100" y="614" class="sans ivory body">China</text>
    <text x="470" y="614" class="sans ivory body" font-weight="700">1 – 9</text>
    <text x="740" y="614" class="sans muted small" text-anchor="end">23 Sep</text>

    <rect x="86" y="646" width="668" height="44" rx="8" fill="#1d3a2a"/>
    <text x="100" y="676" class="sans green body" font-weight="700">Hong Kong</text>
    <text x="470" y="676" class="sans green body" font-weight="700">7 – 2</text>
    <text x="740" y="676" class="sans green small" text-anchor="end">25 Sep · first win</text>

    <text x="100" y="730" class="sans ivory body">Thailand</text>
    <text x="470" y="730" class="sans ivory body" font-weight="700">0 – 1</text>
    <text x="740" y="730" class="sans muted small" text-anchor="end">26 Sep · 10 innings</text>

    <line x1="100" y1="764" x2="740" y2="764" stroke="#3a3b40" stroke-width="2"/>
    <text x="100" y="796" class="sans ivory small">Final placing: eighth of eight teams</text>
    <text x="100" y="822" class="arabic muted tiny">المركز الثامن من ثماني دول</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="830" y="400" width="700" height="450" rx="18" fill="#27282c" stroke="#61aa80" stroke-width="2"/>
    <text x="860" y="444" class="sans green label">WHERE THE SQUAD COMES FROM</text>
    <text x="1500" y="444" class="arabic muted small" text-anchor="end">من أين يأتي اللاعبون</text>

    <text x="860" y="492" class="sans gold label">GAZA</text>
    <text x="1500" y="492" class="arabic gold small" text-anchor="end">غزة</text>
    <text x="860" y="526" class="sans ivory body">About 1,500 registered players before the war</text>
    <text x="860" y="552" class="arabic muted tiny">نحو 1500 لاعب ولاعبة قبل الحرب</text>
    <text x="860" y="586" class="sans ivory body">The one field, at al-Shati camp, is gone</text>
    <text x="860" y="612" class="arabic muted tiny">الملعب الوحيد في مخيم الشاطئ لم يعد قائماً</text>

    <line x1="860" y1="638" x2="1500" y2="638" stroke="#3a3b40" stroke-width="2"/>

    <text x="860" y="674" class="sans gold label">COOK COUNTY, ILLINOIS</text>
    <text x="1500" y="674" class="arabic gold small" text-anchor="end">مقاطعة كوك</text>
    <text x="860" y="708" class="sans ivory body">More Palestinians than any other US county</text>
    <text x="860" y="734" class="arabic muted tiny">أكبر تجمع فلسطيني بين المقاطعات الأميركية</text>
    <text x="860" y="768" class="sans ivory body">Seven of the 2025 squad live in four towns</text>
    <text x="860" y="794" class="arabic muted tiny">سبعة من تشكيلة 2025 من أربع بلدات</text>
    <text x="860" y="826" class="sans muted small">Palos Park · Palos Hills · Oak Lawn · Orland Park</text>
  </g>

  <text x="90" y="882" class="sans muted tiny">Times of Palestine · research: Asian Games results, World Baseball Softball Confederation, Al-Raya, WBEZ Chicago</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">France PAUSE programme and Gaza applications, 2025–2026</title>
  <desc id="desc">Bilingual timeline of Gaza laureate evacuations, the application suspension, the July 2026 court order, France's September objective and the next application deadline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".35"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .muted{fill:#aaa9a5}
      .ivory{fill:#f2eee8}
      .small{font-size:19px}
      .body{font-size:22px}
      .date{font-size:20px;font-weight:800;letter-spacing:1px}
      .card-title{font-size:26px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <text x="90" y="90" class="serif ivory" font-size="42" font-weight="800">Selected for safety — but unable to leave</text>
  <text x="1510" y="90" class="arabic ivory" font-size="34" font-weight="800" text-anchor="end">اختيار للحماية — لكن من دون طريق للمغادرة</text>
  <text x="90" y="132" class="sans muted body">France’s PAUSE programme and Gaza, 2025–2026</text>
  <text x="1510" y="132" class="arabic muted body" text-anchor="end">برنامج «بوز» الفرنسي وغزة، 2025–2026</text>

  <line x1="125" y1="470" x2="1475" y2="470" stroke="#f2eee8" stroke-opacity=".5" stroke-width="6"/>

  <g filter="url(#shadow)">
    <rect x="70" y="205" width="330" height="205" rx="16" fill="#27282c" stroke="#286344" stroke-width="3"/>
    <text x="100" y="250" class="sans" fill="#59a97d" font-size="19" font-weight="800">16 &amp; 23 APR 2025</text>
    <text x="100" y="292" class="sans ivory card-title">About 20 laureates</text>
    <text x="100" y="325" class="sans muted small">evacuated with families</text>
    <text x="370" y="365" class="arabic muted small" text-anchor="end">إجلاء نحو 20 فائزاً</text>
    <text x="370" y="392" class="arabic muted small" text-anchor="end">مع عائلاتهم</text>
  </g>
  <circle cx="235" cy="470" r="16" fill="#286344"/>

  <g filter="url(#shadow)">
    <rect x="430" y="525" width="330" height="205" rx="16" fill="#27282c" stroke="#8a1f2d" stroke-width="3"/>
    <text x="460" y="570" class="sans" fill="#d65b69" font-size="19" font-weight="800">JAN 2026</text>
    <text x="460" y="612" class="sans ivory card-title">Gaza reviews paused</text>
    <text x="460" y="645" class="sans muted small">Evacuation said to be</text>
    <text x="460" y="674" class="sans muted small">impossible in the short term</text>
    <text x="730" y="710" class="arabic muted small" text-anchor="end">تعليق دراسة طلبات غزة</text>
  </g>
  <circle cx="595" cy="470" r="16" fill="#8a1f2d"/>

  <g filter="url(#shadow)">
    <rect x="790" y="205" width="330" height="205" rx="16" fill="#27282c" stroke="#c7a86b" stroke-width="3"/>
    <text x="820" y="250" class="sans" fill="#c7a86b" font-size="19" font-weight="800">17 JUL 2026</text>
    <text x="820" y="292" class="sans ivory card-title">Emergency case rejected</text>
    <text x="820" y="325" class="sans muted small">Urgency test not met;</text>
    <text x="820" y="354" class="sans muted small">legality not decided</text>
    <text x="1090" y="392" class="arabic muted small" text-anchor="end">رفض الاستعجال دون حسم القانونية</text>
  </g>
  <circle cx="955" cy="470" r="16" fill="#c7a86b"/>

  <g filter="url(#shadow)">
    <rect x="1150" y="525" width="380" height="205" rx="16" fill="#27282c" stroke="#286344" stroke-width="3"/>
    <text x="1180" y="570" class="sans" fill="#59a97d" font-size="19" font-weight="800">END AUG–24 SEP 2026</text>
    <text x="1180" y="612" class="sans ivory card-title">Next general call</text>
    <text x="1180" y="645" class="sans muted small">France hopes evacuations</text>
    <text x="1180" y="674" class="sans muted small">can resume by September</text>
    <text x="1500" y="710" class="arabic muted small" text-anchor="end">دورة جديدة وهدف لاستئناف الإجلاء</text>
  </g>
  <circle cx="1340" cy="470" r="16" fill="#286344"/>

  <text x="90" y="820" class="sans muted" font-size="18">Court outcome: emergency relief denied; equality and discrimination arguments were not decided.</text>
  <text x="1510" y="820" class="arabic muted" font-size="18" text-anchor="end">نتيجة المحكمة: رفض التدخل العاجل من دون الفصل في حجج المساواة والتمييز</text>
  <text x="90" y="858" class="sans muted" font-size="16">Sources: Conseil d’État; France Diplomatie; PAUSE; SNCS-FSU. Graphic: Times of Palestine.</text>
  <text x="1510" y="858" class="arabic muted" font-size="16" text-anchor="end">المصادر: مجلس الدولة، الخارجية الفرنسية، بوز، واتحاد الباحثين الفرنسي</text>
</svg>

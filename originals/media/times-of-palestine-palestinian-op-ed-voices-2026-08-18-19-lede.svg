<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Abbas sets 350 Palestinian National Council seats — 200 for the territories, 150 for the diaspora, with appointment allowed where voting fails</title>
<desc id="dsc">Chart of the ratified electoral system: forty solid green circles represent 200 seats for a single constituency covering the Palestinian territories; thirty dashed gold circles represent 150 seats for Palestinians abroad. Each circle equals five seats. A side panel lists the three fallback routes where elections cannot be held in a diaspora area: electoral college, consensus among the Palestinian components present there, or consensus and appointment.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="90" y="86" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" letter-spacing="3.2" fill="#c7a86b">PALESTINIAN NATIONAL COUNCIL · ELECTORAL SYSTEM RATIFIED 4 JUNE</text>

<text x="90" y="152" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">Abbas fixes the council at 350 seats — 150 abroad,</text>
<text x="90" y="206" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">and where voting fails, seats may be appointed</text>

<text x="90" y="256" font-family="Cairo,Arial,sans-serif" font-size="28" fill="#aaa9a5">عباس يثبّت 350 مقعداً: 150 للشتات</text>
<text x="90" y="294" font-family="Cairo,Arial,sans-serif" font-size="28" fill="#aaa9a5">وحيث يتعذّر التصويت تُملأ المقاعد بالتعيين</text>

<line x1="90" y1="318" x2="1545" y2="318" stroke="#3a3b3f" stroke-width="1.5"/>

<!-- Block A label -->
<text x="128" y="366" font-family="'Libre Franklin',Arial,sans-serif" font-size="42" font-weight="700" fill="#59a97d">200</text>
<text x="232" y="352" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2.4" fill="#f2eee8">SEATS · TERRITORIES</text>
<text x="232" y="374" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" letter-spacing="1.6" fill="#aaa9a5">ONE CONSTITUENCY · ELECTED</text>
<text x="128" y="400" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">200 مقعد · دائرة واحدة</text>

<!-- Block B label -->
<text x="738" y="366" font-family="'Libre Franklin',Arial,sans-serif" font-size="42" font-weight="700" fill="#c7a86b">150</text>
<text x="842" y="352" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2.4" fill="#f2eee8">SEATS · ABROAD</text>
<text x="842" y="374" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" letter-spacing="1.6" fill="#aaa9a5">MAY BE APPOINTED</text>
<text x="738" y="400" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">150 مقعد · الشتات</text>

<!-- 40 solid dots = 200 seats -->
<g fill="#286344" stroke="#59a97d" stroke-width="2.5">
<circle cx="150" cy="440" r="22"/><circle cx="212" cy="440" r="22"/><circle cx="274" cy="440" r="22"/><circle cx="336" cy="440" r="22"/><circle cx="398" cy="440" r="22"/><circle cx="460" cy="440" r="22"/><circle cx="522" cy="440" r="22"/><circle cx="584" cy="440" r="22"/>
<circle cx="150" cy="502" r="22"/><circle cx="212" cy="502" r="22"/><circle cx="274" cy="502" r="22"/><circle cx="336" cy="502" r="22"/><circle cx="398" cy="502" r="22"/><circle cx="460" cy="502" r="22"/><circle cx="522" cy="502" r="22"/><circle cx="584" cy="502" r="22"/>
<circle cx="150" cy="564" r="22"/><circle cx="212" cy="564" r="22"/><circle cx="274" cy="564" r="22"/><circle cx="336" cy="564" r="22"/><circle cx="398" cy="564" r="22"/><circle cx="460" cy="564" r="22"/><circle cx="522" cy="564" r="22"/><circle cx="584" cy="564" r="22"/>
<circle cx="150" cy="626" r="22"/><circle cx="212" cy="626" r="22"/><circle cx="274" cy="626" r="22"/><circle cx="336" cy="626" r="22"/><circle cx="398" cy="626" r="22"/><circle cx="460" cy="626" r="22"/><circle cx="522" cy="626" r="22"/><circle cx="584" cy="626" r="22"/>
<circle cx="150" cy="688" r="22"/><circle cx="212" cy="688" r="22"/><circle cx="274" cy="688" r="22"/><circle cx="336" cy="688" r="22"/><circle cx="398" cy="688" r="22"/><circle cx="460" cy="688" r="22"/><circle cx="522" cy="688" r="22"/><circle cx="584" cy="688" r="22"/>
</g>

<line x1="666" y1="420" x2="666" y2="712" stroke="#3a3b3f" stroke-width="1.5"/>

<!-- 30 dashed rings = 150 seats -->
<g fill="none" stroke="#c7a86b" stroke-width="3" stroke-dasharray="5 6">
<circle cx="738" cy="440" r="22"/><circle cx="800" cy="440" r="22"/><circle cx="862" cy="440" r="22"/><circle cx="924" cy="440" r="22"/><circle cx="986" cy="440" r="22"/><circle cx="1048" cy="440" r="22"/>
<circle cx="738" cy="502" r="22"/><circle cx="800" cy="502" r="22"/><circle cx="862" cy="502" r="22"/><circle cx="924" cy="502" r="22"/><circle cx="986" cy="502" r="22"/><circle cx="1048" cy="502" r="22"/>
<circle cx="738" cy="564" r="22"/><circle cx="800" cy="564" r="22"/><circle cx="862" cy="564" r="22"/><circle cx="924" cy="564" r="22"/><circle cx="986" cy="564" r="22"/><circle cx="1048" cy="564" r="22"/>
<circle cx="738" cy="626" r="22"/><circle cx="800" cy="626" r="22"/><circle cx="862" cy="626" r="22"/><circle cx="924" cy="626" r="22"/><circle cx="986" cy="626" r="22"/><circle cx="1048" cy="626" r="22"/>
<circle cx="738" cy="688" r="22"/><circle cx="800" cy="688" r="22"/><circle cx="862" cy="688" r="22"/><circle cx="924" cy="688" r="22"/><circle cx="986" cy="688" r="22"/><circle cx="1048" cy="688" r="22"/>
</g>

<text x="128" y="756" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Each circle = 5 seats · كل دائرة = 5 مقاعد</text>

<!-- fallback panel -->
<rect x="1120" y="330" width="425" height="430" rx="10" fill="#17181b" stroke="#3a3b3f" stroke-width="1.5"/>
<rect x="1120" y="330" width="425" height="6" rx="3" fill="#8a1f2d"/>

<text x="1152" y="382" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2.2" fill="#f2eee8">WHERE ELECTIONS CANNOT</text>
<text x="1152" y="408" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2.2" fill="#f2eee8">BE HELD, SEATS FILLED BY</text>
<text x="1152" y="444" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#c7a86b">حيث يتعذّر إجراء الانتخابات</text>

<text x="1152" y="504" font-family="'Source Serif 4',Georgia,serif" font-size="26" fill="#c7a86b">1</text>
<text x="1188" y="504" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Electoral college</text>
<text x="1188" y="530" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5">الكلية الانتخابية</text>

<text x="1152" y="586" font-family="'Source Serif 4',Georgia,serif" font-size="26" fill="#c7a86b">2</text>
<text x="1188" y="586" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Consensus among the</text>
<text x="1188" y="612" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">components present there</text>
<text x="1188" y="638" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5">بالتوافق بين المكوّنات</text>

<text x="1152" y="694" font-family="'Source Serif 4',Georgia,serif" font-size="26" fill="#c7a86b">3</text>
<text x="1188" y="694" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Consensus and appointment</text>
<text x="1188" y="720" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5">بالتوافق والتعيين</text>

<line x1="90" y1="792" x2="1545" y2="792" stroke="#3a3b3f" stroke-width="1.5"/>
<text x="90" y="828" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Council fixed at 350 members · no reduction of diaspora seats · 32 sessions since 1964, none elected</text>
<text x="90" y="862" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5">المجلس 350 عضواً · 32 دورة منذ 1964 دون انتخابات · النظام المنشور عن الرئاسة</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The hidden economic cost of violence against women</title>
  <desc id="d">Editorial illustration of an open public ledger, a stopped work clock and an empty chair, representing household, work, care and service costs. No survivor is depicted. English and Arabic labels.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient><style>.e{font-family:Arial,sans-serif}.a{font-family:Cairo,Arial,sans-serif}.iv{fill:#f2eee8}.mu{fill:#aaa9a5}.go{fill:#c7a86b}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="22" height="900" fill="#8a1f2d"/><rect x="22" width="8" height="900" fill="#286344"/>
  <text x="75" y="85" class="e iv" font-size="42" font-weight="800">HER STORY · THE PUBLIC COST OF VIOLENCE</text><text x="1525" y="85" class="a iv" font-size="36" font-weight="700" text-anchor="end">حكايتها · الكلفة العامة للعنف</text>
  <text x="75" y="130" class="e mu" font-size="24">An annual loss carried by households, work, unpaid care and public services</text><text x="1525" y="166" class="a mu" font-size="22" text-anchor="end">خسارة سنوية تحملها الأسر والعمل والرعاية والخدمات العامة</text>
  <g transform="translate(180 255)"><path d="M0 80 Q250 10 500 80 V470 Q250 400 0 470Z" fill="#ede6da"/><path d="M500 80 Q750 10 1000 80 V470 Q750 400 500 470Z" fill="#e2d7c7"/><path d="M500 80V470" stroke="#8a1f2d" stroke-width="8"/><g stroke="#8c8479" stroke-width="3"><path d="M70 150H430M70 215H430M70 280H430M570 150H930M570 215H930M570 280H930"/></g><text x="250" y="360" class="e" fill="#8a1f2d" font-size="72" font-weight="800" text-anchor="middle">297.45m</text><text x="750" y="360" class="a" fill="#286344" font-size="58" font-weight="800" text-anchor="middle">مليون شيكل سنوياً</text></g>
  <g transform="translate(1220 340)"><circle cx="120" cy="120" r="112" fill="none" stroke="#c7a86b" stroke-width="18"/><path d="M120 120L120 48M120 120L190 154" stroke="#f2eee8" stroke-width="16" stroke-linecap="round"/><path d="M40 300h160v30H40zM62 330v155M178 330v155" fill="none" stroke="#aaa9a5" stroke-width="16"/></g>
  <text x="75" y="825" class="e go" font-size="22">EDITORIAL ILLUSTRATION · NO SURVIVOR DEPICTED · TIMES OF PALESTINE</text><text x="1525" y="825" class="a go" font-size="21" text-anchor="end">رسم تحريري لا يصوّر أي ناجية · تايمز أوف فلسطين</text>
</svg>

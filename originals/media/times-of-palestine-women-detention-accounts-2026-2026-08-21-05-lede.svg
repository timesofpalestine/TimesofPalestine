<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
  <title id="ttl">Ninety Palestinian women held in Israeli prisons, April 2026</title>
  <desc id="dsc">A grid of 90 figures represents the number of Palestinian women held by Israel, reported by the Palestinian Prisoners' Club on 22 April 2026. Highlighted subsets show 25 administrative detainees, 3 journalists, 2 girls, and 3 women in medical danger — 2 with cancer and 1 pregnant in her third month. Most are held in Damon prison in northern Israel. A quote from Khalida Jarrar, released 19 January 2025, reads: "I was shut inside a grave."</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <g id="w">
      <circle cx="15" cy="9" r="8.5"/>
      <path d="M15 21c-8.5 0-13 5.5-13 13.5V45h26V34.5C28 26.5 23.5 21 15 21z"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <text x="90" y="66" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" letter-spacing="3.5" fill="#c7a86b">PRISONERS &#183; 22 APRIL 2026</text>

  <text x="90" y="126" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">Israel holds 90 Palestinian women</text>
  <text x="90" y="184" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#aaa9a5">as freed detainees describe abuse</text>
  <text x="90" y="234" font-family="Cairo,Arial,sans-serif" font-size="32" fill="#59a97d" text-anchor="start">&#1573;&#1587;&#1585;&#1575;&#1574;&#1610;&#1604; &#1578;&#1581;&#1578;&#1580;&#1586; 90 &#1571;&#1587;&#1610;&#1585;&#1577; &#1601;&#1604;&#1587;&#1591;&#1610;&#1606;&#1610;&#1577; &#1608;&#1605;&#1581;&#1585;&#1617;&#1585;&#1575;&#1578; &#1610;&#1585;&#1608;&#1610;&#1606; &#1575;&#1604;&#1575;&#1606;&#1578;&#1607;&#1575;&#1603;&#1575;&#1578;</text>

  <line x1="90" y1="258" x2="1500" y2="258" stroke="#33353a" stroke-width="2"/>

  <text x="90" y="290" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Each figure = one woman held</text>
  <text x="410" y="290" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start">&#1603;&#1604; &#1585;&#1605;&#1586; = &#1571;&#1587;&#1610;&#1585;&#1577; &#1608;&#1575;&#1581;&#1583;&#1577;</text>


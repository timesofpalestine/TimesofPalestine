  </g>

  <line x1="700" y1="296" x2="700" y2="800" stroke="#33353a" stroke-width="2"/>

  <!-- legend -->
  <text x="750" y="316" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="2.5" fill="#c7a86b">WHO THEY ARE</text>
  <text x="1000" y="316" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#c7a86b" text-anchor="start">&#1605;&#1614;&#1606; &#1607;&#1606;&#1617;</text>

  <g fill="#c7a86b"><use href="#w" x="750" y="348"/></g>
  <text x="800" y="372" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" fill="#f2eee8">25 held in administrative detention, no charge</text>
  <text x="800" y="400" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5" text-anchor="start">25 &#1585;&#1607;&#1606; &#1575;&#1604;&#1575;&#1593;&#1578;&#1602;&#1575;&#1604; &#1575;&#1604;&#1573;&#1583;&#1575;&#1585;&#1610; &#1576;&#1604;&#1575; &#1578;&#1607;&#1605;&#1577;</text>

  <g fill="#C8102E"><use href="#w" x="750" y="426"/></g>
  <text x="800" y="450" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" fill="#f2eee8">3 journalists</text>
  <text x="800" y="478" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5" text-anchor="start">3 &#1589;&#1581;&#1601;&#1610;&#1575;&#1578;</text>

  <g fill="#59a97d"><use href="#w" x="750" y="504"/></g>
  <text x="800" y="528" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" fill="#f2eee8">2 girls</text>
  <text x="800" y="556" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5" text-anchor="start">&#1591;&#1601;&#1604;&#1578;&#1575;&#1606;</text>

  <g fill="#f2eee8"><use href="#w" x="750" y="582"/></g>
  <text x="800" y="606" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" fill="#f2eee8">2 with cancer, 1 pregnant (three months)</text>
  <text x="800" y="634" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5" text-anchor="start">&#1571;&#1587;&#1610;&#1585;&#1578;&#1575;&#1606; &#1605;&#1589;&#1575;&#1576;&#1578;&#1575;&#1606; &#1576;&#1575;&#1604;&#1587;&#1585;&#1591;&#1575;&#1606; &#1608;&#1581;&#1575;&#1605;&#1604; &#1601;&#1610; &#1588;&#1607;&#1585;&#1607;&#1575; &#1575;&#1604;&#1579;&#1575;&#1604;&#1579;</text>

  <line x1="750" y1="664" x2="1500" y2="664" stroke="#33353a" stroke-width="2"/>

  <text x="750" y="698" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#aaa9a5">Most are held in Damon prison, northern Israel</text>
  <text x="750" y="726" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5" text-anchor="start">&#1605;&#1593;&#1592;&#1605;&#1607;&#1606; &#1601;&#1610; &#1587;&#1580;&#1606; &#1575;&#1604;&#1583;&#1575;&#1605;&#1608;&#1606; &#1588;&#1605;&#1575;&#1604;&#1610; &#1573;&#1587;&#1585;&#1575;&#1574;&#1610;&#1604;</text>

  <rect x="750" y="752" width="6" height="88" fill="#8a1f2d"/>
  <text x="778" y="786" font-family="'Source Serif 4',Georgia,serif" font-size="30" font-style="italic" fill="#f2eee8">&#8220;I was shut inside a grave.&#8221;</text>
  <text x="778" y="816" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#c7a86b">Khalida Jarrar, released 19 January 2025</text>
  <text x="778" y="840" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start">&#1582;&#1575;&#1604;&#1583;&#1577; &#1580;&#1585;&#1575;&#1585;&#1548; &#1571;&#1601;&#1585;&#1580; &#1593;&#1606;&#1607;&#1575; &#1601;&#1610; 19 &#1610;&#1606;&#1575;&#1610;&#1585; 2025</text>

  <text x="90" y="826" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">Source: Palestinian Prisoners&#8217; Club statement, 22 April 2026</text>
  <text x="90" y="854" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">Total Palestinian and Arab prisoners: more than 9,600, early April 2026</text>
  <text x="90" y="882" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#aaa9a5" text-anchor="start">&#1575;&#1604;&#1605;&#1589;&#1583;&#1585;: &#1606;&#1575;&#1583;&#1610; &#1575;&#1604;&#1571;&#1587;&#1610;&#1585; &#1575;&#1604;&#1601;&#1604;&#1587;&#1591;&#1610;&#1606;&#1610;&#1548; 22 &#1606;&#1610;&#1587;&#1575;&#1606; 2026</text>
</svg>
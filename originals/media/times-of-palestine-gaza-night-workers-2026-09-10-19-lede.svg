<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Gaza's bread supply against WFP targets: bakeries, distribution points and people reached</title>
<desc id="dsc">Dark infographic. Three horizontal bars compare what is working in Gaza against World Food Programme targets, as reported on 8 May 2026: 17 of 25 supported bakeries operating, 44 of 145 active distribution points, and one million of a target 1.6 million people reached with family food parcels. A side panel notes that an estimated 700,000 people receive fresh bread daily. Bilingual English and Arabic labels.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="fill1" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#c7a86b"/>
<stop offset="1" stop-color="#9c8348"/>
</linearGradient>
<linearGradient id="fill2" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#59a97d"/>
<stop offset="1" stop-color="#286344"/>
</linearGradient>
<mask id="moonmask">
<rect x="1380" y="60" width="180" height="180" fill="#000"/>
<circle cx="1470" cy="150" r="46" fill="#fff"/>
<circle cx="1494" cy="136" r="40" fill="#000"/>
</mask>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<rect x="1380" y="60" width="180" height="180" fill="#c7a86b" opacity="0.45" mask="url(#moonmask)"/>

<text x="110" y="106" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" letter-spacing="5" fill="#c7a86b">GAZA · THE NIGHT SHIFT</text>

<text x="110" y="176" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">Israeli import limits shorten the night</text>
<text x="110" y="234" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">shift that feeds Gaza</text>
<text x="110" y="284" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#aaa9a5" text-anchor="start" direction="rtl">قيود الاستيراد الإسرائيلية تقصّر مناوبة الليل التي تُطعم غزة</text>

<line x1="110" y1="318" x2="1540" y2="318" stroke="#3a3b3f" stroke-width="2"/>

<!-- legend -->
<rect x="110" y="336" width="26" height="12" fill="url(#fill1)"/>
<text x="146" y="347" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">working now</text>
<rect x="290" y="336" width="26" height="12" fill="#2a2b2f" stroke="#4a4b50" stroke-width="2"/>
<text x="326" y="347" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">WFP target</text>

<!-- ROW 1 -->
<text x="110" y="404" font-family="'Libre Franklin',Arial,sans-serif" font-size="26" fill="#f2eee8">WFP-supported bakeries operating</text>
<text x="640" y="404" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5" text-anchor="start" direction="rtl">المخابز العاملة</text>
<rect x="110" y="420" width="900" height="36" fill="#2a2b2f" stroke="#4a4b50" stroke-width="2"/>
<rect x="110" y="420" width="612" height="36" fill="url(#fill1)"/>
<text x="1032" y="447" font-family="'Libre Franklin',Arial,sans-serif" font-size="28" fill="#c7a86b">17 of 25</text>

<!-- ROW 2 -->
<text x="110" y="524" font-family="'Libre Franklin',Arial,sans-serif" font-size="26" fill="#f2eee8">Active food distribution points</text>
<text x="640" y="524" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5" text-anchor="start" direction="rtl">نقاط التوزيع العاملة</text>
<rect x="110" y="540" width="900" height="36" fill="#2a2b2f" stroke="#4a4b50" stroke-width="2"/>
<rect x="110" y="540" width="273" height="36" fill="url(#fill1)"/>
<text x="1032" y="567" font-family="'Libre Franklin',Arial,sans-serif" font-size="28" fill="#c7a86b">44 of 145</text>

<!-- ROW 3 -->
<text x="110" y="644" font-family="'Libre Franklin',Arial,sans-serif" font-size="26" fill="#f2eee8">People reached, food parcels</text>
<text x="640" y="644" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5" text-anchor="start" direction="rtl">المستفيدون من الطرود الغذائية</text>
<rect x="110" y="660" width="900" height="36" fill="#2a2b2f" stroke="#4a4b50" stroke-width="2"/>
<rect x="110" y="660" width="562" height="36" fill="url(#fill2)"/>
<text x="1032" y="687" font-family="'Libre Franklin',Arial,sans-serif" font-size="28" fill="#59a97d">1m of 1.6m</text>

<!-- SIDE PANEL -->
<rect x="1210" y="380" width="330" height="316" rx="10" fill="#191a1d" stroke="#3a3b3f" stroke-width="2"/>
<ellipse cx="1375" cy="452" rx="86" ry="26" fill="#c7a86b" opacity="0.35"/>
<ellipse cx="1375" cy="436" rx="80" ry="24" fill="#c7a86b" opacity="0.6"/>
<ellipse cx="1375" cy="420" rx="72" ry="22" fill="#c7a86b"/>
<text x="1240" y="536" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">700,000</text>
<text x="1240" y="572" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">people receive fresh</text>
<text x="1240" y="598" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">bread daily</text>
<text x="1240" y="644" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#c7a86b" text-anchor="start" direction="rtl">700 ألف شخص يوميًا</text>
<text x="1240" y="674" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" text-anchor="start" direction="rtl">يحصلون على الخبز الطازج</text>

<line x1="110" y1="754" x2="1540" y2="754" stroke="#3a3b3f" stroke-width="2"/>
<text x="110" y="792" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">Nine of the working bakeries are in south and central Gaza, eight in the north.</text>
<text x="110" y="822" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">Source: WFP update distributed by UN media, 8 May 2026.</text>
<text x="110" y="856" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#8a8985" text-anchor="start" direction="rtl">المصدر: برنامج الأغذية العالمي — 8 مايو 2026</text>
</svg>
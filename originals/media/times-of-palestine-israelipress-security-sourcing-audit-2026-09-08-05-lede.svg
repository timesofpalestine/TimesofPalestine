<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Ynet audit: 15 threat reports on Israeli broadcast media, 8 built on the same template</title>
<desc id="d">A grid of 15 screen shapes represents the threat stories Ynet counted on Israeli national television and radio between 12 July and 12 August. Eight are filled dark red and marked with a question mark, standing for items built on the same template: an unnamed security source, a highly threatening scenario, almost no data on scale and no qualifying voice. A side panel lists the template elements and the survey scope of seven national television channels and six national radio stations.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="90" y="66" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="4" fill="#c7a86b">MEDIA AUDIT — ISRAEL</text>

<text x="90" y="126" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">Ynet audit finds unnamed security sources</text>
<text x="90" y="178" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">drove 15 threat reports in one month</text>
<text x="90" y="228" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#59a97d">مراجعة: 15 تقريراً عن تهديدات، 8 منها بالقالب نفسه</text>


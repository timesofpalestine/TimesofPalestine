<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Where the property-rights lens meets the Palestinian record</title>
  <desc id="desc">A bilingual comparison between the property questions Ammous emphasizes and the additional collective and legal rights established in international records.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient><style>.sans{font-family:"Libre Franklin",Arial,sans-serif}.serif{font-family:"Source Serif 4",Georgia,serif}.arabic{font-family:Cairo,Tahoma,Arial,sans-serif}.ivory{fill:#f2eee8}.gold{fill:#c7a86b}.muted{fill:#aaa9a5}.green{fill:#61aa80}.red{fill:#dc6572}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="22" height="900" fill="#8a1f2d"/><rect x="22" width="8" height="900" fill="#286344"/>
  <text x="80" y="80" class="serif ivory" font-size="51" font-weight="800">One lens, two layers of the record</text><text x="1520" y="128" text-anchor="end" direction="rtl" class="arabic gold" font-size="39" font-weight="700">عدسة واحدة وطبقتان من السجل</text>
  <rect x="85" y="185" width="680" height="535" rx="3" fill="#17211d" stroke="#286344" stroke-width="4"/><rect x="835" y="185" width="680" height="535" rx="3" fill="#231b1d" stroke="#8a1f2d" stroke-width="4"/>
  <text x="125" y="247" class="sans green" font-size="27" font-weight="800">THE PROPERTY-RIGHTS TEST ASKS</text><text x="725" y="292" text-anchor="end" direction="rtl" class="arabic ivory" font-size="29">ماذا يسأل اختبار الملكية؟</text>
  <g class="sans ivory" font-size="29"><text x="135" y="370">• Who owned the home or land?</text><text x="135" y="445">• By what rule was it taken?</text><text x="135" y="520">• Does one rule govern everyone?</text><text x="135" y="595">• Can it be restored or compensated?</text></g>
  <g class="arabic gold" font-size="25" text-anchor="end"><text x="720" y="400" direction="rtl">من كان يملك البيت أو الأرض؟</text><text x="720" y="475" direction="rtl">بأي قاعدة انتُزعت؟</text><text x="720" y="550" direction="rtl">هل تسري القاعدة نفسها على الجميع؟</text><text x="720" y="625" direction="rtl">هل يمكن الإعادة أو التعويض؟</text></g>
  <text x="875" y="247" class="sans red" font-size="27" font-weight="800">INTERNATIONAL LAW ALSO ADDS</text><text x="1475" y="292" text-anchor="end" direction="rtl" class="arabic ivory" font-size="29">ماذا يضيف القانون الدولي؟</text>
  <g class="sans ivory" font-size="29"><text x="885" y="370">• Military occupation</text><text x="885" y="445">• Forcible transfer and settlements</text><text x="885" y="520">• Refugee status and return claims</text><text x="885" y="595">• Collective self-determination</text></g>
  <g class="arabic gold" font-size="25" text-anchor="end"><text x="1470" y="400" direction="rtl">الاحتلال العسكري</text><text x="1470" y="475" direction="rtl">النقل القسري والاستيطان</text><text x="1470" y="550" direction="rtl">اللجوء ومطالبات العودة</text><text x="1470" y="625" direction="rtl">حق الشعب في تقرير المصير</text></g>
  <rect x="85" y="760" width="1430" height="55" fill="#222328"/><text x="110" y="796" class="sans muted" font-size="20">Sources: Saifedean Ammous podcast episodes 328 and 331; ICJ advisory opinion summary; UNCTAD 2024 assistance report</text>
  <text x="70" y="860" class="sans muted" font-size="18">Graphic: Times of Palestine</text><text x="1530" y="860" text-anchor="end" direction="rtl" class="arabic muted" font-size="18">غرافيك: تايمز أوف فلسطين</text>
</svg>

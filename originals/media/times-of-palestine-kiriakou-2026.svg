<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="John Kiriakou: the whistleblower's file — redacted lines, one sentence left readable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>
  <text x="800" y="88" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="30" letter-spacing="6">TIMES OF PALESTINE · ACCOUNTABILITY</text>
  <text x="800" y="156" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="54" font-weight="bold">The Whistleblower's File</text>
  <text x="800" y="212" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,sans-serif" font-size="40">ملف المبلّغ</text>

  <!-- the dossier: redacted lines, one left readable -->
  <g transform="translate(360,300)">
    <rect x="0" y="0" width="880" height="420" rx="6" fill="#17181b" stroke="#2a2b2f" stroke-width="2"/>
    <rect x="60" y="60" width="560" height="26" rx="4" fill="#0b0b0c"/>
    <rect x="60" y="112" width="720" height="26" rx="4" fill="#0b0b0c"/>
    <rect x="60" y="164" width="640" height="26" rx="4" fill="#0b0b0c"/>
    <text x="60" y="238" fill="#f2eee8" font-family="Georgia,serif" font-size="30">"I am not recruitable."</text>
    <text x="60" y="280" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="24">«أنا غير قابل للتجنيد»</text>
    <rect x="60" y="318" width="700" height="26" rx="4" fill="#0b0b0c"/>
    <rect x="60" y="370" width="480" height="26" rx="4" fill="#0b0b0c"/>
    <rect x="600" y="30" width="240" height="44" rx="4" fill="none" stroke="#8a1f2d" stroke-width="3" transform="rotate(8 720 52)"/>
    <text x="720" y="60" text-anchor="middle" fill="#8a1f2d" font-family="Tahoma,sans-serif" font-size="22" font-weight="bold" transform="rotate(8 720 52)">DECLASSIFIED</text>
  </g>

  <text x="800" y="812" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="22">أول ضابط في «سي آي إيه» يؤكد التعذيب علناً · The first CIA officer to confirm the torture publicly · 2007</text>
  <rect x="0" y="894" width="1600" height="6" fill="#286344"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Nizar Banat: a public voice and an unfinished trial</title>
  <desc id="desc">Bilingual Times of Palestine timeline showing Nizar Banat's political candidacy, the June 2021 arrest and death, the indictment of 14 officers, the family's international referral and the latest traced postponement. This is an editorial data visualization and does not depict Banat or any defendant.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1013"/><stop offset="1" stop-color="#202126"/></linearGradient>
    <style>.en{font-family:Arial,Helvetica,sans-serif}.ar{font-family:Cairo,Tahoma,Arial,sans-serif}.iv{fill:#f4f0e8}.mu{fill:#b8b6b0}.go{fill:#d1ae6b}.red{fill:#8e2434}.green{fill:#276749}.line{stroke:#d1ae6b;stroke-width:8}.thin{stroke:#706d68;stroke-width:2}</style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="24" height="900" class="red"/><rect x="24" width="8" height="900" class="green"/>
  <text x="82" y="92" class="en iv" font-size="47" font-weight="800">NIZAR BANAT · A VOICE, A DEATH, AN UNFINISHED TRIAL</text>
  <text x="1518" y="151" class="ar iv" font-size="41" font-weight="700" text-anchor="end">نزار بنات · صوتٌ ووفاة ومحاكمة بلا حسم</text>
  <text x="82" y="202" class="en mu" font-size="25">Public records reviewed through 4 August 2026 · السجلات العامة حتى 4 أغسطس/آب 2026</text>
  <line x1="145" y1="462" x2="1455" y2="462" class="line"/>
  <g>
    <circle cx="170" cy="462" r="27" class="green"/><circle cx="170" cy="462" r="10" class="iv"/>
    <text x="170" y="340" class="en go" font-size="30" font-weight="800" text-anchor="middle">2020</text>
    <text x="170" y="382" class="en iv" font-size="24" text-anchor="middle">Repeated arrests</text>
    <text x="170" y="570" class="ar iv" font-size="24" text-anchor="middle">اعتقالات متكررة</text>
  </g>
  <g>
    <circle cx="430" cy="462" r="27" class="red"/><circle cx="430" cy="462" r="10" class="iv"/>
    <text x="430" y="308" class="en go" font-size="30" font-weight="800" text-anchor="middle">MAY 2021</text>
    <text x="430" y="350" class="en iv" font-size="24" text-anchor="middle">Election postponed</text>
    <text x="430" y="384" class="en iv" font-size="24" text-anchor="middle">Home attacked</text>
    <text x="430" y="570" class="ar iv" font-size="24" text-anchor="middle">تأجيل الانتخابات</text>
    <text x="430" y="606" class="ar iv" font-size="24" text-anchor="middle">واستهداف المنزل</text>
  </g>
  <g>
    <circle cx="690" cy="462" r="32" class="red"/><circle cx="690" cy="462" r="11" class="iv"/>
    <text x="690" y="308" class="en go" font-size="30" font-weight="800" text-anchor="middle">24 JUN 2021</text>
    <text x="690" y="350" class="en iv" font-size="24" text-anchor="middle">Arrest and death</text>
    <text x="690" y="570" class="ar iv" font-size="24" text-anchor="middle">الاعتقال والوفاة</text>
  </g>
  <g>
    <circle cx="950" cy="462" r="27" class="green"/><circle cx="950" cy="462" r="10" class="iv"/>
    <text x="950" y="308" class="en go" font-size="30" font-weight="800" text-anchor="middle">SEP 2021</text>
    <text x="950" y="350" class="en iv" font-size="24" text-anchor="middle">14 officers indicted</text>
    <text x="950" y="384" class="en iv" font-size="24" text-anchor="middle">Military trial opens</text>
    <text x="950" y="570" class="ar iv" font-size="24" text-anchor="middle">اتهام 14 عنصراً</text>
    <text x="950" y="606" class="ar iv" font-size="24" text-anchor="middle">وبدء المحاكمة</text>
  </g>
  <g>
    <circle cx="1210" cy="462" r="27" class="red"/><circle cx="1210" cy="462" r="10" class="iv"/>
    <text x="1210" y="308" class="en go" font-size="30" font-weight="800" text-anchor="middle">2022</text>
    <text x="1210" y="350" class="en iv" font-size="24" text-anchor="middle">Defendants released</text>
    <text x="1210" y="384" class="en iv" font-size="24" text-anchor="middle">Family goes to ICC</text>
    <text x="1210" y="570" class="ar iv" font-size="24" text-anchor="middle">الإفراج عن المتهمين</text>
    <text x="1210" y="606" class="ar iv" font-size="24" text-anchor="middle">والعائلة تلجأ إلى الجنائية</text>
  </g>
  <g>
    <circle cx="1450" cy="462" r="32" fill="#d1ae6b"/><circle cx="1450" cy="462" r="11" fill="#101216"/>
    <text x="1450" y="308" class="en go" font-size="30" font-weight="800" text-anchor="middle">29 SEP 2025</text>
    <text x="1450" y="350" class="en iv" font-size="24" text-anchor="middle" textLength="268" lengthAdjust="spacingAndGlyphs">Latest traced hearing</text>
    <text x="1450" y="384" class="en iv" font-size="24" text-anchor="middle">postponed again</text>
    <text x="1450" y="570" class="ar iv" font-size="24" text-anchor="middle">آخر جلسة متاحة</text>
    <text x="1450" y="606" class="ar iv" font-size="24" text-anchor="middle">تؤجَّل مجدداً</text>
  </g>
  <line x1="82" y1="718" x2="1518" y2="718" class="thin"/>
  <text x="82" y="776" class="en mu" font-size="23">EDITORIAL TIMELINE · NO LIKENESS OR DOCUMENTARY IMAGE · TIMES OF PALESTINE</text>
  <text x="1518" y="824" class="ar mu" font-size="23" text-anchor="end">خط زمني تحريري · لا يتضمن صورة شخصية أو وثائقية · تايمز أوف فلسطين</text>
</svg>

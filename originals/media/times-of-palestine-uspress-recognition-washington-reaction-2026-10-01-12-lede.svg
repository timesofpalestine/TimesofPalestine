<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
<title>Washington think tanks split over what recognition delivered Palestinians</title>
<desc>A balance scale on Capitol Hill backdrop: one pan holds a recognition document, the other a visa-denial stamp, illustrating the divide between diplomatic recognition of Palestine and continued US sanctions on PLO/PA officials.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#1d1e21"/>
<stop offset="1" stop-color="#111214"/>
</linearGradient>
</defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="90" y="90" font-family="Libre Franklin,Arial" font-size="44" fill="#f2eee8" font-weight="700">Think tanks split on what</text>
<text x="90" y="145" font-family="Libre Franklin,Arial" font-size="44" fill="#f2eee8" font-weight="700">recognition delivered</text>
<text x="90" y="195" font-family="Cairo,Arial" font-size="30" fill="#c7a86b">انقسام واشنطن حول جدوى الاعتراف</text>

<!-- Scale -->
<line x1="800" y1="260" x2="800" y2="620" stroke="#aaa9a5" stroke-width="8"/>
<rect x="770" y="620" width="60" height="22" fill="#aaa9a5"/>
<line x1="620" y1="330" x2="980" y2="330" stroke="#aaa9a5" stroke-width="6"/>

<!-- left pan: recognition document -->
<line x1="620" y1="330" x2="560" y2="440" stroke="#aaa9a5" stroke-width="4"/>
<line x1="620" y1="330" x2="680" y2="440" stroke="#aaa9a5" stroke-width="4"/>
<path d="M500 440 Q620 500 740 440 L720 460 Q620 510 520 460 Z" fill="#286344" opacity="0.5"/>
<rect x="540" y="330" width="160" height="100" rx="6" fill="#f2eee8" stroke="#286344" stroke-width="3"/>
<line x1="560" y1="355" x2="680" y2="355" stroke="#286344" stroke-width="4"/>
<line x1="560" y1="375" x2="680" y2="375" stroke="#aaa9a5" stroke-width="3"/>
<line x1="560" y1="395" x2="650" y2="395" stroke="#aaa9a5" stroke-width="3"/>
<text x="560" y="420" font-family="Libre Franklin,Arial" font-size="16" fill="#286344" font-weight="700">RECOGNITION</text>

<!-- right pan: visa denial stamp -->
<line x1="980" y1="330" x2="920" y2="460" stroke="#aaa9a5" stroke-width="4"/>
<line x1="980" y1="330" x2="1040" y2="460" stroke="#aaa9a5" stroke-width="4"/>
<path d="M860 460 Q980 520 1100 460 L1080 480 Q980 530 880 480 Z" fill="#8a1f2d" opacity="0.5"/>
<rect x="900" y="330" width="160" height="130" rx="6" fill="#f2eee8" stroke="#8a1f2d" stroke-width="3"/>
<circle cx="980" cy="395" r="48" fill="none" stroke="#8a1f2d" stroke-width="5"/>
<text x="980" y="390" font-family="Libre Franklin,Arial" font-size="15" fill="#8a1f2d" font-weight="700" text-anchor="middle">VISA</text>
<text x="980" y="408" font-family="Libre Franklin,Arial" font-size="15" fill="#8a1f2d" font-weight="700" text-anchor="middle">DENIED</text>

<!-- fulcrum tilts toward sanctions -->
<circle cx="800" cy="330" r="14" fill="#c7a86b"/>

<text x="90" y="700" font-family="Source Serif 4,Georgia" font-size="26" fill="#aaa9a5">State Dept extended PLO/PA visa sanctions, 16 Sept 2025</text>
<text x="90" y="735" font-family="Source Serif 4,Georgia" font-size="26" fill="#aaa9a5">A year after recognition wave, statehood "more distant than ever" — AFP</text>
<text x="90" y="790" font-family="Cairo,Arial" font-size="24" fill="#59a97d">تمديد العقوبات على منظمة التحرير والسلطة الفلسطينية</text>

<text x="90" y="850" font-family="Libre Franklin,Arial" font-size="20" fill="#c7a86b">Washington Institute · Carnegie · Atlantic Council · Arab Center DC</text>
</svg>
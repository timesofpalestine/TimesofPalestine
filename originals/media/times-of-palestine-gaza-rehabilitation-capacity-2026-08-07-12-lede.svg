<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Rehabilitation supplies held at Gaza's crossings while 43,011 people live with life-changing injuries</title>
<desc id="dsc">Left: three crates representing wheelchairs, prosthetic limbs and stationary bicycles, with the figure 18 for shipments pending clearance after 130 to 520 days, blocked by a red and ivory hatched barrier marking the crossing. Right: the World Health Organization figure of 43,011 people with life-changing injuries and a bar chart of the injury breakdown — more than 22,000 major limb injuries, 5,000 traumatic amputations, 3,400 major burns, 2,000 spinal cord injuries and 1,300 major traumatic brain injuries — plus a note that Gaza has only eight prosthetists. Source: WHO, 12 May 2026.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<pattern id="hatch" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
<rect width="20" height="20" fill="#8a1f2d"/>
<rect width="10" height="20" fill="#f2eee8"/>
</pattern>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="90" y="102" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">Held at the crossing</text>
<text x="90" y="140" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#c7a86b">18 shipments of rehabilitation supplies await clearance — waits of 130 to 520 days</text>
<text x="1540" y="98" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="38" fill="#f2eee8">محتجزة عند المعابر</text>
<text x="1540" y="136" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5">مستلزمات إعادة التأهيل تنتظر التصريح</text>
<rect x="90" y="160" width="1450" height="1" fill="#3a3b3f"/>

<!-- crossing barrier -->
<rect x="664" y="196" width="26" height="612" fill="url(#hatch)" opacity="0.85"/>
<text x="646" y="502" text-anchor="middle" transform="rotate(-90 646 502)" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="4" fill="#aaa9a5">CROSSING · المعبر</text>

<!-- crate 1: wheelchairs -->
<rect x="130" y="222" width="490" height="112" rx="6" fill="#17181b" stroke="#c7a86b" stroke-opacity="0.5" stroke-width="2"/>
<g stroke="#59a97d" stroke-width="4" fill="none" stroke-linecap="round">
<circle cx="196" cy="292" r="24"/>
<circle cx="196" cy="292" r="4" fill="#59a97d"/>
<path d="M186 250 L186 274 L214 274"/>
<path d="M186 262 L206 262"/>
<circle cx="184" cy="240" r="8"/>
<path d="M214 274 L228 296 L214 300"/>
</g>
<text x="266" y="272" font-family="'Libre Franklin',Arial,sans-serif" font-size="25" fill="#f2eee8">Wheelchairs — adult &amp; children’s</text>
<text x="266" y="304" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">كراسٍ متحركة للكبار والأطفال</text>

<!-- crate 2: prosthetic limbs -->
<rect x="130" y="352" width="490" height="112" rx="6" fill="#17181b" stroke="#c7a86b" stroke-opacity="0.5" stroke-width="2"/>
<g stroke="#59a97d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M182 372 h30 v34 h-30 z"/>
<circle cx="197" cy="418" r="10"/>
<path d="M197 428 v22"/>
<path d="M185 450 h24 v14 h-30 l6 -14"/>
<path d="M212 386 h14"/>
</g>
<text x="266" y="402" font-family="'Libre Franklin',Arial,sans-serif" font-size="25" fill="#f2eee8">Prosthetic limbs</text>
<text x="266" y="434" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">أطراف اصطناعية</text>

<!-- crate 3: stationary bicycles -->
<rect x="130" y="482" width="490" height="112" rx="6" fill="#17181b" stroke="#c7a86b" stroke-opacity="0.5" stroke-width="2"/>
<g stroke="#59a97d" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
<circle cx="176" cy="556" r="20"/>
<circle cx="222" cy="556" r="12"/>
<path d="M176 556 L196 520 L222 556"/>
<path d="M196 520 L206 502 h18"/>
<path d="M186 520 h22"/>
</g>
<text x="266" y="532" font-family="'Libre Franklin',Arial,sans-serif" font-size="25" fill="#f2eee8">Stationary bicycles</text>
<text x="266" y="564" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">دراجات ثابتة</text>

<!-- 18 shipments -->
<text x="130" y="700" font-family="'Source Serif 4',Georgia,serif" font-size="92" font-weight="700" fill="#c7a86b">18</text>
<text x="266" y="662" font-family="'Libre Franklin',Arial,sans-serif" font-size="23" fill="#f2eee8">shipments pending clearance</text>
<text x="266" y="694" font-family="'Libre Franklin',Arial,sans-serif" font-size="23" fill="#C8102E">130–520 days waiting</text>
<text x="266" y="726" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5">شحنة معلّقة عند المعابر</text>
<text x="130" y="778" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">No rehabilitation equipment for health facilities entered</text>
<text x="130" y="802" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">Gaza between May 2024 and mid-April 2026.</text>

<!-- right: the wounded -->
<text x="1540" y="250" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="28" fill="#59a97d">إصابات تُغيّر مسار الحياة</text>
<text x="740" y="308" font-family="'Source Serif 4',Georgia,serif" font-size="96" font-weight="700" fill="#c7a86b">43,011</text>
<text x="740" y="348" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" fill="#f2eee8">people in Gaza living with potentially life-changing injuries</text>
<text x="740" y="380" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5" textLength="844" lengthAdjust="spacingAndGlyphs">2% of the population · up to 10,000 of them children · 172,000 injured since October 2023</text>

<text x="740" y="432" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="2" fill="#aaa9a5">INJURIES NEEDING LONG-TERM REHABILITATION · إصابات تتطلب تأهيلاً طويل الأمد</text>
<rect x="740" y="444" width="800" height="1" fill="#3a3b3f"/>

<g font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#f2eee8">
<text x="1040" y="476" text-anchor="end">Major limb injuries</text>
<text x="1040" y="528" text-anchor="end">Traumatic amputations</text>
<text x="1040" y="580" text-anchor="end">Major burns</text>
<text x="1040" y="632" text-anchor="end">Spinal cord injuries</text>
<text x="1040" y="684" text-anchor="end">Major traumatic brain injuries</text>
</g>
<g>
<rect x="1060" y="458" width="400" height="24" fill="#8a1f2d"/>
<rect x="1060" y="510" width="91" height="24" fill="#8a1f2d"/>
<rect x="1060" y="562" width="62" height="24" fill="#8a1f2d"/>
<rect x="1060" y="614" width="36" height="24" fill="#8a1f2d"/>
<rect x="1060" y="666" width="24" height="24" fill="#8a1f2d"/>
</g>
<g font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#c7a86b">
<text x="1472" y="476">22,000+</text>
<text x="1163" y="528">5,000+</text>
<text x="1134" y="580">3,400+</text>
<text x="1108" y="632">2,000+</text>
<text x="1096" y="684">1,300+</text>
</g>

<rect x="740" y="726" width="800" height="60" rx="6" fill="#17181b" stroke="#286344" stroke-width="2"/>
<text x="762" y="752" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Treating capacity: 8 prosthetists in all of Gaza</text>
<text x="762" y="776" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#aaa9a5">ثمانية أخصائيي أطراف اصطناعية فقط في القطاع</text>

<text x="90" y="852" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Source: World Health Organization, 12 May 2026</text>
<text x="1540" y="852" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="17" fill="#aaa9a5">المصدر: منظمة الصحة العالمية، 12 مايو 2026</text>
</svg>
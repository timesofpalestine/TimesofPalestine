<text x="850" y="432" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Nine countries and the United States, pledged February</text>

<text x="850" y="494" font-family="'Libre Franklin',Arial,sans-serif" font-size="30" font-weight="700" fill="#c7a86b">No schedule of deposits</text>
<text x="850" y="522" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">World Bank fund for Gaza, established November 2025</text>

<text x="850" y="584" font-family="'Libre Franklin',Arial,sans-serif" font-size="30" font-weight="700" fill="#c7a86b">More than US$67 billion</text>
<text x="850" y="612" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Reconstruction and recovery needs assessed</text>

<text x="850" y="676" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Cairo pledging conference not held on schedule</text>
<text x="850" y="704" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5" direction="rtl">مؤتمر القاهرة لم يُعقد في موعده</text>

<!-- GAUGE -->
<text x="90" y="786" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">OCHA 2026 Flash Appeal: US$4.06 billion for 3 million people — less than 25% covered</text>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Arab bilateral aid reaches Gaza while pledged reconstruction billions await disbursement</title>
<desc id="d">Two panels compare aid that has been delivered through bilateral Arab channels — US$3.12 billion of Emirati assistance under Operation Chivalrous Knight 3, a field hospital in Gaza and a floating hospital at Al Arish, 7,600 tonnes of Saudi KSrelief supplies, and a US$20 million Qatar–UNRWA agreement — with pledges awaiting disbursement: US$7 billion from nine countries plus US$10 billion from the United States, held by a World Bank fund that has published no schedule of deposits, against reconstruction needs above US$67 billion. A bar below shows OCHA's 2026 Flash Appeal of US$4.06 billion less than 25 per cent covered.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="90" y="92" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">Arab donors keep Gaza hospitals running</text>
<text x="90" y="146" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">while billions await disbursement</text>
<text x="90" y="196" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#c7a86b" direction="rtl" text-anchor="end">مانحون عرب يشغّلون مستشفيات غزة ومليارات الإعمار تنتظر الصرف</text>
<rect x="90" y="216" width="180" height="4" fill="#8a1f2d"/>


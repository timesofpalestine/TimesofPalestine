<rect x="90" y="260" width="670" height="470" fill="#16181a" stroke="#286344" stroke-width="2" rx="6"/>
<circle cx="132" cy="308" r="18" fill="none" stroke="#59a97d" stroke-width="3"/>
<rect x="129" y="297" width="6" height="22" fill="#59a97d"/>
<rect x="121" y="305" width="22" height="6" fill="#59a97d"/>
<text x="166" y="304" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="700" fill="#59a97d" letter-spacing="1.5">DELIVERED — BILATERAL CHANNELS</text>
<text x="166" y="332" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5" direction="rtl" text-anchor="end">مساعدات وصلت عبر قنوات ثنائية</text>
<line x1="120" y1="356" x2="730" y2="356" stroke="#2c2e31" stroke-width="2"/>

<text x="120" y="404" font-family="'Libre Franklin',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2eee8">US$3.12 billion</text>
<text x="120" y="432" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">UAE aid to Gaza, Operation Chivalrous Knight 3</text>

<text x="120" y="494" font-family="'Libre Franklin',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2eee8">Field hospital + floating hospital</text>
<text x="120" y="522" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Inside Gaza and at Al Arish, Egypt; 21 prosthetics fitted</text>

<text x="120" y="584" font-family="'Libre Franklin',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2eee8">7,600 tons · 67 planes · 8 ships</text>
<text x="120" y="612" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">KSrelief supplies reported, early October 2025</text>

<text x="120" y="674" font-family="'Libre Franklin',Arial,sans-serif" font-size="30" font-weight="700" fill="#f2eee8">US$20 million</text>
<text x="120" y="702" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Qatar–UNRWA agreement signed June 2025</text>


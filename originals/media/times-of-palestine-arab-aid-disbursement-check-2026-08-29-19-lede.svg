<text x="1510" y="866" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">Sources: OCHA · Gulf News · Sharjah24 · KSrelief/SPA · World Bank</text>

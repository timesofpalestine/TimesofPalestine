<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The builders of Palestinian capital</title>
  <desc id="d">Illustration of the Palestinian business elite: a skyline of a bank, a tower crane, a factory and an office tower connected by a golden network, with English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <!-- golden network above the skyline -->
  <g stroke="#c7a86b" stroke-width="3" stroke-dasharray="4 10" opacity=".8">
    <path d="M400 420 Q 610 300 820 400" fill="none"/>
    <path d="M820 400 Q 1030 290 1240 410" fill="none"/>
    <path d="M400 420 Q 800 250 1240 410" fill="none"/>
  </g>
  <g fill="#c7a86b">
    <circle cx="400" cy="420" r="14"/><circle cx="820" cy="400" r="14"/><circle cx="1240" cy="410" r="14"/>
    <circle cx="610" cy="332" r="8" opacity=".7"/><circle cx="1030" cy="322" r="8" opacity=".7"/>
  </g>

  <!-- bank portico -->
  <g filter="url(#sh)">
    <rect x="300" y="470" width="200" height="220" fill="#16161a" stroke="#3a3a42" stroke-width="3"/>
    <polygon points="290,470 400,410 510,470" fill="#26262c" stroke="#3a3a42" stroke-width="3"/>
    <rect x="330" y="510" width="24" height="150" fill="#286344"/>
    <rect x="388" y="510" width="24" height="150" fill="#286344"/>
    <rect x="446" y="510" width="24" height="150" fill="#286344"/>
  </g>

  <!-- tower crane over a rising block -->
  <g filter="url(#sh)">
    <rect x="700" y="560" width="240" height="130" fill="#16161a" stroke="#3a3a42" stroke-width="3"/>
    <rect x="720" y="580" width="40" height="30" fill="#26262c"/><rect x="780" y="580" width="40" height="30" fill="#26262c"/>
    <rect x="840" y="580" width="40" height="30" fill="#26262c"/><rect x="720" y="630" width="40" height="30" fill="#26262c"/>
    <rect x="780" y="630" width="40" height="30" fill="#26262c"/><rect x="840" y="630" width="40" height="30" fill="#26262c"/>
    <rect x="812" y="430" width="14" height="130" fill="#8a1f2d"/>
    <rect x="740" y="418" width="240" height="14" fill="#8a1f2d"/>
    <path d="M747 432 L747 470 M747 470 L741 470 M747 470 L753 470" stroke="#c7a86b" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- factory -->
  <g filter="url(#sh)">
    <rect x="1080" y="560" width="300" height="130" fill="#16161a" stroke="#3a3a42" stroke-width="3"/>
    <polygon points="1080,560 1130,520 1130,560" fill="#26262c"/>
    <polygon points="1130,560 1180,520 1180,560" fill="#26262c"/>
    <polygon points="1180,560 1230,520 1230,560" fill="#26262c"/>
    <rect x="1300" y="450" width="30" height="110" fill="#26262c" stroke="#3a3a42" stroke-width="3"/>
    <circle cx="1315" cy="430" r="10" fill="#59a97d" opacity=".55"/>
    <circle cx="1330" cy="404" r="7" fill="#59a97d" opacity=".35"/>
    <rect x="1110" y="600" width="50" height="60" rx="4" fill="#286344"/>
    <rect x="1190" y="600" width="50" height="60" rx="4" fill="#26262c"/>
    <rect x="1270" y="600" width="50" height="60" rx="4" fill="#286344"/>
  </g>

  <!-- ground line -->
  <rect x="220" y="690" width="1240" height="6" fill="#3a3a42"/>

  <text x="90" y="120" class="sans ivory" font-size="56" font-weight="800">The builders of Palestinian capital</text>
  <text x="90" y="170" class="sans muted" font-size="27">Banks, cranes and factories — the fortunes that hold up an economy at war</text>
  <text x="1510" y="120" class="arabic ivory" font-size="44" font-weight="700" text-anchor="end">بُناة الرأسمال الفلسطيني</text>
  <text x="1510" y="170" class="arabic muted" font-size="26" text-anchor="end">مصارف ورافعات ومصانع تسند اقتصاداً في زمن الحرب</text>
  <text x="800" y="830" class="mono" fill="#59a97d" font-size="24" text-anchor="middle">Nablus · Ramallah · Gaza · Athens · Riyadh · Houston</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The reach and argument of The Bitcoin Standard</title>
  <desc id="desc">A bilingual explanatory graphic tracing the book from its 2018 publication through Arabic access, 39 reported language editions and debate over scarcity, central banking and Bitcoin.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".3"/></filter><style>.sans{font-family:"Libre Franklin",Arial,sans-serif}.serif{font-family:"Source Serif 4",Georgia,serif}.arabic{font-family:Cairo,Tahoma,Arial,sans-serif}.ivory{fill:#f2eee8}.gold{fill:#c7a86b}.muted{fill:#aaa9a5}.green{fill:#61aa80}</style></defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="22" height="900" fill="#8a1f2d"/><rect x="22" width="8" height="900" fill="#286344"/>
  <text x="78" y="82" class="serif ivory" font-size="54" font-weight="800">How one book reframed Bitcoin</text>
  <text x="1525" y="132" text-anchor="end" direction="rtl" class="arabic gold" font-size="39" font-weight="700">كيف أعاد كتاب واحد صياغة فهم البيتكوين؟</text>
  <line x1="100" y1="330" x2="1500" y2="330" stroke="#3d4f6b" stroke-width="5"/>
  <g filter="url(#shadow)">
    <rect x="90" y="210" width="310" height="395" rx="3" fill="#18191c" stroke="#c7a86b" stroke-width="3"/>
    <rect x="90" y="210" width="26" height="395" fill="#8a1f2d"/>
    <text x="145" y="282" class="sans gold" font-size="23" font-weight="800">2018 • WILEY</text><text x="145" y="365" class="serif ivory" font-size="49" font-weight="800">The Bitcoin</text><text x="145" y="425" class="serif ivory" font-size="49" font-weight="800">Standard</text><text x="145" y="500" class="arabic gold" font-size="33">معيار البيتكوين</text>
  </g>
  <g>
    <circle cx="520" cy="330" r="18" fill="#c7a86b"/><circle cx="810" cy="330" r="18" fill="#c7a86b"/><circle cx="1100" cy="330" r="18" fill="#c7a86b"/><circle cx="1390" cy="330" r="18" fill="#c7a86b"/>
    <rect x="445" y="390" width="230" height="215" rx="3" fill="#222328" stroke="#3d4f6b" stroke-width="2"/><text x="560" y="452" text-anchor="middle" class="sans green" font-size="24" font-weight="800">THE LENS</text><text x="560" y="505" text-anchor="middle" class="sans ivory" font-size="29">Scarcity</text><text x="560" y="545" text-anchor="middle" class="sans ivory" font-size="29">through time</text><text x="560" y="580" text-anchor="middle" class="arabic gold" font-size="25">الندرة عبر الزمن</text>
    <rect x="735" y="390" width="230" height="215" rx="3" fill="#222328" stroke="#3d4f6b" stroke-width="2"/><text x="850" y="452" text-anchor="middle" class="sans green" font-size="24" font-weight="800">THE CLAIM</text><text x="850" y="505" text-anchor="middle" class="sans ivory" font-size="29">Rules beyond</text><text x="850" y="545" text-anchor="middle" class="sans ivory" font-size="29">the issuer</text><text x="850" y="580" text-anchor="middle" class="arabic gold" font-size="25">قواعد فوق المُصدِر</text>
    <rect x="1025" y="390" width="230" height="215" rx="3" fill="#222328" stroke="#3d4f6b" stroke-width="2"/><text x="1140" y="452" text-anchor="middle" class="sans green" font-size="24" font-weight="800">ARABIC</text><text x="1140" y="505" text-anchor="middle" class="sans ivory" font-size="29">Free edition,</text><text x="1140" y="545" text-anchor="middle" class="sans ivory" font-size="29">talks and audio</text><text x="1140" y="580" text-anchor="middle" class="arabic gold" font-size="25">نسخة ومواد مجانية</text>
    <rect x="1315" y="390" width="230" height="215" rx="3" fill="#222328" stroke="#3d4f6b" stroke-width="2"/><text x="1430" y="452" text-anchor="middle" class="sans green" font-size="24" font-weight="800">REACH*</text><text x="1430" y="525" text-anchor="middle" class="serif ivory" font-size="58" font-weight="800">39</text><text x="1430" y="570" text-anchor="middle" class="arabic gold" font-size="25">لغة</text>
  </g>
  <rect x="90" y="674" width="1455" height="98" rx="3" fill="#17181b" stroke="#8a1f2d" stroke-width="2"/><text x="125" y="718" class="sans ivory" font-size="23">Influence is not consensus: independent reviewers dispute parts of the book’s history, tone and monetary theory.</text><text x="1510" y="757" text-anchor="end" direction="rtl" class="arabic gold" font-size="23">الانتشار لا يعني الإجماع: راجع باحثون تاريخ الكتاب ونبرته ونظريته النقدية بالنقد.</text>
  <text x="70" y="851" class="sans muted" font-size="18">Sources: Wiley; Saifedean.com; Podcast Palestine; Cato Journal; QJAE • *Author-reported translation count</text><text x="1530" y="851" text-anchor="end" direction="rtl" class="arabic muted" font-size="18">غرافيك: تايمز أوف فلسطين</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The machinery beneath the ceasefire</title>
  <desc id="d">Diagram of the Gaza stabilization architecture: the Board of Peace at top, Admiral Brad Cooper's Civil-Military Coordination Center at the middle as the operational hub, and three streams below — humanitarian aid, the International Stabilization Force, and ceasefire monitoring — with English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <text x="70" y="80" class="sans ivory" font-size="44" font-weight="800">THE MACHINERY BENEATH THE CEASEFIRE</text>
  <text x="1530" y="80" class="arabic ivory" font-size="36" font-weight="700" text-anchor="end">الآلة تحت وقف النار</text>

  <!-- Board of Peace -->
  <g filter="url(#sh)">
    <rect x="540" y="130" width="520" height="90" rx="12" fill="#16161a" stroke="#c7a86b" stroke-width="4"/>
    <text x="800" y="170" class="sans ivory" font-size="27" font-weight="800" text-anchor="middle">BOARD OF PEACE · مجلس السلام</text>
    <text x="800" y="203" class="sans muted" font-size="20" text-anchor="middle">Political direction · High Rep. Mladenov · member states' $17bn pledges</text>
  </g>
  <path d="M800 220 L800 290" stroke="#c7a86b" stroke-width="5"/>

  <!-- CMCC / Cooper -->
  <g filter="url(#sh)">
    <rect x="450" y="290" width="700" height="130" rx="14" fill="#16161a" stroke="#8a1f2d" stroke-width="5"/>
    <text x="800" y="335" class="sans ivory" font-size="28" font-weight="800" text-anchor="middle">CIVIL-MILITARY COORDINATION CENTER</text>
    <text x="800" y="368" class="arabic muted" font-size="23" text-anchor="middle">مركز التنسيق المدني العسكري — بقيادة الأدميرال براد كوبر</text>
    <text x="800" y="400" class="sans muted" font-size="20" text-anchor="middle">CENTCOM-run hub in Israel · ~200 US personnel + partner nations · no US troops inside Gaza</text>
  </g>
  <path d="M620 420 L440 510 M800 420 L800 510 M980 420 L1160 510" stroke="#c7a86b" stroke-width="4"/>

  <!-- three streams -->
  <g filter="url(#sh)" class="sans" text-anchor="middle">
    <rect x="250" y="510" width="380" height="150" rx="12" fill="#16161a" stroke="#286344" stroke-width="3"/>
    <text x="440" y="558" class="ivory" font-size="25" font-weight="800">AID FLOW</text>
    <text x="440" y="592" class="arabic muted" font-size="22">تدفق المساعدات</text>
    <text x="440" y="628" class="muted" font-size="19">Humanitarian and logistics streams into Gaza</text>

    <rect x="610" y="510" width="380" height="150" rx="12" fill="#16161a" stroke="#3d4f6b" stroke-width="3"/>
    <text x="800" y="558" class="ivory" font-size="25" font-weight="800">STABILIZATION FORCE</text>
    <text x="800" y="592" class="arabic muted" font-size="22">قوة الاستقرار الدولية</text>
    <text x="800" y="628" class="muted" font-size="19">Entry approved 26 July · first ~200 troops</text>

    <rect x="970" y="510" width="380" height="150" rx="12" fill="#16161a" stroke="#8a1f2d" stroke-width="3"/>
    <text x="1160" y="558" class="ivory" font-size="25" font-weight="800">CEASEFIRE WATCH</text>
    <text x="1160" y="592" class="arabic muted" font-size="22">مراقبة وقف النار</text>
    <text x="1160" y="628" class="muted" font-size="19">Real-time operations floor, incident tracking</text>
  </g>

  <text x="800" y="740" class="sans ivory" font-size="26" font-weight="700" text-anchor="middle">Every stream runs through one headquarters — and no Palestinian sits in its chain of command</text>
  <text x="800" y="780" class="arabic muted" font-size="24" text-anchor="middle">كل المسارات تمرّ بمقرّ واحد.. ولا فلسطيني في سلسلة قيادته</text>

  <text x="70" y="862" class="sans muted" font-size="19">Graphic: Times of Palestine · Sources: CENTCOM statements, FDD Long War Journal, Times of Israel, 2025–2026</text>
</svg>

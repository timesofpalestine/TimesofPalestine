<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Palestinian institutional life in Chile and the proposed friendship day</title>
  <desc id="desc">A bilingual timeline from Arab migration beginning in 1885 through Club Palestino, Chile's recognition of Palestine, and the bill still pending in July 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#142333"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="54" width="1472" height="792" rx="30" fill="#0d1a26" stroke="#30485a" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="126" fill="#ffffff" font-family="Arial, sans-serif" font-size="44" font-weight="700">A diaspora enters Chile’s public calendar</text>
  <text x="1490" y="181" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-family="Arial, sans-serif" font-size="35" font-weight="700">شتات يدخل التقويم العام في تشيلي</text>
  <text x="110" y="181" fill="#89a8ba" font-family="Arial, sans-serif" font-size="23">Migration, institutions, recognition — and a bill still awaiting its final legislative turn</text>

  <line x1="150" y1="420" x2="1450" y2="420" stroke="#6d8798" stroke-width="8" stroke-linecap="round"/>
  <line x1="150" y1="420" x2="1130" y2="420" stroke="#26a269" stroke-width="8" stroke-linecap="round"/>
  <line x1="1130" y1="420" x2="1450" y2="420" stroke="#e0a928" stroke-width="8" stroke-dasharray="18 16" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif">
    <circle cx="170" cy="420" r="20" fill="#e74c3c" stroke="#ffffff" stroke-width="5"/>
    <text x="170" y="327" text-anchor="middle" fill="#ffffff" font-size="29" font-weight="700">1885–1950</text>
    <text x="170" y="363" text-anchor="middle" fill="#b8cbd6" font-size="20">Major Arab migration era</text>
    <text x="170" y="492" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">حقبة الهجرة العربية الكبرى</text>

    <circle cx="430" cy="420" r="20" fill="#26a269" stroke="#ffffff" stroke-width="5"/>
    <text x="430" y="327" text-anchor="middle" fill="#ffffff" font-size="29" font-weight="700">1920</text>
    <text x="430" y="363" text-anchor="middle" fill="#b8cbd6" font-size="20">Palestinian clubs take root</text>
    <text x="430" y="492" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">تأسيس أندية فلسطينية</text>

    <circle cx="695" cy="420" r="20" fill="#26a269" stroke="#ffffff" stroke-width="5"/>
    <text x="695" y="327" text-anchor="middle" fill="#ffffff" font-size="29" font-weight="700">7 Jan 2011</text>
    <text x="695" y="363" text-anchor="middle" fill="#b8cbd6" font-size="20">Chile recognises Palestine</text>
    <text x="695" y="492" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">تشيلي تعترف بدولة فلسطين</text>

    <circle cx="930" cy="420" r="20" fill="#26a269" stroke="#ffffff" stroke-width="5"/>
    <text x="930" y="327" text-anchor="middle" fill="#ffffff" font-size="29" font-weight="700">10 Jan 2024</text>
    <text x="930" y="363" text-anchor="middle" fill="#b8cbd6" font-size="20">Friendship-day bill filed</text>
    <text x="930" y="492" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">تقديم مشروع يوم الصداقة</text>

    <circle cx="1165" cy="420" r="20" fill="#e0a928" stroke="#ffffff" stroke-width="5"/>
    <text x="1165" y="327" text-anchor="middle" fill="#ffffff" font-size="29" font-weight="700">20 May 2026</text>
    <text x="1165" y="363" text-anchor="middle" fill="#b8cbd6" font-size="20">Senate approves changes</text>
    <text x="1165" y="492" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">الشيوخ يقر التعديلات</text>

    <circle cx="1410" cy="420" r="20" fill="#0d1a26" stroke="#e0a928" stroke-width="8"/>
    <text x="1410" y="327" text-anchor="middle" fill="#ffffff" font-size="29" font-weight="700">30 Jul 2026</text>
    <text x="1410" y="363" text-anchor="middle" fill="#e0c874" font-size="20" font-weight="700">Still in third stage</text>
    <text x="1410" y="492" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#f4df9a" font-size="22" font-weight="700">ما زال في المرحلة الثالثة</text>
  </g>

  <rect x="110" y="585" width="1380" height="148" rx="22" fill="#172838" stroke="#466173" stroke-width="2"/>
  <path d="M110 585H126L196 733H110Z" fill="#e74c3c"/>
  <text x="145" y="646" fill="#ffffff" font-family="Arial, sans-serif" font-size="18" font-weight="700">STATUS</text>
  <text x="240" y="646" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">A bill, not yet law</text>
  <text x="240" y="695" fill="#a9bfcc" font-family="Arial, sans-serif" font-size="20">The Chamber must decide on the Senate’s amendments.</text>
  <text x="1445" y="646" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#ffffff" font-family="Arial, sans-serif" font-size="31" font-weight="700">مشروع قانون لم يصبح قانوناً بعد</text>
  <text x="1445" y="695" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#a9bfcc" font-family="Arial, sans-serif" font-size="20">على النواب البت في تعديلات مجلس الشيوخ</text>

  <text x="110" y="804" fill="#6f8d9e" font-family="Arial, sans-serif" font-size="19">Sources: Chilean Chamber of Deputies, Senate of Chile, Chilean Foreign Ministry, Memoria Chilena</text>
  <text x="1490" y="804" text-anchor="end" fill="#6f8d9e" font-family="Arial, sans-serif" font-size="19">Graphic: Times of Palestine</text>
</svg>

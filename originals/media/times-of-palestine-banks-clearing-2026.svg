<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The clearing chokepoint every Palestinian bank passes through</title>
  <desc id="desc">A bilingual flow diagram: thirteen licensed Palestinian banks under the Palestine Monetary Authority pass all shekel clearing through two Israeli correspondent banks, Discount and Hapoalim, under an Israeli Finance Ministry indemnity, to the Bank of Israel — 51 billion shekels a year, with termination notices for autumn 2026.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#142333"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#89a8ba"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="54" width="1472" height="792" rx="30" fill="#0d1a26" stroke="#30485a" stroke-width="2" filter="url(#shadow)"/>

  <text x="110" y="128" fill="#ffffff" font-family="Arial, sans-serif" font-size="44" font-weight="700">The clearing chokepoint</text>
  <text x="1490" y="128" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-family="Arial, sans-serif" font-size="36" font-weight="700">نقطة اختناق المقاصة</text>
  <text x="110" y="176" fill="#89a8ba" font-family="Arial, sans-serif" font-size="23">Every shekel of Palestinian banking crosses one politically held bridge</text>

  <g font-family="Arial, sans-serif">
    <rect x="110" y="230" width="420" height="420" rx="16" fill="#122536" stroke="#26a269" stroke-width="2"/>
    <text x="320" y="286" text-anchor="middle" fill="#26a269" font-size="25" font-weight="700">13 LICENSED BANKS</text>
    <text x="320" y="330" text-anchor="middle" fill="#ffffff" font-size="22">Bank of Palestine — Shawa family</text>
    <text x="320" y="366" text-anchor="middle" fill="#ffffff" font-size="22">Arab Bank — al-Masri chair</text>
    <text x="320" y="402" text-anchor="middle" fill="#ffffff" font-size="22">The National Bank — 8,000+ owners</text>
    <text x="320" y="438" text-anchor="middle" fill="#b8cbd6" font-size="21">Quds, PIB + 3 Islamic banks</text>
    <text x="320" y="474" text-anchor="middle" fill="#b8cbd6" font-size="21">6 Jordanian + Egyptian banks</text>
    <text x="320" y="530" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="21">ثلاثة عشر مصرفًا مرخصًا</text>
    <text x="320" y="566" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#89a8ba" font-size="19">تحت سلطة النقد الفلسطينية</text>

    <line x1="530" y1="440" x2="700" y2="440" stroke="#89a8ba" stroke-width="6" marker-end="url(#arrow)"/>

    <rect x="710" y="300" width="420" height="280" rx="16" fill="#122536" stroke="#e74c3c" stroke-width="3"/>
    <text x="920" y="356" text-anchor="middle" fill="#e74c3c" font-size="25" font-weight="700">2 ISRAELI CORRESPONDENTS</text>
    <text x="920" y="400" text-anchor="middle" fill="#ffffff" font-size="23">Discount Bank + Bank Hapoalim</text>
    <text x="920" y="436" text-anchor="middle" fill="#b8cbd6" font-size="21">indemnity extended to end-2026</text>
    <text x="920" y="472" text-anchor="middle" fill="#e0a928" font-size="21" font-weight="700">termination notices: Sept–Oct</text>
    <text x="920" y="526" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="21">مراسلان إسرائيليان وإشعارا إنهاء</text>

    <line x1="1130" y1="440" x2="1290" y2="440" stroke="#89a8ba" stroke-width="6" marker-end="url(#arrow)"/>

    <rect x="1300" y="330" width="190" height="220" rx="16" fill="#122536" stroke="#6d8798" stroke-width="2"/>
    <text x="1395" y="410" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">Bank of</text>
    <text x="1395" y="444" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">Israel</text>
    <text x="1395" y="500" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="20">بنك إسرائيل</text>

    <rect x="110" y="690" width="1380" height="90" rx="16" fill="#0f2436" stroke="#30485a" stroke-width="2"/>
    <text x="800" y="734" text-anchor="middle" fill="#ffffff" font-size="27" font-weight="700">₪51 billion a year cleared across this bridge — 90% of Palestinian trade passes through Israel</text>
    <text x="800" y="768" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#89a8ba" font-size="20">51 مليار شيكل سنويًا عبر هذا الجسر — و90% من التجارة الفلسطينية تمر عبر إسرائيل</text>
  </g>

  <text x="110" y="818" fill="#6d8798" font-family="Arial, sans-serif" font-size="20">Graphic: Times of Palestine — figures: JNS, Times of Israel, Middle East Online</text>
</svg>

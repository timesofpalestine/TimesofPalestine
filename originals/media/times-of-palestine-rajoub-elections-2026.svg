<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Rajoub's demand: the presidency first</title>
  <desc id="d">Illustration of Jibril Rajoub's challenge: two ballot boxes — the presidential box lit and moved first, the legislative box behind it — with a reversed-order arrow, and English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <!-- presidential ballot box: forward, lit -->
  <g filter="url(#sh)">
    <rect x="430" y="380" width="330" height="280" rx="16" fill="#16161a" stroke="#c7a86b" stroke-width="4"/>
    <rect x="520" y="360" width="150" height="18" rx="8" fill="#c7a86b"/>
    <path d="M595 300 L595 372" stroke="#c7a86b" stroke-width="5"/>
    <rect x="558" y="258" width="76" height="52" rx="6" fill="#f2eee8" transform="rotate(-14 596 284)"/>
    <path d="M572 284 L588 300 L622 266" stroke="#286344" stroke-width="7" fill="none" stroke-linecap="round" transform="rotate(-14 596 284)"/>
    <text x="595" y="520" class="sans ivory" font-size="28" font-weight="800" text-anchor="middle">PRESIDENCY</text>
    <text x="595" y="560" class="arabic ivory" font-size="26" text-anchor="middle">الرئاسة أولاً</text>
    <text x="595" y="620" class="mono" fill="#c7a86b" font-size="22" text-anchor="middle">1</text>
  </g>

  <!-- legislative box: behind, dimmer -->
  <g filter="url(#sh)" opacity=".62">
    <rect x="960" y="420" width="290" height="240" rx="16" fill="#16161a" stroke="#3a3a42" stroke-width="4"/>
    <rect x="1040" y="402" width="130" height="16" rx="8" fill="#3a3a42"/>
    <text x="1105" y="530" class="sans muted" font-size="25" font-weight="800" text-anchor="middle">LEGISLATIVE</text>
    <text x="1105" y="568" class="arabic muted" font-size="24" text-anchor="middle">التشريعية · 28 نوفمبر</text>
    <text x="1105" y="620" class="mono muted" font-size="22" text-anchor="middle">2</text>
  </g>

  <!-- reversed-order arrow -->
  <path d="M980 340 Q 800 250 640 320" stroke="#8a1f2d" stroke-width="7" fill="none" stroke-linecap="round"/>
  <path d="M660 300 L636 322 L668 334" stroke="#8a1f2d" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <text x="90" y="120" class="sans ivory" font-size="52" font-weight="800">"The presidency first"</text>
  <text x="90" y="170" class="sans muted" font-size="27">Rajoub inverts the ballot order — and names the fear out loud</text>
  <text x="1510" y="120" class="arabic ivory" font-size="44" font-weight="700" text-anchor="end">«الرئاسة أولاً»</text>
  <text x="1510" y="170" class="arabic muted" font-size="25" text-anchor="end">الرجوب يقلب ترتيب الصناديق.. ويسمّي الخوف باسمه</text>
  <text x="800" y="840" class="mono" fill="#59a97d" font-size="24" text-anchor="middle">«أبو مازن خايف نعمل عليه انقلاب» — رام الله، يوليو 2026</text>
</svg>

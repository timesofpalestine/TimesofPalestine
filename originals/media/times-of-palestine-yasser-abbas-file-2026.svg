<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="The Yasser Abbas file: a two-decade timeline of documented business, scrutiny and new mandates — from USAID contracts to the Fatah Central Committee">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#286344"/>
      <stop offset="1" stop-color="#8a1f2d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>
  <text x="800" y="80" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="28" letter-spacing="6">TIMES OF PALESTINE · RESEARCH</text>
  <text x="800" y="142" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="48" font-weight="bold">The Yasser Abbas File</text>
  <text x="800" y="192" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,sans-serif" font-size="34">ملف ياسر عباس — سجلّ عقدين</text>

  <line x1="160" y1="450" x2="1440" y2="450" stroke="url(#tl)" stroke-width="6" stroke-linecap="round"/>

  <g font-family="Tahoma,sans-serif">
    <circle cx="220" cy="450" r="11" fill="#286344"/>
    <text x="220" y="390" text-anchor="middle" fill="#f2eee8" font-size="24">2005</text>
    <text x="220" y="422" text-anchor="middle" fill="#aaa9a5" font-size="19">USAID contracts · عقود</text>

    <circle cx="480" cy="450" r="11" fill="#f2eee8"/>
    <text x="480" y="510" text-anchor="middle" fill="#f2eee8" font-size="24">2009</text>
    <text x="480" y="542" text-anchor="middle" fill="#aaa9a5" font-size="19">Reuters reports · تقارير رويترز</text>

    <circle cx="740" cy="450" r="11" fill="#c7a86b"/>
    <text x="740" y="390" text-anchor="middle" fill="#f2eee8" font-size="24">2012</text>
    <text x="740" y="422" text-anchor="middle" fill="#aaa9a5" font-size="19">Congress asks · الكونغرس يسأل</text>

    <circle cx="1000" cy="450" r="11" fill="#f2eee8"/>
    <text x="1000" y="510" text-anchor="middle" fill="#f2eee8" font-size="24">2015</text>
    <text x="1000" y="542" text-anchor="middle" fill="#aaa9a5" font-size="19">Libel case fails · سقوط دعواه</text>

    <circle cx="1230" cy="450" r="11" fill="#c7a86b"/>
    <text x="1230" y="390" text-anchor="middle" fill="#f2eee8" font-size="24">2025</text>
    <text x="1230" y="422" text-anchor="middle" fill="#aaa9a5" font-size="19">Beirut mandate · تكليف بيروت</text>

    <circle cx="1400" cy="450" r="13" fill="#8a1f2d"/>
    <text x="1400" y="510" text-anchor="middle" fill="#f2eee8" font-size="24">2026</text>
    <text x="1400" y="542" text-anchor="middle" fill="#aaa9a5" font-size="19">Central Committee · المركزية</text>
  </g>

  <text x="800" y="700" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="27" font-style="italic" textLength="1568" lengthAdjust="spacingAndGlyphs">"Are the sons of the Palestinian president growing rich off their father's system?" — Foreign Policy, 2012</text>
  <text x="800" y="742" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="22">السؤال الذي حاول إسقاطه في المحاكم — فأجازت المحاكمُ طرحَه</text>
  <text x="800" y="830" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="19">Sources: Reuters · Foreign Policy · US House hearing record · Abbas v. Foreign Policy Group (D.C. Cir. 2015) · AFP</text>
  <rect x="0" y="894" width="1600" height="6" fill="#286344"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl desc">
<title id="ttl">94 of every 100 Israeli police files on settler violence close without charges</title>
<desc id="desc">A grid of 100 squares representing 100 police investigation files into ideologically motivated crimes by Israelis against Palestinians in the West Bank. Ninety-four squares are grey, marked closed without indictment; three are red, indicted but no conviction; three are gold, convictions. Side panel: 93.6 percent of files closed without indictment, 2005 to 2025; police failed in the investigation of 82 percent of cases; and of 1,701 monitored files from 2005 to 2024, 109 produced indictments and 53 full or partial convictions. Source: Yesh Din data sheets.</desc>


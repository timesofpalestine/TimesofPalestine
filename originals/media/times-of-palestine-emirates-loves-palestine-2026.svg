<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Emirates Loves Palestine at Expo City Dubai</title>
  <desc id="d">House illustration for the Emirates Loves Palestine festival on 29 August at Expo City Dubai: the lattice dome of Al Wasl Plaza rises over a crowd rendered as points of light, with a ribbon in the Palestinian colours crossing the sky. English and Arabic titles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#101114"/><stop offset=".62" stop-color="#17181c"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#c7a86b" stop-opacity=".28"/><stop offset="1" stop-color="#c7a86b" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <clipPath id="dome"><path d="M420 660 A380 380 0 0 1 1180 660 Z"/></clipPath>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}.gold{fill:#c7a86b}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <!-- glow behind the dome -->
  <ellipse cx="800" cy="660" rx="520" ry="240" fill="url(#glow)"/>

  <!-- Al Wasl lattice dome -->
  <g clip-path="url(#dome)" stroke="#c7a86b" stroke-width="3" fill="none" opacity=".85">
    <path d="M420 660 A380 380 0 0 1 1180 660"/>
    <ellipse cx="800" cy="660" rx="380" ry="130"/>
    <ellipse cx="800" cy="660" rx="300" ry="260"/>
    <ellipse cx="800" cy="660" rx="180" ry="330"/>
    <ellipse cx="800" cy="660" rx="60" ry="370"/>
    <path d="M430 560 Q800 420 1170 560" opacity=".7"/>
    <path d="M470 460 Q800 330 1130 460" opacity=".7"/>
    <path d="M540 370 Q800 260 1060 370" opacity=".7"/>
    <path d="M650 300 Q800 230 950 300" opacity=".7"/>
  </g>
  <path d="M420 660 A380 380 0 0 1 1180 660" stroke="#e8d9b8" stroke-width="5" fill="none"/>
  <line x1="120" y1="660" x2="1480" y2="660" stroke="#3a3b40" stroke-width="3"/>

  <!-- crowd as points of light -->
  <g fill="#e8d9b8">
    <circle cx="300" cy="700" r="5"/><circle cx="360" cy="722" r="4"/><circle cx="425" cy="705" r="5"/>
    <circle cx="497" cy="730" r="4"/><circle cx="560" cy="708" r="5"/><circle cx="628" cy="726" r="4"/>
    <circle cx="700" cy="702" r="5"/><circle cx="772" cy="731" r="4"/><circle cx="840" cy="706" r="5"/>
    <circle cx="912" cy="727" r="4"/><circle cx="985" cy="704" r="5"/><circle cx="1052" cy="729" r="4"/>
    <circle cx="1120" cy="707" r="5"/><circle cx="1195" cy="724" r="4"/><circle cx="1268" cy="703" r="5"/>
    <circle cx="520" cy="758" r="4"/><circle cx="660" cy="762" r="4"/><circle cx="800" cy="756" r="5"/>
    <circle cx="940" cy="763" r="4"/><circle cx="1080" cy="757" r="4"/>
  </g>

  <!-- ribbon in the Palestinian colours -->
  <g filter="url(#sh)">
    <path d="M150 250 C 480 160, 1120 160, 1450 250 L1450 274 C 1120 184, 480 184, 150 274 Z" fill="#111214" stroke="#2c2d31" stroke-width="1"/>
    <path d="M150 274 C 480 184, 1120 184, 1450 274 L1450 298 C 1120 208, 480 208, 150 298 Z" fill="#f2eee8"/>
    <path d="M150 298 C 480 208, 1120 208, 1450 298 L1450 322 C 1120 232, 480 232, 150 322 Z" fill="#286344"/>
    <path d="M150 250 L 258 286 L150 322 Z" fill="#8a1f2d"/>
  </g>

  <!-- title lockup -->
  <text x="800" y="120" class="sans ivory" font-size="58" font-weight="800" text-anchor="middle" letter-spacing="2">EMIRATES LOVES PALESTINE</text>
  <text x="800" y="182" class="arabic gold" font-size="44" font-weight="700" text-anchor="middle">الإمارات تحب فلسطين</text>

  <text x="800" y="828" class="sans muted" font-size="27" text-anchor="middle">EXPO CITY DUBAI · SATURDAY 29 AUGUST · NOON TO MIDNIGHT</text>
  <text x="800" y="872" class="arabic muted" font-size="24" text-anchor="middle">مدينة إكسبو دبي · السبت 29 أغسطس/آب · من الظهر حتى منتصف الليل</text>
</svg>

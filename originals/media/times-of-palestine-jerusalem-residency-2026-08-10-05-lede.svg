<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">14,929 Jerusalemites stripped of Israeli permanent residency since 1967</title>
<desc id="dsc">Dark editorial graphic. Left: a stylised permanent residency card overstamped in red with the words "expired of itself", beside the headline figure 14,929 revocations between 1967 and the end of 2024. Right: a bar chart on one scale showing the 2008 peak of 4,577 revocations against 26 in 2021, 81 in 2022, 61 in 2023 and 60 in 2024. Footer lists the 2024 breakdown: 60 people, 33 women, 3 minors, 52 outside Israel. Source: Israeli Interior Ministry data supplied to HaMoked under the Freedom of Information Law.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="barg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#C8102E"/>
<stop offset="1" stop-color="#8a1f2d"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="110" y="86" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="5" fill="#c7a86b">EAST JERUSALEM · 1967–2024</text>
<text x="110" y="140" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">Residency that “expired of itself”</text>
<text x="1520" y="86" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="26" fill="#c7a86b">القدس الشرقية</text>
<text x="1520" y="136" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="34" fill="#f2eee8">إقامة «انتهت من تلقاء ذاتها»</text>
<rect x="110" y="168" width="1410" height="2" fill="#3a3b3f"/>

<!-- left column: headline number -->
<text x="110" y="272" font-family="'Source Serif 4',Georgia,serif" font-size="96" fill="#c7a86b">14,929</text>
<text x="110" y="308" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Palestinians from East Jerusalem stripped of permanent residency</text>
<text x="110" y="336" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">فلسطينيون سُحبت إقامتهم الدائمة</text>

<!-- residency card -->
<g>
<rect x="110" y="368" width="470" height="272" rx="14" fill="#232427" stroke="#c7a86b" stroke-width="2"/>
<rect x="110" y="368" width="470" height="46" rx="14" fill="#286344"/>
<rect x="110" y="398" width="470" height="16" fill="#286344"/>
<text x="134" y="399" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#f2eee8">PERMANENT RESIDENCY</text>
<text x="556" y="399" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#f2eee8">إقامة دائمة</text>
<rect x="136" y="440" width="106" height="130" rx="6" fill="#2e3033" stroke="#4a4c50" stroke-width="2"/>
<circle cx="189" cy="486" r="24" fill="#4a4c50"/>
<path d="M151 560c0-24 17-42 38-42s38 18 38 42z" fill="#4a4c50"/>
<rect x="268" y="446" width="240" height="12" rx="6" fill="#3f4145"/>
<rect x="268" y="480" width="286" height="12" rx="6" fill="#3f4145"/>
<rect x="268" y="514" width="196" height="12" rx="6" fill="#3f4145"/>
<rect x="268" y="548" width="240" height="12" rx="6" fill="#3f4145"/>
<rect x="136" y="596" width="420" height="10" rx="5" fill="#2e3033"/>
<g transform="rotate(-9 345 512)">
<rect x="128" y="470" width="434" height="86" rx="8" fill="#8a1f2d" opacity="0.94" stroke="#C8102E" stroke-width="3"/>
<text x="345" y="506" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="26" letter-spacing="3" fill="#f2eee8">EXPIRED OF ITSELF</text>
<text x="345" y="540" text-anchor="middle" font-family="Cairo,Arial,sans-serif" font-size="24" fill="#f2eee8">انتهت من تلقاء ذاتها</text>
</g>
</g>
<text x="110" y="676" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">No deportation order: the Supreme Court’s 1988 ‘Awad judgment lets status</text>
<text x="110" y="700" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">lapse once the “centre of life” moves outside Israel. The West Bank and</text>
<text x="110" y="724" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Gaza count as abroad. Residents were usually not notified.</text>

<!-- chart -->
<text x="700" y="228" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" letter-spacing="3" fill="#f2eee8">ANNUAL REVOCATIONS · ONE SCALE</text>
<text x="1520" y="228" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5">عمليات السحب السنوية</text>

<g stroke="#34363a" stroke-width="1">
<line x1="700" y1="700" x2="1520" y2="700" stroke="#6a6c70" stroke-width="2"/>
<line x1="700" y1="619" x2="1520" y2="619"/>
<line x1="700" y1="538" x2="1520" y2="538"/>
<line x1="700" y1="458" x2="1520" y2="458"/>
<line x1="700" y1="377" x2="1520" y2="377"/>
</g>
<g font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">
<text x="690" y="705" text-anchor="end">0</text>
<text x="690" y="624" text-anchor="end">1,000</text>
<text x="690" y="543" text-anchor="end">2,000</text>
<text x="690" y="463" text-anchor="end">3,000</text>
<text x="690" y="382" text-anchor="end">4,000</text>
</g>

<!-- 2008 peak bar -->
<rect x="742" y="330" width="96" height="370" fill="url(#barg)"/>
<text x="790" y="312" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="34" fill="#f2eee8">4,577</text>
<text x="790" y="730" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#f2eee8">2008</text>
<text x="790" y="754" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">peak</text>

<!-- gap marker -->
<g stroke="#4a4c50" stroke-width="2" stroke-dasharray="6 8">
<line x1="900" y1="700" x2="900" y2="340"/>
</g>
<text x="920" y="366" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">totals fell after 2008</text>

<!-- recent bars, same scale -->
<g fill="#59a97d">
<rect x="1090" y="698" width="70" height="2"/>
<rect x="1190" y="693.5" width="70" height="6.5"/>
<rect x="1290" y="695" width="70" height="5"/>
<rect x="1390" y="695.2" width="70" height="4.8"/>
</g>
<g font-family="'Source Serif 4',Georgia,serif" font-size="30" fill="#c7a86b" text-anchor="middle">
<text x="1125" y="676">26</text>
<text x="1225" y="670">81</text>
<text x="1325" y="672">61</text>
<text x="1425" y="672">60</text>
</g>
<g font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#f2eee8" text-anchor="middle">
<text x="1125" y="730">2021</text>
<text x="1225" y="730">2022</text>
<text x="1325" y="730">2023</text>
<text x="1425" y="730">2024</text>
</g>
<text x="1520" y="756" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">bars for 2021–2024 are drawn to the same scale</text>

<!-- footer band -->
<rect x="110" y="790" width="1410" height="2" fill="#3a3b3f"/>
<text x="110" y="826" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2" fill="#c7a86b">2024 IN DETAIL</text>
<g font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">
<text x="300" y="826"><tspan font-family="'Source Serif 4',Georgia,serif" font-size="26" fill="#c7a86b">60</tspan> stripped of status</text>
<text x="560" y="826"><tspan font-family="'Source Serif 4',Georgia,serif" font-size="26" fill="#c7a86b">33</tspan> women</text>
<text x="740" y="826"><tspan font-family="'Source Serif 4',Georgia,serif" font-size="26" fill="#c7a86b">3</tspan> minors</text>
<text x="900" y="826"><tspan font-family="'Source Serif 4',Georgia,serif" font-size="26" fill="#c7a86b">52</tspan> outside Israel on the day it took effect</text>
</g>
<text x="110" y="866" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">Source: Israeli Interior Ministry figures supplied to HaMoked under the Freedom of Information Law; 2008 peak from B’Tselem. Figure for 2025 not published.</text>
<text x="1520" y="866" text-anchor="end" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#aaa9a5">المصدر: بيانات وزارة الداخلية الإسرائيلية لمنظمة «هَموكيد»</text>
</svg>
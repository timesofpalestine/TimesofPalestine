<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The Coldcard entropy failure</title>
  <desc id="d">Illustration of the Coldcard hardware wallet entropy flaw: a signing device whose dice — its source of randomness — come up cracked, beside the emptied-wallet count, with English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <!-- the signing device -->
  <g filter="url(#sh)">
    <rect x="520" y="260" width="260" height="420" rx="26" fill="#16161a" stroke="#3a3a42" stroke-width="3"/>
    <rect x="548" y="300" width="204" height="130" rx="10" fill="#0b0b0c" stroke="#26262c" stroke-width="2"/>
    <text x="650" y="352" class="mono" fill="#c96a6a" font-size="26" text-anchor="middle">72 bits</text>
    <text x="650" y="392" class="mono" fill="#59a97d" font-size="20" text-anchor="middle" opacity=".55">expected 128</text>
    <g fill="#26262c">
      <rect x="556" y="458" width="56" height="44" rx="8"/><rect x="622" y="458" width="56" height="44" rx="8"/><rect x="688" y="458" width="56" height="44" rx="8"/>
      <rect x="556" y="512" width="56" height="44" rx="8"/><rect x="622" y="512" width="56" height="44" rx="8"/><rect x="688" y="512" width="56" height="44" rx="8"/>
      <rect x="556" y="566" width="56" height="44" rx="8"/><rect x="622" y="566" width="56" height="44" rx="8"/><rect x="688" y="566" width="56" height="44" rx="8"/>
    </g>
  </g>

  <!-- cracked die: the failed randomness -->
  <g filter="url(#sh)">
    <rect x="900" y="380" width="180" height="180" rx="26" fill="#16161a" stroke="#c7a86b" stroke-width="4"/>
    <g fill="#c7a86b">
      <circle cx="945" cy="425" r="14"/><circle cx="1035" cy="425" r="14"/>
      <circle cx="990" cy="470" r="14"/>
      <circle cx="945" cy="515" r="14"/><circle cx="1035" cy="515" r="14"/>
    </g>
    <path d="M900 430 L960 470 L930 520 L985 560" stroke="#c96a6a" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- the sweep -->
  <g class="mono">
    <text x="1180" y="430" fill="#c96a6a" font-size="44" font-weight="700">−1,082 ₿</text>
    <text x="1180" y="478" class="muted" font-size="24">1,196 wallets · 41 minutes</text>
    <text x="1180" y="516" class="muted" font-size="24">30 July · 01:10–01:51 UTC</text>
  </g>

  <text x="90" y="120" class="sans ivory" font-size="54" font-weight="800">The dice were loaded</text>
  <text x="90" y="170" class="sans muted" font-size="27">A Coldcard firmware flaw made "random" keys guessable — and someone guessed</text>
  <text x="1510" y="120" class="arabic ivory" font-size="44" font-weight="700" text-anchor="end">النرد كان مغشوشاً</text>
  <text x="1510" y="170" class="arabic muted" font-size="26" text-anchor="end">خلل في «كولدكارد» جعل المفاتيح «العشوائية» قابلة للتخمين</text>
  <text x="800" y="840" class="mono" fill="#59a97d" font-size="24" text-anchor="middle">a new seed on fixed firmware is the only repair · updating alone does not fix an old seed</text>
</svg>

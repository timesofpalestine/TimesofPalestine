<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Paradiso 17 — Hannah Lillith Assadi, National Book Award for Fiction 2026</title>
<desc id="dsc">A night desert under a field of stars. A single dotted road runs from a small stone arch marked Safad 1948 on the far horizon, across the sand, to a lit open doorway in the foreground — the road home that the novel's hero, a Palestinian refugee, travels in memory. Beside it, the novel's title, Paradiso 17, and the words National Book Award for Fiction 2026, in English and Arabic.</desc>
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#0d0f14"/>
<stop offset="0.62" stop-color="#1b1d24"/>
<stop offset="1" stop-color="#2a2320"/>
</linearGradient>
<linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#3a2c22"/>
<stop offset="1" stop-color="#17120f"/>
</linearGradient>
<radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#f3d58f" stop-opacity="0.95"/>
<stop offset="0.5" stop-color="#c7a86b" stop-opacity="0.35"/>
<stop offset="1" stop-color="#c7a86b" stop-opacity="0"/>
</radialGradient>
<radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
<stop offset="0" stop-color="#f2eee8"/>
<stop offset="1" stop-color="#c9c2b6"/>
</radialGradient>
</defs>

<rect width="1600" height="900" fill="url(#sky)"/>

<!-- stars -->
<g fill="#f2eee8">
<circle cx="880" cy="70" r="2"/><circle cx="960" cy="140" r="1.4"/><circle cx="1030" cy="60" r="1.8"/>
<circle cx="1110" cy="120" r="1.2"/><circle cx="1180" cy="48" r="2.2"/><circle cx="1250" cy="160" r="1.5"/>
<circle cx="1320" cy="90" r="1.3"/><circle cx="1400" cy="40" r="1.9"/><circle cx="1460" cy="150" r="1.2"/>
<circle cx="1530" cy="80" r="1.7"/><circle cx="910" cy="230" r="1.1"/><circle cx="1010" cy="250" r="1.6"/>
<circle cx="1140" cy="210" r="1.2"/><circle cx="1290" cy="250" r="1.1"/><circle cx="1500" cy="230" r="1.5"/>
<circle cx="840" cy="170" r="1.2"/><circle cx="1560" cy="300" r="1.1"/><circle cx="1210" cy="300" r="1"/>
</g>
<!-- seventeen brighter stars in a gentle arc -->
<g fill="#c7a86b">
<circle cx="860" cy="330" r="3"/><circle cx="900" cy="300" r="3"/><circle cx="943" cy="274" r="3"/>
<circle cx="988" cy="252" r="3"/><circle cx="1035" cy="234" r="3"/><circle cx="1083" cy="220" r="3"/>
<circle cx="1132" cy="210" r="3"/><circle cx="1182" cy="204" r="3"/><circle cx="1232" cy="202" r="3"/>
<circle cx="1282" cy="204" r="3"/><circle cx="1332" cy="210" r="3"/><circle cx="1380" cy="220" r="3"/>
<circle cx="1427" cy="234" r="3"/><circle cx="1472" cy="252" r="3"/><circle cx="1515" cy="274" r="3"/>
<circle cx="1555" cy="300" r="3"/><circle cx="1590" cy="330" r="3"/>
</g>
<circle cx="1420" cy="120" r="46" fill="url(#moon)" opacity="0.9"/>
<circle cx="1440" cy="108" r="44" fill="#14161c"/>

<!-- far hills -->
<path d="M760 560 C900 520 1000 540 1100 515 C1220 485 1330 530 1440 505 C1520 490 1570 500 1600 505 L1600 900 L760 900 Z" fill="#241d1a"/>
<!-- the far arch: Safad -->
<g transform="translate(1290,470)">
<rect x="-26" y="0" width="52" height="40" fill="#3b302a"/>
<path d="M-14 40 L-14 18 A14 14 0 0 1 14 18 L14 40 Z" fill="#0d0f14"/>
</g>
<text x="1290" y="455" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="3" fill="#aaa9a5">SAFAD · 1948</text>

<!-- desert floor -->
<path d="M700 640 C900 600 1100 620 1300 600 C1420 590 1520 600 1600 596 L1600 900 L700 900 Z" fill="url(#sand)"/>

<!-- the road home, dotted -->
<path d="M1290 512 C1250 560 1180 590 1150 630 C1110 690 1180 740 1100 800 C1060 830 1010 850 990 900" fill="none" stroke="#c7a86b" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round"/>

<!-- the lit doorway -->
<circle cx="1000" cy="720" r="170" fill="url(#glow)"/>
<g transform="translate(1000,600)">
<path d="M-60 210 L-60 40 A60 60 0 0 1 60 40 L60 210 Z" fill="#f3d58f"/>
<path d="M-60 210 L-60 40 A60 60 0 0 1 60 40 L60 210" fill="none" stroke="#8a1f2d" stroke-width="8"/>
<path d="M-60 210 L-24 196 L-24 66 L-60 50 Z" fill="#286344"/>
</g>

<!-- left column: brand + title -->
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="100" y="120" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="5" fill="#c7a86b">NATIONAL BOOK AWARD · FICTION · 2026</text>
<text x="100" y="160" font-family="Cairo,Arial,sans-serif" font-size="26" fill="#aaa9a5">جائزة الكتاب الوطني الأميركية للرواية</text>

<text x="96" y="330" font-family="'Source Serif 4',Georgia,serif" font-size="128" font-style="italic" fill="#f2eee8">Paradiso</text>
<text x="96" y="470" font-family="'Source Serif 4',Georgia,serif" font-size="150" fill="#c7a86b">17</text>
<text x="100" y="540" font-family="Cairo,Arial,sans-serif" font-size="44" fill="#f2eee8">باراديسو 17</text>

<line x1="100" y1="585" x2="560" y2="585" stroke="#3a3b3f" stroke-width="2"/>

<text x="100" y="640" font-family="'Source Serif 4',Georgia,serif" font-size="40" fill="#f2eee8">Hannah Lillith Assadi</text>
<text x="100" y="690" font-family="Cairo,Arial,sans-serif" font-size="32" fill="#c7a86b">هانا ليليث أسعدي</text>

<text x="100" y="790" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">A father's road, from Safad to the Arizona desert</text>
<text x="100" y="830" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5">طريق أبٍ من صفد إلى صحراء أريزونا</text>

<text x="1560" y="870" text-anchor="end" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" letter-spacing="3" fill="#6f6e6a">TIMES OF PALESTINE · ILLUSTRATION</text>
</svg>

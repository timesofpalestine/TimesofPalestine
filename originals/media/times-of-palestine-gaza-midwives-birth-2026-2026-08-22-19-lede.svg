<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Registered live births in Gaza fall 67 per cent as midwives deliver babies in shelters and tents</title>
<desc id="d">Bar chart of monthly registered live births reported by Gaza's Ministry of Health: 6,076 in November 2025, 5,210 in January 2026, 3,433 in February, 3,233 in March and 2,004 in April, with 1,701 births recorded by the interior ministry in May. Side panel notes more than 125 midwives deployed by UNFPA in June 2026, at least 15 women a week giving birth outside any health facility, and 921 miscarriages logged in April.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="barA" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#c7a86b"/>
<stop offset="1" stop-color="#8a7443"/>
</linearGradient>
<linearGradient id="barB" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#C8102E"/>
<stop offset="1" stop-color="#8a1f2d"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- Headline -->
<text x="90" y="104" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">Gaza's registered births fall 67% as midwives</text>
<text x="90" y="152" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">deliver in shelters, tents and medical points</text>
<text x="90" y="196" font-family="Cairo,Arial,sans-serif" font-size="28" fill="#c7a86b">غزة: تراجع الولادات المسجلة 67٪ والقابلات يولّدن في الخيام</text>

<!-- Chart heading -->
<text x="180" y="252" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">Registered live births per month, Gaza Ministry of Health</text>
<text x="180" y="282" font-family="Cairo,Arial,sans-serif" font-size="19" fill="#aaa9a5">الولادات الحية المسجلة شهرياً — وزارة الصحة في غزة</text>

<!-- Bars -->
<g font-family="'Libre Franklin',Arial,sans-serif" text-anchor="middle">
  <rect x="200" y="360" width="100" height="380" fill="url(#barA)"/>
  <text x="250" y="346" font-size="21" fill="#c7a86b">6,076</text>
  <text x="250" y="770" font-size="19" fill="#f2eee8">Nov 2025</text>

  <rect x="340" y="414" width="100" height="326" fill="url(#barB)"/>
  <text x="390" y="400" font-size="21" fill="#f2eee8">5,210</text>
  <text x="390" y="770" font-size="19" fill="#f2eee8">Jan</text>

  <rect x="480" y="525" width="100" height="215" fill="url(#barB)"/>
  <text x="530" y="511" font-size="21" fill="#f2eee8">3,433</text>
  <text x="530" y="770" font-size="19" fill="#f2eee8">Feb</text>

  <rect x="620" y="538" width="100" height="202" fill="url(#barB)"/>
  <text x="670" y="524" font-size="21" fill="#f2eee8">3,233</text>
  <text x="670" y="770" font-size="19" fill="#f2eee8">Mar</text>

  <rect x="760" y="615" width="100" height="125" fill="url(#barB)"/>
  <text x="810" y="601" font-size="21" fill="#f2eee8">2,004</text>
  <text x="810" y="770" font-size="19" fill="#f2eee8">Apr</text>

  <rect x="900" y="634" width="100" height="106" fill="none" stroke="#8a1f2d" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="950" y="620" font-size="21" fill="#aaa9a5">1,701</text>
  <text x="950" y="770" font-size="19" fill="#aaa9a5">May*</text>

  <text x="600" y="798" font-size="17" fill="#aaa9a5">2026 monthly figures / أرقام شهرية لعام 2026</text>
</g>

<polyline points="250,360 390,414 530,525 670,538 810,615 950,634" fill="none" stroke="#c7a86b" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.85"/>
<line x1="180" y1="740" x2="1020" y2="740" stroke="#aaa9a5" stroke-width="2" opacity="0.6"/>

<!-- Drop annotation -->
<text x="812" y="336" font-family="'Source Serif 4',Georgia,serif" font-size="44" fill="#c7a86b">−67%</text>
<text x="812" y="362" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Nov 2025 to Apr 2026</text>

<!-- Side panel -->
<g>
  <rect x="1080" y="290" width="440" height="132" rx="6" fill="#f2eee8" opacity="0.06"/>
  <rect x="1080" y="290" width="5" height="132" fill="#59a97d"/>
  <text x="1106" y="342" font-family="'Source Serif 4',Georgia,serif" font-size="42" fill="#c7a86b">125+</text>
  <text x="1106" y="378" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">midwives deployed by UNFPA, June 2026</text>
  <text x="1106" y="406" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#aaa9a5">قابلات منتشرات في غزة</text>

  <rect x="1080" y="440" width="440" height="132" rx="6" fill="#f2eee8" opacity="0.06"/>
  <rect x="1080" y="440" width="5" height="132" fill="#c7a86b"/>
  <text x="1106" y="492" font-family="'Source Serif 4',Georgia,serif" font-size="42" fill="#c7a86b">15</text>
  <text x="1106" y="528" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">women a week give birth outside</text>
  <text x="1106" y="552" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">any health facility</text>
  <text x="1106" y="566" font-family="Cairo,Arial,sans-serif" font-size="1" fill="#aaa9a5"> </text>

  <rect x="1080" y="590" width="440" height="132" rx="6" fill="#f2eee8" opacity="0.06"/>
  <rect x="1080" y="590" width="5" height="132" fill="#C8102E"/>
  <text x="1106" y="642" font-family="'Source Serif 4',Georgia,serif" font-size="42" fill="#C8102E">921</text>
  <text x="1106" y="678" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">miscarriages logged in April alone</text>
  <text x="1106" y="706" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#aaa9a5">حالة إجهاض في نيسان/أبريل</text>
</g>

<!-- Footnotes -->
<text x="90" y="840" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">* 1,701 births recorded by the interior ministry in May 2026. Annual totals: about 57,000 births in 2022, 54,000 in 2023, 38,000 in 2024.</text>
<text x="90" y="866" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Source: Gaza Ministry of Health figures set out by the Gaza Centre for Human Rights, 12 June 2026; UNFPA. — Times of Palestine</text>
</svg>
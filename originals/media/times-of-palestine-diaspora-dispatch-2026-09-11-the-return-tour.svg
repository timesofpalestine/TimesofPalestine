<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Return: from a Nuseirat house to a Victorian stage tour</title>
  <desc id="desc">A bilingual timeline of the December 2023 Israeli strike on the Abu Samra family home in Nuseirat, Nagham Abu Samra's evacuation to Egypt and death in January 2024, and the community-hall tour of the play The Return through Sydney in 2025 and Victoria in September 2026, with the dated counts behind the story.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101114"/>
      <stop offset="1" stop-color="#1c1d21"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e1e2b"/>
      <stop offset=".5" stop-color="#286344"/>
      <stop offset="1" stop-color="#bd9854"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f3efe8}
      .muted{fill:#aaa9a5}
      .gold{fill:#d4b36e}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:16px}
      .small{font-size:19px}
      .body{font-size:22px}
      .label{font-size:17px;font-weight:800;letter-spacing:1.1px}
      .name{font-size:25px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="76" y="74" class="serif ivory" font-size="44" font-weight="800">The Return: a Nuseirat house, then a tour of halls</text>
  <text x="76" y="114" class="sans muted body">No state theatre commissioned it. Community venues carry it.</text>
  <text x="1524" y="158" class="arabic ivory" font-size="32" font-weight="800" text-anchor="end">"العودة": من بيت في النصيرات إلى قاعات فيكتوريا</text>
  <text x="1524" y="190" class="arabic muted small" text-anchor="end">لم يكلّفها مسرح رسمي، بل حملتها قاعات المجتمع</text>

  <g filter="url(#shadow)">
    <rect x="60" y="224" width="440" height="404" rx="18" fill="#27282c" stroke="#dc6572" stroke-width="3"/>
    <text x="88" y="264" class="sans red label">THE RECORD IN GAZA</text>
    <text x="472" y="264" class="arabic muted small" text-anchor="end">ما حدث في غزة</text>

    <circle cx="102" cy="316" r="9" fill="#dc6572"/>
    <text x="128" y="308" class="sans ivory name">18 December 2023</text>
    <text x="128" y="338" class="sans muted small">Israeli strike hits the family home,</text>
    <text x="128" y="362" class="sans muted small">Nuseirat camp. Her sister Rozan killed.</text>
    <text x="472" y="388" class="arabic muted small" text-anchor="end">قصفٌ على البيت في النصيرات</text>

    <circle cx="102" cy="440" r="9" fill="#d4b36e"/>
    <text x="128" y="432" class="sans ivory name">7 January 2024</text>
    <text x="128" y="462" class="sans muted small">Nagham, in a coma, reaches a</text>
    <text x="128" y="486" class="sans muted small">hospital in El-Arish, Egypt.</text>
    <text x="472" y="512" class="arabic muted small" text-anchor="end">إخلاء متأخر إلى العريش</text>

    <circle cx="102" cy="564" r="9" fill="#85878d"/>
    <text x="128" y="556" class="sans ivory name">12 January 2024</text>
    <text x="128" y="586" class="sans muted small">She dies of her wounds there.</text>
    <text x="472" y="612" class="arabic muted small" text-anchor="end">استشهادها في مستشفى مصري</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="540" y="224" width="1000" height="404" rx="18" fill="#27282c" stroke="#61aa80" stroke-width="2"/>
    <text x="572" y="264" class="sans green label">WHERE THE PLAY HAS RUN</text>
    <text x="1508" y="264" class="arabic muted small" text-anchor="end">حيث عُرضت المسرحية</text>

    <path d="M600 320H1470" stroke="#67696f" stroke-width="3"/>
    <circle cx="620" cy="320" r="10" fill="#d4b36e"/>
    <circle cx="790" cy="320" r="10" fill="#d4b36e"/>
    <circle cx="1000" cy="320" r="10" fill="#61aa80"/>
    <circle cx="1150" cy="320" r="10" fill="#61aa80"/>
    <circle cx="1300" cy="320" r="10" fill="#61aa80"/>
    <circle cx="1450" cy="320" r="10" fill="#61aa80"/>

    <text x="572" y="372" class="sans gold label">SYDNEY, 2025</text>
    <text x="572" y="406" class="sans ivory small">21 Nov and 21 Dec — East Sydney Community</text>
    <text x="572" y="430" class="sans ivory small">and Arts Centre, Darlinghurst</text>
    <text x="572" y="458" class="sans ivory small">9 and 11 Dec — Flight Path Theatre, Marrickville</text>
    <text x="572" y="486" class="sans muted small">Tickets $40. Producer: Jasmine H. Low.</text>
    <text x="1508" y="516" class="arabic muted small" text-anchor="end">موسمان في سيدني أواخر 2025</text>

    <text x="1060" y="372" class="sans green label">VICTORIA, SEPTEMBER 2026</text>
    <text x="1060" y="406" class="sans ivory small">15, 16, 17 and 20 — Brunswick</text>
    <text x="1060" y="430" class="sans ivory small">Mechanics Institute, Melbourne</text>
    <text x="1060" y="458" class="sans ivory small">18 — Ballarat Performing Arts Centre</text>
    <text x="1060" y="482" class="sans ivory small">19 — Chandler Community Centre, Keysborough</text>
    <text x="1060" y="506" class="sans ivory small">22 — Phee Broadway Theatre, Castlemaine</text>
  </g>

  <rect x="60" y="660" width="1480" height="118" rx="16" fill="#212226" stroke="#3a3b40" stroke-width="2"/>
  <text x="92" y="700" class="sans gold label">THE NUMBERS AROUND IT</text>
  <text x="1508" y="700" class="arabic muted small" text-anchor="end">أرقام موثّقة بتواريخها</text>
  <text x="92" y="740" class="sans ivory body">1,009 athletes killed</text>
  <text x="92" y="766" class="sans muted small">Palestinian Football Association count, June 2026</text>
  <text x="600" y="740" class="sans ivory body">15,607 of Palestinian ancestry</text>
  <text x="600" y="766" class="sans muted small">Australian census, 2021; 2,959 born in Gaza or the West Bank</text>
  <text x="1160" y="740" class="sans ivory body">A$20,000 sought</text>
  <text x="1160" y="766" class="sans muted small">for the next work, Nagham of Gaza</text>

  <rect x="60" y="798" width="1480" height="56" rx="14" fill="url(#band)"/>
  <text x="92" y="834" class="sans ivory" font-size="21" font-weight="800">Presented by The Return Project with Free Palestine Melbourne</text>
  <text x="1508" y="834" class="arabic ivory small" text-anchor="end">من تقديم "مشروع العودة" و"فلسطين الحرة ملبورن"</text>

  <text x="76" y="884" class="sans muted tiny">Dates from the presenters' listings; counts as attributed. Graphic: Times of Palestine.</text>
</svg>

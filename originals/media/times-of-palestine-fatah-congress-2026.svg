<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Fatah's eighth congress: who rose and who fell — the new Central Committee ladder and the departures">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>

  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>
  <text x="800" y="80" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="28" letter-spacing="6">TIMES OF PALESTINE · POLITICS</text>
  <text x="800" y="142" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="48" font-weight="bold">Fatah's Eighth Congress: The New Ladder</text>
  <text x="800" y="192" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,sans-serif" font-size="34">مؤتمر فتح الثامن: السلّم الجديد</text>

  <!-- risers column -->
  <g transform="translate(140,250)">
    <rect x="0" y="0" width="620" height="540" rx="6" fill="#17181b" stroke="#286344" stroke-width="2"/>
    <text x="310" y="52" text-anchor="middle" fill="#286344" font-family="Georgia,serif" font-size="30" font-weight="bold">ROSE · صعدوا</text>
    <g font-family="Tahoma,sans-serif" font-size="24" fill="#f2eee8">
      <text x="50" y="120">Marwan Barghouti · مروان البرغوثي</text>
      <text x="50" y="158" fill="#aaa9a5" font-size="20">1,893 — top vote, from prison · الأول من سجنه</text>
      <text x="50" y="212">Majed Faraj · ماجد فرج</text>
      <text x="50" y="250" fill="#aaa9a5" font-size="20">1,884 — intelligence chief · رئيس المخابرات</text>
      <text x="50" y="304">Hussein al-Sheikh · حسين الشيخ</text>
      <text x="50" y="342" fill="#aaa9a5" font-size="20">first-ever deputy chairman · أول نائب لرئيس الحركة</text>
      <text x="50" y="396">Yasser Abbas · ياسر عباس</text>
      <text x="50" y="434" fill="#aaa9a5" font-size="20">1,301 — the president's son · نجل الرئيس</text>
      <text x="50" y="488">Dalal Erikat · دلال عريقات</text>
      <text x="50" y="516" fill="#aaa9a5" font-size="20">topped the Revolutionary Council · تصدّرت «الثوري»</text>
    </g>
  </g>

  <!-- departures column -->
  <g transform="translate(840,250)">
    <rect x="0" y="0" width="620" height="540" rx="6" fill="#17181b" stroke="#8a1f2d" stroke-width="2"/>
    <text x="310" y="52" text-anchor="middle" fill="#8a1f2d" font-family="Georgia,serif" font-size="30" font-weight="bold">FELL · خرجوا</text>
    <g font-family="Tahoma,sans-serif" font-size="24" fill="#f2eee8">
      <text x="50" y="120">Azzam al-Ahmad · عزام الأحمد</text>
      <text x="50" y="158" fill="#aaa9a5" font-size="20">lost his seat · خسر مقعده</text>
      <text x="50" y="212">Rawhi Fattouh · روحي فتوح</text>
      <text x="50" y="250" fill="#aaa9a5" font-size="20">lost his seat · خسر مقعده</text>
      <text x="50" y="304">Abbas Zaki · عباس زكي</text>
      <text x="50" y="342" fill="#aaa9a5" font-size="20">lost his seat · خسر مقعده</text>
      <text x="50" y="396">Sabri Saidam · صبري صيدم</text>
      <text x="50" y="434" fill="#aaa9a5" font-size="20">deputy secretary-general, out · خرج من المركزية</text>
      <text x="50" y="488">Husam Zomlot · حسام زملط</text>
      <text x="50" y="516" fill="#aaa9a5" font-size="20">ran, fell short · ترشح ولم يفز</text>
    </g>
  </g>

  <text x="800" y="852" text-anchor="middle" fill="#aaa9a5" font-family="Tahoma,sans-serif" font-size="20">نتائج أعلنتها رئاسة المؤتمر في 18 أيار/مايو 2026 · Results announced by the congress presidency, 18 May 2026 (WAFA)</text>
  <rect x="0" y="894" width="1600" height="6" fill="#286344"/>
</svg>

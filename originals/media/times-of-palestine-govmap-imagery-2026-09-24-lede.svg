<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Israel's govmap showed northern Gaza's ruins in high resolution, then re-blurred the imagery</title>
<desc id="dsc">Dark house illustration. Two schematic map tiles sit side by side: the left one shows flattened housing blocks, bulldozer tracks and marked army positions in sharp detail; the right one shows the same tile under a blur. Labels in English and Arabic identify the left panel as govmap between 21 and 24 September 2026 and the right panel as the same area after the site re-applied its blur. A footer records that an analyst archived the layer, about 2.5 billion pixels at 13 centimetres a pixel. The tiles are a schematic, not the imagery itself.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#111214"/>
    <stop offset="1" stop-color="#1d1e21"/>
  </linearGradient>
  <filter id="blurf" x="-12%" y="-12%" width="124%" height="124%">
    <feGaussianBlur stdDeviation="9"/>
  </filter>
  <clipPath id="rclip"><rect x="830" y="392" width="620" height="300"/></clipPath>
  <g id="tile">
    <rect width="620" height="300" fill="#191a1d"/>
    <g fill="#4e4f54">
      <rect x="24" y="22" width="86" height="54"/><rect x="126" y="22" width="62" height="54"/>
      <rect x="204" y="22" width="104" height="54"/><rect x="330" y="30" width="70" height="46"/>
      <rect x="416" y="22" width="92" height="54"/><rect x="524" y="34" width="68" height="42"/>
      <rect x="24" y="104" width="64" height="70"/><rect x="104" y="104" width="96" height="48"/>
      <rect x="216" y="112" width="58" height="62"/><rect x="292" y="104" width="110" height="44"/>
      <rect x="420" y="116" width="74" height="58"/><rect x="510" y="104" width="82" height="70"/>
      <rect x="24" y="200" width="98" height="52"/><rect x="138" y="208" width="66" height="44"/>
      <rect x="222" y="200" width="84" height="60"/><rect x="326" y="212" width="58" height="40"/>
      <rect x="404" y="200" width="100" height="52"/><rect x="522" y="206" width="70" height="46"/>
    </g>
    <g stroke="#2a2b2f" stroke-width="10" fill="none">
      <path d="M0 92 H620"/><path d="M0 186 H620"/><path d="M312 0 V300"/>
    </g>
    <g stroke="#6d5a33" stroke-width="5" fill="none" stroke-linecap="round">
      <path d="M40 276 C 170 250, 250 296, 400 262 S 560 240, 600 268"/>
      <path d="M60 60 C 190 96, 300 46, 430 88"/>
    </g>
    <g fill="none" stroke="#c7a86b" stroke-width="4">
      <rect x="150" y="122" width="44" height="34"/>
      <rect x="352" y="216" width="50" height="30"/>
      <rect x="470" y="36" width="40" height="32"/>
    </g>
  </g>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="110" y="104" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" letter-spacing="5" fill="#c7a86b">GAZA &#183; THE RECORD FROM ABOVE</text>

<text x="110" y="176" font-family="'Source Serif 4',Georgia,serif" font-size="50" fill="#f2eee8">Israel's map site showed northern Gaza's</text>
<text x="110" y="232" font-family="'Source Serif 4',Georgia,serif" font-size="50" fill="#f2eee8">ruins, then blurred them again</text>
<text x="110" y="286" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#aaa9a5">كشفت خرائط إسرائيل الرسمية دمار شمال غزة ثم أعادت حجبه</text>

<line x1="110" y1="330" x2="1450" y2="330" stroke="#3a3b3f" stroke-width="2"/>

<rect x="108" y="390" width="624" height="304" fill="none" stroke="#3a3b3f" stroke-width="2"/>
<use href="#tile" x="110" y="392"/>
<g clip-path="url(#rclip)"><use href="#tile" x="830" y="392" filter="url(#blurf)"/></g>
<rect x="828" y="390" width="624" height="304" fill="none" stroke="#3a3b3f" stroke-width="2"/>

<text x="110" y="730" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" letter-spacing="3" fill="#c7a86b">GOVMAP, 21&#8211;24 SEPTEMBER</text>
<text x="110" y="762" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#aaa9a5">2025 aerial layer, 13 cm a pixel</text>
<text x="110" y="794" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5">طبقة 2025 الجوية بدقة 13 سنتيمترًا</text>

<text x="830" y="730" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" letter-spacing="3" fill="#c7a86b">AFTER THE RE&#8209;BLUR</text>
<text x="830" y="762" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#aaa9a5">Same photography, blurred on zoom</text>
<text x="830" y="794" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5">الصور نفسها مع ضباب عند التقريب</text>

<rect x="110" y="822" width="1340" height="56" rx="8" fill="#17181b" stroke="#286344" stroke-width="2"/>
<text x="138" y="857" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Schematic, not the imagery itself. An analyst archived the layer before it went: about 2.5 billion pixels.</text>
</svg>

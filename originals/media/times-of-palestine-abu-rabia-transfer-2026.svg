<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="t">
  <title id="t">Two findings: the diglossia gap, and language transfer that runs backwards</title>
  <defs><style>.serif{font-family:"Source Serif 4",Georgia,serif}.sans{font-family:"Libre Franklin",Arial,sans-serif}.arabic{font-family:Cairo,Arial,sans-serif}</style>
  <marker id="ar" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#c7a86b"/></marker>
  <marker id="arg" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#4fb477"/></marker>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#8a1f2d"/></marker>
  <marker id="ars" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#3d4f6b"/></marker></defs>
  <rect width="1600" height="760" fill="#111214"/>
  <rect x="110" y="48" width="90" height="6" fill="#c7a86b"/>
  <text x="110" y="114" class="serif" fill="#f2eee8" font-size="40" font-weight="700">Two findings that moved the field</text>

  <!-- band 1: diglossia -->
  <g>
    <text x="110" y="196" class="sans" fill="#c7a86b" font-size="22" font-weight="700" letter-spacing="2">THE GAP</text>
    <rect x="110" y="224" width="380" height="120" rx="8" fill="#17181b" stroke="#3d4f6b" stroke-width="2"/>
    <text x="300" y="272" text-anchor="middle" class="arabic" fill="#f2eee8" font-size="34" font-weight="700">المحكية</text>
    <text x="300" y="312" text-anchor="middle" class="sans" fill="#aaa9a5" font-size="21">the Arabic a child speaks</text>
    <line x1="500" y1="284" x2="700" y2="284" stroke="#8a1f2d" stroke-width="5" marker-end="url(#arr)"/>
    <text x="600" y="262" text-anchor="middle" class="sans" fill="#f2eee8" font-size="21">day one of school</text>
    <rect x="712" y="224" width="380" height="120" rx="8" fill="#17181b" stroke="#c7a86b" stroke-width="2"/>
    <text x="902" y="272" text-anchor="middle" class="arabic" fill="#f2eee8" font-size="34" font-weight="700">الفصحى</text>
    <text x="902" y="312" text-anchor="middle" class="sans" fill="#aaa9a5" font-size="21">the Arabic a child reads</text>
    <text x="1118" y="268" class="sans" fill="#f2eee8" font-size="22">The further the two forms sit</text>
    <text x="1118" y="298" class="sans" fill="#f2eee8" font-size="22">apart, the slower the reading.</text>
    <text x="1118" y="330" class="sans" fill="#aaa9a5" font-size="20">Reading and Writing, 2000</text>
  </g>

  <!-- band 2: cognitive retroactive transfer -->
  <g>
    <text x="110" y="440" class="sans" fill="#4fb477" font-size="22" font-weight="700" letter-spacing="2">THE BACKWARD ARROW</text>
    <rect x="110" y="470" width="380" height="120" rx="8" fill="#17181b" stroke="#3d4f6b" stroke-width="2"/>
    <text x="300" y="520" text-anchor="middle" class="sans" fill="#f2eee8" font-size="27" font-weight="700">Arabic</text>
    <text x="300" y="556" text-anchor="middle" class="sans" fill="#aaa9a5" font-size="21">the first language</text>
    <rect x="712" y="470" width="380" height="120" rx="8" fill="#17181b" stroke="#3d4f6b" stroke-width="2"/>
    <text x="902" y="520" text-anchor="middle" class="sans" fill="#f2eee8" font-size="27" font-weight="700">English</text>
    <text x="902" y="556" text-anchor="middle" class="sans" fill="#aaa9a5" font-size="21">the foreign language</text>
    <line x1="500" y1="504" x2="700" y2="504" stroke="#3d4f6b" stroke-width="4" marker-end="url(#ars)" opacity=".6"/>
    <text x="600" y="486" text-anchor="middle" class="sans" fill="#aaa9a5" font-size="19">assumed</text>
    <line x1="700" y1="560" x2="500" y2="560" stroke="#4fb477" stroke-width="6" marker-end="url(#arg)"/>
    <text x="600" y="594" text-anchor="middle" class="sans" fill="#4fb477" font-size="21" font-weight="700">measured</text>
    <text x="1118" y="514" class="sans" fill="#f2eee8" font-size="22">Teach a struggling reader</text>
    <text x="1118" y="544" class="sans" fill="#f2eee8" font-size="22">English, and the Arabic</text>
    <text x="1118" y="574" class="sans" fill="#f2eee8" font-size="22">improves too.</text>
  </g>

  <rect x="110" y="646" width="1380" height="66" rx="8" fill="#17181b" stroke="#286344" stroke-width="2"/>
  <text x="140" y="688" class="sans" fill="#f2eee8" font-size="23">Cognitive Retroactive Transfer — Abu-Rabia, Shakkour and Siegel, Bilingual Research Journal, 2013</text>
  <text x="1460" y="688" text-anchor="end" class="sans" fill="#aaa9a5" font-size="19" letter-spacing="3">TIMES OF PALESTINE</text>
</svg>

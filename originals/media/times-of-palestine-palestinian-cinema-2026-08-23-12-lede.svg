<path d="M686 705 h50 m-12 -7 l12 7 l-12 7" fill="none" stroke="#aaa9a5" stroke-width="2.5"/>
<rect x="756" y="686" width="52" height="38" rx="4" fill="#2a1013" stroke="#8a1f2d" stroke-width="2"/>
<path d="M768 696 l28 18 M796 696 l-28 18" stroke="#C8102E" stroke-width="2.5"/>
<text x="90" y="748" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">ten cinemas during the 1970s</text>
<text x="756" y="748" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#e6a3ab">none since 1987</text>
<text x="90" y="790" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">al-Khadra · al-Samer · al-Jalaa · al-Nasr</text>
<text x="90" y="814" font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#aaa9a5">al-Nasr reopened 1994, burned a year later</text>

<!-- right: fund -->
<text x="1010" y="626" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="bold" letter-spacing="1.4" fill="#f2eee8">PALESTINE FILM FUND</text>
<text x="1010" y="658" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#c7a86b">صندوق فيلم فلسطين</text>
<text x="1010" y="694" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#f2eee8">Palestine Film Institute founded 2019</text>

<rect x="1166" y="340" width="330" height="160" fill="#1a1b1e" stroke="#33353a" stroke-width="1.5"/>
<text x="1186" y="374" font-family="'Source Serif 4',Georgia,serif" font-size="24" fill="#f2eee8">Once Upon a Time in Gaza</text>
<text x="1186" y="410" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Cannes, May 2025</text>
<text x="1186" y="434" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Partners withdrew promised funds</text>
<rect x="1186" y="458" width="214" height="30" rx="15" fill="#3a1119" stroke="#8a1f2d" stroke-width="1.5"/>
<text x="1200" y="478" font-family="'Libre Franklin',Arial,sans-serif" font-size="14" letter-spacing="1.1" fill="#e6a3ab">FUNDING WITHDRAWN</text>

<line x1="90" y1="580" x2="1510" y2="580" stroke="#2a2c30" stroke-width="2"/>
<line x1="960" y1="596" x2="960" y2="830" stroke="#2a2c30" stroke-width="2"/>

<!-- left: Gaza cinemas -->
<text x="90" y="626" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" font-weight="bold" letter-spacing="1.4" fill="#f2eee8">GAZA: NO CINEMA SINCE THE END OF 1987</text>
<text x="90" y="658" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#c7a86b">غزة بلا دور سينما منذ نهاية 1987</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Four Palestinian-related films and the screens they did or did not reach</title>
<desc id="dsc">A film-strip graphic with four frames: "No Other Land" (Academy Award March 2025, no US distributor, self-distributed at Film Forum on 31 January 2025 for about $26,000), "The Voice of Hind Rajab" (Venice premiere September 2025, nearly 23-minute ovation, a divided Hollywood), "Put Your Soul on Your Hand and Walk" (Cannes ACID 2025, North American rights sold to Kino Lorber; Fatma Hassona killed 16 April 2025) and "Once Upon a Time in Gaza" (Cannes May 2025, pledged funds withdrawn). Below, a row of ten cinema icons marks the ten cinemas Gaza had in the 1970s and none since the end of 1987, beside a panel on the Palestine Film Fund.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<pattern id="perf" width="60" height="40" patternUnits="userSpaceOnUse" patternTransform="translate(104,300)">
<rect x="0" y="10" width="18" height="12" rx="3" fill="#34373c"/>
</pattern>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<text x="90" y="112" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">US distributors keep award-winning</text>
<text x="90" y="164" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">Palestinian films off cinema screens</text>
<text x="90" y="214" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#c7a86b">أفلام فلسطينية بعيدة عن الشاشات الأميركية</text>

<line x1="90" y1="248" x2="1510" y2="248" stroke="#33353a" stroke-width="2"/>
<text x="90" y="284" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2.4" fill="#aaa9a5">FOUR FILMS · FOUR ROUTES TO A SCREEN</text>

<!-- film strip -->
<rect x="90" y="300" width="1420" height="240" rx="6" fill="#0d0e10" stroke="#2a2c30" stroke-width="2"/>
<rect x="104" y="300" width="1386" height="40" fill="url(#perf)"/>
<rect x="104" y="500" width="1386" height="40" fill="url(#perf)"/>

<!-- frame 1 -->
<rect x="104" y="340" width="330" height="160" fill="#1a1b1e" stroke="#33353a" stroke-width="1.5"/>
<text x="124" y="374" font-family="'Source Serif 4',Georgia,serif" font-size="24" fill="#f2eee8">No Other Land</text>
<text x="124" y="410" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Academy Award, March 2025</text>
<text x="124" y="434" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Film Forum, 31 Jan 2025: ~$26,000</text>
<rect x="124" y="458" width="216" height="30" rx="15" fill="#3a1119" stroke="#8a1f2d" stroke-width="1.5"/>
<text x="138" y="478" font-family="'Libre Franklin',Arial,sans-serif" font-size="14" letter-spacing="1.1" fill="#e6a3ab">NO US DISTRIBUTOR</text>

<!-- frame 2 -->
<rect x="458" y="340" width="330" height="160" fill="#1a1b1e" stroke="#33353a" stroke-width="1.5"/>
<text x="478" y="374" font-family="'Source Serif 4',Georgia,serif" font-size="24" fill="#f2eee8">The Voice of Hind Rajab</text>
<text x="478" y="410" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Venice premiere, Sept 2025</text>
<text x="478" y="434" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Nearly 23-minute ovation</text>
<rect x="478" y="458" width="200" height="30" rx="15" fill="#33290f" stroke="#c7a86b" stroke-width="1.5"/>
<text x="492" y="478" font-family="'Libre Franklin',Arial,sans-serif" font-size="14" letter-spacing="1.1" fill="#c7a86b">DIVIDED HOLLYWOOD</text>

<!-- frame 3 -->
<rect x="812" y="340" width="330" height="160" fill="#1a1b1e" stroke="#33353a" stroke-width="1.5"/>
<text x="832" y="372" font-family="'Source Serif 4',Georgia,serif" font-size="24" fill="#f2eee8">Put Your Soul on Your</text>
<text x="832" y="398" font-family="'Source Serif 4',Georgia,serif" font-size="24" fill="#f2eee8">Hand and Walk</text>
<text x="832" y="424" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Cannes ACID section, 2025</text>
<text x="832" y="446" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Fatma Hassona, killed 16 Apr 2025</text>
<rect x="832" y="458" width="252" height="30" rx="15" fill="#12301f" stroke="#286344" stroke-width="1.5"/>
<text x="846" y="478" font-family="'Libre Franklin',Arial,sans-serif" font-size="14" letter-spacing="1.1" fill="#59a97d">KINO LORBER — N. AMERICA</text>


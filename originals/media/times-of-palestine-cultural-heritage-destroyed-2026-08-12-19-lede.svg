<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Gaza's Central Archives and the Omari Mosque library destroyed: UNESCO's rising count of damaged cultural sites</title>
<desc id="dsc">Left: a bar chart of UNESCO-verified damaged cultural sites in Gaza — 22 in January 2024, 43 on 8 April 2024, 50 on 10 June 2024, 69 on 17 September 2024, 75 on 29 November 2024 and 164 on 24 March 2026. Right: an illustration of charred documents in an archive box, captioned for the Central Archives at Gaza City Hall, and the surviving lower half of the Great Omari Mosque minaret with the missing upper half drawn as a dashed outline, captioned for the mosque library. Bilingual English and Arabic labels.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="90" y="72" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="2.5" fill="#c7a86b">UNESCO: 164 CULTURAL SITES DAMAGED, VERIFIED 24 MARCH 2026</text>
<text x="90" y="128" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">Israel destroyed Gaza's Central Archives</text>
<text x="90" y="180" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">and the Omari Mosque library</text>
<text x="90" y="226" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#59a97d">إسرائيل تدمّر الأرشيف المركزي ومكتبة الجامع العمري</text>

<!-- chart -->
<text x="90" y="332" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">UNESCO-verified damaged cultural sites</text>
<text x="90" y="364" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5">مواقع ثقافية متضررة موثقة</text>


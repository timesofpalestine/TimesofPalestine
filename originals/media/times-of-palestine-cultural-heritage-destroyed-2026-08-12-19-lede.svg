<text x="1010" y="322" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="2" fill="#c7a86b">CENTRAL ARCHIVES, GAZA CITY HALL</text>
<text x="1010" y="368" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">Thousands of documents, 150 years of</text>
<text x="1010" y="398" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">records, burned by direct shelling</text>
<text x="1010" y="428" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">"turning them into ashes" - Yahya al-Sarraj</text>
<text x="1010" y="470" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#59a97d">الأرشيف المركزي في بلدية غزة</text>


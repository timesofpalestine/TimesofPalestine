<rect x="720" y="560" width="800" height="270" rx="10" fill="#16171a" fill-opacity="0.6" stroke="#2c2d31"/>

<path d="M805,680 L805,600 L862,600 M805,600 Q833,566 862,600 L862,680" fill="none" stroke="#c7a86b" stroke-width="2" stroke-dasharray="7 7" opacity="0.45"/>

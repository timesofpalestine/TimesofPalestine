<text x="1010" y="632" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="2" fill="#c7a86b">GREAT OMARI MOSQUE LIBRARY</text>
<text x="1010" y="678" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">Wrecked 8 December 2023; rare books</text>
<text x="1010" y="708" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">including 14th-century works</text>
<text x="1010" y="738" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#aaa9a5">200+ manuscripts digitised in 2022</text>
<text x="1010" y="780" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#59a97d">مكتبة الجامع العمري الكبير</text>

<text x="90" y="864" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#aaa9a5">Sources: UNESCO preliminary assessment, 24 March 2026; Museums Association and ICOM UK; Anadolu; LAP, 1 Feb 2024</text>

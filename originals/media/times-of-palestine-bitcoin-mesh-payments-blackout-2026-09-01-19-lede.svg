<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">Israeli strikes cut the networks Gaza's new digital money needs</title>
<desc id="dsc">Graphic showing Gaza's 2025 fibre outage log along a broken cable line — blackout from 11 June 2025, partial return 14 June, fresh cut 16 June, communications lost again 17 June, Paltel feeder routes struck 17 September — alongside a bar chart of digital wallet balances rising from about $40 million in January 2025 to more than $115 million in June 2025, and a panel listing offline payment tools with no published record of use inside Gaza.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="cable" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#c7a86b"/>
<stop offset="1" stop-color="#8a6f3c"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- HEADLINE -->
<text x="90" y="112" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">Israeli strikes cut the networks Gaza's</text>
<text x="90" y="164" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">new digital money needs</text>
<text x="90" y="210" font-family="Cairo,Arial,sans-serif" font-size="28" fill="#c7a86b">الضربات تقطع الشبكات التي يحتاجها المال الرقمي في غزة</text>
<line x1="90" y1="238" x2="1530" y2="238" stroke="#3a3b3f" stroke-width="2"/>

<!-- FIBRE LOG -->
<text x="120" y="292" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="3" fill="#aaa9a5">GAZA'S FIBRE: 2025 OUTAGE LOG</text>
<text x="560" y="292" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#59a97d">سجل انقطاع الإنترنت في غزة 2025</text>

<!-- cable segments with gaps at each event -->
<g stroke="url(#cable)" stroke-width="9" stroke-linecap="round">
<line x1="120" y1="358" x2="178" y2="358"/>
<line x1="224" y1="358" x2="488" y2="358"/>
<line x1="534" y1="358" x2="798" y2="358"/>
<line x1="844" y1="358" x2="1108" y2="358"/>
<line x1="1154" y1="358" x2="1418" y2="358"/>
<line x1="1464" y1="358" x2="1520" y2="358"/>
</g>

<!-- event markers -->
<g>
<circle cx="200" cy="358" r="20" fill="#1d1e21" stroke="#C8102E" stroke-width="4"/>
<path d="M191 349 L209 367 M209 349 L191 367" stroke="#C8102E" stroke-width="4" stroke-linecap="round"/>

<circle cx="510" cy="358" r="20" fill="#1d1e21" stroke="#59a97d" stroke-width="4"/>
<path d="M501 358 L508 366 L520 351" fill="none" stroke="#59a97d" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<circle cx="820" cy="358" r="20" fill="#1d1e21" stroke="#C8102E" stroke-width="4"/>
<path d="M811 349 L829 367 M829 349 L811 367" stroke="#C8102E" stroke-width="4" stroke-linecap="round"/>

<circle cx="1130" cy="358" r="20" fill="#1d1e21" stroke="#C8102E" stroke-width="4"/>
<path d="M1121 349 L1139 367 M1139 349 L1121 367" stroke="#C8102E" stroke-width="4" stroke-linecap="round"/>

<circle cx="1440" cy="358" r="20" fill="#1d1e21" stroke="#C8102E" stroke-width="4"/>
<path d="M1431 349 L1449 367 M1449 349 L1431 367" stroke="#C8102E" stroke-width="4" stroke-linecap="round"/>
</g>

<g font-family="'Libre Franklin',Arial,sans-serif" text-anchor="middle">
<text x="200" y="412" font-size="16" fill="#f2eee8">11 JUN 2025</text>
<text x="200" y="434" font-size="13" fill="#aaa9a5">third near-total blackout</text>

<text x="510" y="412" font-size="16" fill="#59a97d">14 JUN 2025</text>
<text x="510" y="434" font-size="13" fill="#aaa9a5">partial service returns</text>

<text x="820" y="412" font-size="16" fill="#f2eee8">16 JUN 2025</text>
<text x="820" y="434" font-size="13" fill="#aaa9a5">fresh cut: south and centre</text>

<text x="1130" y="412" font-size="16" fill="#f2eee8">17 JUN 2025</text>
<text x="1130" y="434" font-size="13" fill="#aaa9a5">comms lost again</text>

<text x="1440" y="412" font-size="16" fill="#f2eee8">17 SEP 2025</text>
<text x="1440" y="434" font-size="13" fill="#aaa9a5" textLength="144" lengthAdjust="spacingAndGlyphs">Paltel feeder routes hit</text>
</g>

<line x1="90" y1="470" x2="1530" y2="470" stroke="#3a3b3f" stroke-width="2"/>

<!-- BAR CHART -->
<text x="120" y="518" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2" fill="#aaa9a5">DIGITAL WALLET BALANCES IN GAZA</text>
<text x="120" y="546" font-family="Cairo,Arial,sans-serif" font-size="17" fill="#59a97d">أرصدة المحافظ الرقمية في غزة</text>

<line x1="180" y1="790" x2="520" y2="790" stroke="#55565a" stroke-width="2"/>
<rect x="200" y="720" width="100" height="70" fill="#286344"/>
<rect x="380" y="590" width="100" height="200" fill="#59a97d"/>
<text x="250" y="706" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8" text-anchor="middle">$40m</text>
<text x="430" y="576" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8" text-anchor="middle">$115m</text>
<text x="250" y="814" font-family="'Libre Franklin',Arial,sans-serif" font-size="14" fill="#aaa9a5" text-anchor="middle">JAN 2025</text>
<text x="430" y="814" font-family="'Libre Franklin',Arial,sans-serif" font-size="14" fill="#aaa9a5" text-anchor="middle">JUN 2025</text>

<g font-family="'Libre Franklin',Arial,sans-serif" font-size="15" fill="#f2eee8">
<text x="545" y="620">790,000 active users</text>
<text x="545" y="650">2.8m transactions, iBURAQ</text>
<text x="545" y="680">nearly 1,000 merchants</text>
<text x="545" y="712" fill="#aaa9a5" font-size="13">Hudson Institute; UNCDF, June 2026</text>
</g>

<!-- OFFLINE PANEL -->
<rect x="800" y="490" width="730" height="310" rx="10" fill="#17181b" stroke="#8a1f2d" stroke-width="2" stroke-dasharray="10 8"/>
<text x="830" y="536" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" letter-spacing="2" fill="#c7a86b">OFFLINE ALTERNATIVES</text>
<text x="830" y="566" font-family="Cairo,Arial,sans-serif" font-size="17" fill="#59a97d">بدائل تعمل دون إنترنت</text>

<g font-family="'Libre Franklin',Arial,sans-serif" font-size="16" fill="#f2eee8">
<circle cx="838" cy="605" r="5" fill="#c7a86b"/><text x="858" y="611">Cashu ecash, sent over Bluetooth or NFC</text>
<circle cx="838" cy="640" r="5" fill="#c7a86b"/><text x="858" y="646">Bitchat BLE mesh: messages, not settlement</text>
<circle cx="838" cy="675" r="5" fill="#c7a86b"/><text x="858" y="681">Meshtastic LoRa radio: 2 to 5 km typical</text>
<circle cx="838" cy="710" r="5" fill="#c7a86b"/><text x="858" y="716">Satellite blockchain feed: one-way only</text>
</g>

<line x1="830" y1="738" x2="1500" y2="738" stroke="#3a3b3f" stroke-width="2"/>
<text x="830" y="772" font-family="'Libre Franklin',Arial,sans-serif" font-size="18" fill="#C8102E">Value moved offline inside Gaza: no published figure</text>

<!-- FOOTER -->
<text x="90" y="862" font-family="'Libre Franklin',Arial,sans-serif" font-size="13" fill="#aaa9a5">Sources: UNCDF, Hudson Institute, FEWS NET, EFF and 7amleh, PTRA, ETC, Access Now, Paltel, Palestine Monetary Authority</text>
<text x="1530" y="862" font-family="Cairo,Arial,sans-serif" font-size="14" fill="#aaa9a5" text-anchor="end">Times of Palestine</text>
</svg>
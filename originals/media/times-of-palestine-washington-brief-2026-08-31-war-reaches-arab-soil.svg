<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Five days: from an Omani corridor to missiles over Jordan</title>
  <desc id="desc">A bilingual timeline of the American-Iranian exchange between 25 and 31 August 2026 — the Iran-Oman temporary Hormuz corridor, the US strike on Larak Island, the Revolutionary Guard's missiles at bases in Jordan and the United Arab Emirates, and President Trump's promise of a response — with four figures on the war's cost, the oil price, the American presence in Jordan and the Palestinian refugee population there.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#286344"/>
      <stop offset=".55" stop-color="#c7a86b"/>
      <stop offset="1" stop-color="#8a1f2d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f2eee8}
      .muted{fill:#aaa9a5}
      .gold{fill:#c7a86b}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:16px}
      .small{font-size:19px}
      .body{font-size:22px}
      .label{font-size:17px;font-weight:800;letter-spacing:1.2px}
      .figure{font-size:44px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#286344"/>

  <text x="80" y="76" class="serif ivory" font-size="46" font-weight="800">Five days: from an Omani corridor to missiles over Jordan</text>
  <text x="80" y="120" class="sans muted body">25–31 August 2026. The American war on Iran returns, and the answer lands on Arab soil.</text>
  <text x="1520" y="164" class="arabic ivory" font-size="36" font-weight="800" text-anchor="end">خمسة أيام.. من ممر عُماني إلى صواريخ فوق الأردن</text>
  <text x="1520" y="197" class="arabic muted small" text-anchor="end">25-31 آب/أغسطس 2026: الحرب الأميركية على إيران تعود، والرد يسقط على أرض عربية</text>

  <line x1="200" y1="268" x2="1400" y2="268" stroke="url(#track)" stroke-width="6" stroke-linecap="round"/>
  <circle cx="230" cy="268" r="13" fill="#286344" stroke="#111214" stroke-width="4"/>
  <circle cx="610" cy="268" r="13" fill="#c7a86b" stroke="#111214" stroke-width="4"/>
  <circle cx="990" cy="268" r="13" fill="#8a1f2d" stroke="#111214" stroke-width="4"/>
  <circle cx="1370" cy="268" r="13" fill="#8a1f2d" stroke="#111214" stroke-width="4"/>

  <g filter="url(#shadow)">
    <rect x="80" y="300" width="300" height="252" rx="16" fill="#27282c" stroke="#286344" stroke-width="2"/>
    <text x="104" y="338" class="sans green label">25–26 AUGUST</text>
    <text x="104" y="374" class="sans ivory small" font-weight="700">Oman and Iran agree</text>
    <text x="104" y="399" class="sans ivory small" font-weight="700">a temporary Hormuz lane</text>
    <text x="104" y="430" class="sans muted tiny">A corridor 11.3 km wide and a</text>
    <text x="104" y="452" class="sans muted tiny">phased mine-clearing framework,</text>
    <text x="104" y="474" class="sans muted tiny">Tehran's deputy foreign minister said.</text>
    <text x="356" y="510" class="arabic muted tiny" text-anchor="end">مسقط وطهران تتفقان على ممر</text>
    <text x="356" y="532" class="arabic muted tiny" text-anchor="end">ملاحي مؤقت عرضه 11.3 كيلومترا</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="460" y="300" width="300" height="252" rx="16" fill="#27282c" stroke="#c7a86b" stroke-width="2"/>
    <text x="484" y="338" class="sans gold label">SUNDAY 30 AUGUST</text>
    <text x="484" y="374" class="sans ivory small" font-weight="700">US forces strike Larak</text>
    <text x="484" y="399" class="sans ivory small" font-weight="700">Island in the Gulf</text>
    <text x="484" y="430" class="sans muted tiny">Two Revolutionary Guard rocket</text>
    <text x="484" y="452" class="sans muted tiny">launchers. CENTCOM called it</text>
    <text x="484" y="474" class="sans muted tiny">"limited, precise action".</text>
    <text x="736" y="510" class="arabic muted tiny" text-anchor="end">القوات الأميركية تقصف جزيرة لارك</text>
    <text x="736" y="532" class="arabic muted tiny" text-anchor="end">وتصيب منصتي صواريخ للحرس الثوري</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="300" width="300" height="252" rx="16" fill="#27282c" stroke="#dc6572" stroke-width="3"/>
    <text x="864" y="338" class="sans red label">MONDAY 31 AUGUST</text>
    <text x="864" y="374" class="sans ivory small" font-weight="700">The Guard fires at bases</text>
    <text x="864" y="399" class="sans ivory small" font-weight="700">in Jordan and the UAE</text>
    <text x="864" y="430" class="sans muted tiny">Jordan's army says it intercepted</text>
    <text x="864" y="452" class="sans muted tiny">eight missiles in its airspace; the</text>
    <text x="864" y="474" class="sans muted tiny">UAE engaged a drone offshore.</text>
    <text x="1116" y="510" class="arabic muted tiny" text-anchor="end">الحرس الثوري يقصف قواعد في الأردن</text>
    <text x="1116" y="532" class="arabic muted tiny" text-anchor="end">والإمارات.. وعمّان تعترض ثمانية صواريخ</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1220" y="300" width="300" height="252" rx="16" fill="#27282c" stroke="#8a1f2d" stroke-width="3"/>
    <text x="1244" y="338" class="sans red label">MONDAY 31 AUGUST</text>
    <text x="1244" y="374" class="sans ivory small" font-weight="700">Trump promises more</text>
    <text x="1244" y="399" class="sans ivory small" font-weight="700">force, not talks</text>
    <text x="1244" y="430" class="sans muted tiny">"We're going to hit them hard,"</text>
    <text x="1244" y="452" class="sans muted tiny">he told Fox News. The White House</text>
    <text x="1244" y="474" class="sans muted tiny">says no talks run with Tehran.</text>
    <text x="1496" y="510" class="arabic muted tiny" text-anchor="end">ترامب يتوعد بالرد: «سنضربهم بقوة»</text>
    <text x="1496" y="532" class="arabic muted tiny" text-anchor="end">والبيت الأبيض ينفي وجود مفاوضات</text>
  </g>

  <text x="80" y="614" class="sans gold label">WHAT THE SIXTH MONTH COSTS</text>
  <text x="1520" y="614" class="arabic gold label" text-anchor="end">كلفة الشهر السادس</text>

  <g filter="url(#shadow)">
    <rect x="80" y="636" width="300" height="184" rx="16" fill="#232427" stroke="#3a3b3f" stroke-width="2"/>
    <text x="104" y="700" class="serif ivory figure">18 / 759</text>
    <text x="104" y="734" class="sans muted tiny">US service members killed and</text>
    <text x="104" y="756" class="sans muted tiny">wounded since 28 February</text>
    <text x="356" y="792" class="arabic muted tiny" text-anchor="end">قتلى وجرحى الجنود الأميركيين منذ 28 شباط</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="460" y="636" width="300" height="184" rx="16" fill="#232427" stroke="#3a3b3f" stroke-width="2"/>
    <text x="484" y="700" class="serif ivory figure">+24%</text>
    <text x="484" y="734" class="sans muted tiny">Brent crude against its level</text>
    <text x="484" y="756" class="sans muted tiny">before the war, near $90 a barrel</text>
    <text x="736" y="792" class="arabic muted tiny" text-anchor="end">ارتفاع خام برنت عن مستواه قبل الحرب</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="636" width="300" height="184" rx="16" fill="#232427" stroke="#3a3b3f" stroke-width="2"/>
    <text x="864" y="700" class="serif ivory figure">4,000</text>
    <text x="864" y="734" class="sans muted tiny">US defence personnel in Jordan,</text>
    <text x="864" y="756" class="sans muted tiny">on over $1.5bn a year in aid</text>
    <text x="1116" y="792" class="arabic muted tiny" text-anchor="end">عسكريون أميركيون في الأردن ومساعدات سنوية</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1220" y="636" width="300" height="184" rx="16" fill="#232427" stroke="#3a3b3f" stroke-width="2"/>
    <text x="1244" y="700" class="serif ivory figure">2.39m</text>
    <text x="1244" y="734" class="sans muted tiny">Palestine refugees registered in</text>
    <text x="1244" y="756" class="sans muted tiny">Jordan, UNRWA's largest field</text>
    <text x="1496" y="792" class="arabic muted tiny" text-anchor="end">لاجئون فلسطينيون مسجلون في الأردن</text>
  </g>

  <text x="80" y="866" class="sans muted tiny">Times of Palestine · Washington Brief, 31 August 2026 · CENTCOM, IRNA, Jordan's armed forces, the UAE defence ministry, Al Jazeera, UNRWA</text>
  <text x="1520" y="866" class="arabic muted tiny" text-anchor="end">تايمز أوف فلسطين · موجز واشنطن</text>
</svg>

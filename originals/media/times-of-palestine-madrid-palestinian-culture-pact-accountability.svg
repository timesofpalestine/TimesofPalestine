<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">What Madrid agreed and what the Palestinian culture pact still needs</title>
  <desc id="desc">A bilingual accountability graphic showing the Madrid declaration's signatories and principles, the missing budget, secretariat, timeline and targets, and the documented scale of Palestinian cultural recovery needs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#182b3d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="13" flood-color="#000000" flood-opacity=".26"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="58" y="48" width="1484" height="804" rx="32" fill="#0e1b27" stroke="#334d60" stroke-width="2" filter="url(#shadow)"/>

  <text x="106" y="116" fill="#ffffff" font-family="Arial, sans-serif" font-size="42" font-weight="700">A pact promised. A delivery system still to build.</text>
  <text x="1290" y="168" text-anchor="middle" direction="rtl" fill="#e5eef4" font-family="Arial, sans-serif" font-size="33" font-weight="700">وعد بميثاق وآلية تنفيذ لم تُبنَ بعد</text>
  <text x="106" y="166" fill="#91adbd" font-family="Arial, sans-serif" font-size="22">Madrid, 16 July 2026 • Palestinian culture and heritage</text>

  <rect x="106" y="218" width="650" height="330" rx="24" fill="#142c2a" stroke="#2a9d68" stroke-width="3"/>
  <text x="148" y="272" fill="#66d19e" font-family="Arial, sans-serif" font-size="24" font-weight="700">WHAT THE DECLARATION CONTAINS</text>
  <text x="605" y="310" text-anchor="middle" direction="rtl" fill="#bcebd3" font-family="Arial, sans-serif" font-size="23" font-weight="700">ما يتضمنه الإعلان</text>
  <text x="148" y="370" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="700">28</text>
  <text x="252" y="358" fill="#d9e8e1" font-family="Arial, sans-serif" font-size="24">governments signed</text>
  <text x="615" y="404" text-anchor="middle" direction="rtl" fill="#d9e8e1" font-family="Arial, sans-serif" font-size="22">وقّعت 28 حكومة</text>
  <text x="148" y="462" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="700">3</text>
  <text x="216" y="450" fill="#d9e8e1" font-family="Arial, sans-serif" font-size="24">shared principles</text>
  <text x="615" y="496" text-anchor="middle" direction="rtl" fill="#d9e8e1" font-family="Arial, sans-serif" font-size="22">ثلاثة مبادئ مشتركة</text>

  <rect x="844" y="218" width="650" height="330" rx="24" fill="#31251b" stroke="#d9a441" stroke-width="3"/>
  <text x="886" y="272" fill="#f0c36c" font-family="Arial, sans-serif" font-size="24" font-weight="700">NOT SPECIFIED IN THE TEXT</text>
  <text x="1340" y="310" text-anchor="middle" direction="rtl" fill="#f4d9a6" font-family="Arial, sans-serif" font-size="23" font-weight="700">ما لم يحدده النص</text>
  <g fill="#ffffff" font-family="Arial, sans-serif" font-size="22">
    <text x="886" y="357">• Budget or contribution table</text>
    <text x="886" y="418">• Secretariat or governing body</text>
    <text x="886" y="479">• Start date, milestones or targets</text>
  </g>
  <g fill="#f0dcc1" font-family="Arial, sans-serif" font-size="19">
    <text x="1350" y="386" text-anchor="middle" direction="rtl">ميزانية أو جدول مساهمات</text>
    <text x="1350" y="447" text-anchor="middle" direction="rtl">أمانة عامة أو جهة حاكمة</text>
    <text x="1350" y="508" text-anchor="middle" direction="rtl">موعد بدء أو أهداف قابلة للقياس</text>
  </g>

  <rect x="106" y="588" width="1388" height="178" rx="24" fill="#172838" stroke="#466579" stroke-width="2"/>
  <text x="148" y="637" fill="#89a8ba" font-family="Arial, sans-serif" font-size="21" font-weight="700">DOCUMENTED SCALE</text>
  <text x="148" y="704" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="700">$230m</text>
  <text x="348" y="692" fill="#cadbe5" font-family="Arial, sans-serif" font-size="23">cultural-heritage recovery needs</text>
  <line x1="775" y1="624" x2="775" y2="730" stroke="#466579" stroke-width="2"/>
  <text x="844" y="704" fill="#ffffff" font-family="Arial, sans-serif" font-size="52" font-weight="700">164</text>
  <text x="986" y="692" fill="#cadbe5" font-family="Arial, sans-serif" font-size="23">sites with damage verified by UNESCO</text>
  <text x="560" y="741" text-anchor="middle" direction="rtl" fill="#9fb8c7" font-family="Arial, sans-serif" font-size="20">احتياجات تعافي التراث الثقافي</text>
  <text x="1280" y="741" text-anchor="middle" direction="rtl" fill="#9fb8c7" font-family="Arial, sans-serif" font-size="20">موقعاً تحققت اليونسكو من تضررها</text>

  <text x="106" y="817" fill="#718f9f" font-family="Arial, sans-serif" font-size="18">Sources: Madrid Final Declaration; 2026 Rapid Damage and Needs Assessment; UNESCO damage register</text>
  <text x="1492" y="817" text-anchor="end" fill="#718f9f" font-family="Arial, sans-serif" font-size="18">Graphic: Times of Palestine</text>
</svg>

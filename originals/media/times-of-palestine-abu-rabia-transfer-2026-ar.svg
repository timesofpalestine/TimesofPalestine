<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="t">
  <title id="t">اكتشافان: فجوة الازدواج اللغوي، ونقل لغوي يسير إلى الوراء</title>
  <defs><style>.sans{font-family:"Libre Franklin",Arial,sans-serif}.arabic{font-family:Cairo,Arial,sans-serif}</style>
  <marker id="ar" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#c7a86b"/></marker>
  <marker id="arg" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#4fb477"/></marker>
  <marker id="arr" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#8a1f2d"/></marker>
  <marker id="ars" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto">
    <path d="M0 0 L10 5 L0 10 z" fill="#3d4f6b"/></marker></defs>
  <rect width="1600" height="760" fill="#111214"/>
  <rect x="1400" y="48" width="90" height="6" fill="#c7a86b"/>
  <text x="1490" y="114" text-anchor="end" class="arabic" fill="#f2eee8" font-size="40" font-weight="700">اكتشافان حرّكا الحقل</text>

  <g>
    <text x="1490" y="196" text-anchor="end" class="arabic" fill="#c7a86b" font-size="24" font-weight="700">الفجوة</text>
    <rect x="1110" y="224" width="380" height="120" rx="8" fill="#17181b" stroke="#3d4f6b" stroke-width="2"/>
    <text x="1300" y="272" text-anchor="middle" class="arabic" fill="#f2eee8" font-size="34" font-weight="700">المحكية</text>
    <text x="1300" y="312" text-anchor="middle" class="arabic" fill="#aaa9a5" font-size="22">العربية التي يتكلمها الطفل</text>
    <line x1="1100" y1="284" x2="900" y2="284" stroke="#8a1f2d" stroke-width="5" marker-end="url(#arr)"/>
    <text x="1000" y="262" text-anchor="middle" class="arabic" fill="#f2eee8" font-size="22">أول يوم مدرسة</text>
    <rect x="508" y="224" width="380" height="120" rx="8" fill="#17181b" stroke="#c7a86b" stroke-width="2"/>
    <text x="698" y="272" text-anchor="middle" class="arabic" fill="#f2eee8" font-size="34" font-weight="700">الفصحى</text>
    <text x="698" y="312" text-anchor="middle" class="arabic" fill="#aaa9a5" font-size="22">العربية التي يقرأها الطفل</text>
    <text x="482" y="268" text-anchor="end" class="arabic" fill="#f2eee8" font-size="23">كلما ابتعدت الصيغتان</text>
    <text x="482" y="300" text-anchor="end" class="arabic" fill="#f2eee8" font-size="23">تباطأت القراءة</text>
    <text x="482" y="332" text-anchor="end" class="arabic" fill="#aaa9a5" font-size="21">مجلة القراءة والكتابة، 2000</text>
  </g>

  <g>
    <text x="1490" y="440" text-anchor="end" class="arabic" fill="#4fb477" font-size="24" font-weight="700">السهم المعاكس</text>
    <rect x="1110" y="470" width="380" height="120" rx="8" fill="#17181b" stroke="#3d4f6b" stroke-width="2"/>
    <text x="1300" y="520" text-anchor="middle" class="arabic" fill="#f2eee8" font-size="30" font-weight="700">العربية</text>
    <text x="1300" y="558" text-anchor="middle" class="arabic" fill="#aaa9a5" font-size="22">اللغة الأم</text>
    <rect x="508" y="470" width="380" height="120" rx="8" fill="#17181b" stroke="#3d4f6b" stroke-width="2"/>
    <text x="698" y="520" text-anchor="middle" class="arabic" fill="#f2eee8" font-size="30" font-weight="700">الإنجليزية</text>
    <text x="698" y="558" text-anchor="middle" class="arabic" fill="#aaa9a5" font-size="22">اللغة الأجنبية</text>
    <line x1="1100" y1="504" x2="900" y2="504" stroke="#3d4f6b" stroke-width="4" marker-end="url(#ars)" opacity=".6"/>
    <text x="1000" y="486" text-anchor="middle" class="arabic" fill="#aaa9a5" font-size="20">المفترض</text>
    <line x1="900" y1="560" x2="1100" y2="560" stroke="#4fb477" stroke-width="6" marker-end="url(#arg)"/>
    <text x="1000" y="596" text-anchor="middle" class="arabic" fill="#4fb477" font-size="22" font-weight="700">المقاس</text>
    <text x="482" y="514" text-anchor="end" class="arabic" fill="#f2eee8" font-size="23">علّم قارئاً متعثراً الإنجليزية</text>
    <text x="482" y="548" text-anchor="end" class="arabic" fill="#f2eee8" font-size="23">فتتحسن عربيته هي أيضاً</text>
  </g>

  <rect x="110" y="646" width="1380" height="66" rx="8" fill="#17181b" stroke="#286344" stroke-width="2"/>
  <text x="1460" y="688" text-anchor="end" class="arabic" fill="#f2eee8" font-size="23">النقل الفكري التراجعي — أبو ربيعة وشقور وسيغل، مجلة البحوث ثنائية اللغة، 2013</text>
  <text x="140" y="688" class="sans" fill="#aaa9a5" font-size="19" letter-spacing="3">TIMES OF PALESTINE</text>
</svg>

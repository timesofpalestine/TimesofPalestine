  <text x="90" y="205" class="sans muted" font-size="26">Carrying the flag onto the world's fields</text>
  <text x="1510" y="150" class="arabic ivory" font-size="48" font-weight="700" text-anchor="end">الرياضيون</text>
  <text x="1510" y="205" class="arabic muted" font-size="26" text-anchor="end">يحملون العلم إلى ملاعب العالم</text>

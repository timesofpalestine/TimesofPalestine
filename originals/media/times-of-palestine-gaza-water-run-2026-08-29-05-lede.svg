<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="t d">
<title id="t">Nine in ten Gaza households short of water</title>
<desc id="d">Chart for Times of Palestine. Left panel: ten droplet symbols, nine highlighted, showing 90 per cent of people in Gaza living with moderate-to-high water insecurity in early July, up from 84 per cent in June, with UNICEF's figure of 82 per cent of families. Right panel: bars comparing drinking water available in Gaza of 4.5 to 6 litres per person per day, reported by OCHA on 27 March 2026, against the 15 litre emergency standard shown as a dashed gold outline. Source: OCHA Humanitarian Situation Report, 14 August 2026.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<linearGradient id="barfill" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#C8102E"/>
<stop offset="1" stop-color="#8a1f2d"/>
</linearGradient>
<path id="drop" d="M0,-34 C20,-8 28,4 28,15 A28,28 0 0 1 -28,15 C-28,4 -20,-8 0,-34 Z"/>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="90" y="70" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" letter-spacing="5" fill="#c7a86b">GAZA · WATER SUPPLY</text>
<text x="90" y="126" font-family="'Source Serif 4',Georgia,serif" font-size="46" fill="#f2eee8">Nine in ten Gaza households short of water</text>
<text x="90" y="172" font-family="Cairo,Arial,sans-serif" font-size="30" fill="#59a97d" text-anchor="start" direction="rtl">تسع من كل عشر أسر في غزة تعاني نقص المياه</text>
<line x1="90" y1="200" x2="1510" y2="200" stroke="#2f3034" stroke-width="2"/>

<!-- divider -->
<line x1="800" y1="240" x2="800" y2="770" stroke="#2f3034" stroke-width="2"/>

<!-- PANEL A -->
<text x="90" y="278" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" letter-spacing="3" fill="#c7a86b">WATER-INSECURE PEOPLE</text>
<text x="90" y="312" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5" text-anchor="start" direction="rtl">من يعانون انعدام الأمن المائي</text>

<g fill="#C8102E">
<use href="#drop" x="0" y="0" transform="translate(160,420)"/>
<use href="#drop" x="0" y="0" transform="translate(285,420)"/>
<use href="#drop" x="0" y="0" transform="translate(410,420)"/>
<use href="#drop" x="0" y="0" transform="translate(535,420)"/>
<use href="#drop" x="0" y="0" transform="translate(660,420)"/>
<use href="#drop" x="0" y="0" transform="translate(160,545)"/>
<use href="#drop" x="0" y="0" transform="translate(285,545)"/>
<use href="#drop" x="0" y="0" transform="translate(410,545)"/>
<use href="#drop" x="0" y="0" transform="translate(535,545)"/>
</g>
<g fill="none" stroke="#4a4b4f" stroke-width="3">
<use href="#drop" x="0" y="0" transform="translate(660,545)"/>
</g>

<text x="90" y="662" font-family="'Source Serif 4',Georgia,serif" font-size="52" fill="#f2eee8">90%</text>
<text x="215" y="662" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#f2eee8">moderate-to-high water insecurity, early July</text>
<text x="90" y="700" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">Up from 84% in June — survey cited by OCHA</text>
<text x="90" y="732" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">82% of families water-insecure — UNICEF, 21 July 2026</text>

<!-- PANEL B -->
<text x="860" y="278" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" letter-spacing="3" fill="#c7a86b">LITRES PER PERSON PER DAY</text>
<text x="860" y="312" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5" text-anchor="start" direction="rtl">لترات للفرد في اليوم</text>

<line x1="860" y1="660" x2="1480" y2="660" stroke="#4a4b4f" stroke-width="2"/>

<!-- 15 L standard reference -->
<line x1="860" y1="400" x2="1480" y2="400" stroke="#c7a86b" stroke-width="2" stroke-dasharray="8 8"/>
<text x="1160" y="388" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#c7a86b">15 L — emergency standard used by OCHA</text>

<rect x="890" y="582" width="110" height="78" fill="url(#barfill)"/>
<rect x="1050" y="556" width="110" height="104" fill="url(#barfill)"/>
<rect x="1210" y="400" width="110" height="260" fill="none" stroke="#c7a86b" stroke-width="3" stroke-dasharray="6 7"/>

<text x="890" y="566" font-family="'Source Serif 4',Georgia,serif" font-size="34" fill="#f2eee8">4.5</text>
<text x="1050" y="540" font-family="'Source Serif 4',Georgia,serif" font-size="34" fill="#f2eee8">6</text>
<text x="1210" y="384" font-family="'Source Serif 4',Georgia,serif" font-size="34" fill="#c7a86b">15</text>

<text x="890" y="692" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">low</text>
<text x="1050" y="692" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">high</text>
<text x="1210" y="692" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">standard</text>

<text x="860" y="732" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#f2eee8">Drinking water available in Gaza, 4.5–6 L — OCHA, 27 March 2026</text>

<!-- footer strip -->
<line x1="90" y1="790" x2="1510" y2="790" stroke="#2f3034" stroke-width="2"/>
<text x="90" y="826" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#59a97d">About 80% of the population relies on water trucking for drinking water — WASH Cluster, cited by UNRWA</text>
<text x="90" y="858" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Source: OCHA Humanitarian Situation Report, 14 August 2026; OCHA, 27 March 2026; UNICEF, 21 July 2026</text>
<text x="90" y="884" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#aaa9a5" text-anchor="start" direction="rtl">المصدر: أوتشا، 14 أغسطس 2026</text>
</svg>
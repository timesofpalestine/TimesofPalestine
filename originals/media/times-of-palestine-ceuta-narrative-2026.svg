<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Ceuta: the crisis and the narrative</title>
  <desc id="d">Diagram of the Ceuta crisis narrative: Madrid, Rabat and Tel Aviv as three nodes; a solid line marks the documented Morocco-Spain rupture at Ceuta, a dashed line with a question mark marks the alleged, unproven Morocco-Israel coordination; a ledger below separates what is documented from what is not. English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}.gold{fill:#c7a86b}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <text x="70" y="80" class="sans ivory" font-size="44" font-weight="800">CEUTA: THE CRISIS AND THE NARRATIVE</text>
  <text x="1530" y="80" class="arabic ivory" font-size="36" font-weight="700" text-anchor="end">سبتة: الأزمة والرواية</text>

  <!-- documented rupture line -->
  <path d="M400 330 L800 560" stroke="#8a1f2d" stroke-width="6"/>
  <text x="530" y="470" class="sans" fill="#e0808a" font-size="21" transform="rotate(30 530 470)">DOCUMENTED RUPTURE · قطيعة موثقة</text>
  <!-- alleged coordination line -->
  <path d="M1200 330 L800 560" stroke="#c7a86b" stroke-width="5" stroke-dasharray="10 10"/>
  <circle cx="1030" cy="430" r="26" fill="#16161a" stroke="#c7a86b" stroke-width="3"/>
  <text x="1030" y="440" class="mono gold" font-size="30" font-weight="700" text-anchor="middle">?</text>
  <text x="1160" y="470" class="sans gold" font-size="21" transform="rotate(-30 1160 470)">ALLEGED · UNPROVEN · رواية بلا دليل</text>
  <path d="M400 330 L1200 330" stroke="#3d4f6b" stroke-width="4" stroke-dasharray="4 8"/>
  <text x="800" y="312" class="sans muted" font-size="20" text-anchor="middle">frozen relations · recognition, "genocide", cancelled arms deals</text>

  <!-- nodes -->
  <g filter="url(#sh)" text-anchor="middle">
    <rect x="270" y="270" width="260" height="80" rx="12" fill="#16161a" stroke="#8a1f2d" stroke-width="4"/>
    <text x="400" y="305" class="sans ivory" font-size="26" font-weight="800">MADRID</text>
    <text x="400" y="336" class="arabic muted" font-size="22">مدريد</text>
    <rect x="1070" y="270" width="260" height="80" rx="12" fill="#16161a" stroke="#3d4f6b" stroke-width="4"/>
    <text x="1200" y="305" class="sans ivory" font-size="26" font-weight="800">TEL AVIV</text>
    <text x="1200" y="336" class="arabic muted" font-size="22">تل أبيب</text>
    <rect x="670" y="530" width="260" height="80" rx="12" fill="#16161a" stroke="#286344" stroke-width="4"/>
    <text x="800" y="565" class="sans ivory" font-size="26" font-weight="800">RABAT</text>
    <text x="800" y="596" class="arabic muted" font-size="22">الرباط</text>
  </g>
  <text x="800" y="655" class="mono gold" font-size="24" text-anchor="middle">CEUTA · 50,000 crossings · at least 57 dead · سبتة</text>

  <!-- ledger -->
  <path d="M70 700 H1530" stroke="#33342f" stroke-width="3"/>
  <text x="70" y="740" class="sans ivory" font-size="22" font-weight="800">DOCUMENTED:</text>
  <text x="245" y="740" class="sans muted" font-size="21">absent guards · US House report: Ceuta "in Moroccan territory" + $40m, 15 July · Danon: "colonial enclaves" · Pegasus on Madrid's phones</text>
  <text x="70" y="782" class="sans ivory" font-size="22" font-weight="800">NOT DOCUMENTED:</text>
  <text x="290" y="782" class="sans muted" font-size="21">evidence that Rabat and Tel Aviv coordinated the surge itself — the question this file stays open on</text>
  <text x="1530" y="827" class="arabic muted" font-size="21" text-anchor="end">الموثّق: تقرير الكونغرس، تصريح دانون، «بيغاسوس» على هواتف مدريد · غير الموثّق: تنسيق الموجة ذاتها</text>
  <text x="70" y="862" class="sans muted" font-size="19">Graphic: Times of Palestine · Sources: CNN, NBC, MEE, Al Jazeera, Times of Israel, H.R. 8595 committee report, Pegasus Project · August 2026</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">The fifteen-clause document and the promised halt</title>
  <desc id="d">Illustration of the fifteen-clause Gaza implementation document: a page with fifteen ruled clauses, a golden seal of agreement, and a green dawn mark for the promised morning halt, with English and Arabic labels.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".4"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin",Arial,sans-serif}
      .arabic{font-family:Cairo,Arial,sans-serif}
      .mono{font-family:ui-monospace,Menlo,monospace}
      .muted{fill:#aaa9a5}.ivory{fill:#f2eee8}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" y="0" width="8" height="900" fill="#286344"/>

  <!-- the document -->
  <g filter="url(#sh)">
    <rect x="560" y="200" width="480" height="560" rx="14" fill="#16161a" stroke="#3a3a42" stroke-width="3"/>
    <rect x="600" y="240" width="270" height="22" rx="6" fill="#26262c"/>
    <!-- 15 clause lines, three registers of five -->
    <g fill="#26262c">
      <rect x="600" y="292" width="400" height="12" rx="6"/><rect x="600" y="322" width="380" height="12" rx="6"/>
      <rect x="600" y="352" width="400" height="12" rx="6"/><rect x="600" y="382" width="360" height="12" rx="6"/>
      <rect x="600" y="412" width="390" height="12" rx="6"/>
    </g>
    <g fill="#286344" opacity=".85">
      <rect x="600" y="452" width="400" height="12" rx="6"/><rect x="600" y="482" width="370" height="12" rx="6"/>
      <rect x="600" y="512" width="400" height="12" rx="6"/><rect x="600" y="542" width="350" height="12" rx="6"/>
      <rect x="600" y="572" width="385" height="12" rx="6"/>
    </g>
    <g fill="#26262c">
      <rect x="600" y="612" width="400" height="12" rx="6"/><rect x="600" y="642" width="365" height="12" rx="6"/>
      <rect x="600" y="672" width="395" height="12" rx="6"/><rect x="600" y="702" width="340" height="12" rx="6"/>
    </g>
    <rect x="600" y="732" width="180" height="12" rx="6" fill="#26262c"/>
  </g>

  <!-- golden seal of the factions' approval -->
  <g filter="url(#sh)">
    <circle cx="1010" cy="700" r="58" fill="#16161a" stroke="#c7a86b" stroke-width="4"/>
    <path d="M985 700 L1003 720 L1038 678" stroke="#c7a86b" stroke-width="8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- dawn mark: the promised morning halt -->
  <g>
    <circle cx="1240" cy="430" r="70" fill="#286344" opacity=".28"/>
    <circle cx="1240" cy="430" r="44" fill="#286344" opacity=".5"/>
    <path d="M1150 430 L1330 430" stroke="#59a97d" stroke-width="6" stroke-linecap="round"/>
    <path d="M1240 372 L1240 330 M1198 388 L1170 360 M1282 388 L1310 360" stroke="#59a97d" stroke-width="6" stroke-linecap="round"/>
  </g>

  <text x="90" y="120" class="sans ivory" font-size="54" font-weight="800">Fifteen clauses, one promised morning</text>
  <text x="90" y="170" class="sans muted" font-size="27">The factions have signed. Dahlan says Kushner confirmed the guns pause at dawn.</text>
  <text x="1510" y="120" class="arabic ivory" font-size="44" font-weight="700" text-anchor="end">وثيقة البنود الخمسة عشر</text>
  <text x="1510" y="170" class="arabic muted" font-size="26" text-anchor="end">الفصائل وقّعت.. ودحلان ينقل عن كوشنر وقف الاعتداءات مع الفجر</text>
  <text x="800" y="850" class="mono" fill="#59a97d" font-size="24" text-anchor="middle">15 clauses · one authority, one law, one weapon · UNSC 2803</text>
</svg>

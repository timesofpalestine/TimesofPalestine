<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">What the NIS 297.45 million estimate includes</title><desc id="d">A non-proportional pathway graphic showing household spending, lost income and productivity, unpaid care, and institutional services feeding into UN Women’s annual estimate. The source did not publish amounts for each component.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient><style>.e{font-family:Arial,sans-serif}.a{font-family:Cairo,Arial,sans-serif}.iv{fill:#f2eee8}.mu{fill:#aaa9a5}.go{fill:#c7a86b}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="22" height="900" fill="#8a1f2d"/><rect x="22" width="8" height="900" fill="#286344"/>
  <text x="75" y="78" class="e iv" font-size="40" font-weight="800">HOW THE ANNUAL COST ACCUMULATES</text><text x="1525" y="78" class="a iv" font-size="36" font-weight="700" text-anchor="end">كيف تتراكم الكلفة السنوية</text><text x="75" y="120" class="e mu" font-size="22">Components shown without shares: UN Women has not published the component values</text><text x="1525" y="153" class="a mu" font-size="21" text-anchor="end">المكونات بلا نسب لأن الهيئة لم تنشر قيمة كل بند</text>
  <g font-weight="700"><rect x="90" y="235" width="330" height="160" rx="18" fill="#211d22" stroke="#8a1f2d" stroke-width="4"/><text x="255" y="295" class="e iv" font-size="25" text-anchor="middle">HOUSEHOLD SPENDING</text><text x="255" y="342" class="a mu" font-size="23" text-anchor="middle">إنفاق الأسر والناجيات</text><rect x="90" y="505" width="330" height="160" rx="18" fill="#1b2220" stroke="#286344" stroke-width="4"/><text x="255" y="565" class="e iv" font-size="25" text-anchor="middle">LOST WORK AND INCOME</text><text x="255" y="612" class="a mu" font-size="23" text-anchor="middle">عمل ودخل مفقودان</text><rect x="1180" y="235" width="330" height="160" rx="18" fill="#242118" stroke="#c7a86b" stroke-width="4"/><text x="1345" y="295" class="e iv" font-size="25" text-anchor="middle">UNPAID CARE</text><text x="1345" y="342" class="a mu" font-size="23" text-anchor="middle">رعاية غير مدفوعة</text><rect x="1180" y="505" width="330" height="160" rx="18" fill="#1b2028" stroke="#526b92" stroke-width="4"/><text x="1345" y="565" class="e iv" font-size="25" text-anchor="middle">INSTITUTIONS AND SERVICES</text><text x="1345" y="612" class="a mu" font-size="23" text-anchor="middle">المؤسسات والخدمات</text></g>

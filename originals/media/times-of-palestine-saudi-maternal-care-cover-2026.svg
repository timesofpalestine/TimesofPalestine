<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d"><title id="t">Saudi-funded maternal care restored in Gaza</title><desc id="d">Editorial illustration of a restored clinic doorway, delivery bed, fetal heartbeat and a green support route between Saudi Arabia and Gaza. No patient is depicted.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient><style>.e{font-family:Arial,sans-serif}.a{font-family:Cairo,Arial,sans-serif}.iv{fill:#f2eee8}.mu{fill:#aaa9a5}.go{fill:#c7a86b}</style></defs><rect width="1600" height="900" fill="url(#bg)"/><rect width="22" height="900" fill="#8a1f2d"/><rect x="22" width="8" height="900" fill="#286344"/><text x="75" y="84" class="e iv" font-size="42" font-weight="800">ARAB SUPPORT · MATERNAL CARE RESTORED</text><text x="1525" y="84" class="a iv" font-size="36" font-weight="700" text-anchor="end">الإسناد العربي · عودة رعاية الأمومة</text><text x="75" y="132" class="e mu" font-size="24">Saudi funding · Palestinian health workers · three Gaza facilities</text><text x="1525" y="167" class="a mu" font-size="22" text-anchor="end">تمويل سعودي · كوادر فلسطينية · ثلاثة مرافق في غزة</text><g transform="translate(180 245)"><path d="M0 500V110L360 0l360 110v390" fill="#171a18" stroke="#c7a86b" stroke-width="8"/><rect x="260" y="220" width="200" height="280" fill="#286344"/><path d="M360 270v150M285 345h150" stroke="#f2eee8" stroke-width="26"/><rect x="510" y="350" width="150" height="70" rx="20" fill="#f2eee8"/><path d="M500 420h180v80M540 420v80" stroke="#aaa9a5" stroke-width="14"/></g><path d="M940 490h100l45-85 70 190 65-130 55 25h210" fill="none" stroke="#8a1f2d" stroke-width="16" stroke-linejoin="round"/><circle cx="1220" cy="490" r="165" fill="none" stroke="#286344" stroke-width="18" stroke-dasharray="80 30"/><text x="1220" y="470" class="e iv" font-size="48" font-weight="800" text-anchor="middle">20,400+</text><text x="1220" y="525" class="a iv" font-size="31" text-anchor="middle">امرأة وفتاة</text><text x="75" y="825" class="e go" font-size="21">EDITORIAL ILLUSTRATION · NO PATIENT DEPICTED · TIMES OF PALESTINE</text><text x="1525" y="825" class="a go" font-size="21" text-anchor="end">رسم تحريري لا يصوّر أي مريضة · تايمز أوف فلسطين</text></svg>

<!-- TEXT COLUMN -->
<text x="92" y="120" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="4.5" fill="#c7a86b">SAMA' ABDULHADI</text>
<text x="92" y="152" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#59a97d" direction="rtl">سماء عبد الهادي</text>

<text x="92" y="228" font-family="'Source Serif 4',Georgia,serif" font-size="52" font-weight="700" fill="#f2eee8">Ramallah's techno,</text>
<text x="92" y="286" font-family="'Source Serif 4',Georgia,serif" font-size="52" font-weight="700" fill="#f2eee8">on the world's stages</text>
<text x="92" y="336" font-family="Cairo,Arial,sans-serif" font-size="28" fill="#c7a86b" direction="rtl">تكنو رام الله على مسارح العالم</text>

<rect x="92" y="366" width="120" height="4" fill="#8a1f2d"/>
<text x="92" y="412" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">From Boiler Room in Ramallah to Coachella's Yuma Tent</text>


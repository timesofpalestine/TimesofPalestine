<text x="92" y="798" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" letter-spacing="1.5" fill="#aaa9a5">UNION, RAMALLAH &#183; A HUB THAT INCUBATES DJs, PRODUCERS AND CREATIVES</text>
<text x="92" y="828" font-family="Cairo,Arial,sans-serif" font-size="18" fill="#59a97d" direction="rtl">يونيون &#8212; رام الله</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl desc">
<title id="ttl">Sama' Abdulhadi: from Boiler Room in Ramallah to global festival stages</title>
<desc id="desc">Dark editorial graphic. A large vinyl record with a red centre label reading "58-min set, 10M+ views" sits at right, with a tonearm and a sound waveform beneath it. At left, bilingual English and Arabic headlines about Ramallah's techno scene and four data cards: 7.3M views by June 2021 as reported by DJ Mag; 40 booking requests in one day; the 100th edition of Mixmag's Mix series in April; 12,500 people at Wembley Arena on 17 September 2025.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
<radialGradient id="disc" cx="0.42" cy="0.36" r="0.75">
<stop offset="0" stop-color="#2a2c30"/>
<stop offset="0.6" stop-color="#1a1b1e"/>
<stop offset="1" stop-color="#101113"/>
</radialGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#f2eee8" stop-opacity="0.10"/>
<stop offset="0.5" stop-color="#f2eee8" stop-opacity="0"/>
<stop offset="1" stop-color="#f2eee8" stop-opacity="0.05"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- RECORD -->
<g transform="translate(1150,430)">
<circle r="284" fill="url(#disc)" stroke="#33363a" stroke-width="2"/>

<text x="0" y="-24" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="15" letter-spacing="2.4" fill="#f2eee8" opacity="0.85">BOILER ROOM</text>
<text x="0" y="10" text-anchor="middle" font-family="'Source Serif 4',Georgia,serif" font-size="30" font-weight="700" fill="#f2eee8">58 MIN</text>
<text x="0" y="38" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="1.2" fill="#f2eee8" opacity="0.9">10M+ VIEWS</text>
<circle r="6" fill="#111214"/>
<circle r="6" fill="none" stroke="#f2eee8" stroke-width="1" opacity="0.5"/>
</g>


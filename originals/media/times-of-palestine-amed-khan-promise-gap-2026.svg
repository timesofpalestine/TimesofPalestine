<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">The gap Amed Khan keeps measuring: what was pledged against what arrived</title>
<desc id="dsc">Dark chart. Three paired bars compare pledges with delivery in Gaza, using figures Amed Khan gave: 2,000 children with cancer pledged for evacuation by Jordan against 65 taken; about 10,000 children needing immediate medical evacuation against fewer than 1,000 moved; and 600 aid trucks a day agreed in the ceasefire against about 113 counted by the United Nations.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#c7a86b"/><stop offset="1" stop-color="#9c8348"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="110" y="44" width="90" height="6" fill="#c7a86b"/>
<text x="110" y="110" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" letter-spacing="5" fill="#c7a86b">PLEDGED, AND DELIVERED</text>
<text x="110" y="176" font-family="'Source Serif 4',Georgia,serif" font-size="44" fill="#f2eee8">The gap Amed Khan keeps measuring</text>
<text x="110" y="218" font-family="'Libre Franklin',Arial,sans-serif" font-size="22" fill="#aaa9a5">Each pair is drawn to its own scale &#8212; the shorter bar is what arrived</text>
<text x="110" y="292" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" fill="#f2eee8">Children with cancer Jordan pledged to evacuate</text>
<text x="110" y="320" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">The February 2025 pledge, against the number Khan says actually left</text>
<rect x="110" y="336" width="1150" height="26" fill="#3d4f6b"/>
<text x="1276" y="357" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">2,000 pledged</text>
<rect x="110" y="374" width="37" height="26" fill="url(#gold)"/>
<text x="163" y="395" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" font-weight="700" fill="#f2eee8">65 taken</text>
<text x="110" y="464" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" fill="#f2eee8">Children Khan says need immediate medical evacuation</text>
<text x="110" y="492" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Against those moved out, as he described it in May 2025</text>
<rect x="110" y="508" width="1150" height="26" fill="#3d4f6b"/>
<text x="1276" y="529" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">about 10,000 need it</text>
<rect x="110" y="546" width="115" height="26" fill="url(#gold)"/>
<text x="241" y="567" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" font-weight="700" fill="#f2eee8">fewer than 1,000 moved</text>
<text x="110" y="636" font-family="'Libre Franklin',Arial,sans-serif" font-size="24" fill="#f2eee8">Aid trucks a day agreed in the ceasefire</text>
<text x="110" y="664" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">Israel says about 450 a day; before 2023 about 500 entered daily</text>
<rect x="110" y="680" width="1150" height="26" fill="#3d4f6b"/>
<text x="1276" y="701" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">600 agreed</text>
<rect x="110" y="718" width="217" height="26" fill="url(#gold)"/>
<text x="343" y="739" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" font-weight="700" fill="#f2eee8">113 counted by the UN</text>
<rect x="110" y="790" width="1380" height="78" rx="8" fill="#17181b" stroke="#286344" stroke-width="2"/>
<text x="140" y="828" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Figures as Amed Khan gave them to Service95 in May 2025 and in the Los Angeles Times, 5 March 2026.</text>
<text x="140" y="856" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#aaa9a5">The truck count Israel disputes is its own: it says about 450 a day enter.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">St. Louis dabke troupe funds West Bank autism therapy</title>
<desc id="dsc">Illustration: a linked line of six dabke dancers on a stage in St. Louis, with an arrow marked "funds" pointing to a panel for Autism Superhero Palestine — diagnosis, parent training and therapy for 350 families in the West Bank, where the group says government infrastructure "doesn't exist". A small bar chart shows Palestinian Central Bureau of Statistics disability rates for adults 18 and over: 3% in Palestine, 2.6% in the West Bank, 3.9% in Gaza, with no autism-specific figure.</desc>

<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/>
<stop offset="1" stop-color="#1d1e21"/>
</linearGradient>
</defs>

<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="0" y="0" width="22" height="900" fill="#8a1f2d"/>
<rect x="22" y="0" width="8" height="900" fill="#286344"/>

<!-- header -->
<text x="90" y="86" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="4" fill="#c7a86b">DIASPORA STAGE → WEST BANK CLINIC</text>
<text x="90" y="146" font-family="'Source Serif 4',Georgia,serif" font-size="58" fill="#f2eee8">Dabke dancers fund autism care</text>
<text x="90" y="194" font-family="Cairo,Arial,sans-serif" font-size="34" fill="#c7a86b">دبكة في سانت لويس تُموّل علاج التوحّد في الضفة الغربية</text>
<text x="90" y="234" font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">“Jafra”, 4–6 p.m., 1 August — Purser Center, Logan University, 1851 Schoettler Road, Chesterfield, Missouri</text>


<text x="266" y="878" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">West Bank</text>
<rect x="340" y="735" width="72" height="117" fill="#8a1f2d"/>

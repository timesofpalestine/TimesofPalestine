<text x="376" y="878" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Gaza Strip</text>

<!-- facts -->
<g font-family="'Libre Franklin',Arial,sans-serif" font-size="20" fill="#aaa9a5">
<circle cx="620" cy="754" r="5" fill="#c7a86b"/>
<text x="640" y="761">No autism-specific figure in either PCBS release retrieved</text>
<circle cx="620" cy="796" r="5" fill="#c7a86b"/>
<text x="640" y="803">24.7% of disabled people in Palestine have a learning disability (23.6% West Bank)</text>
<circle cx="620" cy="838" r="5" fill="#c7a86b"/>
<text x="640" y="845">Parents pay about $50 for a 45-minute visit “without receiving the attention needed”</text>
<circle cx="620" cy="880" r="5" fill="#c7a86b"/>
<text x="640" y="887">7 Palestine Red Crescent day centres in the West Bank, ages 4–16, not autism-specific</text>
</g>

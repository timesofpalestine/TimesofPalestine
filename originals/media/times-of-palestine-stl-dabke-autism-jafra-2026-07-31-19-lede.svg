<text x="912" y="428" font-family="Cairo,Arial,sans-serif" font-size="24" fill="#59a97d">الضفة الغربية — تشخيص وتدريب وعلاج</text>
<text x="912" y="470" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Diagnosis · parent training · therapy</text>
<text x="912" y="502" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#aaa9a5">350 families · education and direct services</text>
<rect x="912" y="524" width="596" height="82" rx="8" fill="#8a1f2d" opacity="0.22"/>
<rect x="912" y="524" width="596" height="82" rx="8" fill="none" stroke="#8a1f2d" stroke-width="2" stroke-dasharray="9 7"/>
<text x="936" y="562" font-family="'Source Serif 4',Georgia,serif" font-size="34" fill="#c7a86b">?</text>
<text x="972" y="556" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">“No official statistics” on autistic children in Palestine;</text>
<text x="972" y="584" font-family="'Libre Franklin',Arial,sans-serif" font-size="19" fill="#f2eee8">government infrastructure “doesn’t exist” — the group’s appeal</text>
</g>

<line x1="86" y1="706" x2="1540" y2="706" stroke="#f2eee8" opacity="0.12" stroke-width="2"/>

<!-- chart -->
<text x="86" y="742" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" letter-spacing="2" fill="#c7a86b">DISABILITY RATE, AGED 18+ (PCBS, DEC 2023)</text>
<line x1="104" y1="852" x2="470" y2="852" stroke="#aaa9a5" stroke-width="2"/>
<rect x="120" y="762" width="72" height="90" fill="#c7a86b"/>
<text x="156" y="750" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">3%</text>
<text x="156" y="878" text-anchor="middle" font-family="'Libre Franklin',Arial,sans-serif" font-size="17" fill="#aaa9a5">Palestine</text>
<rect x="230" y="774" width="72" height="78" fill="#59a97d"/>

<!-- stage -->
<rect x="86" y="602" width="620" height="14" fill="#286344"/>
<rect x="86" y="616" width="620" height="8" fill="#8a1f2d" opacity="0.7"/>
<text x="86" y="656" font-family="'Libre Franklin',Arial,sans-serif" font-size="21" fill="#f2eee8">Children’s dabke troupe, founded 2024 · 14 dances · second staging of “Jafra”</text>
<text x="86" y="686" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#aaa9a5">فرقة دبكة للأطفال — ١٤ رقصة</text>


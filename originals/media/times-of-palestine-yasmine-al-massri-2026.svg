<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Yasmine Al Massri, from a stateless childhood in Beirut to Palestine 36</title>
  <desc id="d">A bilingual career card: born stateless in Beirut in 1978 to a Palestinian father displaced in 1948, seventeen years without citizenship rights, then Caramel in 2007, Miral in 2010, Quantico in 2015, The Strangers' Case in 2024 and Annemarie Jacir's Palestine 36 in 2025.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#286344"/>
      <stop offset="1" stop-color="#8a1f2d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>

  <text x="800" y="78" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="26" letter-spacing="6">TIMES OF PALESTINE &#183; CULTURE</text>

  <text x="800" y="166" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="60" font-weight="700">Yasmine Al Massri</text>
  <text x="800" y="222" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,Arial,sans-serif" font-size="40">ياسمين المصري</text>
  <text x="800" y="274" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="25">Born stateless in Beirut, 1978 &#183; father displaced in 1948</text>
  <text x="800" y="312" text-anchor="middle" fill="#8f8b83" font-family="Tahoma,Arial,sans-serif" font-size="23">وُلدت بلا جنسية في بيروت &#183; والدها مهجَّر عام 1948</text>

  <line x1="150" y1="368" x2="1450" y2="368" stroke="url(#rule)" stroke-width="4"/>

  <circle cx="270" cy="368" r="12" fill="#286344"/>
  <text x="270" y="424" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="30" font-weight="700">2007</text>
  <text x="270" y="460" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Caramel</text>

  <circle cx="535" cy="368" r="12" fill="#3f7a53"/>
  <text x="535" y="424" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="30" font-weight="700">2010</text>
  <text x="535" y="460" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Miral</text>

  <circle cx="800" cy="368" r="12" fill="#6b5a48"/>
  <text x="800" y="424" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="30" font-weight="700">2015</text>
  <text x="800" y="460" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Quantico</text>

  <circle cx="1065" cy="368" r="12" fill="#8a4a3c"/>
  <text x="1065" y="424" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="30" font-weight="700">2024</text>
  <text x="1065" y="460" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">The Strangers&#8217; Case</text>

  <circle cx="1330" cy="368" r="12" fill="#8a1f2d"/>
  <text x="1330" y="424" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="30" font-weight="700">2025</text>
  <text x="1330" y="460" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Palestine 36</text>

  <rect x="150" y="540" width="1300" height="176" rx="10" fill="#16171a" stroke="#2a2c31" stroke-width="2"/>
  <text x="196" y="596" fill="#c7a86b" font-family="Georgia,serif" font-size="21" letter-spacing="3">IN HER OWN WORDS</text>
  <text x="196" y="652" fill="#f2eee8" font-family="Georgia,serif" font-size="31">&#8220;I&#8217;m lucky and I&#8217;m a hustler. That&#8217;s the refugee in me.&#8221;</text>
  <text x="196" y="700" fill="#a9a49b" font-family="Georgia,serif" font-size="24">On playing a refugee: &#8220;You didn&#8217;t use any acting skills here.&#8221;</text>

  <text x="800" y="796" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="24">Seventeen years without citizenship rights before she left for France</text>
  <text x="800" y="852" text-anchor="middle" fill="#6f6b64" font-family="Georgia,serif" font-size="19">Graphic: Times of Palestine</text>
</svg>

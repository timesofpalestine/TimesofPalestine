<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">The Masri family's road from Balfour to the door of Downing Street</title>
  <desc id="desc">A bilingual timeline from the 1917 Balfour Declaration through the British bullet that wounded Munib al-Masri in 1943, the Nakba of 1948, the Israeli sniper bullet that paralysed his grandson at Maroun al-Ras in 2011, the 2025 legal petition at 10 Downing Street, and the September 2026 deadline for a British answer.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#142333"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="54" width="1472" height="792" rx="30" fill="#0d1a26" stroke="#30485a" stroke-width="2" filter="url(#shadow)"/>
  <text x="110" y="126" fill="#ffffff" font-family="Arial, sans-serif" font-size="44" font-weight="700">Two bullets, one declaration</text>
  <text x="1490" y="126" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-family="Arial, sans-serif" font-size="35" font-weight="700">رصاصتان ووعد واحد</text>
  <text x="110" y="176" fill="#89a8ba" font-family="Arial, sans-serif" font-size="23">The Masri family's road from the Balfour Declaration to the door of Downing Street</text>

  <line x1="150" y1="480" x2="1450" y2="480" stroke="#6d8798" stroke-width="8" stroke-linecap="round"/>
  <line x1="1196" y1="480" x2="1450" y2="480" stroke="#e0a928" stroke-width="8" stroke-dasharray="18 16" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif">
    <circle cx="180" cy="480" r="20" fill="#e0a928" stroke="#ffffff" stroke-width="5"/>
    <text x="180" y="356" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">1917</text>
    <text x="180" y="392" text-anchor="middle" fill="#b8cbd6" font-size="20">Britain issues the</text>
    <text x="180" y="418" text-anchor="middle" fill="#b8cbd6" font-size="20">Balfour Declaration</text>
    <text x="180" y="546" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">بريطانيا تصدر وعد بلفور</text>

    <circle cx="434" cy="480" r="20" fill="#e74c3c" stroke="#ffffff" stroke-width="5"/>
    <text x="434" y="602" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">1943</text>
    <text x="434" y="638" text-anchor="middle" fill="#b8cbd6" font-size="20">British troops shoot Munib</text>
    <text x="434" y="664" text-anchor="middle" fill="#b8cbd6" font-size="20">al-Masri, a Nablus schoolboy</text>
    <text x="434" y="706" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">رصاصة بريطانية تصيب الجدّ التلميذ</text>

    <circle cx="688" cy="480" r="20" fill="#e74c3c" stroke="#ffffff" stroke-width="5"/>
    <text x="688" y="356" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">1948</text>
    <text x="688" y="392" text-anchor="middle" fill="#b8cbd6" font-size="20">The Nakba drives out hundreds</text>
    <text x="688" y="418" text-anchor="middle" fill="#b8cbd6" font-size="20">of thousands of Palestinians</text>
    <text x="688" y="546" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">النكبة تهجّر مئات الآلاف</text>

    <circle cx="942" cy="480" r="20" fill="#e74c3c" stroke="#ffffff" stroke-width="5"/>
    <text x="942" y="602" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">15 May 2011</text>
    <text x="942" y="638" text-anchor="middle" fill="#b8cbd6" font-size="20">An Israeli sniper paralyses his</text>
    <text x="942" y="664" text-anchor="middle" fill="#b8cbd6" font-size="20">grandson Munib, 22, at Maroun al-Ras</text>
    <text x="942" y="706" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">قنّاص إسرائيلي يشلّ الحفيد في مارون الراس</text>

    <circle cx="1196" cy="480" r="20" fill="#26a269" stroke="#ffffff" stroke-width="5"/>
    <text x="1196" y="356" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">Sept 2025</text>
    <text x="1196" y="392" text-anchor="middle" fill="#b8cbd6" font-size="20">The family delivers a 400-page</text>
    <text x="1196" y="418" text-anchor="middle" fill="#b8cbd6" font-size="20">petition to 10 Downing Street</text>
    <text x="1196" y="546" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">العائلة تسلّم عريضة إلى داونينغ ستريت</text>

    <circle cx="1440" cy="480" r="20" fill="#e0a928" stroke="#ffffff" stroke-width="5"/>
    <text x="1420" y="602" text-anchor="middle" fill="#ffffff" font-size="30" font-weight="700">Sept 2026</text>
    <text x="1420" y="638" text-anchor="middle" fill="#b8cbd6" font-size="20">Deadline for London's answer,</text>
    <text x="1420" y="664" text-anchor="middle" fill="#b8cbd6" font-size="20">then judicial review</text>
    <text x="1420" y="706" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="22">مهلة الردّ ثم المراجعة القضائية</text>
  </g>

  <text x="110" y="806" fill="#6d8798" font-family="Arial, sans-serif" font-size="20">Graphic: Times of Palestine</text>
  <text x="1490" y="806" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#6d8798" font-family="Arial, sans-serif" font-size="20">غرافيك: تايمز أوف فلسطين</text>
</svg>

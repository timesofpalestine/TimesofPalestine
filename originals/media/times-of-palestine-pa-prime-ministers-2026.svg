<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Seven prime ministers, 2003 to today</title>
  <desc id="desc">A bilingual timeline of the seven Palestinian Authority prime ministers: Mahmoud Abbas in 2003, Ahmed Qurei 2003 to 2006, Ismail Haniyeh 2006 to 2007, Salam Fayyad 2007 to 2013, Rami Hamdallah 2013 to 2019, Mohammad Shtayyeh 2019 to 2024, and Mohammad Mustafa since 2024.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071018"/>
      <stop offset="1" stop-color="#142333"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000000" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="64" y="54" width="1472" height="792" rx="30" fill="#0d1a26" stroke="#30485a" stroke-width="2" filter="url(#shadow)"/>

  <text x="110" y="126" fill="#ffffff" font-family="Arial, sans-serif" font-size="44" font-weight="700">Seven prime ministers, one office</text>
  <text x="1490" y="126" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-family="Arial, sans-serif" font-size="35" font-weight="700">سبعة رؤساء وزراء ومنصب واحد</text>
  <text x="110" y="174" fill="#89a8ba" font-family="Arial, sans-serif" font-size="23">The Palestinian premiership from its creation in 2003 to the present government</text>

  <line x1="150" y1="480" x2="1450" y2="480" stroke="#6d8798" stroke-width="8" stroke-linecap="round"/>

  <g font-family="Arial, sans-serif">
    <circle cx="185" cy="480" r="18" fill="#26a269" stroke="#ffffff" stroke-width="4"/>
    <text x="185" y="368" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">2003</text>
    <text x="185" y="400" text-anchor="middle" fill="#b8cbd6" font-size="20">Mahmoud Abbas</text>
    <text x="185" y="426" text-anchor="middle" fill="#89a8ba" font-size="18">6 months</text>
    <text x="185" y="540" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="20">محمود عباس</text>

    <circle cx="380" cy="480" r="18" fill="#26a269" stroke="#ffffff" stroke-width="4"/>
    <text x="380" y="588" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">2003–06</text>
    <text x="380" y="620" text-anchor="middle" fill="#b8cbd6" font-size="20">Ahmed Qurei</text>
    <text x="380" y="652" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="20">أحمد قريع</text>

    <circle cx="575" cy="480" r="18" fill="#e0a928" stroke="#ffffff" stroke-width="4"/>
    <text x="575" y="368" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">2006–07</text>
    <text x="575" y="400" text-anchor="middle" fill="#b8cbd6" font-size="20">Ismail Haniyeh</text>
    <text x="575" y="426" text-anchor="middle" fill="#89a8ba" font-size="18">the only elected premier</text>
    <text x="575" y="540" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="20">إسماعيل هنية</text>

    <circle cx="790" cy="480" r="18" fill="#26a269" stroke="#ffffff" stroke-width="4"/>
    <text x="790" y="588" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">2007–13</text>
    <text x="790" y="620" text-anchor="middle" fill="#b8cbd6" font-size="20">Salam Fayyad</text>
    <text x="790" y="652" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="20">سلام فياض</text>

    <circle cx="1005" cy="480" r="18" fill="#26a269" stroke="#ffffff" stroke-width="4"/>
    <text x="1005" y="368" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">2013–19</text>
    <text x="1005" y="400" text-anchor="middle" fill="#b8cbd6" font-size="20">Rami Hamdallah</text>
    <text x="1005" y="540" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="20">رامي الحمد الله</text>

    <circle cx="1220" cy="480" r="18" fill="#26a269" stroke="#ffffff" stroke-width="4"/>
    <text x="1220" y="588" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">2019–24</text>
    <text x="1220" y="620" text-anchor="middle" fill="#b8cbd6" font-size="20">Mohammad Shtayyeh</text>
    <text x="1220" y="652" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="20">محمد اشتية</text>

    <circle cx="1415" cy="480" r="18" fill="#e74c3c" stroke="#ffffff" stroke-width="4"/>
    <text x="1415" y="368" text-anchor="middle" fill="#ffffff" font-size="26" font-weight="700">2024–</text>
    <text x="1400" y="400" text-anchor="middle" fill="#b8cbd6" font-size="20">Mohammad Mustafa</text>
    <text x="1415" y="426" text-anchor="middle" fill="#89a8ba" font-size="18">incumbent</text>
    <text x="1415" y="540" text-anchor="middle" direction="rtl" unicode-bidi="bidi-override" fill="#dce9f1" font-size="20">محمد مصطفى</text>
  </g>

  <text x="110" y="770" fill="#89a8ba" font-family="Arial, sans-serif" font-size="21">The post was created in March 2003 to share the presidency's powers; no parliament has confirmed a government since 2007.</text>
  <text x="110" y="812" fill="#6d8798" font-family="Arial, sans-serif" font-size="20">Graphic: Times of Palestine</text>
  <text x="1490" y="812" text-anchor="start" direction="rtl" unicode-bidi="bidi-override" fill="#6d8798" font-family="Arial, sans-serif" font-size="20">غرافيك: تايمز أوف فلسطين</text>
</svg>

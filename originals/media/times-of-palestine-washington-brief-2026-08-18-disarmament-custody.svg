<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Who verifies Gaza's disarmament: the roadmap Hamas signed and the agreement reached in Jerusalem</title>
  <desc id="desc">A bilingual comparison of the 30 July 2026 roadmap, under which Hamas was to hand its weapons to a Palestinian governing body with the International Stabilization Force supervising, and the 17 August 2026 Kushner-Netanyahu understanding, under which an American general verifies disarmament before any Israeli withdrawal — with Jared Kushner's thirty-day timetable, the new deconfliction mechanism for Israeli claims of emerging threats, and the toll since the October ceasefire.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="clock" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7e1e2b"/>
      <stop offset=".55" stop-color="#3a2b2c"/>
      <stop offset="1" stop-color="#bd9854"/>
    </linearGradient>
    <linearGradient id="mech" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#25262a"/>
      <stop offset="1" stop-color="#2a2426"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="13" flood-color="#000" flood-opacity=".34"/>
    </filter>
    <style>
      .sans{font-family:"Libre Franklin","Arial",sans-serif}
      .serif{font-family:"Source Serif 4","Georgia",serif}
      .arabic{font-family:"Cairo","Arial",sans-serif}
      .ivory{fill:#f2eee8}
      .muted{fill:#aaa9a5}
      .gold{fill:#c7a86b}
      .green{fill:#61aa80}
      .red{fill:#dc6572}
      .tiny{font-size:16px}
      .small{font-size:19px}
      .body{font-size:22px}
      .label{font-size:17px;font-weight:800;letter-spacing:1.2px}
      .num{font-size:34px;font-weight:800}
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" width="22" height="900" fill="#8a1f2d"/>
  <rect x="22" width="8" height="900" fill="#007A3D"/>

  <text x="80" y="76" class="serif ivory" font-size="50" font-weight="800">Who verifies that Gaza is disarmed</text>
  <text x="80" y="118" class="sans muted body">The roadmap Hamas signed on 30 July, and what Kushner and Netanyahu agreed in Jerusalem on 17 August.</text>
  <text x="1524" y="162" class="arabic ivory" font-size="35" font-weight="800" text-anchor="end">من يتحقّق من نزع سلاح غزة</text>
  <text x="1524" y="194" class="arabic muted small" text-anchor="end">خريطة 30 تموز/يوليو.. ثم ما اتُّفق عليه في القدس في 17 آب/أغسطس</text>

  <g filter="url(#shadow)">
    <rect x="70" y="228" width="460" height="316" rx="18" fill="#25262a" stroke="#61aa80" stroke-width="2"/>
    <text x="98" y="268" class="sans green label">ROADMAP, 30 JULY</text>
    <text x="98" y="292" class="arabic muted tiny">خريطة الطريق التي وافقت عليها حماس</text>
    <text x="98" y="336" class="sans ivory small">Weapons handed to a Palestinian</text>
    <text x="98" y="362" class="sans ivory small">governing body in Gaza</text>
    <text x="98" y="400" class="sans ivory small">Decommissioning supervised by the</text>
    <text x="98" y="426" class="sans ivory small">International Stabilization Force</text>
    <text x="98" y="464" class="sans muted small">Gradual, sequential, time-bound</text>
    <text x="98" y="500" class="arabic muted tiny">تسليم السلاح إلى جهة فلسطينية بإشراف قوة الاستقرار الدولية</text>
    <text x="98" y="524" class="arabic muted tiny">على مراحل ووفق جدول زمني</text>
  </g>

  <path d="M548 386h44" stroke="#c7a86b" stroke-width="3"/>
  <path d="M592 378l16 8-16 8z" fill="#c7a86b"/>

  <g filter="url(#shadow)">
    <rect x="622" y="228" width="460" height="316" rx="18" fill="#25262a" stroke="#dc6572" stroke-width="3"/>
    <text x="650" y="268" class="sans red label">JERUSALEM, 17 AUGUST</text>
    <text x="650" y="292" class="arabic muted tiny">ما اتّفق عليه كوشنر ونتنياهو</text>
    <text x="650" y="336" class="sans ivory small">An American general verifies the</text>
    <text x="650" y="362" class="sans ivory small">handover — Maj. Gen. Jasper Jeffers</text>
    <text x="650" y="400" class="sans ivory small">No redeployment or reconstruction</text>
    <text x="650" y="426" class="sans ivory small">until Hamas is disarmed in all Gaza</text>
    <text x="650" y="464" class="sans muted small">Israeli official, to AFP</text>
    <text x="650" y="500" class="arabic muted tiny">جنرال أميركي يتحقّق من التسليم قبل أي انسحاب أو إعادة إعمار</text>
    <text x="650" y="524" class="arabic muted tiny">مسؤول إسرائيلي لوكالة فرانس برس</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1174" y="228" width="350" height="316" rx="18" fill="url(#clock)"/>
    <text x="1202" y="268" class="sans gold label">KUSHNER'S TIMETABLE</text>
    <text x="1202" y="292" class="arabic ivory tiny">الجدول الذي أعلنه كوشنر</text>
    <text x="1202" y="366" class="sans ivory" font-size="88" font-weight="800">30</text>
    <text x="1330" y="366" class="sans ivory num">days</text>
    <text x="1330" y="396" class="arabic ivory small">يوماً</text>
    <text x="1202" y="438" class="sans ivory small">to start taking weapons out</text>
    <text x="1202" y="464" class="sans ivory small">and filling in tunnels</text>
    <text x="1202" y="500" class="sans gold tiny">Fox News, from Tel Aviv, 17 August 2026</text>
    <text x="1202" y="524" class="arabic ivory tiny">لبدء إخراج السلاح وردم الأنفاق</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="580" width="1454" height="182" rx="18" fill="url(#mech)" stroke="#3a3b40" stroke-width="2"/>
    <text x="98" y="620" class="sans gold label">THE NEW DECONFLICTION MECHANISM — آلية فضّ التعارض الجديدة</text>

    <rect x="98" y="644" width="392" height="90" rx="12" fill="#2c2d31" stroke="#72747a" stroke-width="2"/>
    <text x="120" y="678" class="sans ivory small">Israel reports an emerging</text>
    <text x="120" y="704" class="sans ivory small">threat from Hamas</text>
    <text x="120" y="726" class="arabic muted tiny">إسرائيل تبلّغ عن تهديد ناشئ</text>

    <path d="M506 689h40" stroke="#c7a86b" stroke-width="3"/>
    <path d="M546 681l16 8-16 8z" fill="#c7a86b"/>

    <rect x="578" y="644" width="422" height="90" rx="12" fill="#2c2d31" stroke="#c7a86b" stroke-width="2"/>
    <text x="600" y="678" class="sans ivory small">The mechanism judges whether it</text>
    <text x="600" y="704" class="sans ivory small">is genuine, or solvable without force</text>
    <text x="600" y="726" class="arabic muted tiny">الآلية تحكم: حقيقي أم يُحلّ بغير القوة</text>

    <path d="M1016 689h40" stroke="#c7a86b" stroke-width="3"/>
    <path d="M1056 681l16 8-16 8z" fill="#c7a86b"/>

    <rect x="1088" y="644" width="412" height="90" rx="12" fill="#2c2d31" stroke="#61aa80" stroke-width="2"/>
    <text x="1110" y="678" class="sans ivory small">Mediators raise it with Hamas,</text>
    <text x="1110" y="704" class="sans ivory small">which learns it is being watched</text>
    <text x="1110" y="726" class="arabic muted tiny">الوسطاء يطرحونه على حماس</text>

    <text x="1500" y="620" class="sans muted tiny" text-anchor="end">Channel 12 and Axios, citing a senior US official</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="70" y="782" width="464" height="72" rx="14" fill="#221f21" stroke="#8a1f2d" stroke-width="2"/>
    <text x="94" y="818" class="sans red num">1,265</text>
    <text x="230" y="812" class="sans ivory small">Palestinians killed since</text>
    <text x="230" y="836" class="sans ivory small">the 10 October ceasefire</text>
    <text x="94" y="846" class="arabic muted tiny">وزارة الصحة في غزة</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="558" y="782" width="380" height="72" rx="14" fill="#212224" stroke="#72747a" stroke-width="2"/>
    <text x="582" y="818" class="sans ivory num">5</text>
    <text x="626" y="812" class="sans ivory small">Israeli soldiers killed in</text>
    <text x="626" y="836" class="sans ivory small">the same period</text>
    <text x="582" y="846" class="arabic muted tiny">الجيش الإسرائيلي</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="962" y="782" width="562" height="72" rx="14" fill="#1e2321" stroke="#286344" stroke-width="2"/>
    <text x="986" y="818" class="sans green num">2.1m</text>
    <text x="1094" y="812" class="sans ivory small">Gazans confined west of the Yellow Line,</text>
    <text x="1094" y="836" class="sans ivory small">on less than half the Strip — UN, 17 August</text>
    <text x="986" y="846" class="arabic muted tiny">الأمم المتحدة</text>
  </g>

  <text x="80" y="884" class="sans muted tiny">Sources: the 30 July roadmap; Israeli and US officials on the 17 August Jerusalem meeting; Gaza health ministry and Israeli military tolls; UN reporting of 17 August 2026.</text>
</svg>

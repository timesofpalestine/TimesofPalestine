<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Mustafa Abuelhija: from the Comedy Cellar floor to Netflix — two decades building the rooms where comedians work, ending with Mo Amer and the most widely seen Palestinian story on television">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111214"/>
      <stop offset="1" stop-color="#1d1e21"/>
    </linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#286344"/>
      <stop offset="1" stop-color="#8a1f2d"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="6" fill="#8a1f2d"/>

  <text x="800" y="82" text-anchor="middle" fill="#c7a86b" font-family="Georgia,serif" font-size="26" letter-spacing="6">TIMES OF PALESTINE · CULTURE</text>

  <text x="800" y="172" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="62" font-weight="700">Mustafa Abuelhija</text>
  <text x="800" y="228" text-anchor="middle" fill="#f2eee8" font-family="Tahoma,Arial,sans-serif" font-size="40">مصطفى أبو الهيجاء</text>
  <text x="800" y="286" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="27">Haifa · New York · Los Angeles</text>

  <line x1="180" y1="360" x2="1420" y2="360" stroke="url(#tl)" stroke-width="4"/>

  <circle cx="300" cy="360" r="13" fill="#286344"/>
  <text x="300" y="418" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="30" font-weight="700">2000</text>
  <text x="300" y="456" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Comedy Cellar</text>
  <text x="300" y="486" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">New York</text>

  <circle cx="633" cy="360" r="13" fill="#4a7d55"/>
  <text x="633" y="418" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="30" font-weight="700">2004</text>
  <text x="633" y="456" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Manages Chappelle</text>
  <text x="633" y="486" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Block Party</text>

  <circle cx="966" cy="360" r="13" fill="#7a5040"/>
  <text x="966" y="418" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="30" font-weight="700">2018</text>
  <text x="966" y="456" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Co-founds</text>
  <text x="966" y="486" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Mint Comedy</text>

  <circle cx="1300" cy="360" r="13" fill="#8a1f2d"/>
  <text x="1300" y="418" text-anchor="middle" fill="#f2eee8" font-family="Georgia,serif" font-size="30" font-weight="700">2021—</text>
  <text x="1300" y="456" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Netflix · Mo Amer</text>
  <text x="1300" y="486" text-anchor="middle" fill="#a9a49b" font-family="Georgia,serif" font-size="22">Wild World</text>

  <rect x="180" y="580" width="1240" height="180" rx="10" fill="#16171a" stroke="#2a2c31" stroke-width="2"/>
  <text x="230" y="646" fill="#c7a86b" font-family="Georgia,serif" font-size="22" letter-spacing="3">THE WORK</text>
  <text x="230" y="700" fill="#f2eee8" font-family="Georgia,serif" font-size="31">He manages the comedian behind the most widely seen</text>
  <text x="230" y="742" fill="#f2eee8" font-family="Georgia,serif" font-size="31">Palestinian story on television.</text>
  <text x="1370" y="742" text-anchor="end" fill="#a9a49b" font-family="Tahoma,Arial,sans-serif" font-size="26">يدير الكوميدي صاحب أوسع حكاية فلسطينية على الشاشة</text>

  <text x="800" y="852" text-anchor="middle" fill="#6f6b64" font-family="Georgia,serif" font-size="20">Times of Palestine · original illustration</text>
</svg>

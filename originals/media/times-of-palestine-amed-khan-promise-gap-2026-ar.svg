<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="ttl dsc">
<title id="ttl">الفجوة التي يقيسها آمد خان: ما تعهّد به العالم مقابل ما وصل</title>
<desc id="dsc">رسم بياني داكن. ثلاثة أزواج من الأشرطة تقارن التعهدات بما وصل فعلًا إلى غزة، بأرقام قدّمها آمد خان: ألفا طفل مصاب بالسرطان تعهد الأردن بإجلائهم مقابل 65 خرجوا، ونحو عشرة آلاف طفل يحتاجون إجلاءً طبيًا فوريًا مقابل أقل من ألف نُقلوا، و600 شاحنة مساعدات يوميًا أقرّها وقف النار مقابل نحو 113 تحصيها الأمم المتحدة.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#111214"/><stop offset="1" stop-color="#1d1e21"/></linearGradient>
<linearGradient id="gold" x1="1" y1="0" x2="0" y2="0">
<stop offset="0" stop-color="#c7a86b"/><stop offset="1" stop-color="#9c8348"/></linearGradient></defs>
<rect width="1600" height="900" fill="url(#bg)"/>
<rect x="1400" y="44" width="90" height="6" fill="#c7a86b"/>
<text x="1490" y="112" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="24" fill="#c7a86b">تعهّدوا.. وهذا ما وصل</text>
<text x="1490" y="180" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="44" fill="#f2eee8">الفجوة التي يقيسها آمد خان</text>
<text x="1490" y="224" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="23" fill="#aaa9a5">كل زوج مرسوم بمقياسه الخاص، والشريط الأقصر هو ما وصل</text>
<text x="1490" y="294" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="25" fill="#f2eee8">أطفال مصابون بالسرطان تعهّد الأردن بإجلائهم</text>
<text x="1490" y="324" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">تعهد شباط/فبراير 2025، مقابل ما يقول خان إنه خرج فعلًا</text>
<rect x="340" y="338" width="1150" height="26" fill="#3d4f6b"/>
<text x="324" y="359" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">2000 تعهد بإجلائهم</text>
<rect x="1453" y="376" width="37" height="26" fill="url(#gold)"/>
<text x="1437" y="397" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2eee8">خرج 65 فقط</text>
<text x="1490" y="466" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="25" fill="#f2eee8">أطفال يقول خان إنهم يحتاجون إجلاءً طبيًا فوريًا</text>
<text x="1490" y="496" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">مقابل من نُقلوا، كما وصف الحال في أيار/مايو 2025</text>
<rect x="340" y="510" width="1150" height="26" fill="#3d4f6b"/>
<text x="324" y="531" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">نحو 10000 يحتاجونه</text>
<rect x="1375" y="548" width="115" height="26" fill="url(#gold)"/>
<text x="1359" y="569" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2eee8">نُقل أقل من 1000</text>
<text x="1490" y="638" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="25" fill="#f2eee8">شاحنات مساعدات يوميًا أقرّها وقف النار</text>
<text x="1490" y="668" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">إسرائيل تقول نحو 450 يوميًا، وقبل 2023 كان يدخل نحو 500</text>
<rect x="340" y="682" width="1150" height="26" fill="#3d4f6b"/>
<text x="324" y="703" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="21" fill="#aaa9a5">600 متفق عليها</text>
<rect x="1273" y="720" width="217" height="26" fill="url(#gold)"/>
<text x="1257" y="741" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="21" font-weight="700" fill="#f2eee8">113 تحصيها الأمم المتحدة</text>
<rect x="110" y="790" width="1380" height="78" rx="8" fill="#17181b" stroke="#286344" stroke-width="2"/>
<text x="1462" y="830" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="22" fill="#f2eee8">أرقام كما قدّمها آمد خان لمجلة «سيرفيس 95» في أيار/مايو 2025 وفي «لوس أنجلوس تايمز» يوم 5 آذار/مارس 2026</text>
<text x="1462" y="858" direction="rtl" text-anchor="start" font-family="Cairo,Arial,sans-serif" font-size="20" fill="#aaa9a5">وحصيلة الشاحنات التي تعترض عليها إسرائيل هي حصيلتها هي: تقول إن نحو 450 تدخل يوميًا</text>
</svg>

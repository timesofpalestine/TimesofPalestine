<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" font-kerning="normal">
<rect x="0" y="0" width="1000" height="720" fill="#F4F6F0" rx="0"/>
<line x1="0" y1="0" x2="1000" y2="0" stroke="#14201B" stroke-width="6"/>
<text x="48" y="52" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="11.5" fill="#A6291F" font-weight="600" text-anchor="start" letter-spacing="0.16em">FIGURE 3 · THE MARKET FOR A STORY</text>
<text x="48" y="88" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="27" fill="#14201B" font-weight="600" text-anchor="start">Four buyers, and what each one got</text>
<text x="48" y="114" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="13.5" fill="#55655C" font-weight="400" text-anchor="start">A smear is not a mistake. It is a product, and products have buyers.</text>
<line x1="48" y1="134" x2="952" y2="134" stroke="#C9D3C2" stroke-width="1"/>
<rect x="48" y="162" width="214" height="6" fill="#14201B" rx="0"/>
<text x="48" y="194" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#A6291F" font-weight="600" text-anchor="start" letter-spacing="0.12em">2002–2004</text>
<text x="48" y="222" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="16.5" fill="#14201B" font-weight="600" text-anchor="start">The Israeli government</text>
<text x="48" y="292" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="9.5" fill="#55655C" font-weight="400" text-anchor="start" letter-spacing="0.1em">WHAT THEY PUT INTO CIRCULATION</text>
<text x="48" y="314.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">Military intelligence briefs</text>
<text x="48" y="331.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">the Knesset that Arafat</text>
<text x="48" y="349.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">personally controls $1.3bn.</text>
<text x="48" y="366.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">Israeli officials are the</text>
<text x="48" y="384.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">sourcing behind the</text>
<text x="48" y="401.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">$100,000-a-month figure.</text>
<line x1="48" y1="448" x2="262" y2="448" stroke="#C9D3C2" stroke-width="1"/>
<text x="48" y="470" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="9.5" fill="#1D3A57" font-weight="400" text-anchor="start" letter-spacing="0.1em">WHAT IT BOUGHT THEM</text>
<text x="48" y="492.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">Converts a national leadership</text>
<text x="48" y="509.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">into a criminal enterprise.</text>
<text x="48" y="527.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">Once a movement is a racket,</text>
<text x="48" y="544.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">the question of what it is</text>
<text x="48" y="562.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">owed politically stops being</text>
<text x="48" y="579.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">asked.</text>
<rect x="276" y="162" width="214" height="6" fill="#14201B" rx="0"/>
<text x="276" y="194" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#A6291F" font-weight="600" text-anchor="start" letter-spacing="0.12em">2004–present</text>
<text x="276" y="222" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="16.5" fill="#14201B" font-weight="600" text-anchor="start">The PA and Fatah old</text>
<text x="276" y="243" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="16.5" fill="#14201B" font-weight="600" text-anchor="start">guard</text>
<text x="276" y="292" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="9.5" fill="#55655C" font-weight="400" text-anchor="start" letter-spacing="0.1em">WHAT THEY PUT INTO CIRCULATION</text>
<text x="276" y="314.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">The largest and least sourced</text>
<text x="276" y="331.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">figures — $22m a year,</text>
<text x="276" y="349.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">“hundreds of millions</text>
<text x="276" y="366.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">inherited” — are attributed to</text>
<text x="276" y="384.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">unnamed Palestinian officials,</text>
<text x="276" y="401.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">not Israeli ones.</text>
<line x1="276" y1="448" x2="490" y2="448" stroke="#C9D3C2" stroke-width="1"/>
<text x="276" y="470" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="9.5" fill="#1D3A57" font-weight="400" text-anchor="start" letter-spacing="0.1em">WHAT IT BOUGHT THEM</text>
<text x="276" y="492.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">Neutralises a widow who had</text>
<text x="276" y="509.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">criticised PA corruption</text>
<text x="276" y="527.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">publicly, controlled access to</text>
<text x="276" y="544.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">the dying president, and knew</text>
<text x="276" y="562.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">where accounts were.</text>
<rect x="504" y="162" width="214" height="6" fill="#14201B" rx="0"/>
<text x="504" y="194" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#A6291F" font-weight="600" text-anchor="start" letter-spacing="0.12em">2007–2011</text>
<text x="504" y="222" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="16.5" fill="#14201B" font-weight="600" text-anchor="start">Ben Ali&#x27;s Tunisia</text>
<text x="504" y="292" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="9.5" fill="#55655C" font-weight="400" text-anchor="start" letter-spacing="0.1em">WHAT THEY PUT INTO CIRCULATION</text>
<text x="504" y="314.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">Strips her citizenship by</text>
<text x="504" y="331.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">decree after she disparages</text>
<text x="504" y="349.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">the ruling family to the US</text>
<text x="504" y="366.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">ambassador. Post-revolution,</text>
<text x="504" y="384.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">her name joins the Trabelsi</text>
<text x="504" y="401.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">dragnet.</text>
<line x1="504" y1="448" x2="718" y2="448" stroke="#C9D3C2" stroke-width="1"/>
<text x="504" y="470" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="9.5" fill="#1D3A57" font-weight="400" text-anchor="start" letter-spacing="0.1em">WHAT IT BOUGHT THEM</text>
<text x="504" y="492.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">Removes an inconvenient guest,</text>
<text x="504" y="509.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">then supplies the world with a</text>
<text x="504" y="527.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">court document that reads, at</text>
<text x="504" y="544.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">a glance, as proof of</text>
<text x="504" y="562.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">everything else.</text>
<rect x="732" y="162" width="214" height="6" fill="#14201B" rx="0"/>
<text x="732" y="194" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="10.5" fill="#A6291F" font-weight="600" text-anchor="start" letter-spacing="0.12em">2010s–now</text>
<text x="732" y="222" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="16.5" fill="#14201B" font-weight="600" text-anchor="start">The content economy</text>
<text x="732" y="292" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="9.5" fill="#55655C" font-weight="400" text-anchor="start" letter-spacing="0.1em">WHAT THEY PUT INTO CIRCULATION</text>
<text x="732" y="314.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">“Net worth” pages, viral</text>
<text x="732" y="331.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">posts, AI-generated</text>
<text x="732" y="349.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">encyclopedia entries. A state</text>
<text x="732" y="366.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">account puts $8bn in front of</text>
<text x="732" y="384.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#14201B" font-weight="400" text-anchor="start">millions at zero cost.</text>
<line x1="732" y1="448" x2="946" y2="448" stroke="#C9D3C2" stroke-width="1"/>
<text x="732" y="470" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="9.5" fill="#1D3A57" font-weight="400" text-anchor="start" letter-spacing="0.1em">WHAT IT BOUGHT THEM</text>
<text x="732" y="492.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">Revenue, engagement, and a</text>
<text x="732" y="509.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">permanent answer to anyone who</text>
<text x="732" y="527.0" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">says Palestinians in Gaza need</text>
<text x="732" y="544.5" font-family="'IBM Plex Serif', Georgia, 'Times New Roman', serif" font-size="12" fill="#55655C" font-weight="400" text-anchor="start">food.</text>
<line x1="48" y1="674" x2="952" y2="674" stroke="#C9D3C2" stroke-width="1"/>
<text x="48" y="694" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#55655C" font-weight="400" text-anchor="start">Analysis. Attributions are to the reporting cited in the accompanying article.</text>
<text x="952" y="694" font-family="'IBM Plex Mono', 'SF Mono', Consolas, 'Courier New', monospace" font-size="11" fill="#55655C" font-weight="400" text-anchor="end" letter-spacing="0.14em">TIMES OF PALESTINE</text>
</svg>

name: Build & publish Times of Palestine
on:
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: photo-hunt
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Hunt rights-cleared photo candidates (no build, no deploy)
        run: python .github/scripts/photo_hunt.py
      - name: Commit candidates to branch
        run: |
          git config user.name "Times of Palestine Newsdesk"
          git config user.email "newsdesk@timesofpalestine.com"
          git add photo-candidates/
          if ! git diff --cached --quiet; then
            git commit -m "Photo candidates for rights review [skip ci]"
            git push origin HEAD:widow-photos
          fi

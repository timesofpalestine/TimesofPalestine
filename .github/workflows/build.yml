name: Build & publish Times of Palestine
on:
  schedule:
    # Target cadence: every ~10 minutes. GitHub throttles high-frequency
    # schedules hard — the old "*/10" line was firing every 3-4 HOURS in
    # practice (checked 2026-08-03; the site only looked alive because PR
    # merges triggered push builds). Mitigations: staggered odd minutes
    # (top-of-slot stampedes are deprioritized first) and several distinct
    # entries so a dropped tick doesn't silence a whole cycle. The durable
    # cadence is rearm.yml: once WORKFLOW_DISPATCH_TOKEN is set, every
    # completed build dispatches the next one ~9 minutes later, scheduler
    # or no scheduler (owner-approved 2026-08-03).
    - cron: "7,37 * * * *"
    - cron: "17,47 * * * *"
    - cron: "27,57 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write            # the investigations desk commits its reports back
  pages: write
  id-token: write
concurrency:
  group: pages-build
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # 40, not 30 (2026-11-08): the deploy below may take three short
    # attempts while GitHub's Pages backend stalls in syncing_files.
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Restore delivery cache
        uses: actions/cache/restore@v5
        with:
          path: |
            briefs-cache.json
            remote-image-cache.json
            telegram-delivery.json
            webhook-delivery.json
          key: newsroom-state-${{ github.run_id }}
          restore-keys: |
            newsroom-state-
            briefs-
      - name: Install brief-writing dependency
        run: pip install anthropic
      - name: Run publishing safety tests
        run: python -m unittest discover -s tests -v
      - name: Build site from live feeds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reader-growth hooks — all optional, all off until the repo
          # variables exist (owner approval 2026-08-08).
          ANALYTICS_GOATCOUNTER: ${{ vars.ANALYTICS_GOATCOUNTER }}
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          INVESTIGATIONS: ${{ vars.INVESTIGATIONS }}   # set this repo variable to "off" to pause the desk
        run: python build.py
      # Social crawlers (Facebook first among them) reject SVG og:images and
      # then scrape the page for ANY large image — which put a neighboring
      # story's infographic on a share card (owner report 2026-08-24). Every
      # house SVG in dist/media gets a PNG sibling here so the og:image the
      # renderer advertises actually exists. Fail-open per file: a failed
      # raster leaves the og-banner fallback tag to carry the card.
      # The step is an ENHANCEMENT and must never stop the paper: every
      # og:image already carries the og-banner fallback tag, so if the
      # tooling is missing the cards degrade to branding, not to a
      # neighboring story's art. First run failed on a wrong package name
      # (fonts-noto-naskh-arabic absent on the runner) — hence every line
      # here is fail-open.
      - name: Rasterize house SVGs for social cards
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-core >/dev/null 2>&1 || true
          if ! command -v rsvg-convert >/dev/null; then
            echo "::warning::rsvg-convert unavailable — social rasters skipped; og-banner fallback carries the share cards this build"
            exit 0
          fi
          shopt -s nullglob
          for f in dist/media/*.svg; do
            rsvg-convert -w 1200 -h 675 --keep-aspect-ratio "$f" -o "${f%.svg}.png" 2>/dev/null || true
          done
          ls dist/media/*.png 2>/dev/null | wc -l | xargs echo "social rasters written:"
      - name: Validate generated site
        id: validate
        run: python validate_build.py dist
      - name: Publish sanitized health summary
        if: always()
        run: python validate_build.py dist --summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
        with:
          # Self-heal (restored by owner order 2026-08-03): a visibility flip
          # erases the Pages configuration and deploys then die here. With
          # enablement the workflow re-creates the Pages site itself when the
          # site exists but lost its config; a fully DELETED Pages site still
          # needs one owner click (Settings → Pages → Source: GitHub Actions),
          # as the 2026-08-03 outage proved. Custom domain is a Pages setting
          # and may need re-entry after a flip.
          enablement: true
      - id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      # Deploy with short timeouts and up to two retries (outage of
      # 2026-11-07/08). GitHub's Pages backend began leaving deployments stuck
      # in "syncing_files" — an unchanged 328 MB site that synced in under 30 s
      # sat there past deploy-pages' 10-minute cap on every run from 18:33 UTC,
      # and the site went 14 hours without a deploy. The same stall was
      # reported across many unrelated repos that week. A healthy sync here
      # takes under a minute, so 4 minutes is generous; on timeout deploy-pages
      # cancels the stuck deployment, and a fresh attempt usually goes through.
      - id: deploy_try1
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000
      - name: Pause before deploy retry
        if: ${{ !cancelled() && steps.deploy_try1.outcome == 'failure' }}
        run: sleep 30
      - id: deploy_try2
        if: ${{ !cancelled() && steps.deploy_try1.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000
      - name: Pause before final deploy retry
        if: ${{ !cancelled() && steps.deploy_try2.outcome == 'failure' }}
        run: sleep 60
      - id: deploy_try3
        if: ${{ !cancelled() && steps.deploy_try2.outcome == 'failure' }}
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 240000
      # One verdict for every later step (they key on steps.deployment) and
      # for the environment URL: success if any attempt landed, failure
      # (red run) if all three timed out.
      - id: deployment
        if: ${{ !cancelled() && steps.upload.outcome == 'success' }}
        env:
          T1: ${{ steps.deploy_try1.outcome }}
          T2: ${{ steps.deploy_try2.outcome }}
          T3: ${{ steps.deploy_try3.outcome }}
          U1: ${{ steps.deploy_try1.outputs.page_url }}
          U2: ${{ steps.deploy_try2.outputs.page_url }}
          U3: ${{ steps.deploy_try3.outputs.page_url }}
        run: |
          for n in 1 2 3; do
            t="T$n"; u="U$n"
            if [ "${!t}" = "success" ]; then
              echo "page_url=${!u}" >> "$GITHUB_OUTPUT"
              echo "Pages deploy landed on attempt $n."
              exit 0
            fi
          done
          echo "::error::Pages deploy failed on all three attempts (GitHub Pages syncing_files stall) — the build itself is good; its archive and ledger are still persisted below."
          exit 1
      - name: Publish deployed stories to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_publish.py
      - name: Distribute validated stories
        if: ${{ always() && steps.deployment.outcome == 'success' }}
        env:
          DISTRIBUTION_WEBHOOK_URL: ${{ secrets.DISTRIBUTION_WEBHOOK_URL }}
        run: python distribute.py dist --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Persist generated investigations and story archive
        # Runs whenever the site BUILT and VALIDATED, deployed or not (outage
        # of 2026-11-07/08). Tying it to deploy success meant every Pages
        # stall also threw away the run's investigations, story-archive
        # records and budget-ledger spend — and, with no new commit landing,
        # every retry redeployed the same stuck commit SHA.
        if: ${{ always() && steps.validate.outcome == 'success' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "Times of Palestine Newsdesk"
          git config user.email "newsdesk@timesofpalestine.com"
          # story-archive/ is the permalink-permanence ledger (owner order
          # 2026-08-09): every published story page persists here so links
          # already shared on Telegram keep resolving on every future build.
          git add originals/ story-archive/
          if ! git diff --cached --quiet; then
            # The governor's month-to-date, printed here so it sits at the
            # END of the job log where the log API can reach it (the build
            # step's copy is buried under the dist listing).
            python3 budget_ledger.py --status || true
            git commit -m "Persist investigations and published-story archive [skip ci]"
            # Fetch/rebase/retry (charter publishing contract): this repo
            # receives frequent commits, and a silently lost push here loses
            # a finished, already-deployed investigation from the repo.
            # Conflicts are RESOLVED, not ignored (site scan 2026-09-02): the
            # old ignore-errors rebase left a conflicted rebase in place
            # and then pushed HEAD — which was plain origin/main — so the
            # push "succeeded" while this run's archive entries and budget
            # ledger were dropped on the floor. Known conflict classes:
            # the budget ledger merges as upstream + this run's delta; an
            # archive record or the desk state file takes this run's newer
            # copy; anything else aborts the rebase and retries.
            ok=0
            for i in 1 2 3; do
              git fetch origin main
              if ! git rebase --autostash origin/main; then
                resolved=1
                for path in $(git diff --name-only --diff-filter=U); do
                  case "$path" in
                    originals/_ledger.json)
                      python3 budget_ledger.py --resolve-conflict && git add "$path" || resolved=0 ;;
                    story-archive/*|originals/_state.json)
                      git checkout --theirs -- "$path" && git add "$path" || resolved=0 ;;
                    *)
                      echo "::warning::persist: unexpected conflict on $path"; resolved=0 ;;
                  esac
                done
                if [ "$resolved" = 1 ] && ! git diff --cached --quiet; then
                  GIT_EDITOR=true git rebase --continue || resolved=0
                elif [ "$resolved" = 1 ]; then
                  git rebase --skip || resolved=0   # nothing left to persist after the merge
                fi
                if [ "$resolved" != 1 ]; then
                  git rebase --abort || true
                  sleep $((i * 5)); continue
                fi
              fi
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "::error::failed to persist investigations/story archive after 3 attempts"
              exit 1
            fi
          fi
      - name: Save briefs and delivery cache
        if: always()
        uses: actions/cache/save@v5
        with:
          path: |
            briefs-cache.json
            remote-image-cache.json
            telegram-delivery.json
            webhook-delivery.json
          key: newsroom-state-${{ github.run_id }}

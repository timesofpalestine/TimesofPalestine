name: Build & publish Times of Palestine
on:
  schedule:
    # Target cadence: every ~10 minutes. GitHub throttles high-frequency
    # schedules hard — the old "*/10" line was firing every 3-4 HOURS in
    # practice (checked 2026-08-03; the site only looked alive because PR
    # merges triggered push builds). Mitigations: staggered odd minutes
    # (top-of-slot stampedes are deprioritized first) and several distinct
    # entries so a dropped tick doesn't silence a whole cycle. The durable
    # cadence is rearm.yml: once WORKFLOW_DISPATCH_TOKEN is set, every
    # completed build dispatches the next one ~9 minutes later, scheduler
    # or no scheduler (owner-approved 2026-08-03).
    - cron: "7,37 * * * *"
    - cron: "17,47 * * * *"
    - cron: "27,57 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write            # the investigations desk commits its reports back
  pages: write
  id-token: write
concurrency:
  group: pages-build
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore delivery cache
        uses: actions/cache/restore@v4
        with:
          path: |
            briefs-cache.json
            remote-image-cache.json
            telegram-delivery.json
            webhook-delivery.json
          key: newsroom-state-${{ github.run_id }}
          restore-keys: |
            newsroom-state-
            briefs-
      - name: Install brief-writing dependency
        run: pip install anthropic
      - name: Run publishing safety tests
        run: python -m unittest discover -s tests -v
      - name: Build site from live feeds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Reader-growth hooks — all optional, all off until the repo
          # variables exist (owner approval 2026-08-08).
          ANALYTICS_GOATCOUNTER: ${{ vars.ANALYTICS_GOATCOUNTER }}
          NEWSLETTER_URL: ${{ vars.NEWSLETTER_URL }}
          SUPPORT_URL: ${{ vars.SUPPORT_URL }}
          INVESTIGATIONS: ${{ vars.INVESTIGATIONS }}   # set this repo variable to "off" to pause the desk
        run: python build.py
      # Social crawlers (Facebook first among them) reject SVG og:images and
      # then scrape the page for ANY large image — which put a neighboring
      # story's infographic on a share card (owner report 2026-08-24). Every
      # house SVG in dist/media gets a PNG sibling here so the og:image the
      # renderer advertises actually exists. Fail-open per file: a failed
      # raster leaves the og-banner fallback tag to carry the card.
      # The step is an ENHANCEMENT and must never stop the paper: every
      # og:image already carries the og-banner fallback tag, so if the
      # tooling is missing the cards degrade to branding, not to a
      # neighboring story's art. First run failed on a wrong package name
      # (fonts-noto-naskh-arabic absent on the runner) — hence every line
      # here is fail-open.
      - name: Rasterize house SVGs for social cards
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq librsvg2-bin fonts-noto-core >/dev/null 2>&1 || true
          if ! command -v rsvg-convert >/dev/null; then
            echo "::warning::rsvg-convert unavailable — social rasters skipped; og-banner fallback carries the share cards this build"
            exit 0
          fi
          shopt -s nullglob
          for f in dist/media/*.svg; do
            rsvg-convert -w 1200 -h 675 --keep-aspect-ratio "$f" -o "${f%.svg}.png" 2>/dev/null || true
          done
          ls dist/media/*.png 2>/dev/null | wc -l | xargs echo "social rasters written:"
      - name: Validate generated site
        run: python validate_build.py dist
      - name: Publish sanitized health summary
        if: always()
        run: python validate_build.py dist --summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
        with:
          # Self-heal (restored by owner order 2026-08-03): a visibility flip
          # erases the Pages configuration and deploys then die here. With
          # enablement the workflow re-creates the Pages site itself when the
          # site exists but lost its config; a fully DELETED Pages site still
          # needs one owner click (Settings → Pages → Source: GitHub Actions),
          # as the 2026-08-03 outage proved. Custom domain is a Pages setting
          # and may need re-entry after a flip.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish deployed stories to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_publish.py
      - name: Distribute validated stories
        if: ${{ always() && steps.deployment.outcome == 'success' }}
        env:
          DISTRIBUTION_WEBHOOK_URL: ${{ secrets.DISTRIBUTION_WEBHOOK_URL }}
        run: python distribute.py dist --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Persist generated investigations and story archive
        if: ${{ always() && steps.deployment.outcome == 'success' && github.ref == 'refs/heads/main' }}
        run: |
          git config user.name "Times of Palestine Newsdesk"
          git config user.email "newsdesk@timesofpalestine.com"
          # story-archive/ is the permalink-permanence ledger (owner order
          # 2026-08-09): every published story page persists here so links
          # already shared on Telegram keep resolving on every future build.
          git add originals/ story-archive/
          if ! git diff --cached --quiet; then
            git commit -m "Persist investigations and published-story archive [skip ci]"
            # Fetch/rebase/retry (charter publishing contract): this repo
            # receives frequent commits, and a silently lost push here loses
            # a finished, already-deployed investigation from the repo.
            ok=0
            for i in 1 2 3; do
              git pull --rebase --autostash origin main || true
              if git push origin HEAD:main; then ok=1; break; fi
              sleep $((i * 5))
            done
            if [ "$ok" != "1" ]; then
              echo "::error::failed to persist investigations/story archive after 3 attempts"
              exit 1
            fi
          fi
      - name: Save briefs and delivery cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            briefs-cache.json
            remote-image-cache.json
            telegram-delivery.json
            webhook-delivery.json
          key: newsroom-state-${{ github.run_id }}

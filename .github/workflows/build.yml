name: Build & publish Times of Palestine
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: trace-diagnostic
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Trace story source (no build, no deploy)
        run: python .github/scripts/trace_story.py 23ffbc910f

name: Build & publish Times of Palestine
on:
  schedule:
    # Target cadence: every ~10 minutes. GitHub throttles high-frequency
    # schedules hard — the old "*/10" line was firing every 3-4 HOURS in
    # practice (checked 2026-08-03; the site only looked alive because PR
    # merges triggered push builds). Mitigations: staggered odd minutes
    # (top-of-slot stampedes are deprioritized first) and several distinct
    # entries so a dropped tick doesn't silence a whole cycle. If gaps
    # persist, an external heartbeat hitting workflow_dispatch is the
    # durable fix (discussion: issue #6, 2026-08-03).
    - cron: "7,37 * * * *"
    - cron: "17,47 * * * *"
    - cron: "27,57 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write            # the investigations desk commits its reports back
  pages: write
  id-token: write
concurrency:
  group: pages-build
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore delivery cache
        uses: actions/cache/restore@v4
        with:
          path: |
            briefs-cache.json
            telegram-delivery.json
            webhook-delivery.json
          key: newsroom-state-${{ github.run_id }}
          restore-keys: |
            newsroom-state-
            briefs-
      - name: Install brief-writing dependency
        run: pip install anthropic
      - name: Run publishing safety tests
        run: python -m unittest discover -s tests -v
      - name: Build site from live feeds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          INVESTIGATIONS: ${{ vars.INVESTIGATIONS }}   # set this repo variable to "off" to pause the desk
        run: python build.py
      - name: Validate generated site
        run: python validate_build.py dist
      - name: Publish sanitized health summary
        if: always()
        run: python validate_build.py dist --summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Publish deployed stories to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python telegram_publish.py
      - name: Distribute validated stories
        if: ${{ always() && steps.deployment.outcome == 'success' }}
        env:
          DISTRIBUTION_WEBHOOK_URL: ${{ secrets.DISTRIBUTION_WEBHOOK_URL }}
        run: python distribute.py dist --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Persist generated investigations
        if: ${{ always() && steps.deployment.outcome == 'success' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          git config user.name "Times of Palestine Newsdesk"
          git config user.email "newsdesk@timesofpalestine.com"
          git add originals/
          if ! git diff --cached --quiet; then
            git commit -m "Publish automated investigation [skip ci]"
            git push origin HEAD:main
          fi
      - name: Save briefs and delivery cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            briefs-cache.json
            telegram-delivery.json
            webhook-delivery.json
          key: newsroom-state-${{ github.run_id }}

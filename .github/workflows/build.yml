name: Build & publish Times of Palestine
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install brief-writing dependency
        run: pip install anthropic
      - name: Restore TOP Briefs cache
        uses: actions/cache/restore@v4
        with:
          path: briefs-cache.json
          key: briefs-${{ github.run_id }}
          restore-keys: briefs-
      - name: Run publishing safety tests
        run: python -m unittest discover -s tests -v
      - name: Build site from live feeds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build.py
      - name: Validate generated site
        run: python validate_build.py dist
      - name: Publish sanitized health summary
        if: always()
        run: python validate_build.py dist --summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Distribute validated stories
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DISTRIBUTION_WEBHOOK_URL: ${{ secrets.DISTRIBUTION_WEBHOOK_URL }}
        run: python distribute.py dist --summary >> "$GITHUB_STEP_SUMMARY"
      - name: Save TOP Briefs and delivery cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: briefs-cache.json
          key: briefs-${{ github.run_id }}

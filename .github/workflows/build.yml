name: Build & publish Times of Palestine
on:
  schedule:
    - cron: "9,39 * * * *"   # fallback schedule; the self-scheduling chain keeps refreshes reliable
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write             # lets the run dispatch its own successor
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore delivery cache
        uses: actions/cache/restore@v4
        with:
          path: briefs-cache.json
          key: briefs-${{ github.run_id }}
          restore-keys: briefs-
      - name: Build site from live feeds
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          INVESTIGATIONS: "off"
        run: python build.py
      # The cache currently carries both legacy brief entries and Telegram delivery markers.
      # Brief generation is disabled because no model credential is exposed to the build.
      - name: Save delivery cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: briefs-cache.json
          key: briefs-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
      # Keep the proven refresh chain until the dedicated hourly reliability workflow lands.
      - name: Wait for the next slot
        if: always()
        run: sleep 1500
      - name: Chain the next run
        if: always()
        run: |
          curl -sS -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -d '{"ref":"main"}'

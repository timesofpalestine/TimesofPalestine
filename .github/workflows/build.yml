name: Build & publish Times of Palestine
on:
  schedule:
    - cron: "9,39 * * * *"   # rebuild with fresh news every 30 minutes (offset — GitHub deprioritizes :00 crons)
  workflow_dispatch: {}      # manual "run now" button
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install brief-writing dependency
        run: pip install anthropic
      - name: Restore TOP Briefs cache
        uses: actions/cache@v4
        with:
          path: briefs-cache.json
          key: briefs-${{ github.run_id }}
          restore-keys: briefs-
      - name: Build site from live feeds
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python build.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4


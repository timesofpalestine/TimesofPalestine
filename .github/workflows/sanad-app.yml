# SANAD app CI (owner north star 2026-08-04: bitchat for medicine).
# Builds the debug APK on every change to sanad-app/ — on PRs so the build
# gates review, on main so every merge leaves an installable artifact.
# Fully separate from the news build; never touches the publishing chain.
name: SANAD app
on:
  push:
    branches: [main]
    paths: ["sanad-app/**", ".github/workflows/sanad-app.yml"]
  pull_request:
    paths: ["sanad-app/**", ".github/workflows/sanad-app.yml"]
permissions:
  contents: read
concurrency:
  group: sanad-app-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Build debug APK
        working-directory: sanad-app
        run: gradle assembleDebug --no-daemon
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sanad-debug-apk
          path: sanad-app/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

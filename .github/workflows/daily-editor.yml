# Daily editor-in-chief cycle — owner directive 2026-08-01.
# Every morning Claude surveys the site and ships 3–5 concrete improvements
# (editorial, product/design, platform, franchises) via a PR merged on green.
# Manual runs: Actions → "Daily editor-in-chief cycle" → Run workflow.
name: Daily editor-in-chief cycle

on:
  schedule:
    - cron: "30 6 * * *" # 06:30 UTC daily, before the day's news cycle
  workflow_dispatch:
    inputs:
      edition:
        # Owner override (owner order 2026-09-04, given while raising the
        # budget to $300): a MANUAL run may name its edition and skip the
        # purse check for that run only. Scheduled runs stay governed, and
        # the run still records its spend to the ledger like any other.
        description: "Edition for this manual run (auto = let the budget governor decide)"
        type: choice
        options: [auto, light, full]
        default: auto

concurrency:
  group: daily-editor
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write # claude-code-action exchanges an OIDC token for its GitHub credentials

jobs:
  edit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # Budget governor (owner order 2026-09-01; the purse, 2026-09-02): the
      # editor runs the best EDITION its purse can pay for today — the FULL
      # Opus edition on its big days, the LIGHT Sonnet edition otherwise —
      # and skips only when the purse cannot pay even the light one. A
      # skipped cycle costs a day of polish; a blown budget froze the whole
      # paper for six days in August. Fails OPEN to the full edition on
      # script errors (any exit other than 0/3).
      - name: Budget gate
        id: budget
        env:
          EDITION_OVERRIDE: ${{ github.event.inputs.edition || 'auto' }}
        run: |
          set +e
          if [ "$EDITION_OVERRIDE" = "full" ] || [ "$EDITION_OVERRIDE" = "light" ]; then
            # Owner override on a manual run: the named edition, its model
            # and turn cap from editorial/budget.json, no purse check.
            python3 - "$EDITION_OVERRIDE" > "$RUNNER_TEMP/tier.out" <<'PY'
          import json, sys
          name = sys.argv[1]
          spec = json.load(open("editorial/budget.json"))["tiers"]["editor"][name]
          print("run=yes"); print(f"tier={name}")
          for k in ("model", "max_turns"):
              if spec.get(k) is not None: print(f"{k}={spec[k]}")
          PY
            code=$?
            echo "::warning::owner override — running the $EDITION_OVERRIDE edition regardless of the purse"
          else
            python3 budget_ledger.py --tier editor > "$RUNNER_TEMP/tier.out"
            code=$?
          fi
          set -e
          if [ "$code" -eq 0 ] || [ "$code" -eq 3 ]; then
            cat "$RUNNER_TEMP/tier.out" >> "$GITHUB_OUTPUT"
          else
            printf 'run=yes\ntier=full\n' >> "$GITHUB_OUTPUT"
          fi
          if [ "$code" -eq 3 ]; then
            echo "::warning::daily editor paced out by the monthly API budget — skipping this cycle (see budget_ledger.py --forecast)"
          fi
          python3 budget_ledger.py --forecast || true

      - name: Run the editor-in-chief cycle
        if: steps.budget.outputs.run == 'yes'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Model and turn cap come from the governor's tier (editorial/
          # budget.json). Pin plain model ids: the action's fast-mode default
          # (claude-opus-5[1m]) errored instantly against this key on
          # 2026-08-07. Full output stays on so the next API-side failure is
          # diagnosable from the run log.
          show_full_output: true
          claude_args: '--model ${{ steps.budget.outputs.model || ''claude-opus-5'' }} --max-turns ${{ steps.budget.outputs.max_turns || ''300'' }} --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch"'
          prompt: |
            You are Claude, editor-in-chief of Times of Palestine
            (timesofpalestine.com), running your daily improvement cycle in this
            repository (owner directive 2026-08-01: decide on new items daily and
            execute them automatically — tweaks, code, layout, story ideas and
            coverage that keep the site dynamic).

            TODAY'S EDITION TIER: ${{ steps.budget.outputs.tier }}. The budget
            governor (editorial/budget.json, owner order 2026-09-01) chose it.
            FULL = the whole mandate below. LIGHT = the non-negotiables ONLY:
            the BREAKING SWEEP, the SECTION FRESHNESS CHECK (every STALE
            section filed), MARKETS WATCH, RUNNING FILES deks, the ISRAELI
            and US PRESS REVIEWS (both, at their normal volume, Arabic composed
            fresh), the editorial calendar's due items, and the cadence note on
            #6 — skip the optional three-to-five improvements, all product/
            design/platform work, the photo-led conversions and the queue-depth
            research, and keep your turn budget for filing copy: read only what
            you need, never run the full test suite more than once, and ship
            in ONE PR. A light edition is a daily newspaper, not a smaller
            version of a magazine.

            START by reading CLAUDE.md — the newsroom charter is binding. Then
            run the BREAKING SWEEP: read editorial/x-watchlist.md and check
            every Tier-1 account's last 24 hours via live web search; a
            significant uncovered item there becomes today's first assignment,
            reported with precise attribution and an honest line on what is
            unconfirmed (the Dahlan Sunday-halt report is the model). Then
            survey the current state: recent commits on main, open issues
            (especially coordination thread #6), the newest files in originals/,
            and a local `python3 build.py` run to see rendered output and
            warnings.

            Then run the SECTION FRESHNESS CHECK (owner order 2026-08-11:
            every section of the paper, in BOTH editions, updates at least
            daily): run `python3 section_freshness.py` and read its table
            (the build also writes dist/section-freshness.json and prints
            "⚠ stale section" lines). EVERY section it marks STALE is a
            same-day assignment ranked above the optional improvements:
            file a fresh bilingual item for that section — from the wire,
            from live research, or by writing the stalest section's queued
            topic in topics.json — until no section is stale. A section
            with no coverable news gets a researched evergreen-with-a-news-
            peg, not silence. Note the before/after freshness state in the
            PR body.

            QUEUE DEPTH (owner order 2026-08-16, permanent): the desk can
            only steer to a stale section while topics.json holds an
            unwritten topic for it — a dry queue is how a section starves.
            Check the unwritten count per category (compare topics.json ids
            against originals/_state.json "done"); any publishing category
            below TWO unwritten topics gets fresh researched topics
            appended in the same PR (append-only, keep the file's indent=1
            format, follow the existing id/cat/en/ar/q entry shape). The
            evergreen keeper topics (gaza-water-run, gaza-night-workers,
            arab-aid-disbursement-check, prisoners-family-visits, and the
            2026-08-16 additions across westbank/diaspora/arabaid/arts/
            prisoners) are recyclable by design — never delete them.

            MARKETS WATCH (owner directive 2026-08-11, wired into this
            cycle 2026-08-16 after the fallback sat four days stale):
            refresh editorial/markets.json EVERY cycle. Web-search the
            latest Palestine Exchange Al-Quds index CLOSE (pex.ps, the
            exchange's Arabic wire coverage on raya.ps/urdupoint, or
            Investing.com PLE), and update level/date/source with the
            newest close you can attribute to the exchange — always the
            latest CLOSE, always dated, never invented, never left more
            than one trading day behind without noting why in the PR. A
            significant move (war/ceasefire swing, a Palestinian listing's
            results, a TASE reaction pricing Israeli politics) is a
            same-day economy story in both languages per the charter's
            Markets watch section.

            PHOTO-LED FRONT (site audit 2026-08-16): the build writes a
            photoLed block into dist/section-freshness.json (originals
            count, coverLed count, coverLedPids). Covers are photographs
            (owner order 2026-08-03) — each cycle, convert at least two
            pids from coverLedPids to rights-cleared real photos (Wikimedia
            Commons / official press kits, with media-rights.json entries)
            via image: headers or editorial/image-overrides.json, until the
            photo-led share holds above 0.8.

            RUNNING FILES (site audit 2026-08-16): editorial/topic-files.json
            drives the /topic-<slug>.html hub pages. Keep each file's dek
            current as its story moves (Qusra's dek must never lag the
            siege's actual state), and when a story becomes a file — three
            or more pieces and clearly continuing — append a new entry with
            bilingual name/dek and a tested pattern.

            Then check the EDITORIAL CALENDAR (owner-approved 2026-08-06):
            read editorial/calendar-2026.md; any assignment whose window
            includes today and is not yet marked ✅ is a same-day assignment —
            ship it in this cycle and mark it ✅ with slug and date in the
            same PR. The calendar's standing cadence targets (one humans
            original per week, the sports buildout through September, 2-3
            Arabic-first originals per month, the monthly tracker refreshes)
            count toward today's three-to-five improvements whenever they are
            behind pace.

            Then run the ISRAELI PRESS REVIEW (owner directive 2026-08-06,
            daily, non-optional): follow
            .claude/skills/israeli-press-review/SKILL.md to the letter —
            sweep today's Hebrew and English Israeli press (Haaretz, Ynet,
            Maariv, Israel Hayom, Times of Israel, JPost, the think tanks)
            via live web search and fetch, select what matters to
            Palestinian readers by the skill's relevance test, and publish
            each selected article as its own bilingual original plus the
            front-pages roundup — outlet and author attributed inline,
            opinion reported as its author's argument, think tanks
            labelled, Arabic composed fresh. On a normal day this is 3-8
            items; never zero unless the sweep genuinely finds nothing
            relevant, and then say so in the cadence note.

            Then run the US PRESS REVIEW (owner directive 2026-08-11, daily,
            non-optional, beside the Israeli sweep): follow
            .claude/skills/us-press-review/SKILL.md to the letter — sweep
            the American papers and Washington's think tanks (NYT,
            Washington Post, WSJ, Politico, The Hill, Axios, Foreign
            Policy, The Atlantic, Foreign Affairs; Brookings, Carnegie,
            CSIS, WINEP, Quincy, CFR, FDD, MEI, the Arab Center DC) via
            `python3 israeli_press_fetch.py --feeds
            editorial/us-press-feeds.json --hours 36` plus live web search
            and fetch, select what matters to Palestinian readers by the
            skill's relevance test, and publish each selected piece as its
            own bilingual original in the uspress section plus the
            "Washington wakes up to …" roundup (franchise dek "The American
            front pages, read from Palestine" — never the plain
            "Washington reads") — outlet and author
            attributed inline, opinion reported as its author's argument,
            think tanks labelled with their lean, Arabic composed fresh.
            On a normal day this is 2-6 items; never zero unless the sweep
            genuinely finds nothing relevant, and then say so in the
            cadence note. The Washington Brief franchise is unchanged and
            separate.

            Then choose THREE to FIVE concrete improvements for today, spanning
            at least two of these fronts, and implement them:
            1. EDITORIAL — a fresh researched bilingual original (live web
               research first; never recycle old material), expanded coverage of
               a fast-moving story, or new beat ideas filed to issue #6. This
               includes the PA LITIGATION DOCKET (owner directive 2026-08-02):
               sweep for developments in lawsuits against the PA/PLO worldwide —
               the US cases (Sokolow, Fuld, PSJVTA suits, the Supreme Court stay
               application), Israeli court judgments and clearance-revenue
               deductions, the prisoner-payments audit, and any European
               enforcement or aid-conditionality proceedings — and cover
               significant developments same-day, both languages. It also
               includes the ISRAELI ELECTION WATCH (owner directive
               2026-08-02): sweep the latest polls, mergers and coalition
               moves ahead of the 27 October Knesset election — who leads,
               who gains, who falls, by name (Eisenkot, Netanyahu,
               Bennett–Lapid, Golan, Liberman, Ben Gvir, Smotrich, the Arab
               lists of Mansour Abbas and Odeh–Tibi) — attribute every
               number to its pollster/outlet, frame the Palestinian stakes,
               and cover significant shifts same-day in both languages
               (update or extend originals/israel-election-2026-*). It also
               includes the ARAB SUPPORT MONITOR (owner directive
               2026-08-02): sweep what Arab states and institutions are
               doing for Palestinians — summit pledges and whether they
               disburse, reconstruction financing, medical corridors and
               field hospitals, scholarships for Gaza students, cultural
               initiatives — and keep the arabaid section fresh in both
               languages, with pledges attributed and dated and the
               constructive-framing rule applied. And it includes the
               SCHOLARSHIP GUIDE (owner directive 2026-08-02): keep
               originals/palestine-scholarships-guide-2026.* current —
               sweep for newly opened application windows, new
               university schemes for Palestinian students, and passed
               deadlines to retire; update both language editions of the
               guide in place (it is pinned on the front page as a
               standing reader service).
            2. PRODUCT & DESIGN — layout, typography, reader-facing features,
               visual identity, accessibility, mobile polish, front-page
               freshness.
            3. PLATFORM — build pipeline reliability, performance, SEO and
               structured data, media-rights hygiene, dead-link and dead-image
               sweeps, test coverage.
            4. FRANCHISES — keep the TOP 100 (annual, each August, full fresh
               research sweep per edition), the daily Washington Brief, the
               Health beat and the front-page specials band fresh and well
               presented.

            RULES: follow the charter strictly — both language editions are
            first-class (Arabic composed fresh in native register per
            editorial/arabic-style-guide.md, never translated); headline rules
            (one active-voice sentence, the actor as subject, hard cap 12 words,
            both languages); wire attribution protocol; visual-first (house SVGs
            or rights-cleared photos with media-rights.json entries only); never
            undo or break another agent's layer (Telegram delivery is Codex's;
            renderer hardening PRs are Copilot's) — coordinate via issues
            instead; never commit secrets, caches or __pycache__.

            VALIDATE: `python3 build.py` must print ✓ for any new originals and
            its output validation must pass; `python3 -m unittest discover -s
            tests` must stay green. The `anthropic` package may be installed
            with pip if the briefs desk is needed locally, but editorial copy
            you write yourself is preferred for originals.
            RUN EVERY BUILD AND TEST IN THE FOREGROUND — never as a background
            task, and never end your turn to "wait" for anything: this action
            does NOT re-invoke you when a background command finishes. The
            2026-09-04 Opus edition ended its turn with fifteen finished
            stories uncommitted while a background build ran, and the whole
            edition was lost. A turn that ends before the PR is pushed loses
            the day's work.

            SHIP: create branch claude/daily-editor-<YYYYMMDD> from main FIRST,
            and commit and push it as soon as the first story validates — then
            keep committing and pushing as each item lands, so nothing is ever
            only on this runner. When the edition is complete, use `gh` to
            open a PR titled "Daily editor: <date> — <short summary>"
            describing each item. Watch its checks with `gh pr checks --watch`;
            when green, merge it with `gh pr merge --merge`. If an item is
            risky, ambiguous or crosses another agent's layer, open an issue
            for the owner instead and leave that part out of the merge. Finish
            by posting a short cadence note to issue #6: what shipped today and
            any story ideas for the other desks.

      # Rescue net (owner-reported loss 2026-09-04): the editor's turn can
      # end with finished stories still uncommitted on the runner — the
      # 2026-09-04 Opus edition wrote fifteen and shipped none — and the
      # ledger step below hard-resets the checkout. Whatever the editor left
      # unpushed is committed to the day's branch, pushed, and opened as a
      # draft PR for the owner. Fail-open: no rescue ever fails the cycle,
      # and a run that shipped and merged on its own leaves nothing to do.
      - name: Rescue unshipped editorial work
        if: always() && steps.budget.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git config user.name "Times of Palestine Newsdesk"
          git config user.email "newsdesk@timesofpalestine.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch origin main >/dev/null 2>&1
          DAY=$(date -u +%Y%m%d)
          BR="claude/daily-editor-${DAY}"
          CUR=$(git rev-parse --abbrev-ref HEAD 2>/dev/null)
          case "$CUR" in claude/daily-editor-*) BR="$CUR";; esac
          DIRTY=$(git status --porcelain -- . ':!originals/_ledger.json' | wc -l)
          AHEAD=$(git rev-list --count origin/main..HEAD 2>/dev/null || echo 0)
          echo "rescue: branch=$CUR dirty=$DIRTY ahead-of-main=$AHEAD"
          if [ "$DIRTY" -eq 0 ] && [ "$AHEAD" -eq 0 ]; then
            echo "rescue: nothing unshipped"; exit 0
          fi
          [ "$CUR" = "$BR" ] || git checkout -B "$BR"
          if [ "$DIRTY" -gt 0 ]; then
            git add -A -- . ':!originals/_ledger.json'
            git commit -q -m "Daily editor ${DAY}: work rescued from the runner

          The editor's turn ended before this work was pushed; the workflow's
          rescue step committed it so the edition is not lost. Review before
          merging." || true
          fi
          if git ls-remote --exit-code --heads origin "$BR" >/dev/null 2>&1 \
             && ! git merge-base --is-ancestor "origin/$BR" HEAD 2>/dev/null; then
            BR="${BR}-rescue-$(date -u +%H%M)"
            git checkout -B "$BR"
          fi
          git push -u origin "HEAD:$BR" || { echo "::warning::rescue push failed"; exit 0; }
          if ! gh pr list --head "$BR" --state open --json number --jq 'length' 2>/dev/null | grep -q '^[1-9]'; then
            gh pr create --draft --base main --head "$BR" \
              --title "Daily editor: ${DAY} — unshipped work rescued from the runner" \
              --body "The editor's run ended before this work was committed and pushed. The workflow's rescue step saved it here for review. Check the build (\`python3 build.py\`) and the tests before merging." \
              || echo "::warning::rescue PR not opened"
          fi
          echo "::warning::rescued unshipped editorial work to $BR"

      # Budget governor: record the run's actual cost (the action writes it
      # to RUNNER_TEMP/claude-execution-output.json) into the committed
      # ledger so the next gate paces against it. Fail-open — a recording
      # failure never fails the cycle that already ran.
      - name: Record API spend in the ledger
        if: always() && steps.budget.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COST=$(python3 -c "import json,os;p=os.path.join(os.environ.get('RUNNER_TEMP','/home/runner/work/_temp'),'claude-execution-output.json');d=json.load(open(p));evs=d if isinstance(d,list) else [d];print(round(max([float(e.get('total_cost_usd') or 0) for e in evs if isinstance(e,dict)]+[0.0]),4))" 2>/dev/null || echo 0)
          echo "run cost: \$$COST"
          if python3 -c "import sys; sys.exit(0 if float('$COST' or 0) > 0 else 1)"; then
            git config user.name "Times of Palestine Newsdesk"
            git config user.email "newsdesk@timesofpalestine.com"
            # The Claude action revokes its app token and strips the
            # checkout credential on exit, so this step's pushes failed with
            # "Invalid username or token" on every run (site scan 2026-09-02)
            # and the editor's spend never reached the ledger. Re-authenticate
            # with the workflow token explicitly.
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            for i in 1 2 3; do
              git fetch origin main && git reset --hard origin/main
              python3 budget_ledger.py --record-usd editor "$COST" --tier "${{ steps.budget.outputs.tier || 'full' }}"
              git add originals/_ledger.json
              git commit -m "Record daily-editor API spend [skip ci]" || break
              if git push origin HEAD:main; then break; fi
              sleep $((i * 5))
            done
          fi
